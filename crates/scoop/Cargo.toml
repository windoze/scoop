[package]
name = "scoop"
version.workspace = true
edition.workspace = true

[features]
# 默认启用 LLVM 后端；如需在未安装 LLVM/llvm-config 的环境构建，可使用 `--no-default-features`。
default = ["llvm"]

# 启用后 `scoop build` 将生成 object 并调用 clang 链接运行时（T0806）。
llvm = ["scoopc/llvm"]

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.11"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
serde_json = "1.0.149"
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }
sha2 = "0.10.9"
regex = "1.11.1"

scoopc = { path = "../scoopc", default-features = false }

[dev-dependencies]
tempfile = "3.10.1"
