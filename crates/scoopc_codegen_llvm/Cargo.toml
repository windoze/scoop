[package]
name = "scoopc_codegen_llvm"
version.workspace = true
edition.workspace = true

[features]
default = ["llvm", "standalone-codegen-crate"]
llvm = ["dep:inkwell", "dep:llvm-sys", "scoopc_lir/llvm"]
standalone-codegen-crate = []

[dependencies]
scoopc_lir = { path = "../scoopc_lir" }
scoopc_lir_facts = { path = "../scoopc_lir_facts" }
scoopc_ids = { path = "../scoopc_ids" }
scoop_project_model = { path = "../scoop_project_model" }
inkwell = { version = "0.8.0", optional = true, features = ["llvm21-1"] }
llvm-sys = { version = "211.0.0", optional = true }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.12"
tracing = "0.1.40"
