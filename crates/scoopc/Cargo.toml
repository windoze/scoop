[package]
name = "scoopc"
version.workspace = true
edition.workspace = true

[features]
# 默认启用 LLVM 后端（inkwell）。如需在未安装 LLVM/llvm-config 的环境构建，可使用 `--no-default-features`。
default = ["llvm"]

llvm = [
    "dep:inkwell",
    "dep:llvm-sys",
    "dep:scoopc_codegen_llvm",
    "scoopc_codegen_llvm/llvm",
    "scoopc_lir/llvm",
    "scoopc_mir/llvm",
]

[dependencies]
scoopc_ast = { path = "../scoopc_ast" }
scoopc_codegen_llvm = { path = "../scoopc_codegen_llvm", default-features = false, optional = true }
scoopc_cone = { path = "../scoopc_cone" }
scoopc_effect_facts_stage = { path = "../scoopc_effect_facts_stage" }
scoopc_hir = { path = "../scoopc_hir" }
scoopc_ids = { path = "../scoopc_ids" }
scoopc_lir = { path = "../scoopc_lir" }
scoopc_mir = { path = "../scoopc_mir" }
scoopc_effect_facts = { path = "../scoopc_effect_facts" }
scoopc_hir_facts = { path = "../scoopc_hir_facts" }
scoopc_lir_facts = { path = "../scoopc_lir_facts" }
scoopc_mir_facts = { path = "../scoopc_mir_facts" }
scoopc_project_model = { path = "../scoopc_project_model" }
scoopc_source = { path = "../scoopc_source" }
scoopc_span = { path = "../scoopc_span" }
scoopc_types = { path = "../scoopc_types" }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.12"
tracing = "0.1.40"
toml = "0.8.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.44"
sha2 = "0.10.9"
inkwell = { version = "0.8.0", optional = true, features = ["llvm21-1"] }
llvm-sys = { version = "211.0.0", optional = true }

[dev-dependencies]
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }

[[bin]]
name = "scoopc"
path = "src/bin/scoopc.rs"
required-features = ["llvm"]
