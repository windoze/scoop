[package]
name = "scoopc"
version.workspace = true
edition.workspace = true

[features]
# 默认启用 LLVM 后端（inkwell）。如需在未安装 LLVM/llvm-config 的环境构建，可使用 `--no-default-features`。
default = ["llvm"]

llvm = ["dep:inkwell"]

[dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.12"
tracing = "0.1.40"
toml = "0.8.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.44"
sha2 = "0.10.9"
inkwell = { version = "0.8.0", optional = true, features = ["llvm18-1"] }

[dev-dependencies]
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }

[[bin]]
name = "scoopc"
path = "src/bin/scoopc.rs"
required-features = ["llvm"]
