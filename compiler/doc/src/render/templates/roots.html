<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation roots · Scoop API</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="32" height="32">Scoop <span>API</span></a></div></header>
  <main id="content" class="roots-page">
    <div class="page-heading">
      <p class="eyebrow">API reference</p>
      <h1>Documentation roots</h1>
      <p class="intro">Select a root to browse its API and dependencies.</p>
    </div>
    <section class="listing"><ul>
      {% for root in roots %}
      <li><a href="{{ root.url }}">{{ root.name }}</a><p>{{ root.manifest }}</p></li>
      {% endfor %}
    </ul></section>
  </main>
  <footer><div class="footer-inner"><span>Scoop API documentation</span><span>Generated locally · Available offline</span></div></footer>
</body>
</html>
