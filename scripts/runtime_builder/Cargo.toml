[package]
name = "scoop-runtime-builder"
version = "0.0.0"
edition = "2024"
publish = false

# Internal helper for prepare_sysroot.py, never installed as a product command.
[workspace]

[dependencies]
scoop = { path = "../../compiler/scoop" }
scoop-toolchain = { path = "../../compiler/toolchain" }
scoop-protocol = { path = "../../compiler/protocol" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
