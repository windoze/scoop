version = "0.0.0-dev"
llvm = "22.1.8"
rust_windows = "1.99.1"
llvm_mingw = "20260616"
openssl = "3.5.9"
llhttp = "9.4.3"
nghttp2 = "1.70.0"
text_backend = "0.1.0"
encoding_rs = "0.8.42"
idna = "1.1.0"
icu4x = "2.3.0"
unicode = "17.0.0"
unicode-width = "0.2.2"
uriparser = "1.0.2"
pcre2 = "10.49"
zstd = "1.5.7"
zlib-ng = "2.3.3"
brotli = "1.2.0"

[targets.aarch64-apple-darwin]
cpu = "generic"
minimum_os = "27.0.1"
sdk = "27.0"
build_system = "macOS 27.0.1"

[targets.x86_64-unknown-linux-gnu]
cpu = "x86-64"
minimum_libc = "2.43"
build_system = "Ubuntu 26.04.1"

[targets.x86_64-unknown-linux-musl]
cpu = "x86-64"
minimum_libc = "1.2.5"
build_system = "Ubuntu 26.04.1"

# Windows resource baselines. CLI targets are enabled only after W1/W2 validation.
[targets.x86_64-pc-windows-msvc-ucrt]
cpu = "x86-64"
minimum_os = "10.0.26300"
sdk = "10.0.26100.0"
msvc_toolset = "14.44.35207"
build_system = "Windows x64 10.0.26300"

[targets.x86_64-w64-windows-llvm-mingw-ucrt]
cpu = "x86-64"
minimum_os = "10.0.26300"
build_system = "Windows x64 10.0.26300"

[targets.x86_64-w64-windows-llvm-mingw-msvcrt]
cpu = "x86-64"
minimum_os = "10.0.26300"
build_system = "Windows x64 10.0.26300"
