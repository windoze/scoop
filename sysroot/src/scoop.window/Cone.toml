schema = 1

[cone]
group = "scoop"
name = "scoop.window"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = ["darwin", "linux"] }

[[sources]]
path = "platform/darwin"
when = { os = "darwin" }

[[sources]]
path = "platform/linux"
when = { os = "linux" }

[[test.sources]]
path = "tests"
when = { os = ["darwin", "linux"] }

[[test.sources]]
path = "test-platform/darwin"
when = { os = "darwin" }

[[test.sources]]
path = "test-platform/linux"
when = { os = "linux" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop.tests:window-native" = { version = "0.1.0", path = "test-native" }

[native]
c_flags = ["-D_GNU_SOURCE", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]

