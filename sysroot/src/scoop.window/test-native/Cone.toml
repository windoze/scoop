schema = 1

[cone]
group = "scoop.tests"
name = "window-native"
version = "0.1.0"
kind = "library"

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.test" = "0.1.0"

[[sources]]
path = "common"

[[sources]]
path = "src"
when = { os = "darwin" }

[[sources]]
path = "platform/linux"
when = { os = "linux" }

[native]
c_flags = ["-D_GNU_SOURCE", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]

[[native.sources]]
path = "../examples/software/buffers/native/buffers.c"
when = { os = "linux" }

[[native.libraries]]
name = "wayland-client"
kind = "dynamic"
when = { os = "linux" }

[[native.libraries]]
name = "X11"
kind = "dynamic"
when = { os = "linux" }

[[native.sources]]
path = "native/modes.m"
when = { os = "darwin" }

[[native.sources]]
path = "native/input.m"
when = { os = "darwin" }

[[native.sources]]
path = "native/text.m"
when = { os = "darwin" }

[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }

[[native.libraries]]
name = "CoreFoundation"
kind = "framework"
when = { os = "darwin" }

[[native.libraries]]
name = "CoreGraphics"
kind = "framework"
when = { os = "darwin" }

[[native.sources]]
path = "native/linux/wayland_host.c"
when = { os = "linux" }

[[native.sources]]
path = "native/linux/wayland_input.c"
when = { os = "linux" }

[[native.libraries]]
name = "wayland-server"
kind = "dynamic"
when = { os = "linux" }

[[native.libraries]]
name = "xkbcommon"
kind = "dynamic"
when = { os = "linux" }

[[native.sources]]
path = "native/linux/x11_peer.c"
when = { os = "linux" }

[[native.sources]]
path = "native/linux/x11_im.c"
when = { os = "linux" }

[[native.libraries]]
name = "Xtst"
kind = "dynamic"
when = { os = "linux" }

[[native.libraries]]
name = "xcb"
kind = "dynamic"
when = { os = "linux" }

[[native.libraries]]
name = "xcb-imdkit"
kind = "dynamic"
when = { os = "linux" }
