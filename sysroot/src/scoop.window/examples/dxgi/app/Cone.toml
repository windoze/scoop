schema = 1

[cone]
group = "scoop.examples.window"
name = "dxgi"
version = "0.1.0"
kind = "executable"

[[sources]]
path = "src"
when = { os = "windows" }

[[test.sources]]
path = "tests"
when = { os = "windows" }

[dependencies]
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop.examples.window:dxgi-renderer" = { version = "0.1.0", path = "../renderer" }

[test-dependencies]
"scoop:scoop.test" = "0.1.0"

[windows]
subsystem = "gui"
