schema = 1
[cone]
group = "scoop"
name = "scoop.url"
version = "0.1.0"
kind = "library"
[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.idna" = "0.1.0"
[test-dependencies]
"scoop:scoop.json" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.test" = "0.1.0"
[native]
include = [
    {sysroot = "include"},
]
c_flags = ["-Wextra", "-Werror", "-DURI_STATIC_BUILD", "-DURI_NO_UNICODE"]
[[native.libraries]]
name = "uriparser"
kind = "static"
[[native.sources]]
path = "native/parse.c"
[[native.sources]]
path = "native/components.c"
[[native.sources]]
path = "native/serialize.c"
