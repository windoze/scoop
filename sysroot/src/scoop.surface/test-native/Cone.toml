schema = 1
[cone]
group = "scoop.tests"
name = "surface-native"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src/view.scoop"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src/darwin"
when = { os = "darwin" }
[[sources]]
path = "src/windows"
when = { os = "windows" }

[dependencies]
"scoop:scoop.window" = "0.1.0"
"scoop.tests:window-native" = { version = "0.1.0", path = "../../scoop.window/test-native" }

[native]
cxx = true
cxx_flags = ["-Wmost", "-Wextra", "-Werror"]
objc_flags = ["-Wall", "-Wextra", "-Werror"]
[[native.sources]]
path = "native/view.m"
when = { os = "darwin" }
[[native.sources]]
path = "native/view.cpp"
when = { os = "windows" }
[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "QuartzCore"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "Metal"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "user32"
when = { os = "windows" }
[[native.libraries]]
name = "imm32"
when = { os = "windows" }
[[native.libraries]]
name = "gdi32"
when = { os = "windows" }
[[native.libraries]]
name = "dwmapi"
when = { os = "windows" }
