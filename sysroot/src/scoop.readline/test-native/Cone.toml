schema = 1
[cone]
group = "scoop.tests"
name = "readline-native"
version = "0.1.0"
kind = "library"
[[sources]]
path = "src"
[[sources]]
path = "platform/unix"
when = { os = ["darwin", "linux"] }
[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
[native]
c_flags = ["-Wextra", "-Werror"]
[[native.sources]]
path = "native/pty.c"
when = { os = ["darwin", "linux"] }
[[native.sources]]
path = "native/pty_windows.c"
when = { os = "windows" }
