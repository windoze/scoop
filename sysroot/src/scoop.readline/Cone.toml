schema = 1

[cone]
group = "scoop"
name = "scoop.readline"
version = "0.1.0"
kind = "library"

[[test.sources]]
path = "tests"

[[test.sources]]
path = "test-platform/unix"
when = { os = ["darwin", "linux"] }

[[test.sources]]
path = "test-platform/windows"
when = { os = "windows" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.terminal" = "0.1.0"
"scoop:scoop.charset" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop.tests:readline-native" = { version = "0.1.0", path = "test-native" }
