schema = 1
[cone]
group = "scoop.examples.gui"
name = "basics"
version = "0.1.0"
kind = "executable"

[[sources]]
path = "src"
when = { os = "darwin" }
[[test.sources]]
path = "tests"
when = { os = "darwin" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.math" = "0.1.0"
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.gui" = { version = "0.1.0", path = "../.." }
"scoop:scoop.window" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
