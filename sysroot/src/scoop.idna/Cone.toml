schema = 1
[cone]
group = "scoop"
name = "scoop.idna"
version = "0.1.0"
kind = "library"
[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
[test-dependencies]
"scoop:scoop.test" = "0.1.0"
[native]
include = [
    {path = "../../lib/aarch64-apple-darwin/include", when = {os = "darwin"}},
    {path = "../../lib/x86_64-unknown-linux-gnu/include", when = {env = "gnu"}},
    {path = "../../lib/x86_64-unknown-linux-musl/include", when = {env = "musl"}},
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Werror", "-DIDN2_STATIC", "-DIDN2_SKIP_LIBIDN_COMPAT"]
[[native.libraries]]
name = "idn2"
kind = "static"
[[native.libraries]]
name = "unistring"
kind = "static"
[[native.libraries]]
name = "iconv"
kind = "static"
[[native.sources]]
path = "native/common.c"
[[native.sources]]
path = "native/domain.c"
[[native.sources]]
path = "native/punycode.c"
