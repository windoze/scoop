schema = 1

[cone]
group = "scoop"
name = "scoop.window.asyncio"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = ["darwin", "linux"] }

[[test.sources]]
path = "test-platform/darwin"
when = { os = "darwin" }

[[test.sources]]
path = "test-platform/linux"
when = { os = "linux" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.asyncio" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop.tests:window-native" = { version = "0.1.0", path = "../scoop.window/test-native" }
