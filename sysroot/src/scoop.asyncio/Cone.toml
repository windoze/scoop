schema = 1

[cone]
group = "scoop"
name = "scoop.asyncio"
version = "0.1.0"
kind = "library"

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.crypto" = "0.1.0"
"scoop:scoop.test" = "0.1.0"
"scoop.tests:asyncio-native" = { version = "0.1.0", path = "test-native" }

[native]
include = [
    { path = "../../vendor/libuv/include", when = { os = "linux" } },
    { path = "../../vendor/libuv/src", when = { os = "linux" } },
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Wno-unused-parameter", "-fno-strict-aliasing", "-include", "native/config.h"]

