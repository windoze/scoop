schema = 1

[cone]
group = "scoop"
name = "scoop.asyncio"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"

[[sources]]
path = "platform/unix"
when = { os = ["darwin", "linux"] }

[[sources]]
path = "platform/darwin"
when = { os = "darwin" }

[[test.sources]]
path = "tests"

[[test.sources]]
path = "test-platform/darwin"
when = { os = "darwin" }

[[test.sources]]
path = "test-platform/linux"
when = { os = "linux" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.crypto" = "0.1.0"
"scoop:scoop.test" = "0.1.0"
"scoop.tests:asyncio-native" = { version = "0.1.0", path = "test-native" }

[native]
include = [
    { path = "native/linux/config/gnu", when = { env = "gnu" } },
    { path = "native/linux/config/musl", when = { env = "musl" } },
    { path = "../../vendor/liburing/2.15/src/include", when = { os = "linux" } },
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Wno-unused-parameter", "-fno-strict-aliasing", "-DLIBURING_INTERNAL", "-include", "native/config.h"]

