schema = 1

[cone]
group = "scoop.tests"
name = "asyncio-native"
version = "0.1.0"
kind = "library"

[dependencies]
"scoop:scoop.core" = "0.1.0"

[native]
include = [{ path = "../../../vendor/libuv/include", when = { os = "linux" } }]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-include", "../native/config.h"]

[[native.sources]]
path = "native/fence.c"
when = { os = "linux" }

[[native.sources]]
path = "native/fence_dispatch.c"
when = { os = "darwin" }

[[native.sources]]
path = "native/work.c"

[[native.sources]]
path = "native/socket.c"

[[native.sources]]
path = "native/tty.c"
