schema = 1

[cone]
group = "scoop.tests"
name = "asyncio-native"
version = "0.1.0"
kind = "library"

[dependencies]
"scoop:scoop.core" = "0.1.0"

[native]
include = [
    { path = "../native/linux/config/gnu", when = { env = "gnu" } },
    { path = "../native/linux/config/musl", when = { env = "musl" } },
    { path = "../../../vendor/liburing/2.15/src/include", when = { os = "linux" } },
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-include", "../native/config.h"]

[[native.sources]]
path = "native/fence_work.c"

[[native.sources]]
path = "native/work.c"

[[native.sources]]
path = "native/socket.c"

[[native.sources]]
path = "native/tty.c"

[[native.sources]]
path = "native/host.c"
when = { os = ["darwin", "linux"] }

[[native.sources]]
path = "native/host_windows.c"
when = { os = "windows" }

[[native.sources]]
path = "native/windows/loop.c"
when = { os = "windows" }

[[native.sources]]
path = "native/windows/requests.c"
when = { os = "windows" }

[[native.sources]]
path = "native/windows/work.c"
when = { os = "windows" }

[[native.sources]]
path = "native/windows/tcp.c"
when = { os = "windows" }

[[native.sources]]
path = "native/windows/udp.c"
when = { os = "windows" }

[[native.sources]]
path = "native/host_darwin.c"
when = { os = "darwin" }

[[native.libraries]]
name = "CoreFoundation"
kind = "framework"
when = { os = "darwin" }

[[native.sources]]
path = "native/ring.c"
when = { os = "linux" }

[[native.sources]]
path = "native/ring_policy.c"
when = { os = "linux" }

[[native.sources]]
path = "native/tty_owner.c"

[[native.sources]]
path = "native/tty_completion.c"
