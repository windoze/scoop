schema = 1
[cone]
group = "scoop"
name = "scoop.http"
version = "0.1.0"
kind = "library"

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.idna" = "0.1.0"
"scoop:scoop.url" = "0.1.0"
"scoop:scoop.charset" = "0.1.0"
"scoop:scoop.crypto" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"

[native]
include = [
    "../../vendor/publicsuffix",
    "../../vendor/llhttp/include",
    {path = "../../lib/aarch64-apple-darwin/nghttp2/include", when = {os = "darwin"}},
    {path = "../../lib/x86_64-unknown-linux-gnu/nghttp2/include", when = {env = "gnu"}},
    {path = "../../lib/x86_64-unknown-linux-musl/nghttp2/include", when = {env = "musl"}},
]
# Separate preprocessing removes the upstream's intentional fallthrough comments.
c_flags = [
    "-std=c11", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter",
    "-Wno-implicit-fallthrough", "-DNGHTTP2_STATICLIB",
]

[[native.libraries]]
name = "nghttp2"
kind = "static"

[[native.sources]]
path = "../../vendor/llhttp/src/api.c"
[[native.sources]]
path = "../../vendor/llhttp/src/http.c"
[[native.sources]]
path = "../../vendor/llhttp/src/llhttp.c"
[[native.sources]]
path = "native/data.c"
[[native.sources]]
path = "native/psl.c"
[[native.sources]]
path = "native/http1.c"
[[native.sources]]
path = "native/http1_callbacks.c"
[[native.sources]]
path = "native/http2.c"
[[native.sources]]
path = "native/http2_input.c"
[[native.sources]]
path = "native/http2_body.c"
[[native.sources]]
path = "native/http2_submit.c"
[[native.sources]]
path = "native/http2_headers.c"
[[native.sources]]
path = "native/http2_events.c"
[[native.sources]]
path = "native/http2_upgrade.c"
