schema = 1
[cone]
group = "scoop"
name = "scoop.tls"
version = "0.1.0"
kind = "library"

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.crypto" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop.tests:crypto-certificates" = { version = "0.1.0", path = "../scoop.crypto/test-certificates" }
"scoop.tests:tls-system-native" = { version = "0.1.0", path = "test-native" }

[native]
include = [
    {path = "../../lib/aarch64-apple-darwin/openssl/include", when = {os = "darwin"}},
    {path = "../../lib/x86_64-unknown-linux-gnu/openssl/include", when = {env = "gnu"}},
    {path = "../../lib/x86_64-unknown-linux-musl/openssl/include", when = {env = "musl"}},
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Werror"]

[[native.libraries]]
name = "ssl"
kind = "static"

[[native.libraries]]
name = "Security"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "CoreFoundation"
kind = "framework"
when = { os = "darwin" }

[[native.sources]]
path = "native/context.c"
[[native.sources]]
path = "native/identity.c"
[[native.sources]]
path = "native/session.c"
[[native.sources]]
path = "native/step.c"
[[native.sources]]
path = "native/transport.c"

[[native.sources]]
path = "native/system_context.c"
[[native.sources]]
path = "native/verification.c"
[[native.sources]]
path = "native/system_linux.c"
when = { os = "linux" }
[[native.sources]]
path = "native/verification_linux.c"
when = { os = "linux" }
[[native.sources]]
path = "native/verification_darwin.c"
when = { os = "darwin" }
