schema = 1
[cone]
group = "scoop.tests"
name = "tls-system-native"
version = "0.1.0"
kind = "library"

[dependencies]
"scoop:scoop.asyncio" = "0.1.0"
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.crypto" = "0.1.0"
"scoop.tests:crypto-certificates" = { version = "0.1.0", path = "../../scoop.crypto/test-certificates" }

[native]
include = [
    {sysroot = "openssl/include"},
]
c_flags = ["-Wextra", "-Werror"]

[[native.sources]]
path = "native/trust.c"

[[native.sources]]
path = "native/pool.c"

[[native.sources]]
path = "native/isolated_work.c"

[[native.sources]]
path = "native/certificate.c"
