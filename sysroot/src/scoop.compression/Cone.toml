schema = 1
[cone]
group = "scoop"
name = "scoop.compression"
version = "0.1.0"
kind = "library"
[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.asyncio" = "0.1.0"
[test-dependencies]
"scoop:scoop.charset" = "0.1.0"
"scoop:scoop.http" = "0.1.0"
"scoop:scoop.url" = "0.1.0"
"scoop:scoop.test" = "0.1.0"
[native]
include = [
    {path = "../../lib/aarch64-apple-darwin/include", when = {os = "darwin"}},
    {path = "../../lib/x86_64-unknown-linux-gnu/include", when = {env = "gnu"}},
    {path = "../../lib/x86_64-unknown-linux-musl/include", when = {env = "musl"}},
    {path = "../../lib/x86_64-pc-windows-msvc-ucrt/include", when = {env = "msvc-ucrt"}},
    {path = "../../lib/x86_64-w64-windows-llvm-mingw-msvcrt/include", when = {env = "llvm-mingw-msvcrt"}},
    {path = "../../lib/x86_64-w64-windows-llvm-mingw-ucrt/include", when = {env = "llvm-mingw-ucrt"}},
]
c_flags = ["-Wextra", "-Werror"]
[[native.libraries]]
name = "zstd"
kind = "static"
[[native.libraries]]
name = "z-ng"
kind = "static"
[[native.libraries]]
name = "brotlienc"
kind = "static"
[[native.libraries]]
name = "brotlidec"
kind = "static"
[[native.libraries]]
name = "brotlicommon"
kind = "static"
[[native.sources]]
path = "native/codec.c"
[[native.sources]]
path = "native/memory.c"
[[native.sources]]
path = "native/deflate.c"
[[native.sources]]
path = "native/zstd.c"
[[native.sources]]
path = "native/brotli.c"
[[native.sources]]
path = "native/process.c"
[[native.sources]]
path = "native/output.c"
[[native.sources]]
path = "native/message.c"
[[native.sources]]
path = "native/message_encode.c"
[[native.sources]]
path = "native/message_decode.c"
