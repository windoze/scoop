schema = 1

[cone]
group = "scoop"
name = "scoop.platform"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"

[[sources]]
path = "platform/windows"
when = {os = "windows"}

[[sources]]
path = "platform/posix"
when = {os = ["darwin", "linux"]}

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"

[[test.sources]]
path = "tests"

[[test.sources]]
path = "test-windows"
when = {os = "windows"}

[[test.sources]]
path = "test-posix"
when = {os = ["darwin", "linux"]}

[native]
c_flags = ["-Wextra", "-Werror"]

[[native.libraries]]
name = "bcrypt"
when = {os = "windows"}

[[native.libraries]]
name = "ws2_32"
when = {os = "windows"}

[[native.libraries]]
name = "userenv"
when = {os = "windows"}

[[native.libraries]]
name = "advapi32"
when = {os = "windows"}

[[native.sources]]
path = "native/errors.c"

[[native.sources]]
path = "native/memory.c"

[[native.sources]]
path = "native/io.c"
when = {os = ["darwin", "linux"]}
[[native.sources]]
path = "native/files.c"
when = {os = ["darwin", "linux"]}
