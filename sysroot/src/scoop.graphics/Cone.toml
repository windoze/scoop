schema = 1

[cone]
group = "scoop"
name = "scoop.graphics"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src/geometry"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src/drawing"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src/native"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src/platform/darwin"
when = { os = "darwin" }
[[sources]]
path = "src/platform/windows"
when = { os = "windows" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.math" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop.tests:graphics-native" = { version = "0.1.0", path = "test-native" }

[[test.sources]]
path = "tests/drawing.scoop"
[[test.sources]]
path = "tests/native_canvas.scoop"
[[test.sources]]
path = "tests/canvas_scope.scoop"
[[test.sources]]
path = "tests/effects.scoop"
[[test.sources]]
path = "tests/effects_metal.scoop"
when = { os = "darwin" }
[[test.sources]]
path = "tests/metal.scoop"
when = { os = "darwin" }
[[test.sources]]
path = "tests/d3d.scoop"
when = { os = "windows" }

[native]
cxx = true
include = [{ sysroot = "include/skia" }]
cxx_flags = ["-Wmost", "-Wextra", "-Werror", "-Wno-unused-parameter", "-DSK_RELEASE", "-DSK_GANESH", "-DSK_SHAPER_HARFBUZZ_AVAILABLE", "-DSK_UNICODE_ICU_IMPLEMENTATION"]

[[native.sources]]
path = "native/shared/path.cpp"
[[native.sources]]
path = "native/shared/drawing.cpp"
[[native.sources]]
path = "native/shared/geometry.cpp"
[[native.sources]]
path = "native/shared/filter.cpp"
[[native.sources]]
path = "native/shared/canvas.cpp"
[[native.sources]]
path = "native/darwin/metal.cpp"
when = { os = "darwin" }
[[native.sources]]
path = "native/windows/d3d.cpp"
when = { os = "windows" }

[[native.libraries]]
name = "scoop_skia"
kind = "static"
[[native.libraries]]
name = "z"
when = { os = "darwin" }
[[native.libraries]]
name = "CoreFoundation"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "CoreGraphics"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "CoreText"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "Foundation"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "Metal"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "IOSurface"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "d3d12"
when = { os = "windows" }
[[native.libraries]]
name = "dxgi"
when = { os = "windows" }
[[native.libraries]]
name = "d3dcompiler"
when = { os = "windows" }
[[native.libraries]]
name = "dwrite"
when = { os = "windows" }
[[native.libraries]]
name = "ole32"
when = { os = "windows" }
[[native.libraries]]
name = "oleaut32"
when = { os = "windows" }
[[native.libraries]]
name = "gdi32"
when = { os = "windows" }
[[native.libraries]]
name = "user32"
when = { os = "windows" }
