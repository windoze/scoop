schema = 1

[cone]
group = "scoop"
name = "scoop.terminal"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
[[sources]]
path = "platform/unix"
when = {os = ["darwin", "linux"]}

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"

[native]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Werror"]

[[native.sources]]
path = "native/unix/session.c"
when = {os = ["darwin", "linux"]}
[[native.sources]]
path = "native/unix/control.c"
when = {os = ["darwin", "linux"]}
[[native.sources]]
path = "native/unix/resize_linux.c"
when = {os = "linux"}
[[native.sources]]
path = "native/unix/resize_darwin.c"
when = {os = "darwin"}
[[native.sources]]
path = "native/unix/input.c"
when = {os = ["darwin", "linux"]}
