schema = 1
name = "m31-integer-conditions"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m31", "optimization", "constant-branches"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "43\nsigned\nunsigned\n"
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}
