schema = 1
name = "m45-pressure-noop"
inputs = ["probe.c"]
tools = ["cc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m45", "runtime", "gc"]

[[steps]]
name = "build"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-Wall", "-Wextra", "-Werror", "-pthread", "-I", "${runtime}/include", "${fixture}/probe.c", "${runtime}/src/gc/pressure.c", "${runtime}/src/gc_binding/pressure.c", "-o", "${work}/probe"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/probe"]
exit = 0
stdout = ""
stderr = ""
