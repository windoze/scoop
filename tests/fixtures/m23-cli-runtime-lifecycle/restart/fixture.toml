schema = 1
name = "runtime-lifecycle-restart"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "empty-provider", "../../m23-runtime-images/empty-provider.scoop", "../support/lifetime.c", "empty", "../../m23-runtime-images/empty.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["runtime-lifecycle", "lifetime", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_empty-provider"
files = [
  {"copy" = {"from" = "${fixture}/empty-provider", "to" = "${work}/sources/empty-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/empty-provider.scoop", "to" = "${work}/sources/empty-provider/src/main.scoop"}},
]

[[steps]]
name = "empty-provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/empty-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-empty-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/empty-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/empty-provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${empty-provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/empty-provider/${empty-provider.result.root.identity}/ast.txt", "snapshot" = "empty-provider.ast.txt"},
  {"file" = "${work}/dump/empty-provider/${empty-provider.result.root.identity}/hir.txt", "snapshot" = "empty-provider.hir.txt"},
  {"file" = "${work}/dump/empty-provider/${empty-provider.result.root.identity}/mir.txt", "snapshot" = "empty-provider.mir.txt"},
  {"file" = "${work}/dump/empty-provider/${empty-provider.result.root.identity}/lir.txt", "snapshot" = "empty-provider.lir.txt"},
]

[[steps]]
name = "remove_empty-provider"
files = [
  {"remove" = {"path" = "${work}/sources/empty-provider"}},
]

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../support/lifetime.c", "to" = "${work}/native/trace.c"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/native/trace.c", "-o", "${work}/native/trace.o", "-I", "${runtime}/include", "-I", "${runtime}/src"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_lifecycle.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_native_source"
files = [
  {"remove" = {"path" = "${work}/native/trace.c"}},
  {"remove" = {"path" = "${work}/native/trace.o"}},
]

[[steps]]
name = "prepare_empty"
files = [
  {"copy" = {"from" = "${fixture}/empty", "to" = "${work}/sources/empty"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/empty.scoop", "to" = "${work}/sources/empty/src/main.scoop"}},
  {"replace" = {"path" = "${work}/sources/empty/src/main.scoop", "old" = "fun main() {}", "new" = "@Extern(lib = \"m23_lifecycle\", name = \"m23_register_restart\")\nprivate fun registerRestart()\nfun main() { @Unsafe { registerRestart() } }"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/empty", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--emit", "all", "--dump-dir", "${work}/dump/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${program.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/program/${program.result.root.identity}/ast.txt", "snapshot" = "program.ast.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/hir.txt", "snapshot" = "program.hir.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/mir.txt", "snapshot" = "program.mir.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/lir.txt", "snapshot" = "program.lir.${target}.txt"},
]

[[steps]]
name = "isolate"
files = [
  {"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}},
  {"remove" = {"path" = "${work}/sources"}},
]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 2},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:empty-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:empty:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=3 root=${symbol_prefix}scoop$$1$$re$$50032b120e95d823c1642a8f5edb38cc05ac519be858856d6a5aaf5db0de8dde"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
stdout = ""
stderr = "scoop startup: program runtime may only be started once\n"
env = {}
signal = "SIGABRT"

[[steps]]
name = "run_moving"
argv = ["${work}/program"]
stdout = ""
stderr = "scoop startup: program runtime may only be started once\n"
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
signal = "SIGABRT"
