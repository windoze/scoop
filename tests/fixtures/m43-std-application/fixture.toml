schema = 1
name = "m43-std-application"
inputs = []
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m43", "stdlib", "test-command"]
variants = [
    {name = "debug", vars = {profile = "debug"}},
    {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "production"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/lib/scoop.std", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
    {actual = "${production.result.kind}", equals = "library"},
    {actual = "${production.result.dependencies.length}", equals = 1},
]

[[steps]]
name = "build-tests"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${sysroot}/lib/scoop.std", "--no-run", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
    {actual = "${build-tests.result.dependencies.length}", equals = 2},
    {actual = "${build-tests.result.output}", equals = "${work}/outputs/${target}/${profile}/tests/scoop.std"},
    {actual = "${build-tests.result.root.path}", not_equals = "${production.result.root.path}"},
]

[[steps]]
name = "run-tests"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${sysroot}/lib/scoop.std", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${run-tests.result.observations.child_invocations.length}", equals = 0}]

[[steps]]
name = "moving"
argv = ["${build-tests.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = ""
stderr = ""
