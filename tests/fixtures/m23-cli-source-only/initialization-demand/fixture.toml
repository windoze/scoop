schema = 1
name = "source-only-initialization-demand"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "initialization-demand", "../../m23-source-only-nominals/initialization-demand.scoop", "source-only-initialization-demand-consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["source-only"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_initialization-demand"
files = [
  {"copy" = {"from" = "${fixture}/initialization-demand", "to" = "${work}/sources/initialization-demand"}},
  {"copy" = {"from" = "${fixture}/../../m23-source-only-nominals/initialization-demand.scoop", "to" = "${work}/sources/initialization-demand/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/initialization-demand", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/initialization-demand/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_source-only-initialization-demand-consumer"
files = [
  {"copy" = {"from" = "${fixture}/source-only-initialization-demand-consumer", "to" = "${work}/sources/source-only-initialization-demand-consumer"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/source-only-initialization-demand-consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/source-only-initialization-demand-consumer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []
