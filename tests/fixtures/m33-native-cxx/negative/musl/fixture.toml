schema = 1
name = "m33-native-cxx-reject-musl"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["x86_64-unknown-linux-musl"]
variants = [{name = "static", vars = {mode = "static"}}, {name = "dynamic", vars = {mode = "dynamic"}}]
tags = ["m33", "native", "negative"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--link-mode", "${mode}", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
