schema = 1
name = "m33-native-cxx-artifacts"
inputs = ["provider", "middle", "consumer"]
tools = ["scoop", "scoopc", "scoop-link"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
tags = ["m33", "ffi", "native", "artifact-only", "generics"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/sources/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/sources/consumer"}},
  {copy = {from = "${fixture}/middle", to = "${work}/sources/middle"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--message-format", "json", "-o", "${work}/artifacts/dev.m33/cxx-provider/0.1.0/cone.slib"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "middle"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/middle", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-middle", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.m33/cxx-middle/0.1.0/cone.slib"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/consumer", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "link"
argv = ["${scoop-link}", {each = "${link_args}"}, "--root-slib", "${consumer.result.root.path}", {each = "${consumer.result.dependencies}", field = "path", prefix = "--dep-slib"}, "--runtime-objects", "${consumer.result.runtime_index}", "-o", "${work}/relinked"]
exit = 0
stdout = "link-plan ${consumer.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/relinked"]
exit = 0
stdout = "native-artifacts-ok\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${work}/relinked"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "native-artifacts-ok\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${work}/relinked"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "native-artifacts-ok\n"
stderr = ""
