schema = 1
name = "m52-runtime-deployment"
inputs = ["../m52-deployment/cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["m52", "deployment", "runtime", "negative"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "${fixture}/../m52-deployment/cone", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--message-format", "json", "-o", "${work}/program"]
env = {MACOSX_DEPLOYMENT_TARGET = "27.0"}
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{file = "${work}/program", exists = false}]
