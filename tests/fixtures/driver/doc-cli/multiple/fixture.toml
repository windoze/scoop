schema = 1
name = "doc-cli-multiple"
root = "first/Cone.toml"
inputs = ["library", "first", "second"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["documentation", "cache", "multi-root", "driver"]

[[variants]]
name = "combined"
vars = {first_options = [], first_cones = 3, missing_docs = 0}

[[variants]]
name = "artifact_then_docs"
vars = {first_options = ["--no-deps"], first_cones = 2, missing_docs = 1}

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/library", to = "${work}/library"}},
  {copy = {from = "${fixture}/first", to = "${work}/first"}},
  {copy = {from = "${fixture}/second", to = "${work}/second"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "doc", "${work}/first", "${work}/second", {"each" = "${first_options}"}, {"each" = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${cold.result.cones.length}", equals = "${first_cones}"},
  {actual = "${cold.result.observations.child_invocations.length}", equals = 3},
  {file = "${work}/site/assets/index.js", contains = "firstHelper"},
  {file = "${work}/site/assets/index.js", contains = "secondHelper"},
]

[[steps]]
name = "all"
argv = ["${scoop}", "doc", "${work}/second", "${work}/first", {"each" = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${all.result.cones.length}", equals = 3},
  {actual = "${all.result.observations.child_invocations.length}", equals = "${missing_docs}"},
  {file = "${all.result.output}", contains = "shared-docs"},
  {file = "${work}/site/assets/index.js", contains = "answer"},
]

[[steps]]
name = "save"
files = [{copy = {from = "${work}/site/index.html", to = "${work}/complete.html"}}]

[[steps]]
name = "explicit"
argv = ["${scoop}", "doc", "${work}/library", "${work}/first", "${work}/second", "${work}/library/Cone.toml", "--no-deps", {"each" = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${explicit.result.cones.length}", equals = 3},
  {actual = "${explicit.result.observations.child_invocations}", equals = []},
  {actual = "${explicit.result.rendered}", equals = false},
  {file = "${explicit.result.output}", same_as = "${work}/complete.html"},
]

[[steps]]
name = "change_one_root"
files = [{replace = {path = "${work}/first/src/main.scoop", old = "Uses [answer] from the shared library.", new = "Uses [answer] with a revised explanation."}}]

[[steps]]
name = "incremental"
argv = ["${scoop}", "doc", "${work}/first", "${work}/second", {"each" = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${incremental.result.observations.child_invocations.length}", equals = 1},
  {actual = "${incremental.result.observations.rendered_files.length}", equals = 10},
  {file = "${work}/site/assets/index.js", contains = "revised explanation"},
]

[[steps]]
name = "remove_root"
argv = ["${scoop}", "doc", "${work}/second", "--no-deps", {"each" = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${remove_root.result.cones.length}", equals = 1},
  {actual = "${remove_root.result.observations.child_invocations}", equals = []},
  {file = "${remove_root.result.output}", not_contains = "first-docs"},
  {file = "${work}/site/assets/index.js", not_contains = "firstHelper"},
  {file = "${work}/site/assets/index.js", not_contains = "shared-docs"},
]
