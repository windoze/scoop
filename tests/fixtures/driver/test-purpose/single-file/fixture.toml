schema = 1
name = "test-purpose-single-file"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["test-purpose", "negative", "driver"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--profile", "release", {"each" = "${compile_args}"}, "${root}", "--emit-slib", "--tests", "-o", "${work}/tests.slib"]
exit = 1
stdout = ""
stderr = "error[SCOOP_CLI_CONFIG]: test requires a manifest Cone\n"
checks = [{file = "${work}/tests.slib", exists = false}]

[[steps]]
name = "reject-test-command"
argv = ["${scoop}", "test", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/output"]
exit = 1
stdout = ""
stderr = "error[SCOOP_CLI_CONFIG]: test requires a manifest Cone\n"
checks = [{file = "${work}/output", exists = false}]
