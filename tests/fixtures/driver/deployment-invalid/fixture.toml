schema = 1
name = "deployment-invalid"
inputs = ["../deployment/cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["deployment", "negative", "driver"]

[[variants]]
name = "malformed"
vars = {version = "invalid", reason = "expected major.minor[.patch]"}

[[variants]]
name = "non_numeric"
vars = {version = "27.x", reason = "non-numeric component"}

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", "${fixture}/../deployment/cone", "--lockfile", "${work}/source-lock-0.lock", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--message-format", "json", "-o", "${work}/program"]
env = {MACOSX_DEPLOYMENT_TARGET = "${version}"}
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = [{code = "SCOOP_CLI_CONFIG", message = "invalid MACOSX_DEPLOYMENT_TARGET \"${version}\": ${reason}", notes = [], origin = {kind = "none"}, phase = "Request", severity = "error"}]
checks = [{file = "${work}/program", exists = false}]
