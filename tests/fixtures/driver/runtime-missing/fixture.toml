schema = 1
name = "runtime-missing"
inputs = ["main.scoop", "library"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["sysroot", "runtime", "negative", "driver"]
[vars]
options = ["--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
 {copy = {from = "${sysroot}/lib/${target}/scoop.core.slib", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}},
 {copy = {from = "${sysroot}/lib/${target}/scoop.std.slib", to = "${work}/sysroot/lib/${target}/scoop.std.slib"}},
 {symlink = {from = "${sysroot}/src", to = "${work}/sysroot/src"}},
 {symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}},
]

[[steps]]
name = "library"
argv = ["${scoop}", "build", "--release", "${fixture}/library", {"each" = "${compile_args}"}, {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", "${fixture}/main.scoop", {"each" = "${compile_args}"}, {"each" = "${options}"}, "-o", "${work}/program"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{file = "${work}/program", exists = false}]
