schema = 1
name = "assertions-throwable-bound"
inputs = ["program"]
tools = ["scoop", "scoopc", "scoop-link"]
when = { os = ["darwin", "linux"] }
tags = ["assertions", "negative", "driver"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
