schema = 1
name = "fmt-source-directory-cycle"
inputs = ["Cone.toml"]
tools = ["scoop"]
tags = ["driver", "format", "negative"]

[vars]
source_directory = "${work}/cone/src"

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/Cone.toml", to = "${work}/cone/Cone.toml"}}, {write = {path = "${work}/cone/src/source.scoop", data = "fun f()=1\n"}}, {symlink = {from = "${work}/cone/src", to = "${work}/cone/src/loop"}}]

[[steps]]
name = "cycle"
argv = ["${scoop}", "fmt", "cone", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{actual = "${cycle.result.files}", equals = []}, {actual = "${cycle.result.success}", equals = false}, {file = "${work}/cone/src/source.scoop", equals = "fun f()=1\n"}]
