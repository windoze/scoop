schema = 1
name = "test-selection-invalid"
inputs = ["program"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["test-selection", "negative", "driver"]

[[steps]]
name = "reject-unselected-method"
argv = ["${scoop}", "test", "--release", {"each" = "${link_args}"}, "${fixture}/program", "--filter", "Cases::valid", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{file = "${work}/outputs/${target}/release/dev.m43/selection-invalid/tests/selection-invalid", exists = false}]

[[steps]]
name = "valid-copy"
files = [
    {copy = {from = "${fixture}/program", to = "${work}/program"}},
    {replace = {path = "${work}/program/tests/cases.scoop", old = "invalid(value: Int)", new = "invalid()"}},
]

[[steps]]
name = "build-valid"
argv = ["${scoop}", "test", "--release", {"each" = "${link_args}"}, "${work}/program", "--no-run", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "break-test-source"
files = [
    {copy = {from = "${build-valid.result.output}", to = "${work}/previous-tests"}},
    {replace = {path = "${work}/program/tests/cases.scoop", old = "invalid()", new = "invalid(value: Int)"}},
]

[[steps]]
name = "reject-with-previous-output"
argv = ["${scoop}", "test", "--release", {"each" = "${link_args}"}, "${work}/program", "--filter", "Cases::valid", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = {file = "diagnostics.json"}
checks = [
    {actual = "${reject-with-previous-output.records.length}", equals = 1},
    {file = "${build-valid.result.output}", same_as = "${work}/previous-tests"},
    {glob = "${work}/outputs/${target}/release/dev.m43/selection-invalid/tests/.test-run-*", equals = []},
]
