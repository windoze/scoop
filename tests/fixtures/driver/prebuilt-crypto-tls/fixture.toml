schema = 1
name = "prebuilt-crypto-tls"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["crypto", "tls", "cache", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "${fixture}/cone", "--lockfile", "${work}/source-lock-0.lock", {each = "${link_args}"}, {each = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${cold.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]}]

[[steps]]
name = "run"
argv = ["${cold.result.output}"]
exit = 0
stdout = "prebuilt crypto and TLS\n"
stderr = ""
[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${fixture}/cone", "--lockfile", "${work}/source-lock-0.lock", {each = "${link_args}"}, {each = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]
