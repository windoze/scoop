schema = 1
name = "program-link-equality-roots"
inputs = ["eq-provider", "../../../language/program-link/equality-provider.scoop", "eq-facade", "../../../language/program-link/equality-facade.scoop", "eq-root", "../../../language/program-link/equality-root.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["program-link", "multi-cone", "driver"]
variants = [{"name" = "release"}]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/eq-provider", "to" = "${work}/sources/eq-provider"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/equality-provider.scoop", "to" = "${work}/sources/eq-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/eq-facade", "to" = "${work}/sources/eq-facade"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/equality-facade.scoop", "to" = "${work}/sources/eq-facade/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/eq-root", "to" = "${work}/sources/eq-root"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/equality-root.scoop", "to" = "${work}/sources/eq-root/src/main.scoop"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/eq-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 3},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "true\ntrue\ntrue\ntrue\ntrue\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.1.path}", "to" = "${work}/artifacts/1.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.2.path}", "to" = "${work}/artifacts/2.slib"}},
]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/2.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "true\ntrue\ntrue\ntrue\ntrue\n"
stderr = ""
