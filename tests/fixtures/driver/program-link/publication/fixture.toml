schema = 1
name = "program-link-publication"
inputs = ["cone", "../../../language/program-link/read-println.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["program-link", "concurrency", "publication", "driver"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/root"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/read-println.scoop", "to" = "${work}/sources/root/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-build", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "previous"
files = [{"write" = {"path" = "${work}/program", "data" = "previous output"}}]
checks = []

[[steps]]
name = "first"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
background = true
json = "stderr"
diagnostics = []
[[steps]]
name = "second"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
background = true
json = "stderr"
diagnostics = []
[[steps]]
name = "first_complete"
wait = "first"

[[steps]]
name = "second_complete"
wait = "second"
checks = [{"actual" = "${first.result.link_plan}", "equals" = "${second.result.link_plan}"}, {"actual" = "${first.result.link_plan_fingerprint}", "equals" = "${second.result.link_plan_fingerprint}"}, {"actual" = "${first.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"glob" = "${work}/.scoop-link-*", "equals" = []}]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""
