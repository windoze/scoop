schema = 1
name = "program-link-rebuilt-core"
inputs = ["cone", "../../../language/program-link/read-println.scoop", "string-prefix.scoop", "relocate.py", "../../../language/program-link/rebuilt-core-native.scoop", "ordinary-string", "../../../language/program-link/shadow-string-library.scoop", "root", "../../../language/program-link/rebuilt-core-root.scoop"]
tools = ["scoop", "scoopc", "python"]
when = { os = ["darwin", "linux"] }
tags = ["program-link", "core", "multi-cone", "driver"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/root"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/read-println.scoop", "to" = "${work}/sources/root/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-build", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}]

[[steps]]
name = "prepare_core"
files = [
  {copy = {from = "${sysroot}/src/scoop.core", to = "${work}/core-source"}},
  {copy = {from = "${fixture}/../../../language/program-link/rebuilt-core-native.scoop", to = "${work}/core-source/src/rebuilt-native.scoop"}},
]
checks = []

[[steps]]
name = "relocate_string"
argv = ["${python}", "${fixture}/relocate.py", "${work}/core-source/src", "${fixture}/string-prefix.scoop"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "compile_core"
argv = ["${scoop}", "build", "--profile", "release", "${work}/core-source", "--sysroot", "${sysroot}", {each = "${compile_args}"}, "-o", "${work}/rebuilt-core.slib", "--emit-slib", "--cache-dir", "${cache}", "--target-dir", "${work}/compiler-output", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prepare_ordinary-string"
files = [{"copy" = {"from" = "${fixture}/ordinary-string", "to" = "${work}/sources/ordinary-string"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/shadow-string-library.scoop", "to" = "${work}/sources/ordinary-string/src/main.scoop"}}]
checks = []

[[steps]]
name = "prepare_root"
files = [{"copy" = {"from" = "${fixture}/root", "to" = "${work}/sources/root"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/rebuilt-core-root.scoop", "to" = "${work}/sources/root/src/main.scoop"}}]
checks = []

[[steps]]
name = "rebuilt"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-rebuilt", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run_rebuilt"
argv = ["${rebuilt.result.output}"]
exit = 0
stdout = "rebuilt\nroot\n42\n42\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate_rebuilt"
files = [
  {"copy" = {"from" = "${rebuilt.result.root.path}", "to" = "${work}/rebuilt-artifacts/root.slib"}},
  {"copy" = {"from" = "${rebuilt.result.dependencies.0.path}", "to" = "${work}/rebuilt-artifacts/0.slib"}},
  {"copy" = {"from" = "${rebuilt.result.dependencies.1.path}", "to" = "${work}/rebuilt-artifacts/1.slib"}},
]
checks = []

[[steps]]
name = "rebuilt_link"
argv = ["${scoop}", "link", "--root-slib", "${work}/rebuilt-artifacts/root.slib", "--dependency-slib", "${work}/rebuilt-artifacts/1.slib", "--dependency-slib", "${work}/rebuilt-artifacts/0.slib", "--runtime-objects", "${rebuilt.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${rebuilt_link.result.link_plan_fingerprint}", "equals" = "${rebuilt.result.link_plan_fingerprint}"}, {"actual" = "${rebuilt_link.result.link_plan}", "not_contains" = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$1$td$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"}]

[[steps]]
name = "actual_string_owner"
checks = [{"actual" = "${rebuilt_link.result.link_plan}", "contains" = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$1$td$0245432d5c318ba49a6d2061c5c93ed1a5ba0828b5207170631cc670db031b91"}]

[[steps]]
name = "run_linked"
argv = ["${work}/program"]
exit = 0
stdout = "rebuilt\nroot\n42\n42\n"
stderr = ""
