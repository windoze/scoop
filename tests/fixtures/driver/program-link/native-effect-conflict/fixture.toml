schema = 1
name = "program-link-native-effect-conflict"
inputs = ["cone", "../../../language/program-link/native-effect-conflict.scoop", "../../../language/program-link/empty.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["program-link", "native-link", "negative", "driver"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/native-effect-conflict"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/native-effect-conflict.scoop", "to" = "${work}/sources/native-effect-conflict/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "control_source"
files = [{"copy" = {"from" = "${fixture}/../../../language/program-link/empty.scoop", "to" = "${work}/sources/native-effect-conflict/src/main.scoop"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/native-effect-conflict", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-build", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "restore_native_declaration"
files = [{"copy" = {"from" = "${fixture}/../../../language/program-link/native-effect-conflict.scoop", "to" = "${work}/sources/native-effect-conflict/src/main.scoop"}}]
checks = []

[[steps]]
name = "recompile"
argv = ["${scoop}", "build", "--profile", "release", "${work}/sources/native-effect-conflict", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "-o", "${work}/replacement.slib", "--emit-slib", "--cache-dir", "${cache}", "--target-dir", "${work}/compiler-output", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${work}/replacement.slib", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "previous_reject"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject.json"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]
