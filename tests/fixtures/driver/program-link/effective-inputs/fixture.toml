schema = 1
name = "program-link-effective-inputs"
inputs = ["cone", "../../../language/program-link/read-println.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["program-link", "cache", "runtime", "driver"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/root"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/read-println.scoop", "to" = "${work}/sources/root/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-build", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}]

[[steps]]
name = "original"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "changed_source"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/root"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/read-println.scoop", "to" = "${work}/sources/root/src/main.scoop"}}, {"replace" = {"path" = "${work}/sources/root/src/main.scoop", "old" = "42", "new" = "43"}}]
checks = []

[[steps]]
name = "changed"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-changed", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "changed_artifacts"
files = [
  {"copy" = {"from" = "${changed.result.root.path}", "to" = "${work}/changed-artifacts/root.slib"}},
  {"copy" = {"from" = "${changed.result.dependencies.0.path}", "to" = "${work}/changed-artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "changed_link"
argv = ["${scoop}", "link", "--root-slib", "${work}/changed-artifacts/root.slib", "--dependency-slib", "${work}/changed-artifacts/0.slib", "--runtime-objects", "${changed.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
# A changed function body can preserve the plan's symbol topology; its content fingerprint changes.
checks = [{"actual" = "${changed_link.result.link_plan_fingerprint}", "equals" = "${changed.result.link_plan_fingerprint}"}, {"actual" = "${changed_link.result.link_plan_fingerprint}", "not_equals" = "${link.result.link_plan_fingerprint}"}]

[[steps]]
name = "run_changed"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""

[[steps]]
name = "runtime_sources"
files = [
  {"copy" = {"from" = "${runtime}", "to" = "${work}/runtime-source"}},
  {"replace" = {"path" = "${work}/runtime-source/src/rt.c", "old" = "/* Scoop runtime (DESIGN section 3). C11. */", "new" = "/* Scoop runtime (DESIGN section 3). C11. */\n#if defined(__clang__)\n#pragma clang optimize off\n#elif defined(__GNUC__)\n#pragma GCC optimize (\"O0\")\n#endif"}},
]
checks = []

[[steps]]
name = "runtime_build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${work}/runtime-source", "--cache-dir", "${cache}", "--target-dir", "${work}/runtime-target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${runtime_build.result.observations.child_invocations}", "equals" = []}, {"actual" = "${runtime_build.result.link_plan_fingerprint}", "not_equals" = "${changed_link.result.link_plan_fingerprint}"}, {"actual" = "${runtime_build.result.runtime_index}", "not_equals" = "${changed.result.runtime_index}"}]

[[steps]]
name = "runtime_link"
argv = ["${scoop}", "link", "--root-slib", "${work}/changed-artifacts/root.slib", "--dependency-slib", "${work}/changed-artifacts/0.slib", "--runtime-objects", "${runtime_build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${runtime_link.result.link_plan_fingerprint}", "equals" = "${runtime_build.result.link_plan_fingerprint}"}, {"actual" = "${runtime_link.result.link_plan_fingerprint}", "not_equals" = "${changed_link.result.link_plan_fingerprint}"}]

[[steps]]
name = "changed_runtime"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""
