schema = 1
name = "program-link-diamond-ready-order"
inputs = ["a-base", "../../../language/program-link/schedule-a-base.scoop", "b-next", "../../../language/program-link/schedule-b-next.scoop", "c-peer", "../../../language/program-link/schedule-c-peer.scoop", "d-join", "../../../language/program-link/schedule-d-join.scoop", "root", "../../../language/program-link/schedule-root.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["program-link", "multi-cone", "driver"]
variants = [{"name" = "release"}]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/a-base", "to" = "${work}/sources/a-base"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/schedule-a-base.scoop", "to" = "${work}/sources/a-base/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/b-next", "to" = "${work}/sources/b-next"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/schedule-b-next.scoop", "to" = "${work}/sources/b-next/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/c-peer", "to" = "${work}/sources/c-peer"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/schedule-c-peer.scoop", "to" = "${work}/sources/c-peer/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/d-join", "to" = "${work}/sources/d-join"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/schedule-d-join.scoop", "to" = "${work}/sources/d-join/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/root", "to" = "${work}/sources/root"}}, {"copy" = {"from" = "${fixture}/../../../language/program-link/schedule-root.scoop", "to" = "${work}/sources/root/src/main.scoop"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 5},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "10\n20\n30\n40\n50\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm.result.observations.child_invocations}", equals = []},
  {actual = "${warm.result.link_plan_fingerprint}", equals = "${build.result.link_plan_fingerprint}"},
]

[[steps]]
name = "run_warm"
argv = ["${warm.result.output}"]
exit = 0
stdout = "10\n20\n30\n40\n50\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${build.result.root.path}", "--dependency-slib", "${build.result.dependencies.4.path}", "--dependency-slib", "${build.result.dependencies.3.path}", "--dependency-slib", "${build.result.dependencies.2.path}", "--dependency-slib", "${build.result.dependencies.1.path}", "--dependency-slib", "${build.result.dependencies.0.path}", "--dependency-slib", "${build.result.dependencies.0.path}", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "-o", "${work}/linked", "--message-format", "json", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${link.result.link_plan_fingerprint}", equals = "${build.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "images=6 "},
]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "10\n20\n30\n40\n50\n"
stderr = ""
