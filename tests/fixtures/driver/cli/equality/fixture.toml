schema = 1
name = "cli-derived-equality-provider-reexport"
inputs = ["local.scoop", "provider", "facade", "direct", "reexport", "bad-field.scoop", "bad-no-gc.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["cli", "equality", "reexport", "generics", "driver"]
variants = [{"name" = "release"}]

[vars]
options = ["--sysroot", "${work}/sysroot", "--runtime-root", "${work}/runtime", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/source/provider"}},
  {copy = {from = "${fixture}/facade", to = "${work}/source/facade"}},
  {copy = {from = "${fixture}/direct", to = "${work}/source/direct"}},
  {copy = {from = "${fixture}/reexport", to = "${work}/source/reexport"}},
  {copy = {from = "${sysroot}", to = "${work}/sysroot"}},
  {copy = {from = "${runtime}", to = "${work}/runtime"}},
]

[[steps]]
name = "local"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/local.scoop", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run_local"
argv = ["${local.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""

[[steps]]
name = "direct"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/source/direct", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run_direct"
argv = ["${direct.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""

[[steps]]
name = "reexport"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/source/reexport", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run_reexport"
argv = ["${reexport.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""

[[steps]]
name = "prepare_bad_field"
files = [{copy = {from = "${fixture}/bad-field.scoop", to = "${work}/source/direct/src/main.scoop"}}]

[[steps]]
name = "bad_field"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/source/direct", {"each" = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = [{"severity" = "error", "code" = "SCOOPC_HIR_ERROR", "message" = "cannot derive `equals` for `Broken`: field `Broken.Value._0` of type `Missing` has no applicable member operator `equals`", "origin" = {"kind" = "source", "cone" = "${direct.result.root.identity}", "path" = "src/main.scoop", "start" = 114, "end" = 127}, "notes" = []}]

[[steps]]
name = "prepare_bad_no_gc"
files = [{copy = {from = "${fixture}/bad-no-gc.scoop", to = "${work}/source/direct/src/main.scoop"}}]

[[steps]]
name = "bad_no_gc"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/source/direct", {"each" = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = [{"severity" = "error", "code" = "SCOOPC_HIR_ERROR", "message" = "`@NoGC` code may not call managed function `Flag.equals`", "origin" = {"kind" = "source", "cone" = "${direct.result.root.identity}", "path" = "src/main.scoop", "start" = 114, "end" = 127}, "notes" = []}]

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"mkdir" = {"path" = "${work}/sysroot"}}]

[[steps]]
name = "run_link"
argv = ["${reexport.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""
