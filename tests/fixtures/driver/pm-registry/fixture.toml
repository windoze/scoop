schema = 1
name = "pm-static-registry-build"
inputs = []
support = ["consume.py"]
tools = ["scoop", "scoopc", "scoop-pm", "python"]
when = { os = ["darwin", "linux"] }
tags = ["driver", "pm", "registry", "cache"]

[[steps]]
name = "consume"
argv = ["${python}", "${fixture}/consume.py", "${scoop}", "${scoopc}", "${scoop-pm}", "${work}", "${sysroot}", "${cache}", "${target}", {each = "${compile_args}"}]
exit = 0
stdout = "static registry consumption passed\n"
stderr = ""
