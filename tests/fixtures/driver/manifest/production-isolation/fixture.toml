schema = 1
name = "manifest-production-isolation"
inputs = ["consumer", "provider", "configured.toml"]
tools = ["scoop", "scoopc", "scoop-link"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["manifest", "cache", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
  {copy = {from = "${fixture}/provider", to = "${work}/provider"}},
  {write = {path = "${work}/consumer/tests/bytes.scoop", data = {hex = "fffe"}}},
]

[[steps]]
name = "baseline"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/consumer", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${baseline.result.dependencies.length}", equals = 2}]

[[steps]]
name = "run"
argv = ["${baseline.result.output}"]
exit = 0
stdout = "production 42\n"
stderr = ""

[[steps]]
name = "change_test_sources"
files = [
  {write = {path = "${work}/consumer/tests/invalid.scoop", data = "Different invalid test code.\n"}},
  {write = {path = "${work}/provider/tests/invalid.scoop", data = {hex = "fffe"}}},
]

[[steps]]
name = "unchanged"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/consumer", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${unchanged.result.observations.child_invocations}", equals = []},
  {actual = "${unchanged.result.root.artifact_fingerprint}", equals = "${baseline.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "change_test_manifest"
files = [{copy = {from = "${fixture}/configured.toml", to = "${work}/consumer/Cone.toml"}}]

[[steps]]
name = "configured"
argv = ["${scoop}", "run", "--release", {"each" = "${link_args}"}, "${work}/consumer", {"each" = "${options}"}]
exit = 0
stdout = "production 42\n"
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${configured.result.observations.child_invocations}", equals = []},
  {actual = "${configured.result.root.artifact_fingerprint}", equals = "${baseline.result.root.artifact_fingerprint}"},
  {actual = "${configured.result.dependencies.length}", equals = 2},
]
