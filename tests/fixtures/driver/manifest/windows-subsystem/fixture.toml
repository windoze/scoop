schema = 1
name = "manifest-windows-subsystem"
inputs = ["program", "library"]
tools = ["scoop", "scoopc"]
tags = ["manifest", "negative", "driver"]

[vars]
manifest = "${fixture}/program/Cone.toml"
library_manifest = "${fixture}/library/Cone.toml"

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {each = "${link_args}"}, "${fixture}/program", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}

[[steps]]
name = "library"
argv = ["${scoop}", "build", "--release", {each = "${link_args}"}, "${fixture}/library", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "library-diagnostics.json"}
