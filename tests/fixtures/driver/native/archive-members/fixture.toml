schema = 1
name = "native-archive-members"
inputs = ["cone", "entry.c", "helper.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
when = { os = ["darwin", "linux"] }
tags = ["native", "native-link", "driver"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
  {mkdir = {path = "${work}/native"}},
]

[[steps]]
name = "entry"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-c", "${fixture}/entry.c", "-o", "${work}/__.SYMDEF_extra.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "helper"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-c", "${fixture}/helper.c", "-o", "${work}/a_long_native_helper_member.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/native/libm50_archive.a", "${work}/a_long_native_helper_member.o", "${work}/__.SYMDEF_extra.o"]
exit = 0
stdout = ""
stderr = ""
env = { ZERO_AR_DATE = "1" }

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
