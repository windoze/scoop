schema = 1
name = "prebuilt-sysroot"
inputs = ["library", "consumer"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["sysroot", "cache", "generics", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[vars]
options = ["--sysroot", "${work}/installed resources", "--scoopc", "${scoopc}", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
 {copy = {from = "${fixture}/library", to = "${work}/installed resources/src/scoop.prepared"}},
 {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
 {copy = {from = "${sysroot}/lib/${target}/scoop.core.slib", to = "${work}/installed resources/lib/${target}/scoop.core.slib"}},
 {symlink = {from = "${sysroot}/src/scoop.core", to = "${work}/installed resources/src/scoop.core"}},
 {symlink = {from = "${sysroot}/vendor", to = "${work}/installed resources/vendor"}},
 {symlink = {from = "${sysroot}/include", to = "${work}/installed resources/include"}},
 {symlink = {from = "${sysroot}/lib/${target}/runtime", to = "${work}/installed resources/lib/${target}/runtime"}},
]

[[steps]]
name = "library"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/installed resources/src/scoop.prepared", {each = "${options}"}, "--release", "--cache-dir", "${work}/producer-cache", "-o", "${work}/installed resources/lib/${target}/scoop.prepared.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "cold"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", {each = "${options}"}, "--profile", "${profile}", "--cache-dir", "${work}/consumer-cache"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
 {actual = "${cold.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
 {actual = "${cold.result.observations.nodes.0.origin}", equals = "prebuilt"},
 {actual = "${cold.result.observations.nodes.1.origin}", equals = "prebuilt"},
]

[[steps]]
name = "run"
argv = ["${cold.result.output}"]
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "edit_source"
files = [{replace = {path = "${work}/installed resources/src/scoop.prepared/src/library.scoop", old = "Int = 42", new = "Int = 43"}}]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", {each = "${options}"}, "--profile", "${profile}", "--cache-dir", "${work}/consumer-cache"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]

[[steps]]
name = "run_prebuilt"
argv = ["${warm.result.output}"]
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "rebuild_library"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/installed resources/src/scoop.prepared", {each = "${options}"}, "--release", "--cache-dir", "${work}/producer-cache", "-o", "${work}/installed resources/lib/${target}/scoop.prepared.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "updated"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", {each = "${options}"}, "--profile", "${profile}", "--cache-dir", "${work}/consumer-cache"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_updated"
argv = ["${updated.result.output}"]
exit = 43
stdout = ""
stderr = ""
[[steps]]
name = "link"
argv = ["${scoop}", "link", {each = "${link_args}"}, "--sysroot", "${work}/installed resources", "--root-slib", "${updated.result.root.path}", "--cache-dir", "${work}/link-cache", "--message-format", "json", "-o", "${work}/linked"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 43
stdout = ""
stderr = ""
