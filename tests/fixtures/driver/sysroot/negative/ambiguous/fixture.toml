schema = 1
name = "sysroot-reject-ambiguous"
inputs = ["cone", "platform", "helper"]
tools = ["scoop", "scoopc", "scoop-link"]
when = { os = ["darwin", "linux"] }
tags = ["sysroot", "resolver", "driver"]
[vars]
options = ["--sysroot", "${work}/sysroot", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
 {mkdir = {path = "${work}/sysroot/lib"}},
 {copy = {from = "${sysroot}/lib/${target}/scoop.core.slib", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}},
 {symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}},
 {symlink = {from = "${sysroot}/include", to = "${work}/sysroot/include"}},
 {symlink = {from = "${sysroot}/lib/${target}/runtime", to = "${work}/sysroot/lib/${target}/runtime"}},
 {symlink = {from = "${sysroot}/src/scoop.core", to = "${work}/sysroot/src/scoop.core"}},
 {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
 {copy = {from = "${fixture}/platform", to = "${work}/sysroot/src/scoop.platform"}},
 {copy = {from = "${fixture}/helper", to = "${work}/sysroot/src/scoop.helper"}},
]

[[steps]]
name = "platform"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sysroot/src/scoop.platform", {"each" = "${options}"}, "-o", "${work}/first/scoop/scoop.platform/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []


[[steps]]
name = "change_library"
files = [{replace = {path = "${work}/sysroot/src/scoop.platform/native/value.h", old = "M33_DELTA 2", new = "M33_DELTA 3"}}]

[[steps]]
name = "second"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sysroot/src/scoop.platform", {"each" = "${options}"}, "-o", "${work}/second/scoop/scoop.platform/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/cone", {"each" = "${options}"}, "--cone-path", "${work}/first", "--cone-path", "${work}/second"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
