schema = 1
name = "sysroot-combination"
inputs = ["cone", "platform", "helper"]
tools = ["scoop", "scoop-link"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["sysroot", "resolver", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[vars]
options = ["--sysroot", "${work}/sysroot", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
 {mkdir = {path = "${work}/sysroot/lib"}},
 {copy = {from = "${sysroot}/lib/${target}/scoop.core.slib", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}},
 {symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}},
 {symlink = {from = "${sysroot}/include", to = "${work}/sysroot/include"}},
 {symlink = {from = "${sysroot}/lib/${target}/runtime", to = "${work}/sysroot/lib/${target}/runtime"}},
 {symlink = {from = "${sysroot}/src/scoop.core", to = "${work}/sysroot/src/scoop.core"}},
 {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
 {copy = {from = "${fixture}/platform", to = "${work}/sysroot/src/scoop.platform"}},
 {copy = {from = "${fixture}/helper", to = "${work}/sysroot/src/scoop.helper"}},
]

[[steps]]
name = "helper"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sysroot/src/scoop.helper", {each = "${options}"}, "--profile", "${profile}", "-o", "${work}/sysroot/lib/${target}/scoop.helper.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "platform"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sysroot/src/scoop.platform", {"each" = "${options}"}, "--profile", "${profile}", "-o", "${work}/sysroot/lib/${target}/scoop.platform.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/cone", {"each" = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]

exit = 0
stdout = "sysroot library 42\n"
stderr = ""

[[steps]]
name = "cached"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", {each = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${cached.result.observations.child_invocations}", equals = []}, {actual = "${cached.result.root.artifact_fingerprint}", equals = "${build.result.root.artifact_fingerprint}"}]

[[steps]]
name = "edit_library"
files = [{replace = {path = "${work}/sysroot/src/scoop.platform/native/value.h", old = "M33_DELTA 2", new = "M33_DELTA 3"}}]

[[steps]]
name = "source_only"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", {each = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${source_only.result.observations.child_invocations}", equals = []}, {actual = "${source_only.result.root.artifact_fingerprint}", equals = "${build.result.root.artifact_fingerprint}"}]

[[steps]]
name = "rebuild_library"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sysroot/src/scoop.platform", {each = "${options}"}, "--profile", "${profile}", "-o", "${work}/sysroot/lib/${target}/scoop.platform.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "changed"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", {each = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []


[[steps]]
name = "run_changed"
argv = ["${changed.result.output}"]

exit = 0
stdout = "sysroot library 43\n"
stderr = ""

[[steps]]
name = "sysroot_link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--sysroot", "${work}/sysroot", "--root-slib", "${changed.result.root.path}", {"each" = "${platform.result.dependencies}", "field" = "path", "prefix" = "--dependency-slib"}, "--runtime-objects", "${changed.result.runtime_index}", "-o", "${work}/missing", "--message-format", "json", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_sysroot_link"
argv = ["${sysroot_link.result.output}"]
exit = 0
stdout = "sysroot library 43\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop-link}", {"each" = "${link_args}"}, "--root-slib", "${changed.result.root.path}", {"each" = "${changed.result.dependencies}", "field" = "path", "prefix" = "--dep-slib"}, "--runtime-objects", "${changed.result.runtime_index}", "-o", "${work}/relinked", "--cache-dir", "${cache}", "--sysroot", "${sysroot}"]
exit = 0
stdout = "link-plan ${changed.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "relinked"
argv = ["${work}/relinked"]

exit = 0
stdout = "sysroot library 43\n"
stderr = ""
