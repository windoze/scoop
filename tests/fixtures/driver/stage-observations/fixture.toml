schema = 1
name = "stage-observations"
inputs = ["main.scoop", "state.py", "report.py", "symbols.py"]
tools = ["scoop", "scoopc", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cache", "dump", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--runtime-root", "${runtime}", "--message-format", "json", "-o", "${work}/program"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/main.scoop", to = "${work}/main.scoop"}}]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${cold.result.observations.child_invocations.length}", equals = 1},
]

[[steps]]
name = "save_machine_outputs"
argv = ["${python}", "${fixture}/state.py", "save", "${work}/cache", "${work}/program", "${work}/state.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "ast"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "ast", "--dump-dir", "${work}/dumps"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${ast.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
  {actual = "${ast.result.root.path}", equals = "${cold.result.root.path}"},
  {file = "${work}/dumps/${cold.result.root.identity}/ast.txt", exists = true},
]

[[steps]]
name = "hir"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "hir", "--dump-dir", "${work}/dumps"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${hir.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
  {actual = "${hir.result.root.path}", equals = "${cold.result.root.path}"},
  {file = "${work}/dumps/${cold.result.root.identity}/hir.txt", exists = true},
]

[[steps]]
name = "mir"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "mir", "--dump-dir", "${work}/dumps"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${mir.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
  {actual = "${mir.result.root.path}", equals = "${cold.result.root.path}"},
  {file = "${work}/dumps/${cold.result.root.identity}/mir.txt", exists = true},
]

[[steps]]
name = "optimizations"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "optimizations", "--dump-dir", "${work}/dumps"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${optimizations.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
  {actual = "${optimizations.result.root.path}", equals = "${cold.result.root.path}"},
  {file = "${work}/dumps/${cold.result.root.identity}/optimizations.json", exists = true},
]

[[steps]]
name = "report_contents"
argv = ["${python}", "${fixture}/report.py", "${work}/dumps/${cold.result.root.identity}/optimizations.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "lir"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "lir", "--dump-dir", "${work}/dumps"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${lir.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
  {actual = "${lir.result.root.path}", equals = "${cold.result.root.path}"},
  {file = "${work}/dumps/${cold.result.root.identity}/lir.txt", exists = true},
]

[[steps]]
name = "symbols"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "symbols", "--dump-dir", "${work}/dumps"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${symbols.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
  {actual = "${symbols.result.root.path}", equals = "${cold.result.root.path}"},
  {file = "${work}/dumps/${cold.result.root.identity}/symbols.json", exists = true},
]

[[steps]]
name = "symbol_contents"
argv = ["${python}", "${fixture}/symbols.py", "${work}/dumps/${cold.result.root.identity}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "reuse"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "all", "--dump-dir", "${work}/reused"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${reuse.result.observations.child_invocations.length}", equals = 0},
  {file = "${work}/reused/${cold.result.root.identity}/symbols.json", same_as = "${work}/dumps/${cold.result.root.identity}/symbols.json"},
  {file = "${work}/reused/${cold.result.root.identity}/lir.txt", same_as = "${work}/dumps/${cold.result.root.identity}/lir.txt"},
  {file = "${work}/reused/${cold.result.root.identity}/optimizations.json", same_as = "${work}/dumps/${cold.result.root.identity}/optimizations.json"},
]

[[steps]]
name = "same_machine_outputs"
argv = ["${python}", "${fixture}/state.py", "same", "${work}/cache", "${work}/program", "${work}/state.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "change_source"
files = [{replace = {path = "${work}/main.scoop", old = "48", new = "49"}}]

[[steps]]
name = "changed"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "all", "--dump-dir", "${work}/changed"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${changed.result.observations.child_invocations.length}", equals = 1},
]

[[steps]]
name = "changed_warm"
argv = ["${scoop}", "build", "--release", "${work}/main.scoop", {"each" = "${link_args}"}, {"each" = "${options}"}, "--emit", "all", "--dump-dir", "${work}/changed-warm"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${changed_warm.result.observations.child_invocations.length}", equals = 0},
  {file = "${work}/changed-warm/${changed.result.root.identity}/symbols.json", same_as = "${work}/changed/${changed.result.root.identity}/symbols.json"},
  {file = "${work}/changed-warm/${changed.result.root.identity}/ast.txt", same_as = "${work}/changed/${changed.result.root.identity}/ast.txt"},
  {file = "${work}/changed-warm/${changed.result.root.identity}/optimizations.json", same_as = "${work}/changed/${changed.result.root.identity}/optimizations.json"},
]

[[steps]]
name = "run_changed"
argv = ["${work}/program"]
exit = 49
stdout = ""
stderr = ""
