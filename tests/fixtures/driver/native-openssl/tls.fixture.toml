schema = 1
name = "native-openssl-tls"
inputs = ["tls"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["native", "openssl", "driver"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/tls", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${repo}/sysroot/lib/${target}/openssl/lib", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
