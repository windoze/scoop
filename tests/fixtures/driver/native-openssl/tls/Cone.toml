schema = 1
[cone]
group = "test.m51"
name = "native-tls"
version = "0.1.0"
kind = "executable"
[native]
include = [
    {path = "../../../../../sysroot/lib/aarch64-apple-darwin/openssl/include", when = {os = "darwin"}},
    {path = "../../../../../sysroot/lib/x86_64-unknown-linux-gnu/openssl/include", when = {env = "gnu"}},
    {path = "../../../../../sysroot/lib/x86_64-unknown-linux-musl/openssl/include", when = {env = "musl"}},
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Werror"]
[[native.sources]]
path = "probe.c"

[[native.libraries]]
name = "ssl"
kind = "static"

[[native.libraries]]
name = "crypto"
kind = "static"

[[native.libraries]]
name = "pthread"
