schema = 1
name = "cli-process-single-file"
inputs = ["input.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "cache", "process-cache", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/input.scoop", "to" = "${work}/input.scoop"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/input.scoop", {"each" = "${options}"}, "-o", "${work}/published"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${cold.result.kind}", "equals" = "executable"},
  {"actual" = "${cold.result.dependencies.length}", "equals" = 2},
  {"actual" = "${cold.result.observations.child_invocations}", "equals" = ["${cold.result.root.identity}"]},
  {"glob" = "${work}/cache/compile-v2/.staging/*", "equals" = []},
  {"actual" = "${cold.result.dependencies.0.coordinate}", "equals" = {"group" = "scoop", "name" = "scoop.core", "version" = "0.1.0"}},
  {"actual" = "${cold.result.observations.nodes.0.identity}", "equals" = "${cold.result.dependencies.0.identity}"},
  {"actual" = "${cold.result.observations.nodes.0.origin}", "equals" = "prebuilt"},
  {"actual" = "${cold.result.root.coordinate}", "equals" = {"group" = "scoop", "name" = "single-file", "version" = "0.0.0"}},
  {"actual" = "${cold.result.observations.nodes.2.identity}", "equals" = "${cold.result.root.identity}"},
  {"actual" = "${cold.result.observations.nodes.2.origin}", "equals" = "compiled"},
]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/input.scoop", {"each" = "${options}"}, "-o", "${work}/published"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${warm.result.kind}", "equals" = "executable"},
  {"actual" = "${warm.result.dependencies.length}", "equals" = 2},
  {"actual" = "${warm.result.observations.child_invocations}", "equals" = []},
  {"glob" = "${work}/cache/compile-v2/.staging/*", "equals" = []},
  {"actual" = "${warm.result.dependencies.0.coordinate}", "equals" = {"group" = "scoop", "name" = "scoop.core", "version" = "0.1.0"}},
  {"actual" = "${warm.result.observations.nodes.0.identity}", "equals" = "${warm.result.dependencies.0.identity}"},
  {"actual" = "${warm.result.observations.nodes.0.origin}", "equals" = "prebuilt"},
  {"actual" = "${warm.result.dependencies.0.artifact_fingerprint}", "equals" = "${cold.result.dependencies.0.artifact_fingerprint}"},
  {"actual" = "${warm.result.observations.nodes.0.cache_key}", "equals" = "${cold.result.observations.nodes.0.cache_key}"},
  {"file" = "${warm.result.dependencies.0.path}", "same_as" = "${cold.result.dependencies.0.path}"},
  {"actual" = "${warm.result.root.coordinate}", "equals" = {"group" = "scoop", "name" = "single-file", "version" = "0.0.0"}},
  {"actual" = "${warm.result.observations.nodes.2.identity}", "equals" = "${warm.result.root.identity}"},
  {"actual" = "${warm.result.observations.nodes.2.origin}", "equals" = "cache"},
  {"actual" = "${warm.result.root.artifact_fingerprint}", "equals" = "${cold.result.root.artifact_fingerprint}"},
  {"actual" = "${warm.result.observations.nodes.2.cache_key}", "equals" = "${cold.result.observations.nodes.2.cache_key}"},
  {"file" = "${warm.result.root.path}", "same_as" = "${cold.result.root.path}"},
]

[[steps]]
name = "manual_core"
files = [
  {"copy" = {"from" = "${cold.result.dependencies.0.path}", "to" = "${work}/manual-sysroot/lib/${target}/scoop.core.slib"}},
]

[[steps]]
name = "manual"
argv = ["${scoopc}", "build", "--profile", "release", {"each" = "${compile_args}"}, "${work}/input.scoop", "--sysroot", "${work}/manual-sysroot", "--direct-slib", "${sysroot}/lib/${target}/scoop.std.slib", "--out-slib", "${work}/manual.slib"]
exit = 0
stdout = ""
stderr = ""
checks = [
  {"file" = "${work}/manual.slib", "same_as" = "${cold.result.root.path}"},
]

[[steps]]
name = "run"
argv = ["${work}/published"]
exit = 0
stdout = ""
stderr = ""
