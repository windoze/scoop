schema = 1
name = "cli-generic-cache-input-changes"
inputs = ["dependency", "root", "runner", "../../../language/generic-cache/provider.scoop", "../../../language/generic-cache/consumer.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["cli", "cache", "generics", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/dependency", "to" = "${work}/sources/dependency"}},
  {"copy" = {"from" = "${fixture}/root", "to" = "${work}/sources/root"}},
  {"copy" = {"from" = "${fixture}/runner", "to" = "${work}/sources/runner"}},
  {"copy" = {"from" = "${fixture}/../../../language/generic-cache/provider.scoop", "to" = "${work}/sources/dependency/src/main.scoop"}},
