schema = 1
name = "cli-input-manifest-roots"
root = "cone/Cone.toml"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "input", "manifest", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json", "--runtime-root", "${runtime}"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/cone", "to" = "${work}/cone"}},
  {"symlink" = {"from" = "${work}/cone", "to" = "${work}/alias"}},
  {"mkdir" = {"path" = "${work}/manifest-alias"}},
  {"symlink" = {"from" = "${work}/cone/Cone.toml", "to" = "${work}/manifest-alias/Cone.toml"}},
]

[[steps]]
name = "baseline"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/cone", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${baseline.result.kind}", "equals" = "library"},
  {"actual" = "${baseline.result.observations.child_invocations.length}", "equals" = 1},
]

[[steps]]
name = "absolute_manifest"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/cone/Cone.toml", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}"
checks = [
  {"actual" = "${absolute_manifest.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${absolute_manifest.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${absolute_manifest.result.observations.child_invocations}", "equals" = []},
]

[[steps]]
name = "relative_directory"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "cone", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}"
checks = [
  {"actual" = "${relative_directory.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${relative_directory.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${relative_directory.result.observations.child_invocations}", "equals" = []},
]

[[steps]]
# Each input root records its own compiler inputs; repeating that locator reuses the cache.
name = "directory_symlink"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "alias", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}"
checks = [
  {"actual" = "${directory_symlink.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${directory_symlink.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${directory_symlink.result.observations.child_invocations}", "equals" = ["${baseline.result.root.identity}"]},
]

[[steps]]
name = "directory_symlink_warm"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "alias", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}"
checks = [
  {"actual" = "${directory_symlink_warm.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${directory_symlink_warm.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${directory_symlink_warm.result.observations.child_invocations}", "equals" = []},
]

[[steps]]
name = "manifest_symlink"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/manifest-alias/Cone.toml", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}"
checks = [
  {"actual" = "${manifest_symlink.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${manifest_symlink.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${manifest_symlink.result.observations.child_invocations}", "equals" = ["${baseline.result.root.identity}"]},
]

[[steps]]
name = "manifest_symlink_warm"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/manifest-alias/Cone.toml", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}"
checks = [
  {"actual" = "${manifest_symlink_warm.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${manifest_symlink_warm.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${manifest_symlink_warm.result.observations.child_invocations}", "equals" = []},
]

[[steps]]
name = "default_manifest"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}/cone"
checks = [
  {"actual" = "${default_manifest.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${default_manifest.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${default_manifest.result.observations.child_invocations}", "equals" = []},
]

[[steps]]
name = "explicit_dot"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, ".", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}/cone"
checks = [
  {"actual" = "${explicit_dot.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${explicit_dot.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${explicit_dot.result.observations.child_invocations}", "equals" = []},
]

[[steps]]
name = "relative_manifest"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "Cone.toml", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}/cone"
checks = [
  {"actual" = "${relative_manifest.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${relative_manifest.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${relative_manifest.result.observations.child_invocations}", "equals" = []},
]

[[steps]]
name = "producer"
argv = ["${scoopc}", "build", "--profile", "release", "${work}/alias", {"each" = "${compile_args}"}, "--sysroot", "${sysroot}", "--direct-slib", "${baseline.result.dependencies.0.path}", "--out-slib", "${work}/manual.slib"]
exit = 1
stdout = ""
stderr = "error: scoopc does not read Cone.toml; use scoop build/check for Cone projects\n"
checks = [{file = "${work}/manual.slib", exists = false}]
