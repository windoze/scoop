schema = 1
name = "cli-input-manifest-source-encoding"
inputs = ["main.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["cli", "input", "negative", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
human_options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/main.scoop", "to" = "${work}/cone/src/main.scoop"}},
  {"write" = {"path" = "${work}/cone/Cone.toml", "data" = "schema = 1\n\n[cone]\ngroup = \"dev.cli\"\nname = \"path-library\"\nversion = \"0.1.0\"\nkind = \"library\"\n"}},
  {"write" = {"path" = "${work}/previous.slib", "data" = "previous output\n"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${sysroot}/src/scoop.core", "-o", "${work}/producer-sysroot/lib/${target}/scoop.core.slib", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${core.result.kind}", "equals" = "library"},
]

[[steps]]
name = "public"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/cone", "-o", "${work}/previous.slib", {"each" = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]

[[steps]]
name = "producer"
argv = ["${scoopc}", "build", "--profile", "release", "${work}/cone", "--sysroot", "${work}/producer-sysroot", {"each" = "${compile_args}"}, "--out-slib", "${work}/producer.slib"]
exit = 1
stdout = ""
stderr = "error: scoopc does not read Cone.toml; use scoop build/check for Cone projects\n"
checks = [
  {"file" = "${work}/producer.slib", "exists" = false},
]

[[steps]]
name = "human"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/cone", "-o", "${work}/previous.slib", {"each" = "${human_options}"}]
exit = 1
stdout = ""
stderr = "${work}/cone/src/main.scoop: error[SCOOPC_BUILD_FAILED]: source discovery failed at ${work}/cone/src/main.scoop: source file is not valid UTF-8\n"
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]
