schema = 1
name = "cli-input-single-file-cone-path-run"
inputs = ["../single-file-isolation/main.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["cli", "input", "single-file", "driver"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/../single-file-isolation/main.scoop", "to" = "${work}/main.scoop"}},
]

[[steps]]
name = "accept"
argv = ["${scoop}", "run", "--release", {"each" = "${link_args}"}, "${work}/main.scoop", "--cone-path", "${work}/absent-cones", "--scoopc", "${scoopc}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = "42\n"
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${accept.result.dependencies.length}", equals = 2}]
