schema = 1
name = "cli-input-single-file-isolation"
root = "main.scoop"
inputs = ["main.scoop", "neighbors"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "input", "single-file", "driver"]
[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json", "--runtime-root", "${runtime}"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/main.scoop", "to" = "${work}/clean/main.scoop"}},
  {"copy" = {"from" = "${fixture}/neighbors", "to" = "${work}/noisy"}},
  {"copy" = {"from" = "${fixture}/main.scoop", "to" = "${work}/noisy/main.scoop"}},
  {"copy" = {"from" = "${fixture}/main.scoop", "to" = "${work}/中文 空格/源 文件.scoop"}},
  {"symlink" = {"from" = "${work}/noisy/main.scoop", "to" = "${work}/alias.scoop"}},
]

[[steps]]
name = "baseline"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/clean/main.scoop", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${baseline.result.kind}", "equals" = "executable"},
  {"actual" = "${baseline.result.dependencies.length}", "equals" = 2},
  {"actual" = "${baseline.result.observations.child_invocations.length}", "equals" = 1},
]

[[steps]]
name = "neighboring_files"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "main.scoop", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}/noisy"
checks = [
  {"actual" = "${neighboring_files.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${neighboring_files.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${neighboring_files.result.observations.child_invocations}", "equals" = ["${baseline.result.root.identity}"]},
  {"actual" = "${neighboring_files.result.link_plan_fingerprint}", "equals" = "${baseline.result.link_plan_fingerprint}"},
]

[[steps]]
name = "absolute_file"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/noisy/main.scoop", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}"
checks = [
  {"actual" = "${absolute_file.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${absolute_file.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${absolute_file.result.observations.child_invocations}", "equals" = []},
  {"actual" = "${absolute_file.result.link_plan_fingerprint}", "equals" = "${baseline.result.link_plan_fingerprint}"},
]

[[steps]]
name = "file_symlink"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/alias.scoop", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}/noisy"
checks = [
  {"actual" = "${file_symlink.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${file_symlink.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${file_symlink.result.observations.child_invocations}", "equals" = []},
  {"actual" = "${file_symlink.result.link_plan_fingerprint}", "equals" = "${baseline.result.link_plan_fingerprint}"},
]

[[steps]]
name = "unicode_file"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/中文 空格/源 文件.scoop", "-o", "${work}/unicode-program", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}/noisy"
checks = [
  {"actual" = "${unicode_file.result.root.artifact_fingerprint}", "equals" = "${baseline.result.root.artifact_fingerprint}"},
  {"file" = "${unicode_file.result.root.path}", "same_as" = "${baseline.result.root.path}"},
  {"actual" = "${unicode_file.result.observations.child_invocations}", "equals" = ["${baseline.result.root.identity}"]},
  {"actual" = "${unicode_file.result.link_plan_fingerprint}", "equals" = "${baseline.result.link_plan_fingerprint}"},
]

[[steps]]
name = "normal"
argv = ["${unicode_file.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
checks = []
