schema = 1
name = "cli-input-default-parent-search"
inputs = []
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["cli", "input", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
human_options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target"]

[[steps]]
name = "prepare"
files = [
  {"write" = {"path" = "${work}/parent/Cone.toml", "data" = "schema = 1\n\n[cone]\ngroup = \"dev.cli\"\nname = \"path-library\"\nversion = \"0.1.0\"\nkind = \"library\"\n"}},
  {"mkdir" = {"path" = "${work}/parent/child"}},
  {write = {path = "${work}/parent/src/lib.scoop", data = "package dev.cli\npublic fun value(): Int = 42\n"}},
  {"write" = {"path" = "${work}/previous.slib", "data" = "previous output\n"}},
]

[[steps]]
name = "public"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "-o", "${work}/previous.slib", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
cwd = "${work}/parent/child"
checks = [
  {file = "${work}/previous.slib", same_as = "${public.result.root.path}"},
]

[[steps]]
name = "producer"
argv = ["${scoopc}", "build", "--profile", "release", "${work}/parent/child/Cone.toml", "--sysroot", "${sysroot}", "--target", "${target}", "--out-slib", "${work}/producer.slib"]
exit = 1
stdout = ""
stderr = "error: scoopc does not read Cone.toml; use scoop build/check for Cone projects\n"
cwd = "${work}/parent/child"
checks = [
  {"file" = "${work}/producer.slib", "exists" = false},
]

[[steps]]
name = "human"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "-o", "${work}/previous.slib", {"each" = "${human_options}"}]
exit = 0
stdout = ""
stderr = "built ${work}/previous.slib (release)\n"
cwd = "${work}/parent/child"
checks = [
  {file = "${work}/previous.slib", same_as = "${public.result.root.path}"},
]
