schema = 1
name = "cli-input-extension"
inputs = []
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["cli", "input", "negative", "driver"]

[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
human_options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target"]

[[steps]]
name = "prepare"
files = [
  {"write" = {"path" = "${work}/main.txt", "data" = "fun main() {}\n"}},
  {"write" = {"path" = "${work}/previous.slib", "data" = "previous output\n"}},
]

[[steps]]
name = "public"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/main.txt", "-o", "${work}/previous.slib", {"each" = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]

[[steps]]
name = "producer"
argv = ["${scoopc}", "build", "--profile", "release", "${work}/main.txt", "--sysroot", "${sysroot}", "--target", "${target}", "--out-slib", "${work}/producer.slib"]
exit = 1
stdout = ""
stderr = "error: invalid single-file input ${work}/main.txt: operand extension must be exactly .scoop\n"
checks = [
  {"file" = "${work}/producer.slib", "exists" = false},
]

[[steps]]
name = "human"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/main.txt", "-o", "${work}/previous.slib", {"each" = "${human_options}"}]
exit = 1
stdout = ""
stderr = "error[SCOOP_PACKAGE_PREPARE]: input must be a Cone directory or Cone.toml\n"
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]
