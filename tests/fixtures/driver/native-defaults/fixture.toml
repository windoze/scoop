schema = 1
name = "native-defaults"
inputs = ["cone", "value.c"]
tools = ["scoop", "scoopc", "scoop-link", "cc", "ar"]
when = { os = ["darwin", "linux"] }
tags = ["native", "cache", "driver"]
variants = [{name = "target", vars = {native_subdir = ""}}, {name = "openssl", vars = {native_subdir = "/openssl/lib"}}, {name = "nghttp2", vars = {native_subdir = "/nghttp2/lib"}}]
[vars]
options = ["--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
 {copy = {from = "${sysroot}/lib/${target}/scoop.core.slib", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}},
 {symlink = {from = "${sysroot}/lib/${target}/runtime", to = "${work}/sysroot/lib/${target}/runtime"}},
 {symlink = {from = "${sysroot}/src", to = "${work}/sysroot/src"}},
 {mkdir = {path = "${work}/sysroot/lib/${target}${native_subdir}"}},
 {mkdir = {path = "${work}/explicit"}},
]

[[steps]]
name = "compile"
argv = ["${cc}", {each = "${cc_args}"}, "-c", "${fixture}/value.c", "-o", "${work}/value.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/sysroot/lib/${target}${native_subdir}/libm52_default.a", "${work}/value.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "--release", "${fixture}/cone", "--lockfile", "${work}/source-lock-0.lock", {"each" = "${link_args}"}, {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${cold.result.output}"]
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "compile_updated"
argv = ["${cc}", {each = "${cc_args}"}, "-DM52_VALUE=43", "-c", "${fixture}/value.c", "-o", "${work}/value.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_updated"
argv = ["${ar}", "rcs", "${work}/sysroot/lib/${target}${native_subdir}/libm52_default.a", "${work}/value.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "changed"
argv = ["${scoop}", "build", "--release", "${fixture}/cone", "--lockfile", "${work}/source-lock-0.lock", {"each" = "${link_args}"}, {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${changed.result.observations.child_invocations}", equals = []}]

[[steps]]
name = "run_changed"
argv = ["${changed.result.output}"]
exit = 43
stdout = ""
stderr = ""

[[steps]]
name = "compile_override"
argv = ["${cc}", {each = "${cc_args}"}, "-DM52_VALUE=55", "-c", "${fixture}/value.c", "-o", "${work}/explicit/value.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_override"
argv = ["${ar}", "rcs", "${work}/explicit/libm52_default.a", "${work}/explicit/value.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "override"
argv = ["${scoop}", "link", {each = "${link_args}"}, "--sysroot", "${work}/sysroot", "--cache-dir", "${work}/cache", "--root-slib", "${cold.result.root.path}", "--library-path", "${work}/explicit", "--message-format", "json", "-o", "${work}/override"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_override"
argv = ["${override.result.output}"]
exit = 55
stdout = ""
stderr = ""

[[steps]]
name = "low_link"
argv = ["${scoop-link}", {each = "${link_args}"}, "--sysroot", "${work}/sysroot", "--cache-dir", "${work}/cache", "--root-slib", "${cold.result.root.path}", {each = "${cold.result.dependencies}", field = "path", prefix = "--dep-slib"}, "-o", "${work}/low-program"]
exit = 0
stdout = "link-plan ${changed.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "low_run"
argv = ["${work}/low-program"]
exit = 43
stdout = ""
stderr = ""
