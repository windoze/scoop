schema = 1
name = "external-source-file"
inputs = ["cone", "main.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["sources", "cache", "driver"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
  {copy = {from = "${fixture}/main.scoop", to = "${work}/main.scoop"}},
  {symlink = {from = "${work}/main.scoop", to = "${work}/cone/linked.scoop"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "--release", "${work}/cone", {"each" = "${link_args}"}, "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${cold.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "run_cold"
argv = ["${cold.result.output}"]
exit = 0
stdout = "48\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "--release", "${work}/cone", {"each" = "${link_args}"}, "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations.length}", equals = 0}]

[[steps]]
name = "run_warm"
argv = ["${warm.result.output}"]
exit = 0
stdout = "48\n"
stderr = ""

[[steps]]
name = "update_source_timestamp"
files = [{touch = {path = "${work}/main.scoop"}}]

[[steps]]
name = "timestamp_changed"
argv = ["${scoop}", "build", "--release", "${work}/cone", {"each" = "${link_args}"}, "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${timestamp_changed.result.observations.child_invocations.length}", equals = 1},
  {actual = "${timestamp_changed.result.root.artifact_fingerprint}", equals = "${cold.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "run_timestamp_changed"
argv = ["${timestamp_changed.result.output}"]
exit = 0
stdout = "48\n"
stderr = ""

[[steps]]
name = "change_input"
files = [{replace = {path = "${work}/main.scoop", old = "println(48)", new = "println(49)"}}]

[[steps]]
name = "changed"
argv = ["${scoop}", "build", "--release", "${work}/cone", {"each" = "${link_args}"}, "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${changed.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "run_changed"
argv = ["${changed.result.output}"]
exit = 0
stdout = "49\n"
stderr = ""
