schema = 1
name = "sources-targets"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["sources", "manifest", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
  {mkdir = {path = "${work}/cone/aliases"}},
  {symlink = {from = "${work}/cone/storage/extra.scoop", to = "${work}/cone/aliases/extra.scoop"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/cone", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "manual_core"
files = [{copy = {from = "${build.result.dependencies.0.path}", to = "${work}/manual-sysroot/lib/${target}/scoop.core.slib"}}]

[[steps]]
name = "manual"
argv = ["${scoop}", "build", {each = "${compile_args}"}, "${work}/cone", "--profile", "${profile}", "--sysroot", "${work}/manual-sysroot", "-o", "${work}/manual.slib", "--emit-slib", "--cache-dir", "${cache}", "--target-dir", "${work}/compiler-output", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{file = "${work}/manual.slib", same_as = "${build.result.root.path}"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "sources-ok\n"
stderr = ""
