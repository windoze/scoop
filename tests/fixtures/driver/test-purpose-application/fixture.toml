schema = 1
name = "test-purpose-application"
inputs = ["../test-filter-selection/cone"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["driver", "test-command"]
variants = [
    {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "production"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/../test-filter-selection/cone", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
    {actual = "${production.result.kind}", equals = "library"},
    {actual = "${production.result.dependencies.length}", equals = 1},
]

[[steps]]
name = "build-tests"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/../test-filter-selection/cone", "--no-run", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
    {actual = "${build-tests.result.dependencies.length}", equals = 2},
    {actual = "${build-tests.result.output}", equals = "${work}/outputs/${target}/${profile}/tests/selection"},
    {actual = "${build-tests.result.root.path}", not_equals = "${production.result.root.path}"},
]

[[steps]]
name = "run-tests"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/../test-filter-selection/cone", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
    {actual = "${run-tests.test_result.status}", equals = "passed"},
    {actual = "${run-tests.test_result.complete}", equals = true},
    {actual = "${run-tests.test_result.counts.passed}", equals = 10},
{actual = "${run-tests.result.observations.child_invocations.length}", equals = 0}]
