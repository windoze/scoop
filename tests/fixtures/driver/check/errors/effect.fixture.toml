schema = 1
name = "check-frontend-effect-diagnostics"
root = "../../../language/requirements/errors/unsafe-context.scoop"
inputs = ["../../../language/requirements/errors/unsafe-context.scoop"]
tools = ["scoop", "scoopc"]
tags = ["driver", "check", "diagnostics"]

[[steps]]
name = "check"
argv = ["${scoop}", "check", "${root}", "--release", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "../../../language/requirements/errors/unsafe-context.diagnostics.json"}
