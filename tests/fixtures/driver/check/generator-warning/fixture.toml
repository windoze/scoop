schema = 1
name = "check-generator-machine-warning-retains-fragment-on-cache-hit"
root = "../../generators/errors/program.scoop"
inputs = ["../../generators/errors/program.scoop", "../../generators/peer.py"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["driver", "check", "generator", "diagnostics", "cache"]

[vars]
options = ["--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--generator", "test.peer=generator"]
expected = "warning[SCOOPC_COMPILER_WARNING]: fragment warning\n --> generated/function/6c06a95bf001818dfa22cbd05cc3fdc59e433b60d92dbd9303ce5ff1f5865595.scoop:3:5\n  |\n3 |     return 42\n  |     ^^^^^^\nnote: implementation requested here\n --> ${root}:3:29\n  |\n3 | @GenerateWith(\"test.peer\", [\"Value\"])\n  |                             ^^^^^^^\nchecked scoop:single-file:0.0.0 (production)\n"

[[steps]]
name = "peer"
files = [
  {concat = {path = "${work}/generator", parts = ["#!${python}\n", {file = "../../generators/peer.py"}]}},
  {replace = {path = "${work}/generator", old = 'MODE = "normal"', new = 'MODE = "fragment-warning"'}},
  {chmod = {path = "${work}/generator", mode = "755"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "check", "${root}", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = "${expected}"
checks = [{file = "${work}/generator.calls", equals = "called\n"}]

[[steps]]
name = "warm"
argv = ["${scoop}", "check", "${root}", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = "${expected}"
checks = [{file = "${work}/generator.calls", equals = "called\n"}]
