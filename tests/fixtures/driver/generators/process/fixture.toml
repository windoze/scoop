schema = 1
name = "generator-process-query-and-source"
root = "program.scoop"
inputs = ["program.scoop", "../peer.py"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["driver", "generator", "protocol"]

[[steps]]
name = "peer"
files = [
  {concat = {path = "${work}/generator", parts = ["#!${python}\n", {file = "../peer.py"}]}},
  {chmod = {path = "${work}/generator", mode = "755"}},
]

[[steps]]
name = "compile"
argv = ["${scoopc}", "build", "${root}", "--profile", "release", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--direct-slib", "${sysroot}/lib/${target}/scoop.std.slib", "--generator", "test.peer=generator", "--out-slib", "${work}/program.slib"]
exit = 0
stdout = ""
stderr = "generator: 1 request, 2 owners, 3 methods, queries completed\n"

[[steps]]
name = "link"
argv = ["${scoop}", "link", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--root-slib", "${work}/program.slib", "--message-format", "json", "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""

json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n中文\n\"quoted\"\n7\n5\n"
stderr = ""

[[steps]]
name = "warning_peer"
files = [{replace = {path = "${work}/generator", old = 'MODE = "normal"', new = 'MODE = "warning"'}}]

[[steps]]
name = "warning"
argv = ["${scoopc}", "build", "${root}", "--profile", "release", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--direct-slib", "${sysroot}/lib/${target}/scoop.std.slib", "--generator", "test.peer=generator", "--out-slib", "${work}/warning.slib"]
exit = 0
stdout = ""
stderr = "${root}:6:29: warning: peer diagnostic\n"
checks = [{file = "${work}/warning.slib", exists = true}]
