schema = 1
name = "generator-machine-source-diagnostics"
root = "../errors/program.scoop"
inputs = ["../errors/program.scoop", "../peer.py"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["driver", "generator", "diagnostics"]

[[variants]]
name = "syntax"
vars = { mode = "syntax", expected = "generated/function/6c06a95bf001818dfa22cbd05cc3fdc59e433b60d92dbd9303ce5ff1f5865595.scoop:2:14: error[SCOOPC_HIR_ERROR]: expected expression, found `)`\n${root}:3:29: note: implementation requested here\n${root}:4:1: error[SCOOPC_HIR_ERROR]: class `GeneratedValue` does not implement interface method `Value.value`\n" }

[[variants]]
name = "type"
vars = { mode = "type", expected = "generated/function/6c06a95bf001818dfa22cbd05cc3fdc59e433b60d92dbd9303ce5ff1f5865595.scoop:2:12: error[SCOOPC_HIR_ERROR]: `return` value of `value` must be of type Int, found String\n${root}:3:29: note: implementation requested here\n" }

[[steps]]
name = "peer"
files = [
  {concat = {path = "${work}/generator", parts = ["#!${python}\n", {file = "../peer.py"}]}},
  {replace = {path = "${work}/generator", old = 'MODE = "normal"', new = 'MODE = "${mode}"'}},
  {chmod = {path = "${work}/generator", mode = "755"}},
]

[[steps]]
name = "compile"
argv = ["${scoop}", "build", "${root}", {each = "${link_args}"}, "--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--generator", "test.peer=generator", "-o", "${work}/failed"]
exit = 1
stdout = ""
stderr = "${expected}"
checks = [{file = "${work}/failed", exists = false}]
