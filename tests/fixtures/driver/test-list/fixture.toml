schema = 1
name = "test-list"
inputs = ["program"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["test-command", "test-list", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "list.json"}
json = "stderr"
diagnostics = []

[[steps]]
name = "cached-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "list.json"}
json = "stderr"
diagnostics = []
checks = [
    {actual = "${cached-list.result.observations.child_invocations.length}", equals = 0},
    {actual = "${cached-list.result.root.artifact_fingerprint}", equals = "${list.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "human-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list"]
exit = 0
stdout = {file = "list.stdout"}
stderr = "built ${work}/outputs/${target}/${profile}/dev.m43/list-tests/tests/list-tests (${profile})\n"

[[steps]]
name = "ignored-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--ignored", "--filter", "Cases::skipped", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "ignored.json"}
json = "stderr"
diagnostics = []
checks = [{actual = "${ignored-list.result.observations.child_invocations.length}", equals = 0}]

[[steps]]
name = "empty-cone"
files = [
    {copy = {from = "${fixture}/program", to = "${work}/empty"}},
    {remove = {path = "${work}/empty/tests"}},
]

[[steps]]
name = "empty-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/empty", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "empty.json"}
json = "stderr"
diagnostics = []
