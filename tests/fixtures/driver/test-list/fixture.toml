schema = 1
name = "test-list"
inputs = ["program"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["test-command", "test-list", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "list.json"}
json = "stderr"
diagnostics = []

[[steps]]
name = "cached-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "list.json"}
json = "stderr"
diagnostics = []
checks = [
    {actual = "${cached-list.result.observations.child_invocations.length}", equals = 0},
    {actual = "${cached-list.result.root.artifact_fingerprint}", equals = "${list.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "human-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list"]
exit = 0
stdout = {file = "list.stdout"}
stderr = "built ${work}/outputs/${target}/${profile}/dev.m43/list-tests/tests/list-tests (${profile})\n"

[[steps]]
name = "ignored-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--ignored", "--filter", "Cases::skipped", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "ignored.json"}
json = "stderr"
diagnostics = []
checks = [{actual = "${ignored-list.result.observations.child_invocations.length}", equals = 0}]

[[steps]]
name = "build-for-debugger"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--no-run", "--filter", "no-match", "--ignored", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
    {actual = "${build-for-debugger.result.test_directory.containers.length}", equals = 3},
    {actual = "${build-for-debugger.result.test_directory.containers.0.name}", equals = "dev.m43.Cases"},
    {actual = "${build-for-debugger.result.test_directory.containers.0.cases.0.name}", equals = "检查::名字"},
    {actual = "${build-for-debugger.result.test_directory.containers.0.cases.0.location.path}", equals = "tests/a.scoop"},
    {actual = "${build-for-debugger.result.test_directory.containers.0.cases.1.name}", equals = "skipped"},
    {actual = "${build-for-debugger.result.test_directory.containers.0.cases.1.ignore_reason}", equals = "needs a resource"},
    {actual = "${build-for-debugger.result.test_directory.containers.1.cases.length}", equals = 0},
    {actual = "${build-for-debugger.result.test_directory.containers.2.cases.0.location.path}", equals = "tests/z.scoop"},
]

[[steps]]
name = "exact-test-program"
argv = ["${build-for-debugger.result.output}", "--scoop-test-cases", "0"]
exit = 0
stdout = "initializer must not run\n"
stderr = ""

[[steps]]
name = "empty-cone"
files = [
    {copy = {from = "${fixture}/program", to = "${work}/empty"}},
    {remove = {path = "${work}/empty/tests"}},
]

[[steps]]
name = "empty-list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/empty", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--list", "--message-format", "json"]
exit = 0
stdout = ""
stderr = {file = "empty.json"}
json = "stderr"
diagnostics = []
