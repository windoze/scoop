schema = 1
name = "boundaries-version-conflict"
inputs = ["helper", "one", "program", "two"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["test-boundaries", "negative", "driver"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/helper", to = "${work}/helper"}},
  {copy = {from = "${fixture}/one", to = "${work}/one"}},
  {copy = {from = "${fixture}/program", to = "${work}/program"}},
  {copy = {from = "${fixture}/two", to = "${work}/two"}},
]

[[steps]]
name = "reject"
argv = ["${scoop}", "test", "--release", {"each" = "${link_args}"}, "${work}/program", "--lockfile", "${work}/program/Cone.lock", "--no-run", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{glob = "${work}/outputs/${target}/release/*/*/tests/*", equals = []}]
