schema = 1
name = "short-circuit-runtime-checks"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["short-circuit", "positive", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "false\ntrue\nfalse\ntrue\n0\ntrue\n2\n"
stderr = ""
