schema = 1
name = "declarations-container-annotation"
inputs = ["../program", "case.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["test-declarations", "negative", "driver"]

[[steps]]
name = "prepare"
files = [
    {copy = {from = "${fixture}/../program", to = "${work}/program"}},
    {copy = {from = "${fixture}/case.scoop", to = "${work}/program/tests/case.scoop"}},
]

[[steps]]
name = "reject"
argv = ["${scoop}", "test", "--release", {"each" = "${link_args}"}, "${work}/program", "--no-run", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{file = "${work}/outputs/${target}/release/dev.m43/declaration-negative/tests/declaration-negative", exists = false}]
