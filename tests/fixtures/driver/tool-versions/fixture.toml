schema = 1
name = "tool-versions"
inputs = ["check.py"]
tools = ["scoop", "scoopc", "scoop-link", "scoop-lsp", "scoop-pm", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["cli", "version", "driver"]

[[steps]]
name = "versions"
argv = ["${python}", "${fixture}/check.py", "${scoop}", "${scoopc}", "${scoop-link}", "${scoop-lsp}", "${scoop-pm}"]
exit = 0
stdout = "matching versions\n"
stderr = ""
