schema = 1
name = "m35-jumps-basic"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m35", "jumps", "eh", "gc"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "7\nmissing\n8\n9\nthrown\nnever\n10\n11\ntrue\ntrue\n14\npresent\n15\nempty\n19\n20\n21\n22\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "7\nmissing\n8\n9\nthrown\nnever\n10\n11\ntrue\ntrue\n14\npresent\n15\nempty\n19\n20\n21\n22\n"
stderr = ""
