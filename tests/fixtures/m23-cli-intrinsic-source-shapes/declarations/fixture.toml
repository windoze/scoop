schema = 1
name = "intrinsic-source-shapes-declarations"
inputs = ["program.scoop", "../../m23-intrinsic-source-shapes/declarations.scoop", "factory.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["intrinsic-source-shapes", "modified-core", "moving-gc"]

[[steps]]
name = "runtime_vendor"
files = [
  {symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}},
  {symlink = {from = "${sysroot}/include", to = "${work}/sysroot/include"}},
]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"symlink" = {"from" = "${work}/core-source", "to" = "${work}/sysroot/src/scoop.core"}},
  {"copy" = {"from" = "${fixture}/../../m23-intrinsic-source-shapes/declarations.scoop", "to" = "${work}/core-source/src/intrinsic-shapes.scoop"}},
]
checks = []

[[steps]]
name = "core"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_exposed"
files = [
  {"copy" = {"from" = "${core.result.root.path}", "to" = "${work}/artifacts/original-core.slib"}},
  {"copy" = {"from" = "${fixture}/factory.scoop", "to" = "${work}/core-source/src/intrinsic-factory.scoop"}},
]
checks = []

[[steps]]
name = "exposed"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "publish_core"
files = [{copy = {from = "${exposed.result.root.path}", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}}]

[[steps]]
name = "prepare_program"
files = [{"copy" = {"from" = "${fixture}/program.scoop", "to" = "${work}/sources/program.scoop"}}]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 1}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
checks = []
