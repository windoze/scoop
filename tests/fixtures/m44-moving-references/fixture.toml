schema = 1
name = "m44-moving-references"
root = "program.scoop"
inputs = ["program.scoop", "native.c"]
tools = ["scoop", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m44", "gc", "moving", "pin", "gc-free"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-Wall", "-Wextra", "-Werror", "-I", "${runtime}/include", "-c", "${fixture}/native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libmoving_refs.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--library-path", "${work}", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = "moving roots, pinned aggregate slots and GC-free payloads preserved\n"
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}
json = "stderr"
diagnostics = []
