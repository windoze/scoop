schema = 1
name = "m36-returns-generic-finally"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m36", "returns", "generics", "finally"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--emit", "all", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "program.hir.txt"}, {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "program.mir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "unit-result\nforward-finally\nforward-finally\nvalue-result\ndiscard\nforward-finally\nforward-finally\ncaught\nouter-finally\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "unit-result\nforward-finally\nforward-finally\nvalue-result\ndiscard\nforward-finally\nforward-finally\ncaught\nouter-finally\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "unit-result\nforward-finally\nforward-finally\nvalue-result\ndiscard\nforward-finally\nforward-finally\ncaught\nouter-finally\n"
stderr = ""
