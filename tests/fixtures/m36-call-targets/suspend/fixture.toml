schema = 1
name = "m36-call-targets-suspend"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m36", "calls", "generics", "gc"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "argument-pending\nmethod\nmethod-pending\nmethod\nreference-pending\ntask-finally\n86\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "argument-pending\nmethod\nmethod-pending\nmethod\nreference-pending\ntask-finally\n86\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "argument-pending\nmethod\nmethod-pending\nmethod\nreference-pending\ntask-finally\n86\n"
stderr = ""
