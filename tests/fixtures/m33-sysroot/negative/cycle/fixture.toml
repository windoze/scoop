schema = 1
name = "m33-sysroot-reject-cycle"
inputs = ["cone", "platform"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m33", "sysroot", "negative"]

[[steps]]
name = "prepare"
files = [
 {mkdir = {path = "${work}/sysroot/lib"}},
 {symlink = {from = "${sysroot}/lib/scoop.core", to = "${work}/sysroot/lib/scoop.core"}},
 {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
 {copy = {from = "${fixture}/platform", to = "${work}/sysroot/lib/scoop.platform"}},
 {mkdir = {path = "${work}/sysroot/lib/scoop.helper"}},
 {write = {path = "${work}/sysroot/lib/scoop.helper/Cone.toml", data = "schema = 1\n[cone]\ngroup = \"scoop\"\nname = \"scoop.helper\"\nversion = \"0.1.0\"\nkind = \"library\"\n[dependencies]\n\"scoop:scoop.platform\" = \"0.1.0\"\n"}},
]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${work}/sysroot", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
