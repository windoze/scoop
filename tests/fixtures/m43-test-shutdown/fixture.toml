schema = 1
name = "m43-test-shutdown"
inputs = ["../m43-test-report/program"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m43", "test-report", "shutdown", "callback"]
variants = [
    {name = "debug", vars = {profile = "debug"}},
    {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "shutdown"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/../m43-test-report/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
env = {M43_REPORT_MODE = "9"}
exit = 1
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
    {actual = "${shutdown.test_result.status}", equals = "failed"},
    {actual = "${shutdown.test_result.complete}", equals = true},
    {actual = "${shutdown.test_result.counts.passed}", equals = 2},
    {actual = "${shutdown.test_result.counts.failed}", equals = 0},
    {actual = "${shutdown.test_result.process.code}", equals = 1},
    {actual = "${shutdown.test_result.target_failure}", contains = "test process failed"},
    {actual = "${shutdown.test_result.output.stderr.text}", equals = "scoop: shutdown failed: non-main threads=0, active callbacks=0, owned tokens=1\n"},
]
