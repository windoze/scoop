schema = 1
name = "m60-doc-cli-basic"
root = "cone/Cone.toml"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m60", "documentation", "cache"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}]

[[steps]]
name = "cold"
argv = ["${scoop}", "doc", "${work}/cone", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${cold.result.kind}", equals = "documentation"},
  {actual = "${cold.result.cones.length}", equals = 1},
  {actual = "${cold.result.observations.child_invocations.length}", equals = 1},
  {actual = "${cold.result.rendered}", equals = true},
  {file = "${cold.result.output}", contains = "doc-basic"},
  {file = "${cold.result.cones.0.output}", contains = "README revision one"},
  {file = "${cold.result.cones.0.output}", contains = "Source files"},
  {file = "${cold.result.cones.0.output}", not_contains = "file://"},
  {file = "${work}/site/assets/index.js", contains = "doubler"},
  {file = "${work}/site/assets/index.js", contains = "${target}"},
  {file = "${work}/site/assets/index.js", not_contains = "secret"},
  {file = "${work}/site/assets/index.js", not_contains = "concealed"},
]

[[steps]]
name = "change_test_only"
files = [{write = {path = "${work}/cone/tests/unused.scoop", data = "Still an invalid test input.\n"}}]

[[steps]]
name = "warm"
argv = ["${scoop}", "doc", "${work}/cone/Cone.toml", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--deny-doc-warnings", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm.result.observations.child_invocations}", equals = []},
  {actual = "${warm.result.rendered}", equals = false},
]

[[steps]]
name = "change_readme"
files = [{replace = {path = "${work}/cone/README.md", old = "revision one", new = "revision two"}}]

[[steps]]
name = "readme"
argv = ["${scoop}", "doc", "${work}/cone", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${readme.result.observations.child_invocations}", equals = []},
  {actual = "${readme.result.rendered}", equals = true},
  {file = "${readme.result.cones.0.output}", contains = "README revision two"},
]

[[steps]]
name = "private"
argv = ["${scoop}", "doc", "${work}/cone", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--document-private-items", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${private.result.observations.child_invocations}", equals = []},
  {file = "${work}/site/assets/index.js", contains = "secret"},
  {file = "${work}/site/assets/index.js", not_contains = "concealed"},
]

[[steps]]
name = "missing_page"
files = [{remove = {path = "${work}/site/index.html"}}]

[[steps]]
name = "restore"
argv = ["${scoop}", "doc", "${work}/cone", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--output-dir", "${work}/site", "--document-private-items", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${restore.result.observations.child_invocations}", equals = []},
  {actual = "${restore.result.rendered}", equals = true},
  {file = "${restore.result.output}", exists = true},
]
