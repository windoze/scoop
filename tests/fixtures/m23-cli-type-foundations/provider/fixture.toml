schema = 1
name = "type-foundations-provider"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "type-provider", "../../m23-shared-type-foundations/provider.scoop", "type-foundation-provider-consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["type-foundations", "provider"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_type-provider"
files = [
  {"copy" = {"from" = "${fixture}/type-provider", "to" = "${work}/sources/type-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-shared-type-foundations/provider.scoop", "to" = "${work}/sources/type-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/type-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/type-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_type-foundation-provider-consumer"
files = [
  {"copy" = {"from" = "${fixture}/type-foundation-provider-consumer", "to" = "${work}/sources/type-foundation-provider-consumer"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/type-foundation-provider-consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/type-foundation-provider-consumer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []
