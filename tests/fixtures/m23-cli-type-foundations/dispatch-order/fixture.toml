schema = 1
name = "type-foundations-dispatch-order"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "dispatch-order", "../../m23-shared-type-foundations/dispatch-order.scoop", "type-foundation-dispatch-order-consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["type-foundations", "dispatch-order", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_dispatch-order"
files = [
  {"copy" = {"from" = "${fixture}/dispatch-order", "to" = "${work}/sources/dispatch-order"}},
  {"copy" = {"from" = "${fixture}/../../m23-shared-type-foundations/dispatch-order.scoop", "to" = "${work}/sources/dispatch-order/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "${work}/sources/dispatch-order", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/dispatch-order/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/ast.txt", "snapshot" = "provider.ast.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/hir.txt", "snapshot" = "provider.hir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/mir.txt", "snapshot" = "provider.mir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/lir.txt", "snapshot" = "provider.lir.txt"},
]

[[steps]]
name = "remove_provider_source"
files = [
  {"remove" = {"path" = "${work}/sources/dispatch-order"}},
]

[[steps]]
name = "prepare_type-foundation-dispatch-order-consumer"
files = [
  {"copy" = {"from" = "${fixture}/type-foundation-dispatch-order-consumer", "to" = "${work}/sources/type-foundation-dispatch-order-consumer"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "${work}/sources/type-foundation-dispatch-order-consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/type-foundation-dispatch-order-consumer/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/consumer"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${consumer.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/ast.txt", "snapshot" = "consumer.ast.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/hir.txt", "snapshot" = "consumer.hir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/mir.txt", "snapshot" = "consumer.mir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/lir.txt", "snapshot" = "consumer.lir.txt"},
]

[[steps]]
name = "remove_consumer_source"
files = [
  {"remove" = {"path" = "${work}/sources/type-foundation-dispatch-order-consumer"}},
]
