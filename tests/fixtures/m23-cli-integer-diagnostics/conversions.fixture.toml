schema = 1
name = "integer-diagnostics-explicit-conversions"
inputs = ["conversions.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["integer-diagnostics", "generics", "defaults", "stage-golden", "moving-gc"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/conversions.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "conversions.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "conversions.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "conversions.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "conversions.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "3\n3\n2\n3\n3\n"
stderr = ""
