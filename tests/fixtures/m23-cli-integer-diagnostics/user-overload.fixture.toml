schema = 1
name = "integer-diagnostics-user-overload"
inputs = ["user-overload.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["integer-diagnostics", "negative", "overloads"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "${fixture}/user-overload.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "user-overload.diagnostics.json"}
