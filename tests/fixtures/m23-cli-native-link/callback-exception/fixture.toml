schema = 1
name = "native-link-callback-exception"
inputs = ["callback-provider", "../../m23-native-link/callbacks/provider.scoop", "callback-exception", "../../m23-native-link/callbacks/exception.scoop", "../../m23-native-link/callbacks/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "moving-gc"]

[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = { SCOOP_GC_STRESS_MOVE = "1" }

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/callback-provider", "to" = "${work}/sources/callback-provider"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/callbacks/provider.scoop", "to" = "${work}/sources/callback-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/callback-exception", "to" = "${work}/sources/callback-exception"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/callbacks/exception.scoop", "to" = "${work}/sources/callback-exception/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/callbacks/native.c", "to" = "${work}/sources/native/callbacks/native.c"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]

[[steps]]
name = "compile_0"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/callbacks/native.c", "-o", "${work}/native/m23_callbacks.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "build"
timeout = 300
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/callback-exception", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 2},
  {"actual" = "${build.result.dependencies.0.coordinate.name}", "equals" = "scoop.core"},
  {"actual" = "${build.result.dependencies.1.coordinate.name}", "equals" = "callback-provider"},
  {"actual" = "${build.result.root.coordinate.name}", "equals" = "callback-exception"},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "0\ntrue\nfailure-7\n1\ncaller-alive\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${build.result.root.path}", "--dependency-slib", "${build.result.dependencies.1.path}", "--dependency-slib", "${build.result.dependencies.0.path}", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "0\ntrue\nfailure-7\n1\ncaller-alive\n"
stderr = ""
