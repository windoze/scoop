schema = 1
name = "native-link-archive-chain"
inputs = ["cone", "../../m23-native-link/archive/root.scoop", "../../m23-native-link/archive/entry.c", "../../m23-native-link/archive/end.c", "../../m23-native-link/archive/unused.c", "../../m23-native-link/archive/middle.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "stage-golden"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/archive"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/archive/root.scoop", "to" = "${work}/sources/archive/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_entry"
files = [{"copy" = {"from" = "${fixture}/../../m23-native-link/archive/entry.c", "to" = "${work}/sources/native/entry.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_entry"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/entry.c", "-o", "${work}/objects/entry.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "prepare_compile_end"
files = [{"copy" = {"from" = "${fixture}/../../m23-native-link/archive/end.c", "to" = "${work}/sources/native/end.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_end"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/end.c", "-o", "${work}/objects/end.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "prepare_compile_unused"
files = [{"copy" = {"from" = "${fixture}/../../m23-native-link/archive/unused.c", "to" = "${work}/sources/native/unused.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_unused"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/unused.c", "-o", "${work}/objects/unused.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "prepare_compile_middle"
files = [{"copy" = {"from" = "${fixture}/../../m23-native-link/archive/middle.c", "to" = "${work}/sources/native/middle.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_middle"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/middle.c", "-o", "${work}/objects/middle.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "archive_m23_chain"
argv = ["${ar}", "qcS", "${work}/native/libm23_chain.a", "${work}/objects/entry.o", "${work}/objects/end.o", "${work}/objects/unused.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "archive_m23_tail"
argv = ["${ar}", "qcS", "${work}/native/libm23_tail.a", "${work}/objects/middle.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/archive", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "lir.${target}.txt"}]

[[steps]]
name = "isolate"
files = [{"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}}, {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}}, {"mkdir" = {"path" = "${work}/empty-sysroot"}}, {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}}, {"remove" = {"path" = "${work}/sources"}}]
checks = []

[[steps]]
name = "remove_members"
files = [{"remove" = {"path" = "${work}/objects/entry.o"}}, {"remove" = {"path" = "${work}/objects/end.o"}}, {"remove" = {"path" = "${work}/objects/unused.o"}}, {"remove" = {"path" = "${work}/objects/middle.o"}}]
checks = []

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", {each = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n7\n"
stderr = ""

[[steps]]
name = "run_linked_moving"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n7\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "symbols"
argv = ["/usr/bin/nm", "-j", "${link.result.output}"]
exit = 0
stdout = {snapshot = "symbols.${target}.txt"}
stderr = ""
checks = [{"actual" = "${symbols.stdout}", "not_contains" = "m23_unused"}]
