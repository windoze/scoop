schema = 1
name = "native-link-reject-storage-bad-type"
inputs = ["source-error", "../../m23-native-link/storage/bad-type.scoop", "storage-provider", "../../m23-native-link/storage/provider.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "negative", "canonical-diagnostics"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/source-error", "to" = "${work}/sources/source-error"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/storage/bad-type.scoop", "to" = "${work}/sources/source-error/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/storage-provider", "to" = "${work}/sources/storage-provider"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/storage/provider.scoop", "to" = "${work}/sources/storage-provider/src/main.scoop"}}]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/source-error", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/rejected"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [{"file" = "${work}/rejected", "exists" = false}, {"file" = "${work}/sources/source-error/rejected.slib", "exists" = false}]
