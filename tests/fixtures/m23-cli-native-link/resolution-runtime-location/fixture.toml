schema = 1
name = "native-link-resolution-runtime-location"
inputs = ["cone", "../../m23-native-link/direct/root.scoop", "../../m23-native-link/direct/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
# This fixture exercises Mach-O dylib, dyld namespace, or framework behavior.
targets = ["aarch64-apple-darwin"]
tags = ["native-link", "program-link", "stage-golden"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/paths"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/direct/root.scoop", "to" = "${work}/sources/paths/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_math"
files = [{"copy" = {"from" = "${fixture}/../../m23-native-link/direct/native.c", "to" = "${work}/sources/native/build-m23_math.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_math"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_math.c", "-o", "${work}/objects/build-m23_math.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "dylib_m23_math"
argv = ["${cc}", "-target", "arm64-apple-macos", "-dynamiclib", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "${work}/objects/build-m23_math.o", "-install_name", "@rpath/libm23_math.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-Wl,-headerpad_max_install_names", "-o", "${work}/native/libm23_math.dylib"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/sources/paths", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "lir.txt"}]

[[steps]]
name = "isolate"
files = [{"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}}, {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}}, {"mkdir" = {"path" = "${work}/empty-sysroot"}}, {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}}, {"remove" = {"path" = "${work}/sources"}}]
checks = []

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"actual" = "${link.result.link_plan}", "snapshot" = "link.plan", "normalize" = ["paths"]}]

[[steps]]
name = "run_original"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "copy_provider"
files = [{"copy" = {"from" = "${work}/native/libm23_math.dylib", "to" = "${work}/moved/native/libm23_math.dylib"}}]
checks = []

[[steps]]
name = "relocated"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/moved/program", "--library-path", "${work}/moved/native", "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"actual" = "${relocated.result.link_plan}", "not_equals" = "${link.result.link_plan}"}, {"actual" = "${relocated.result.link_plan}", "contains" = "moved/native"}, {"actual" = "${relocated.result.link_plan_fingerprint}", "not_equals" = "${link.result.link_plan_fingerprint}"}, {"actual" = "${relocated.result.link_plan}", "snapshot" = "relocated.plan", "normalize" = ["paths"]}]

[[steps]]
name = "run_relocated"
argv = ["${relocated.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "change_install_name"
argv = ["/usr/bin/install_name_tool", "-id", "${work}/moved/native/libm23_math.dylib", "${work}/moved/native/libm23_math.dylib"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "renamed"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/moved/program", "--library-path", "${work}/moved/native", "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"actual" = "${renamed.result.link_plan}", "not_equals" = "${relocated.result.link_plan}"}, {"actual" = "${renamed.result.link_plan}", "not_contains" = "rpath "}, {"actual" = "${renamed.result.link_plan_fingerprint}", "not_equals" = "${relocated.result.link_plan_fingerprint}"}]

[[steps]]
name = "run_renamed"
argv = ["${renamed.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
