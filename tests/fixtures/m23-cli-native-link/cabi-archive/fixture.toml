schema = 1
name = "native-link-cabi-archive"
inputs = ["cabi-provider", "../../m23-native-link/cabi/provider.scoop", "cabi-facade", "../../m23-native-link/cabi/facade.scoop", "cabi-root", "../../m23-native-link/cabi/root.scoop", "../../m23-native-link/cabi/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "moving-gc", "stage-golden"]

[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = { SCOOP_GC_STRESS_MOVE = "1" }

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cabi-provider", "to" = "${work}/sources/cabi-provider"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/cabi/provider.scoop", "to" = "${work}/sources/cabi-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/cabi-facade", "to" = "${work}/sources/cabi-facade"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/cabi/facade.scoop", "to" = "${work}/sources/cabi-facade/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/cabi-root", "to" = "${work}/sources/cabi-root"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/cabi/root.scoop", "to" = "${work}/sources/cabi-root/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/cabi/native.c", "to" = "${work}/sources/native/cabi/native.c"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]

[[steps]]
name = "compile_0"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/cabi/native.c", "-o", "${work}/objects/payload.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "archive_m23_cabi"
argv = ["${ar}", "qcS", "${work}/native/libm23_cabi.a", "${work}/objects/payload.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_objects"
files = [{"remove" = {"path" = "${work}/objects/payload.o"}}]

[[steps]]
name = "build"
timeout = 300
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/cabi-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump", "--dump-scope", "sources", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${build.result.dependencies.length}", "equals" = 3}, {"actual" = "${build.result.dependencies.0.coordinate.name}", "equals" = "scoop.core"}, {"actual" = "${build.result.dependencies.1.coordinate.name}", "equals" = "cabi-provider"}, {"file" = "${work}/dump/${build.result.dependencies.1.identity}/ast.txt", "snapshot" = "../goldens/cabi/provider.ast.txt"}, {"file" = "${work}/dump/${build.result.dependencies.1.identity}/hir.txt", "snapshot" = "../goldens/cabi/provider.hir.txt"}, {"file" = "${work}/dump/${build.result.dependencies.1.identity}/mir.txt", "snapshot" = "../goldens/cabi/provider.mir.txt"}, {"file" = "${work}/dump/${build.result.dependencies.1.identity}/lir.txt", "snapshot" = "../goldens/cabi/provider.lir.${target}.txt"}, {"actual" = "${build.result.dependencies.2.coordinate.name}", "equals" = "cabi-facade"}, {"file" = "${work}/dump/${build.result.dependencies.2.identity}/ast.txt", "snapshot" = "../goldens/cabi/facade.ast.txt"}, {"file" = "${work}/dump/${build.result.dependencies.2.identity}/hir.txt", "snapshot" = "../goldens/cabi/facade.hir.txt"}, {"file" = "${work}/dump/${build.result.dependencies.2.identity}/mir.txt", "snapshot" = "../goldens/cabi/facade.mir.txt"}, {"file" = "${work}/dump/${build.result.dependencies.2.identity}/lir.txt", "snapshot" = "../goldens/cabi/facade.lir.txt"}, {"actual" = "${build.result.root.coordinate.name}", "equals" = "cabi-root"}, {"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "../goldens/cabi/root.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "../goldens/cabi/root.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "../goldens/cabi/root.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "../goldens/cabi/root.${target}.lir.txt"}]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "-128\n-32768\n-2147483648\n-9223372036854775808\n255\n65535\n4294967295\n18446744073709551615\n-2\n-4\n-6\n-8\n2\n4\n6\n8\n4\nfalse\n17\n103\n42\n85\n84\ncabi-alive\n"
stderr = ""

[[steps]]
name = "isolate"
files = [{"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}}, {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}}, {"mkdir" = {"path" = "${work}/empty-sysroot"}}, {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}}, {"copy" = {"from" = "${build.result.dependencies.1.path}", "to" = "${work}/artifacts/1.slib"}}, {"copy" = {"from" = "${build.result.dependencies.2.path}", "to" = "${work}/artifacts/2.slib"}}, {"remove" = {"path" = "${work}/sources"}}]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/2.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", {each = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths", "native-digests"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "-128\n-32768\n-2147483648\n-9223372036854775808\n255\n65535\n4294967295\n18446744073709551615\n-2\n-4\n-6\n-8\n2\n4\n6\n8\n4\nfalse\n17\n103\n42\n85\n84\ncabi-alive\n"
stderr = ""
