schema = 1
name = "native-link-formats-tls"
inputs = ["cone", "../../m23-native-link/final/root.scoop", "../../m23-native-link/final/native.c", "../../m23-native-link/final/tls.c", "native-sources/compile_m23_final.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
# This fixture mutates the Mach-O TLV descriptor and template symbol.
targets = ["aarch64-apple-darwin"]
tags = ["native-link", "program-link", "stage-golden"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/records"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/final/root.scoop", "to" = "${work}/sources/records/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_final"
files = [{"copy" = {"from" = "${fixture}/native-sources/compile_m23_final.c", "to" = "${work}/sources/native/m23_final.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_final"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/m23_final.c", "-o", "${work}/objects/m23_final.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "install_m23_final"
files = [{"copy" = {"from" = "${work}/objects/m23_final.o", "to" = "${work}/native/m23_final.o"}}]
checks = []

[[steps]]
name = "original_object"
checks = [{"file" = "${work}/native/m23_final.o", "sha256" = "f1fa0303569b3c769c5561de84d91175f39c806b13b68011f197ea1dbf51f601"}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/records", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "lir.${target}.txt"}]

[[steps]]
name = "control"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "isolate"
files = [{"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}}, {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}}, {"mkdir" = {"path" = "${work}/empty-sysroot"}}, {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}}, {"remove" = {"path" = "${work}/sources"}}]
checks = []

[[steps]]
name = "save_object"
files = [{"copy" = {"from" = "${work}/native/m23_final.o", "to" = "${work}/original.o"}}]
checks = []

[[steps]]
name = "corrupt_key"
files = [{"copy" = {"from" = "${work}/original.o", "to" = "${work}/native/m23_final.o"}}, {"patch" = {"path" = "${work}/native/m23_final.o", "offset" = 796, "hex" = "01"}}]
checks = []

[[steps]]
name = "previous_reject_key"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject_key"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", {each = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject_key.json"}
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]

[[steps]]
name = "corrupt_template"
files = [{"copy" = {"from" = "${work}/original.o", "to" = "${work}/native/m23_final.o"}}, {"patch" = {"path" = "${work}/native/m23_final.o", "offset" = 972, "hex" = "0900000e"}}]
checks = []

[[steps]]
name = "previous_reject_template"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject_template"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", {each = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject_template.json"}
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]
