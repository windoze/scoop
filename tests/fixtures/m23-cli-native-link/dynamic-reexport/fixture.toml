schema = 1
name = "native-link-dynamic-reexport"
inputs = ["cone", "../../m23-native-link/direct/root.scoop", "../../m23-native-link/direct/native.c", "native-sources/compile_m23_facade.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
# This fixture exercises Mach-O dylib, dyld namespace, or framework behavior.
targets = ["aarch64-apple-darwin"]
tags = ["native-link", "program-link"]
variants = [{name = "explicit", vars = {library_args = ["--library-path", "${work}/native"]}}, {name = "sysroot", vars = {library_args = []}}]

[[steps]]
name = "prepare"
files = [
 {copy = {from = "${sysroot}/lib/${target}/scoop.core.slib", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}},
 {symlink = {from = "${sysroot}/src", to = "${work}/sysroot/src"}},
 {symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}},
 {symlink = {from = "${sysroot}/include", to = "${work}/sysroot/include"}},
 {symlink = {from = "${work}/sysroot/lib/${target}", to = "${work}/native"}},
 {copy = {from = "${fixture}/cone", to = "${work}/sources/reexport"}},
 {copy = {from = "${fixture}/../../m23-native-link/direct/root.scoop", to = "${work}/sources/reexport/src/main.scoop"}},
 {mkdir = {path = "${work}/objects"}},
]
checks = []

[[steps]]
name = "library_binding"
files = [{"replace" = {"path" = "${work}/sources/reexport/src/main.scoop", "old" = "m23_math", "new" = "m23_facade"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_leaf"
files = [{"copy" = {"from" = "${fixture}/../../m23-native-link/direct/native.c", "to" = "${work}/sources/native/build-m23_leaf.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_leaf"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_leaf.c", "-o", "${work}/objects/build-m23_leaf.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "dylib_m23_leaf"
argv = ["${cc}", "-target", "arm64-apple-macos", "-dynamiclib", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "${work}/objects/build-m23_leaf.o", "-install_name", "@rpath/libm23_leaf.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-o", "${work}/native/libm23_leaf.dylib"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "prepare_compile_m23_facade"
files = [{"copy" = {"from" = "${fixture}/native-sources/compile_m23_facade.c", "to" = "${work}/sources/native/build-m23_facade.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_facade"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_facade.c", "-o", "${work}/objects/build-m23_facade.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "dylib_m23_facade"
argv = ["${cc}", "-target", "arm64-apple-macos", "-dynamiclib", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "${work}/objects/build-m23_facade.o", "-install_name", "@rpath/libm23_facade.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-Wl,-reexport_library", "${work}/native/libm23_leaf.dylib", "-o", "${work}/native/libm23_facade.dylib"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/sources/reexport", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", {each = "${library_args}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${build.result.root.path}", "--dependency-slib", "${build.result.dependencies.0.path}", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", {each = "${library_args}"}, "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan}", "contains" = "dynamic binding _m23_add -> \"@rpath/libm23_facade.dylib\""}, {"actual" = "${link.result.link_plan}", "contains" = "re-export \"@rpath/libm23_leaf.dylib\""}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
