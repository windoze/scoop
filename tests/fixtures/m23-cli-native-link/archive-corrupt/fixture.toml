schema = 1
name = "native-link-archive-corrupt"
inputs = ["archive", "../../m23-native-link/direct/root.scoop", "../../m23-native-link/direct/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "archive", "corruption", "atomic-output"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/archive", "to" = "${work}/sources/archive"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/direct/root.scoop", "to" = "${work}/sources/archive/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/direct/native.c", "to" = "${work}/sources/native/source.c"}}, {"mkdir" = {"path" = "${work}/native"}}]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/source.c", "-o", "${work}/native/source.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_math.a", "${work}/native/source.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}
# The control step links and runs this archive before corrupting it.
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/archive", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 1},
]

[[steps]]
name = "control"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/core.slib"}},
  {"copy" = {"from" = "${work}/native/libm23_math.a", "to" = "${work}/original.a"}},
  {"write" = {"path" = "${work}/rejected", "data" = "previous executable"}},
]

[[steps]]
name = "prepare_thin"
files = [{"write" = {"path" = "${work}/native/libm23_math.a", "data" = "!<thin>\n"}}]

[[steps]]
name = "reject_thin"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/core.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "-o", "${work}/rejected", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "thin.${target}.json"}
checks = [{"file" = "${work}/rejected", "equals" = "previous executable"}]

[[steps]]
name = "prepare_truncated"
files = [{"copy" = {"from" = "${work}/original.a", "to" = "${work}/native/libm23_math.a"}}, {"truncate" = {"path" = "${work}/native/libm23_math.a", "size" = 596}}]

[[steps]]
name = "reject_truncated"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/core.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "-o", "${work}/rejected", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "truncated.${target}.json"}
checks = [{"file" = "${work}/rejected", "equals" = "previous executable"}]

[[steps]]
name = "prepare_bad-header"
files = [{"write" = {"path" = "${work}/native/libm23_math.a", "data" = "!<arch>\ninvalid header"}}]

[[steps]]
name = "reject_bad-header"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/core.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "-o", "${work}/rejected", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "bad-header.${target}.json"}
checks = [{"file" = "${work}/rejected", "equals" = "previous executable"}]

[[steps]]
name = "prepare_nested"
files = [{"remove" = {"path" = "${work}/native/libm23_math.a"}}, {"copy" = {"from" = "${work}/original.a", "to" = "${work}/nested.a"}}]

[[steps]]
name = "nested_archive"
argv = ["${ar}", "qcS", "${work}/native/libm23_math.a", "${work}/nested.a"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "reject_nested"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/core.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "-o", "${work}/rejected", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "nested.${target}.json"}
checks = [{"file" = "${work}/rejected", "equals" = "previous executable"}]
