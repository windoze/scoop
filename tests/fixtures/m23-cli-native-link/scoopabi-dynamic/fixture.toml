schema = 1
name = "native-link-scoopabi-dynamic"
inputs = ["scoopabi-provider", "../../m23-native-link/scoopabi/provider.scoop", "scoopabi-facade", "../../m23-native-link/scoopabi/facade.scoop", "scoopabi-root", "../../m23-native-link/scoopabi/root.scoop", "../../m23-native-link/scoopabi/native.c", "../../m23-native-link/scoopabi/leaf.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
# This fixture exercises Mach-O dylib, dyld namespace, or framework behavior.
targets = ["aarch64-apple-darwin"]
tags = ["native-link", "program-link", "moving-gc"]

[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = { SCOOP_GC_STRESS_MOVE = "1" }

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/scoopabi-provider", "to" = "${work}/sources/scoopabi-provider"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/scoopabi/provider.scoop", "to" = "${work}/sources/scoopabi-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/scoopabi-facade", "to" = "${work}/sources/scoopabi-facade"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/scoopabi/facade.scoop", "to" = "${work}/sources/scoopabi-facade/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/scoopabi-root", "to" = "${work}/sources/scoopabi-root"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/scoopabi/root.scoop", "to" = "${work}/sources/scoopabi-root/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/scoopabi/native.c", "to" = "${work}/sources/native/scoopabi/native.c"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/scoopabi/leaf.c", "to" = "${work}/sources/native/scoopabi/leaf.c"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]

[[steps]]
name = "compile_0"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "-I", "${runtime}/include", "${work}/sources/native/scoopabi/native.c", "-o", "${work}/objects/managed.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "compile_1"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/scoopabi/leaf.c", "-o", "${work}/objects/leaf.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "dylib_1"
argv = ["${cc}", "-target", "arm64-apple-macos", "-dynamiclib", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "${work}/objects/leaf.o", "-install_name", "@rpath/libm23_scoop_leaf.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-o", "${work}/native/libm23_scoop_leaf.dylib"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "archive_m23_scoopabi"
argv = ["${ar}", "qcS", "${work}/native/libm23_scoopabi.a", "${work}/objects/managed.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "build"
timeout = 300
argv = ["${scoop}", "build", "${work}/sources/scoopabi-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 3},
  {"actual" = "${build.result.dependencies.0.coordinate.name}", "equals" = "scoop.core"},
  {"actual" = "${build.result.dependencies.1.coordinate.name}", "equals" = "scoopabi-provider"},
  {"actual" = "${build.result.dependencies.2.coordinate.name}", "equals" = "scoopabi-facade"},
  {"actual" = "${build.result.root.coordinate.name}", "equals" = "scoopabi-root"},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "managed-alive\n11\n22\n42\ncaller-alive\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.1.path}", "to" = "${work}/artifacts/1.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.2.path}", "to" = "${work}/artifacts/2.slib"}},
]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/2.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--target", "${target}", "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "managed-alive\n11\n22\n42\ncaller-alive\n"
stderr = ""
