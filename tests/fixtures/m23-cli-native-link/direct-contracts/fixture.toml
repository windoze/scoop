schema = 1
name = "native-link-direct-contracts"
inputs = ["cone", "../../m23-native-link/direct/root.scoop", "../../m23-native-link/direct/native.c", "native-sources/input_data.c", "native-sources/input_missing.c", "native-sources/input_constructor.c", "native-sources/input_common.c", "native-sources/input_target.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
# The wrong-architecture case compiles x86_64 Mach-O and checks Darwin object diagnostics.
targets = ["aarch64-apple-darwin"]
tags = ["native-link", "program-link", "stage-golden"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/direct"}}, {"copy" = {"from" = "${fixture}/../../m23-native-link/direct/root.scoop", "to" = "${work}/sources/direct/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_math"
files = [{"copy" = {"from" = "${fixture}/../../m23-native-link/direct/native.c", "to" = "${work}/sources/native/m23_math.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_math"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/m23_math.c", "-o", "${work}/objects/m23_math.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "install_m23_math"
files = [{"copy" = {"from" = "${work}/objects/m23_math.o", "to" = "${work}/native/m23_math.o"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/sources/direct", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "lir.txt"}]

[[steps]]
name = "isolate"
files = [{"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}}, {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}}, {"mkdir" = {"path" = "${work}/empty-sysroot"}}, {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}}, {"remove" = {"path" = "${work}/sources"}}]
checks = []

[[steps]]
name = "prepare_input_data"
files = [{"copy" = {"from" = "${fixture}/native-sources/input_data.c", "to" = "${work}/sources/native/m23_math.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "input_data"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/m23_math.c", "-o", "${work}/objects/m23_math.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "install_input_data"
files = [{"copy" = {"from" = "${work}/objects/m23_math.o", "to" = "${work}/native/m23_math.o"}}]
checks = []

[[steps]]
name = "previous_reject_data"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject_data"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject_data.json"}
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]

[[steps]]
name = "prepare_input_missing"
files = [{"copy" = {"from" = "${fixture}/native-sources/input_missing.c", "to" = "${work}/sources/native/m23_math.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "input_missing"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/m23_math.c", "-o", "${work}/objects/m23_math.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
