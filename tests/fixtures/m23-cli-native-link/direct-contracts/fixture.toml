argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject_constructor.json"}
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]

[[steps]]
name = "prepare_input_common"
files = [{"copy" = {"from" = "${fixture}/native-sources/input_common.c", "to" = "${work}/sources/native/m23_math.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "input_common"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "-fcommon", "${work}/sources/native/m23_math.c", "-o", "${work}/objects/m23_math.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "install_input_common"
files = [{"copy" = {"from" = "${work}/objects/m23_math.o", "to" = "${work}/native/m23_math.o"}}]
checks = []

[[steps]]
