schema = 1
name = "m43-test-selection-invalid"
inputs = ["program"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m43", "test-selection", "negative"]

[[steps]]
name = "reject-unselected-method"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${fixture}/program", "--filter", "Cases::valid", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{file = "${work}/outputs/${target}/debug/tests/selection-invalid", exists = false}]
