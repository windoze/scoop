schema = 1
name = "m54-client-digest-composition"
inputs = ["consumer", "cases.py", "routing_peer.py", "concurrent_peer.py"]
support = ["../m54-client-digest-lifetime/consumer/src/support.scoop", "../m54-client-digest/http1_peer.py", "../m54-client-digest/oracle.py", "../m54-client-trailers/wire.py", "../m54-client-digest/consumer/src/support.scoop", "../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m54", "http", "client", "authentication", "asyncio", "prebuilt"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/routing_peer.py", to = "${work}/routing_peer.py"}},
    {copy = {from = "${fixture}/concurrent_peer.py", to = "${work}/concurrent_peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/m54-client-digest/http1_peer.py", to = "${work}/http1_peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/m54-client-digest/oracle.py", to = "${work}/oracle.py"}},
    {copy = {from = "${repo}/tests/fixtures/m54-client-trailers/wire.py", to = "${work}/wire.py"}},
    {copy = {from = "${repo}/tests/fixtures/m54-client-digest-lifetime/consumer/src/support.scoop", to = "${work}/consumer/src/runtime.scoop"}},
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/cases.py", to = "${work}/cases.py"}},
    {copy = {from = "${repo}/tests/fixtures/m54-client-digest/consumer/src/support.scoop", to = "${work}/consumer/src/common.scoop"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${build.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "run"
timeout = 3600
argv = ["python3", "${work}/cases.py", "${build.result.output}"]
exit = 0
stdout = "Digest metadata redirects retries HTTP2 and concurrent nonce updates passed\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]
