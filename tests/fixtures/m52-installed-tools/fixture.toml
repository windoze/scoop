schema = 1
name = "m52-installed-tools"
inputs = ["cone"]
tools = ["scoop", "scoopc", "scoop-link"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m52", "sysroot", "native", "test"]

[vars]
options = ["--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
 {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
 {copy = {from = "${scoop}", to = "${work}/installed tools/bin/scoop"}},
 {copy = {from = "${scoopc}", to = "${work}/installed tools/bin/scoopc"}},
 {copy = {from = "${scoop-link}", to = "${work}/installed tools/bin/scoop-link"}},
 {symlink = {from = "${work}/installed tools/bin/scoop", to = "${work}/launch/scoop"}},
 {symlink = {from = "${work}/installed tools/bin/scoopc", to = "${work}/launch/scoopc"}},
 {symlink = {from = "${work}/installed tools/bin/scoop-link", to = "${work}/launch/scoop-link"}},
 {symlink = {from = "${sysroot}/lib", to = "${work}/installed tools/lib"}},
 {symlink = {from = "${sysroot}/src", to = "${work}/installed tools/src"}},
 {symlink = {from = "${sysroot}/vendor", to = "${work}/installed tools/vendor"}},
 {copy = {from = "${sysroot}/include", to = "${work}/installed tools/include"}},
 {concat = {path = "${work}/installed tools/include/scoop_rt.h", parts = [{file = "${work}/installed tools/include/scoop_rt.h"}, "\n#define SCOOP_M52_INSTALLED_VALUE 42\n"]}},
]

[[steps]]
name = "cold"
argv = ["/usr/bin/env", "-u", "SCOOP_SYSROOT", "${work}/launch/scoop", "build", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
 {actual = "${cold.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]},
 {actual = "${cold.result.runtime_index}", equals = "${work}/installed tools/lib/${target}/runtime/index.cbor"},
 {file = "${work}/cache/runtime-v5", exists = false},
]

[[steps]]
name = "run"
argv = ["${cold.result.output}"]
exit = 42
stdout = ""
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "warm_run"
argv = ["/usr/bin/env", "-u", "SCOOP_SYSROOT", "${work}/launch/scoop", "run", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 42
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm_run.result.observations.child_invocations}", equals = []}]

[[steps]]
name = "direct_compile"
argv = ["/usr/bin/env", "-u", "SCOOP_SYSROOT", "${work}/launch/scoopc", "build", "${work}/cone", {each = "${compile_args}"}, "--out-slib", "${work}/direct.slib"]
env = {SCOOP_CACHE_DIR = "${work}/cache"}
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "artifact_link"
argv = ["/usr/bin/env", "-u", "SCOOP_SYSROOT", "${work}/launch/scoop", "link", {each = "${compile_args}"}, "--root-slib", "${work}/direct.slib", "--cache-dir", "${work}/cache", "--message-format", "json", "-o", "${work}/artifact-program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "artifact_run"
argv = ["${artifact_link.result.output}"]
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "low_link"
argv = ["/usr/bin/env", "-u", "SCOOP_SYSROOT", "${work}/launch/scoop-link", {each = "${compile_args}"}, "--root-slib", "${cold.result.root.path}", {each = "${cold.result.dependencies}", field = "path", prefix = "--dep-slib"}, "--cache-dir", "${work}/cache", "-o", "${work}/low-program"]
exit = 0
stdout = "link-plan ${cold.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "low_run"
argv = ["${work}/low-program"]
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "test"
argv = ["/usr/bin/env", "-u", "SCOOP_SYSROOT", "${work}/launch/scoop", "test", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
 {actual = "${test.test_result.status}", equals = "passed"},
 {actual = "${test.test_result.counts.passed}", equals = 1},
 {actual = "${test.result.observations.child_invocations}", equals = ["${test.result.root.identity}"]},
]
