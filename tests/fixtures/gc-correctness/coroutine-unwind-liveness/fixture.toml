schema = 1
name = "coroutine-unwind-liveness"
inputs = ["consumer"]
tools = ["scoop", "scoopc"]
tags = ["coroutines", "exceptions", "generics", "gc", "gc-correctness"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", "${fixture}/consumer", {"each" = "${mode}"}, {"each" = "${link_args}"}, "--lockfile", "${work}/source.lock", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "coroutine unwind preserves overwritten cleanup values\n"
stderr = ""
