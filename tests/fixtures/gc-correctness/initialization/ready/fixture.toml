schema = 1
name = "initialization-ready-moving"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["gc", "initialization", "gc-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}, env = {SCOOP_GC_STRESS_MOVE = "1"}},
  {name = "release", vars = {profile = "release"}, env = {SCOOP_GC_STRESS_MINOR = "1"}},
]

[[steps]]
name = "run"
argv = ["${scoop}", "--enable-gc-stress", "run", {each = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "initialization preserves ready roots, failure identity and cycles\n"
stderr = ""
json = "stderr"
diagnostics = []
