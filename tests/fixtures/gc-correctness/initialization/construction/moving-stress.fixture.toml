schema = 1
name = "initialization-moving-stress"
root = "../../../language/initialization/moving-stress.scoop"
inputs = ["../../../language/initialization/moving-stress.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "run", "moving-gc", "gc-correctness"]
[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "base-seed\nbase-copy-base-seed\nderived-seed\nsecondary-alive\nbase-seed\nderived-seed\nbase-seed\nbase-copy-base-seed\nderived-seed\ntrue\n"
stderr = ""
