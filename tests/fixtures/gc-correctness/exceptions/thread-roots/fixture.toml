schema = 1
name = "exception-thread-roots"
inputs = ["program"]
tools = ["scoop", "scoopc"]
tags = ["exceptions", "threads", "gc-correctness", "moving-gc"]

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {each = "${link_args}"}, "${fixture}/program", "--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--lockfile", "${work}/Cone.lock", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
timeout = 180
exit = 0
stdout = "exception roots passed\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
timeout = 180
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "exception roots passed\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
timeout = 180
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "exception roots passed\n"
stderr = ""
