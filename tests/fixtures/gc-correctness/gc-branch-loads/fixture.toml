schema = 1
name = "gc-branch-loads"
inputs = ["main.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["gc", "optimization", "gc-correctness"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", "${fixture}/main.scoop", {"each" = "${mode}"}, {"each" = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "unchanged"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "branch loads keep relocated references\n"
stderr = ""

[[steps]]
name = "replaced"
argv = ["${build.result.output}", "replace"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "branch loads keep relocated references\n"
stderr = ""
