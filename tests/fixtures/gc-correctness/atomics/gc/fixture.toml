schema = 1
name = "atomics-gc"
inputs = ["Cone.toml", "src", "native.c"]
tools = ["scoop", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["atomics", "gc", "barriers", "gc-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-I", "${runtime}/include", "-c", "${fixture}/native.c", "-o", "${work}/threads.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libm33_atomic_gc.a", "${work}/threads.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${fixture}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
timeout = 180
exit = 0
stdout = "atomic gc\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
timeout = 180
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "atomic gc\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
timeout = 180
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "atomic gc\n"
stderr = ""
