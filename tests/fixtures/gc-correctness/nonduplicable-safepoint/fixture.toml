schema = 1
name = "nonduplicable-safepoint"
inputs = ["consumer"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["gc", "optimization", "prebuilt", "gc-correctness"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", "${fixture}/consumer", {"each" = "${mode}"}, {"each" = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "true-branch"
argv = ["${build.result.output}", "left", "x", "", "left"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint left\n"
stderr = ""

[[steps]]
name = "false-first"
argv = ["${build.result.output}", "right", "x", "x", "right"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint right\n"
stderr = ""

[[steps]]
name = "false-second"
argv = ["${build.result.output}", "left", "", "x", "right"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint right\n"
stderr = ""

[[steps]]
name = "true-failure"
argv = ["${build.result.output}", "left", "x", "x", "error"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint error\n"
stderr = ""

[[steps]]
name = "false-failure"
argv = ["${build.result.output}", "right", "x", "", "error"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint error\n"
stderr = ""
