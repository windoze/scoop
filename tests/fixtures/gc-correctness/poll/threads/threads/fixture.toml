schema = 1
name = "poll-threads"
inputs = ["program.scoop", "../../../../language/callback/native.c", "../../../../language/callback/threading.h"]
tools = ["scoop", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["poll", "threads", "gc", "gc-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "threads"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-c", "${fixture}/../../../../language/callback/native.c", "-o", "${work}/threads.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libm34_poll_threads.a", "${work}/threads.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${fixture}/program.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
timeout = 180
exit = 0
stdout = "conditional poll threads\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
timeout = 180
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional poll threads\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
timeout = 180
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "conditional poll threads\n"
stderr = ""
