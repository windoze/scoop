schema = 1
name = "poll-counting"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["poll", "optimization", "gc-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}, {name = "moving", vars = {profile = "release"}, env = {SCOOP_GC_STRESS_MOVE = "1"}}]

[[steps]]
name = "run"
argv = ["${scoop}", "--enable-gc-stress", "run", {"each" = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "bounded poll chunks preserve counts, limits and control flow\n"
stderr = ""
json = "stderr"
diagnostics = []
