schema = 1
name = "native-scoop-abi-moving-roots"
inputs = ["../../language/extern-scoop/extern-scoop.scoop", "../../language/extern-scoop/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
when = { os = ["darwin", "linux"] }
tags = ["native", "scoop-abi", "moving-gc", "gc-correctness"]
[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "prepare"
files = [
  {mkdir = {path = "${work}/native/objects"}},
  {mkdir = {path = "${work}/native/lib"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-Wall", "-Wextra", "-Werror", "-fno-omit-frame-pointer", "-I", "${runtime}/include", "-c", "${fixture}/../../language/extern-scoop/native.c", "-o", "${work}/native/objects/scoop-abi.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "rcs", "${work}/native/lib/libfixture_native.a", "${work}/native/objects/scoop-abi.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${fixture}/../../language/extern-scoop/extern-scoop.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native/lib", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "direct managed ref42\naggregate\n11\n22\n"
stderr = ""
