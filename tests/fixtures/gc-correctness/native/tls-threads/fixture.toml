schema = 1
name = "native-tls-cross-cone-callback-threads"
inputs = ["provider", "facade", "consumer", "native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native", "tls", "callback", "threads", "reexport", "moving-gc", "gc-correctness"]
[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/source/provider"}},
  {copy = {from = "${fixture}/facade", to = "${work}/source/facade"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/source/consumer"}},
  {mkdir = {path = "${work}/native/objects"}},
  {mkdir = {path = "${work}/native/lib"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-Wall", "-Wextra", "-Werror", "-fno-omit-frame-pointer", "-I", "${runtime}/include", "-c", "${fixture}/native.c", "-o", "${work}/native/objects/raw-globals.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "rcs", "${work}/native/lib/libfixture_native.a", "${work}/native/objects/raw-globals.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${work}/source/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native/lib", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "--enable-gc-stress", "link", {"each" = "${link_args}"}, "--root-slib", "${build.result.root.path}", {"each" = "${build.result.dependencies}", "field" = "path", "prefix" = "--dependency-slib"}, "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native/lib", "-o", "${work}/relinked", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${link.result.link_plan_fingerprint}", equals = "${build.result.link_plan_fingerprint}"}]

[[steps]]
name = "run_link"
argv = ["${link.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""
