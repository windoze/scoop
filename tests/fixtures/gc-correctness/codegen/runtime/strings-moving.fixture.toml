schema = 1
name = "runtime-strings-moving"
root = "strings-moving.scoop"
inputs = ["strings-moving.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["gc", "string", "intrinsics", "gc-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
  {name = "moving", vars = {profile = "release"}, env = {SCOOP_GC_STRESS_MOVE = "1"}},
  {name = "minor", vars = {profile = "release"}, env = {SCOOP_GC_STRESS_MINOR = "1"}},
]

[[steps]]
name = "run"
argv = ["${scoop}", "--enable-gc-stress", "run", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = "String iteration and moving GC preserved\n"
stderr = ""
json = "stderr"
diagnostics = []
