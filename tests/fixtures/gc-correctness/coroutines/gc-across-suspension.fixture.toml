schema = 1
name = "coroutines-gc-across-suspension"
root = "../../language/coroutines/gc-across-suspension.scoop"
inputs = ["../../language/coroutines/gc-across-suspension.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["single-file", "run", "moving-gc", "gc-correctness"]
[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "suspended\ncollected\nmiddle-alive\nbundle-alive\nnode-alive\ntask-alive\nnode-alive\nbundle-alive\nbundle-alive\nnode-alive\n42\n"
stderr = ""
