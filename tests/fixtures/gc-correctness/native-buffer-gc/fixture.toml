schema = 1
name = "native-buffer-gc"
inputs = ["consumer", "pressure.c", "allocation.c"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["platform", "gc", "release-blocks", "gc-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "prepare"
files = [
    {copy = {from = "${runtime}", to = "${work}/runtime"}},
    {copy = {from = "${fixture}/pressure.c", to = "${work}/runtime/src/gc/pressure.c"}},
    {copy = {from = "${sysroot}/src/scoop.platform", to = "${work}/platform"}},
    {copy = {from = "${fixture}/allocation.c", to = "${work}/platform/native/allocation.c"}},
    {replace = {path = "${work}/platform/native/memory.c", old = "#include <errno.h>", new = "#define realloc m45_realloc\n#define free m45_free\n#include <errno.h>"}},
    {replace = {path = "${work}/platform/Cone.toml", old = "path = \"native/memory.c\"", new = "path = \"native/memory.c\"\n\n[[native.sources]]\npath = \"native/allocation.c\""}},
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${work}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--runtime-root", "${work}/runtime", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "native buffer ownership, rollback and pressure passed\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "native buffer ownership, rollback and pressure passed\n"
stderr = ""
