schema = 1
name = "conditional-interface-roots"
inputs = ["program.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["conditional-interfaces", "roots", "boxing", "gc-correctness"]

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {each = "${link_args}"}, "${fixture}/program.scoop", "--release", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional interface roots and dispatch\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "conditional interface roots and dispatch\n"
stderr = ""
