schema = 1
name = "reclamation-growth"
root = "program.scoop"
inputs = ["program.scoop", "../native.c", "../../regions/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["regions", "reclamation", "gc", "gc-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-I", "${runtime}/include", "-c", "${fixture}/../native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libm34_reclamation.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
timeout = 180
argv = ["${build.result.output}"]
# The two-region bound exercises ordinary Immix placement, not old-slot placement.
env = {SCOOP_GC_OLD_SLOTS = "0"}
exit = 0
stdout = "region reclamation\n"
stderr = ""

[[steps]]
name = "moving"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "region reclamation\n"
stderr = ""

[[steps]]
name = "minor"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "region reclamation\n"
stderr = ""
