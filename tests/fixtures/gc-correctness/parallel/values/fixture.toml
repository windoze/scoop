schema = 1
name = "parallel-values"
root = "program.scoop"
inputs = ["program.scoop", "../native.c", "../../regions/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["parallel", "gc", "gc-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-I", "${runtime}/include", "-c", "${fixture}/../native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libm34_parallel.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "--enable-gc-stress", "build", {"each" = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "workers-1"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_WORKERS = "1"}
exit = 0
stdout = "parallel values\n"
stderr = ""

[[steps]]
name = "workers-2"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_WORKERS = "2"}
exit = 0
stdout = "parallel values\n"
stderr = ""

[[steps]]
name = "workers-4"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_WORKERS = "4"}
exit = 0
stdout = "parallel values\n"
stderr = ""

[[steps]]
name = "workers-8"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_WORKERS = "8"}
exit = 0
stdout = "parallel values\n"
stderr = ""

[[steps]]
name = "workers-16"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_WORKERS = "16"}
exit = 0
stdout = "parallel values\n"
stderr = ""

[[steps]]
name = "moving"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_WORKERS = "16", SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "parallel values\n"
stderr = ""

[[steps]]
name = "minor"
timeout = 180
argv = ["${build.result.output}"]
env = {SCOOP_GC_WORKERS = "16", SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "parallel values\n"
stderr = ""
