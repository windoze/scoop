schema = 1
name = "program-link-native-library-required"
inputs = ["cone", "../../m23-program-link/native-library-required.scoop", "../../m23-program-link/empty.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["program-link", "native-link", "negative"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/native-library-required"}}, {"copy" = {"from" = "${fixture}/../../m23-program-link/native-library-required.scoop", "to" = "${work}/sources/native-library-required/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "control_source"
files = [{"copy" = {"from" = "${fixture}/../../m23-program-link/empty.scoop", "to" = "${work}/sources/native-library-required/src/main.scoop"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/native-library-required", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-build", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "restore_native_declaration"
files = [{"copy" = {"from" = "${fixture}/../../m23-program-link/native-library-required.scoop", "to" = "${work}/sources/native-library-required/src/main.scoop"}}]
checks = []

[[steps]]
name = "recompile"
argv = ["${scoopc}", "build", "${work}/sources/native-library-required", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--direct-slib", "${build.result.dependencies.0.path}", "--out-slib", "${work}/replacement.slib"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${work}/replacement.slib", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "previous_reject"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject.${target}.json"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]
