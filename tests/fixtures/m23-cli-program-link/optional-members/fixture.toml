schema = 1
name = "program-link-optional-members"
inputs = ["cone", "../../m23-program-link/read-println.scoop", "vectors"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["program-link", "stage-golden", "opaque-members", "corruption", "moving-gc"]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/root"}}, {"copy" = {"from" = "${fixture}/../../m23-program-link/read-println.scoop", "to" = "${work}/sources/root/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/sources/root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-build", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump-build", "--dump-scope", "sources"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump-build/${build.result.root.identity}/ast.txt", "snapshot" = "build.ast.txt"}, {"file" = "${work}/dump-build/${build.result.root.identity}/hir.txt", "snapshot" = "build.hir.txt"}, {"file" = "${work}/dump-build/${build.result.root.identity}/mir.txt", "snapshot" = "build.mir.txt"}, {"file" = "${work}/dump-build/${build.result.root.identity}/lir.txt", "snapshot" = "build.lir.txt"}]

[[steps]]
name = "original_archive"
checks = [{"file" = "${build.result.root.path}", "sha256" = "2141f2b088318b34b7d82e8cef27d455d3e35ffbf2cc460cb89dbb9c8a204441"}]

[[steps]]
name = "isolate"
files = [{"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}}, {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}}, {"mkdir" = {"path" = "${work}/empty-sysroot"}}, {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}}, {"remove" = {"path" = "${work}/sources"}}]
checks = []

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"actual" = "${link.result.link_plan}", "snapshot" = "link.plan", "normalize" = ["paths"]}]

[[steps]]
name = "extraction_directory"
files = [{"mkdir" = {"path" = "${work}/members"}}]
checks = []

[[steps]]
name = "extract_members"
argv = ["/usr/bin/tar", "-xf", "${work}/artifacts/root.slib"]
exit = 0
stdout = ""
stderr = ""
cwd = "${work}/members"

[[steps]]
name = "original_m00000000"
await_file = "${work}/members/m00000000"

[[steps]]
name = "original_m00000001"
await_file = "${work}/members/m00000001"

[[steps]]
name = "original_m00000002"
await_file = "${work}/members/m00000002"

[[steps]]
name = "original_m00000003"
await_file = "${work}/members/m00000003"

[[steps]]
name = "original_m00000004"
await_file = "${work}/members/m00000004"

[[steps]]
name = "original_m00000005"
await_file = "${work}/members/m00000005"

[[steps]]
name = "original_m00000006"
await_file = "${work}/members/m00000006"

[[steps]]
name = "optional_header_0"
await_file = "${fixture}/vectors/optional/header-0.bin"

[[steps]]
name = "optional_header_1"
await_file = "${fixture}/vectors/optional/header-1.bin"

[[steps]]
name = "optional_header_2"
await_file = "${fixture}/vectors/optional/header-2.bin"

[[steps]]
name = "optional_header_3"
await_file = "${fixture}/vectors/optional/header-3.bin"

[[steps]]
name = "optional_header_4"
await_file = "${fixture}/vectors/optional/header-4.bin"

[[steps]]
name = "optional_header_5"
await_file = "${fixture}/vectors/optional/header-5.bin"

[[steps]]
name = "optional_header_6"
await_file = "${fixture}/vectors/optional/header-6.bin"

[[steps]]
name = "optional_header_7"
await_file = "${fixture}/vectors/optional/header-7.bin"

[[steps]]
name = "optional_header_8"
await_file = "${fixture}/vectors/optional/header-8.bin"

[[steps]]
name = "assemble_optional"
files = [{"remove" = {"path" = "${work}/artifacts/root.slib"}}, {"write" = {"path" = "${work}/artifacts/root.slib", "data" = "${optional_header_0.bytes}${original_m00000000.bytes}${optional_header_1.bytes}${original_m00000001.bytes}${optional_header_2.bytes}${original_m00000002.bytes}${optional_header_3.bytes}${original_m00000002.bytes}${optional_header_4.bytes}${original_m00000003.bytes}${optional_header_5.bytes}${original_m00000002.bytes}${optional_header_6.bytes}${original_m00000004.bytes}${optional_header_7.bytes}${original_m00000005.bytes}${optional_header_8.bytes}${original_m00000006.bytes}"}}]
checks = [{"file" = "${work}/artifacts/root.slib", "sha256" = "2797051971d1154cca95fd630710d6bc2352c48176ea830aee734ee17c2e8b42"}]

[[steps]]
name = "optional_link"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"actual" = "${optional_link.result.link_plan}", "equals" = "${link.result.link_plan}"}, {"actual" = "${optional_link.result.link_plan_fingerprint}", "equals" = "${link.result.link_plan_fingerprint}"}, {"file" = "${work}/artifacts/root.slib", "different_from" = "${build.result.root.path}"}, {"actual" = "${optional_link.result.link_plan}", "snapshot" = "optional_link.plan", "normalize" = ["paths"]}]

[[steps]]
name = "run_optional"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "run_optional_moving"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "required_header_0"
await_file = "${fixture}/vectors/required/header-0.bin"

[[steps]]
name = "required_header_1"
await_file = "${fixture}/vectors/required/header-1.bin"

[[steps]]
name = "required_header_2"
await_file = "${fixture}/vectors/required/header-2.bin"

[[steps]]
name = "required_header_3"
await_file = "${fixture}/vectors/required/header-3.bin"

[[steps]]
name = "required_header_4"
await_file = "${fixture}/vectors/required/header-4.bin"

[[steps]]
name = "required_header_5"
await_file = "${fixture}/vectors/required/header-5.bin"

[[steps]]
name = "required_header_6"
await_file = "${fixture}/vectors/required/header-6.bin"

[[steps]]
name = "required_header_7"
await_file = "${fixture}/vectors/required/header-7.bin"

[[steps]]
name = "required_header_8"
await_file = "${fixture}/vectors/required/header-8.bin"

[[steps]]
name = "required_header_9"
await_file = "${fixture}/vectors/required/header-9.bin"

[[steps]]
name = "assemble_required"
files = [{"remove" = {"path" = "${work}/artifacts/root.slib"}}, {"write" = {"path" = "${work}/artifacts/root.slib", "data" = "${required_header_0.bytes}${original_m00000000.bytes}${required_header_1.bytes}${original_m00000001.bytes}${required_header_2.bytes}${original_m00000002.bytes}${required_header_3.bytes}${original_m00000002.bytes}${required_header_4.bytes}${original_m00000003.bytes}${required_header_5.bytes}${original_m00000002.bytes}${required_header_6.bytes}${original_m00000004.bytes}${required_header_7.bytes}${original_m00000002.bytes}${required_header_8.bytes}${original_m00000005.bytes}${required_header_9.bytes}${original_m00000006.bytes}"}}]
checks = [{"file" = "${work}/artifacts/root.slib", "sha256" = "5e024a8e57823f016944ce9ac8d2e3a145b89bb4024ec803981248ac905ef8ea"}]

[[steps]]
name = "previous_required_link"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "required_link"
argv = ["${work}/standalone/scoop", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--target", "${target}", "--message-format", "json", "-o", "${work}/program"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "required_link.json"}
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]
