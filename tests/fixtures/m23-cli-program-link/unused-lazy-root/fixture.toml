schema = 1
name = "program-link-unused-lazy-root"
inputs = ["lazy-failure-provider", "../../m23-program-link/lazy-failure-provider.scoop", "unused-lazy-root", "../../m23-program-link/unused-lazy-root.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["program-link", "multi-cone", "moving-gc"]

[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/lazy-failure-provider", "to" = "${work}/sources/lazy-failure-provider"}}, {"copy" = {"from" = "${fixture}/../../m23-program-link/lazy-failure-provider.scoop", "to" = "${work}/sources/lazy-failure-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/unused-lazy-root", "to" = "${work}/sources/unused-lazy-root"}}, {"copy" = {"from" = "${fixture}/../../m23-program-link/unused-lazy-root.scoop", "to" = "${work}/sources/unused-lazy-root/src/main.scoop"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/unused-lazy-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 2},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.1.path}", "to" = "${work}/artifacts/1.slib"}},
]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
