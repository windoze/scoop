schema = 1
name = "log-output"
inputs = ["consumer", "check.py"]
tools = ["scoop", "scoopc", "python"]
when = { os = ["darwin", "linux"] }
tags = ["log", "output", "libraries"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", "--lockfile", "${work}/source-lock-0.lock", "--release", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${python}", "${fixture}/check.py", "${build.result.output}"]
exit = 0
stdout = "log streams, fallback, closed descriptors, broken pipes and concurrent records passed\n"
stderr = ""
