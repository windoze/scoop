schema = 1
name = "log-output"
inputs = ["consumer", "check.py"]
tools = ["scoop", "scoopc", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["log", "output", "libraries"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", "--release", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${python}", "${fixture}/check.py", "${build.result.output}"]
exit = 0
stdout = "log streams, fallback, closed descriptors, broken pipes and concurrent records passed\n"
stderr = ""
