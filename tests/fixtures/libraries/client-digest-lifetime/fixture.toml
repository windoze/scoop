schema = 1
name = "client-digest-lifetime"
inputs = ["consumer", "cases.py"]
support = ["../client-digest/consumer/src/support.scoop", "../../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop"]
tools = ["scoop", "scoopc", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["http", "client", "authentication", "asyncio", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/cases.py", to = "${work}/cases.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-digest/consumer/src/support.scoop", to = "${work}/consumer/src/common.scoop"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
]
[[steps]]
name = "build"
timeout = 900
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 900
argv = ["${python}", "${work}/cases.py", "${build.result.output}"]
exit = 0
stdout = "Digest callbacks and prehash wait for cancellation and actual cleanup\n"
stderr = ""
