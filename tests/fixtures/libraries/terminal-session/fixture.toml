schema = 1
name = "terminal-session"
inputs = ["consumer"]
tools = ["scoop", "scoopc", "terminal-host"]
when = { os = ["darwin", "linux"] }
tags = ["terminal", "pty", "native", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", "--lockfile", "${work}/source-lock-0.lock", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "session"
argv = ["${terminal-host}", "session", "${build.result.output}"]
exit = 0
stdout = "terminal session: ok\n"
stderr = ""

[[steps]]
name = "already_raw"
argv = ["${terminal-host}", "session-raw", "${build.result.output}"]
exit = 0
stdout = "terminal session-raw: ok\n"
stderr = ""

[[steps]]
name = "unavailable"
argv = ["${build.result.output}"]
env = {"M59_NO_TTY" = "1"}
exit = 0
stdout = "terminal unavailable: ok\n"
stderr = ""
