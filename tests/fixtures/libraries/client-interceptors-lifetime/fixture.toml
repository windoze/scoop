schema = 1
name = "client-interceptors-lifetime"
inputs = ["consumer", "run.py"]
support = ["../../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop"]
tools = ["scoop", "scoopc", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["http", "websocket", "client", "asyncio", "lifetime", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
]

[[steps]]
name = "build"
timeout = 900
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 1800
argv = ["${python}", "${fixture}/run.py", "${build.result.output}"]
exit = 0
stdout = "client interceptor cancellation deadlines cleanup self-wait and HTTP2 isolation passed\n"
stderr = ""
