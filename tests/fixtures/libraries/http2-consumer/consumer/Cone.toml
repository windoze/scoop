schema = 1
[cone]
group = "test.m53"
name = "http2-consumer"
version = "0.1.0"
kind = "executable"
[dependencies]
"scoop:scoop.http" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.std" = "0.1.0"

[native]
include = [
    {sysroot = "nghttp2/include"},
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Werror", "-DNGHTTP2_STATICLIB"]
[[native.sources]]
path = "peer.c"
