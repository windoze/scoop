schema = 1
name = "socks5"
inputs = ["consumer", "peer.py"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["asyncio", "socks5", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", "--lockfile", "${work}/source-lock-0.lock", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}", "${fixture}/peer.py"]
exit = 0
stdout = "SOCKS5 tunnels preserve authenticated and resolved byte streams\n"
stderr = ""
