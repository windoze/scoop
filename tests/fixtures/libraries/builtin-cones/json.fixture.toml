schema = 1
name = "builtin-json-api-tests"
inputs = []
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["libraries", "cone-tests"]
[[steps]]
name = "test"
argv = ["${scoop}", "test", "${repo}/sysroot/src/scoop.json", {each = "${link_args}"}, "--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
# This suite compiles all JSON codecs and derived consumer models together.
# Leave room for the cold release build on the Linux test host.
timeout = 1800
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
  {actual = "${test.test_result.status}", equals = "passed"},
  {actual = "${test.test_result.complete}", equals = true},
  {actual = "${test.test_result.counts.passed}", not_equals = 0},
]
