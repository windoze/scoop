schema = 1
name = "builtin-std-api-tests"
inputs = []
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["libraries", "cone-tests"]
[[steps]]
name = "test"
argv = ["${scoop}", "test", "${repo}/sysroot/src/scoop.std", {each = "${link_args}"}, "--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
timeout = 600
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
  {actual = "${test.test_result.status}", equals = "passed"},
  {actual = "${test.test_result.complete}", equals = true},
  {actual = "${test.test_result.counts.passed}", not_equals = 0},
]
