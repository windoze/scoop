schema = 1
name = "tls-system"
inputs = ["consumer"]
support = [
    "../../../../sysroot/src/scoop.crypto/test-certificates",
    "../../../../sysroot/src/scoop.tls/test-native",
    "../../../../sysroot/src/scoop.tls/native/tls.h",
    "../../../../sysroot/src/scoop.tls/native/system.h",
    "../../../../sysroot/src/scoop.tls/native/verification_darwin.h",
    "../../../../sysroot/src/scoop.crypto/native/common.h",
    "../../../../sysroot/src/scoop.tls/tests/identity_peer_script.scoop",
]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["tls", "crypto", "asyncio", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates", to = "${work}/support/src/scoop.crypto/test-certificates"}},
    {copy = {from = "${repo}/sysroot/src/scoop.tls/test-native", to = "${work}/support/src/scoop.tls/test-native"}},
    {copy = {from = "${repo}/sysroot/src/scoop.tls/native/tls.h", to = "${work}/support/src/scoop.tls/native/tls.h"}},
    {copy = {from = "${repo}/sysroot/src/scoop.tls/native/system.h", to = "${work}/support/src/scoop.tls/native/system.h"}},
    {copy = {from = "${repo}/sysroot/src/scoop.tls/native/verification_darwin.h", to = "${work}/support/src/scoop.tls/native/verification_darwin.h"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/native/common.h", to = "${work}/support/src/scoop.crypto/native/common.h"}},
    {copy = {from = "${repo}/sysroot/src/scoop.tls/tests/identity_peer_script.scoop", to = "${work}/consumer/src/peer_script.scoop"}},
    {"replace" = {"path" = "${work}/consumer/src/peer_script.scoop", "old" = "package scoop.tls\n", "new" = "package scoop.tests.scoop.tls\n"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 900
argv = ["${build.result.output}"]
env = {SCOOP_TEST_PYTHON = "${python}"}
exit = 0
stdout = "System TLS verification composes synchronous and native-worker paths with independent mTLS\n"
stderr = ""
