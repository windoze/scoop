schema = 1
name = "http-response-timing"
inputs = ["consumer", "peer.py"]
support = ["../client-idle/wire.py"]
tools = ["scoop", "scoopc", "python"]
when = { os = ["darwin", "linux"] }
tags = ["asyncio", "prebuilt", "tcp", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/peer.py", to = "${work}/peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-idle/wire.py", to = "${work}/wire.py"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 180
argv = ["${python}", "${work}/peer.py", "${build.result.output}"]
exit = 0
stdout = "HTTP response first-byte timing preserves partial headers pipeline and stream attribution\n"
stderr = ""
