schema = 1
name = "client-bearer-lifetime"
inputs = ["consumer", "peer.py"]
support = ["../client-bearer/consumer/src/support.scoop", "../client-bearer/consumer/src/cancellation.scoop", "../client-bearer/consumer/src/shared.scoop", "../../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop"]
tools = ["scoop", "scoopc", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["http", "client", "authentication", "asyncio", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/peer.py", to = "${work}/peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-bearer/consumer/src/support.scoop", to = "${work}/consumer/src/support.scoop"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-bearer/consumer/src/cancellation.scoop", to = "${work}/consumer/src/cancellation.scoop"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-bearer/consumer/src/shared.scoop", to = "${work}/consumer/src/shared.scoop"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
]

[[steps]]
name = "build"
timeout = 900
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 900
argv = ["${python}", "${work}/peer.py", "${build.result.output}"]
exit = 0
stdout = "shared Bearer failures cleanup and cancellation passed\n"
stderr = ""
