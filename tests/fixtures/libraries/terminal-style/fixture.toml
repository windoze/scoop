schema = 1
name = "terminal-style"
inputs = ["consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["terminal", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", "--lockfile", "${work}/source-lock-0.lock", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
env = {"NO_COLOR" = "", "COLORTERM" = "truecolor", "TERM" = "xterm-256color"}
exit = 0
stdout = {hex = "1b5b33383b323b31363b33323b34386d1b5b35383b353b346d1b5b316d1b5b343a326de4b8adf09f98801b5b306d1b5b35383b353b396d781b5b35396d0a"}
stderr = ""
