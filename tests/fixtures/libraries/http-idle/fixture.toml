schema = 1
name = "http-idle"
inputs = ["consumer", "peer.py", "wire.py"]
tools = ["scoop", "scoopc", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["http", "asyncio", "timeouts", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", "--lockfile", "${work}/source-lock-0.lock", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${python}", "${fixture}/peer.py", "${build.result.output}"]
exit = 0
stdout = "independent HTTP idle progress and stream isolation passed\n"
stderr = ""
