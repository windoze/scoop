schema = 1
name = "client-websocket-secure"
inputs = ["consumer", "peer.py"]
support = [
    "../client-websocket/consumer/src/session.scoop",
    "../client-websocket/peer_server.py",
    "../client-websocket/wire.py",
    "../client-idle/wire.py",
    "../client-network/peer.py",
    "../../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop",
    "../../../../sysroot/src/scoop.crypto/test-certificates/src/server.scoop",
    "../../../../sysroot/src/scoop.crypto/test-certificates/src/intermediate.scoop",
    "../../../../sysroot/src/scoop.crypto/test-certificates/src/client.scoop",
]
tools = ["scoop", "scoopc", "python"]
when = { os = ["darwin", "linux"] }
tags = ["http", "websocket", "asyncio", "lifetime", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/peer.py", to = "${work}/peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-websocket/peer_server.py", to = "${work}/peer_server.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-websocket/wire.py", to = "${work}/wire.py"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-websocket/consumer/src/session.scoop", to = "${work}/consumer/src/session.scoop"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-idle/wire.py", to = "${work}/h2_wire.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-network/peer.py", to = "${work}/network_support.py"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/server.scoop", to = "${work}/consumer/src/server.scoop"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/intermediate.scoop", to = "${work}/consumer/src/intermediate.scoop"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/client.scoop", to = "${work}/consumer/src/client.scoop"}},
]

[[steps]]
name = "build"
timeout = 900
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 1800
argv = ["${python}", "${work}/peer.py", "${build.result.output}", "${work}/consumer/src", "${work}/certificates"]
exit = 0
stdout = "client WebSocket WSS H2 coexistence ALPN identity and compression passed\n"
stderr = ""
