schema = 1
name = "terminal-colors"
inputs = ["consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["terminal", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "auto"
argv = ["${build.result.output}"]
env = {"NO_COLOR" = "", "COLORTERM" = "truecolor", "TERM" = "xterm"}
exit = 0
stdout = {hex = "1b5b33383b353b396d611b5b34383b353b346d62631b5b33396d36353533350a"}
stderr = ""

[[steps]]
name = "disabled"
argv = ["${build.result.output}"]
env = {"NO_COLOR" = "1", "COLORTERM" = "xterm-256color", "TERM" = "xterm"}
exit = 0
stdout = {hex = "611b5b34383b353b346d62633235360a"}
stderr = ""

[[steps]]
name = "empty-colorterm"
argv = ["${build.result.output}"]
env = {"NO_COLOR" = "1", "COLORTERM" = "", "TERM" = "xterm-256color"}
exit = 0
stdout = {hex = "611b5b34383b353b346d6263380a"}
stderr = ""
