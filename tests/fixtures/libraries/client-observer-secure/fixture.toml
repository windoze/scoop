schema = 1
name = "client-observer-secure"
inputs = ["consumer", "peer.py"]
support = [
    "../client-websocket-proxy/peer_server.py",
    "../client-idle/wire.py",
    "../client-observer/consumer/src/support.scoop",
    "../client-websocket/wire.py",
    "../client-trailers/wire.py",
    "../client-proxy/tls_peer.py",
    "../client-network/peer.py",
    "../../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop",
    "../../../../sysroot/src/scoop.crypto/test-certificates/src/server.scoop",
    "../../../../sysroot/src/scoop.crypto/test-certificates/src/intermediate.scoop",
]
tools = ["scoop", "scoopc", "python"]
when = { os = ["darwin", "linux"] }
tags = ["http", "websocket", "asyncio", "lifetime", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/peer.py", to = "${work}/peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-websocket-proxy/peer_server.py", to = "${work}/proxy_peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-idle/wire.py", to = "${work}/h2_wire.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-observer/consumer/src/support.scoop", to = "${work}/consumer/src/support.scoop"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-websocket/wire.py", to = "${work}/wire.py"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-trailers/wire.py", to = "${work}/http_wire.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-proxy/tls_peer.py", to = "${work}/tls_peer.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-network/peer.py", to = "${work}/network_support.py"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/server.scoop", to = "${work}/cert-source/server.scoop"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/intermediate.scoop", to = "${work}/cert-source/intermediate.scoop"}},
]

[[steps]]
name = "build"
timeout = 900
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 1800
argv = ["${python}", "${work}/peer.py", "${build.result.output}", "${work}/cert-source", "${work}/certificates"]
exit = 0
stdout = "client observer DNS TLS proxy TLS tunnel and HTTP2 reuse timing passed\n"
stderr = ""
