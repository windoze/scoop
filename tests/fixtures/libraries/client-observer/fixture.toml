schema = 1
name = "client-observer"
inputs = ["consumer", "peer.py", "peer_server.py"]
support = ["../client-websocket/wire.py", "../../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop"]
tools = ["scoop", "scoopc", "python"]
when = { os = ["darwin", "linux"] }
tags = ["http", "websocket", "asyncio", "lifetime", "prebuilt", "libraries"]
variants = [{"name" = "release", "vars" = {"mode" = ["--release"]}}]
[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/peer.py", to = "${work}/peer.py"}},
    {copy = {from = "${fixture}/peer_server.py", to = "${work}/peer_server.py"}},
    {copy = {from = "${repo}/tests/fixtures/libraries/client-websocket/wire.py", to = "${work}/websocket_wire.py"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
]

[[steps]]
name = "build"
timeout = 900
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 1800
argv = ["${python}", "${work}/peer.py", "${build.result.output}"]
exit = 0
stdout = "client observer timing progress retries cache context streams and redaction passed\n"
stderr = ""
