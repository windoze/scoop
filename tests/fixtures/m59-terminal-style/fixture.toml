schema = 1
name = "m59-terminal-style"
inputs = ["consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m59", "terminal", "prebuilt", "gc"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
env = {NO_COLOR = "", COLORTERM = "truecolor", TERM = "xterm-256color", SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = {hex = "1b5b33383b323b31363b33323b34386d1b5b35383b353b346d1b5b316d1b5b343a326de4b8adf09f98801b5b306d1b5b35383b353b396d781b5b35396d0a"}
stderr = ""

