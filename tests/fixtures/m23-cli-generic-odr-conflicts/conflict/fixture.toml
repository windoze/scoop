schema = 1
name = "generic-odr-conflicts-conflict"
inputs = ["left_provider", "../../m23-generic-odr-siblings/conflict-provider-left.scoop", "left_consumer", "../../m23-generic-odr-siblings/conflict-consumer.scoop", "left_program", "right_provider", "../../m23-generic-odr-siblings/conflict-provider-right.scoop", "right_consumer", "right_program"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generic-odr-conflicts", "cross-cone", "moving-gc", "negative"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/src/scoop.core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_left_artifacts"
files = [
  {"copy" = {"from" = "${core.result.root.path}", "to" = "${work}/left/artifacts/scoop/scoop.core/0.1.0/cone.slib"}},
]
checks = []

[[steps]]
name = "prepare_left_provider"
files = [
  {"copy" = {"from" = "${fixture}/left_provider", "to" = "${work}/sources/left_provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/conflict-provider-left.scoop", "to" = "${work}/sources/left_provider/src/main.scoop"}},
]
checks = []

[[steps]]
name = "left_provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/left_provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left_provider", "--cone-path", "${work}/left/artifacts", "--message-format", "json", "-o", "${work}/left/artifacts/dev.example/generic-odr-conflict-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_left_consumer"
files = [
  {"copy" = {"from" = "${fixture}/left_consumer", "to" = "${work}/sources/left_consumer"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/conflict-consumer.scoop", "to" = "${work}/sources/left_consumer/src/main.scoop"}},
]
checks = []

[[steps]]
name = "left_consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/left_consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left_consumer", "--cone-path", "${work}/left/artifacts", "--message-format", "json", "-o", "${work}/left/artifacts/dev.example/generic-odr-conflict-left/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_left_program"
files = [
  {"copy" = {"from" = "${fixture}/left_program", "to" = "${work}/sources/left_program"}},
]
checks = []

[[steps]]
name = "left_program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/left_program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left_program", "--cone-path", "${work}/left/artifacts", "--message-format", "json", "-o", "${work}/built-left_program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${left_program.result.dependencies.length}", "equals" = 3}]

[[steps]]
name = "left_isolate"
files = [{"copy" = {"from" = "${left_program.result.root.path}", "to" = "${work}/left/artifacts/root.slib"}}]
checks = []

[[steps]]
name = "left_run"
argv = ["${left_program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []

[[steps]]
name = "left_run_moving"
argv = ["${left_program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
checks = []

[[steps]]
name = "prepare_right_artifacts"
files = [
  {"copy" = {"from" = "${core.result.root.path}", "to" = "${work}/right/artifacts/scoop/scoop.core/0.1.0/cone.slib"}},
]
checks = []

[[steps]]
name = "prepare_right_provider"
files = [
  {"copy" = {"from" = "${fixture}/right_provider", "to" = "${work}/sources/right_provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/conflict-provider-right.scoop", "to" = "${work}/sources/right_provider/src/main.scoop"}},
]
checks = []

[[steps]]
name = "right_provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/right_provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-right_provider", "--cone-path", "${work}/right/artifacts", "--message-format", "json", "-o", "${work}/right/artifacts/dev.example/generic-odr-conflict-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${right_provider.result.root.artifact_fingerprint}", "not_equals" = "${left_provider.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "prepare_right_consumer"
files = [
  {"copy" = {"from" = "${fixture}/right_consumer", "to" = "${work}/sources/right_consumer"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/conflict-consumer.scoop", "to" = "${work}/sources/right_consumer/src/main.scoop"}},
]
checks = []

[[steps]]
name = "right_consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/right_consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-right_consumer", "--cone-path", "${work}/right/artifacts", "--message-format", "json", "-o", "${work}/right/artifacts/dev.example/generic-odr-conflict-right/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_right_program"
files = [
  {"copy" = {"from" = "${fixture}/right_program", "to" = "${work}/sources/right_program"}},
]
checks = []

[[steps]]
name = "right_program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/right_program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-right_program", "--cone-path", "${work}/right/artifacts", "--message-format", "json", "-o", "${work}/built-right_program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${right_program.result.dependencies.length}", "equals" = 3}]

[[steps]]
name = "right_isolate"
files = [{"copy" = {"from" = "${right_program.result.root.path}", "to" = "${work}/right/artifacts/root.slib"}}]
checks = []

[[steps]]
name = "right_run"
argv = ["${right_program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []

[[steps]]
name = "right_run_moving"
argv = ["${right_program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
checks = []

[[steps]]
name = "replace_left_provider"
files = [
  {"copy" = {"from" = "${right_provider.result.root.path}", "to" = "${work}/left/artifacts/dev.example/generic-odr-conflict-provider/0.1.0/cone.slib"}},
]
checks = []

[[steps]]
name = "reject_stale_provider"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/left/artifacts/root.slib", "--cone-path", "${work}/left/artifacts", "--runtime-objects", "${left_program.result.runtime_index}", "--sysroot", "${sysroot}", "--message-format", "json", "--dump-plan", "-o", "${work}/rejected-program", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "stale.diagnostics.json"}
diagnostics_normalize = ["dependency-digests"]
checks = [
  {"file" = "${work}/rejected-program", "exists" = false},
]
