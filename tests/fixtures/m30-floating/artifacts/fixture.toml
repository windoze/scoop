schema = 1
name = "m30-floating-artifacts"
inputs = ["provider", "facade", "consumer", "native.c", "../../../../sysroot/lib/scoop.json"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m30", "floating", "annotation", "reexport", "gc"]

[[steps]]
name = "prepare"
files = [
  {"mkdir" = {"path" = "${work}/standalone"}},
  {"copy" = {"from" = "${fixture}/facade", "to" = "${work}/sources/facade"}},
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
  {"copy" = {"from" = "${repo}/sysroot/lib/scoop.json", "to" = "${work}/sources/json"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--profile", "release", {each = "${link_args}"}, "${sysroot}/lib/scoop.core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "json"
argv = ["${scoop}", "build", "--profile", "release", {each = "${link_args}"}, "${work}/sources/json", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-json", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.json/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--profile", "release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.m30/floating-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "facade"
argv = ["${scoop}", "build", "--profile", "release", {each = "${link_args}"}, "${work}/sources/facade", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-facade", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.m30/floating-facade/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prepare_native"
files = [{"mkdir" = {"path" = "${work}/native/objects"}}, {"mkdir" = {"path" = "${work}/native/lib"}}]

[[steps]]
name = "compile_native_0"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-fno-omit-frame-pointer", "-I", "${runtime}/include", "-c", "${fixture}/native.c", "-o", "${work}/native/objects/fixture_native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native_0"
argv = ["${ar}", "rcs", "${work}/native/lib/libfixture_native.a", "${work}/native/objects/fixture_native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--profile", "release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--runtime-root", "${runtime}", "--library-path", "${work}/native/lib", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${consumer.result.root.path}", "to" = "${work}/standalone/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/standalone/root.slib", "--library-path", "${work}/native/lib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${consumer.result.runtime_index}", "--sysroot", "${sysroot}", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${link.result.link_plan_fingerprint}", equals = "${consumer.result.link_plan_fingerprint}"}]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "floating-artifacts-ok\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${work}/program"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "floating-artifacts-ok\n"
stderr = ""
