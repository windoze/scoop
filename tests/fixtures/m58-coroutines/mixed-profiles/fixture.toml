schema = 1
name = "m58-coroutine-mixed-profiles"
inputs = ["provider", "middle", "program"]
tools = ["scoop", "scoopc", "scoop-link"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m58", "coroutine", "artifact", "gc"]
variants = [
  {name = "debug", vars = {profile = "debug", replacement = "release"}},
  {name = "release", vars = {profile = "release", replacement = "debug"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/provider", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/artifacts/dev.m58.profiles/provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "middle"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/middle", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cone-path", "${work}/artifacts", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/artifacts/dev.m58.profiles/middle/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "change_profile"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/provider", "--profile", "${replacement}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/artifacts/dev.m58.profiles/provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cone-path", "${work}/artifacts", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "mixed profiles preserve boxed and suspended calls\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "mixed profiles preserve boxed and suspended calls\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "mixed profiles preserve boxed and suspended calls\n"
stderr = ""
