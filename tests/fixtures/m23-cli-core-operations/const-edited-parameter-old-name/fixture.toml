schema = 1
name = "core-operations-const-edited-parameter-old-name"
inputs = ["../../m23-imported-core-const/edited-parameter-old-name.scoop", "consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["core-intrinsics", "const", "negative"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
  {"replace" = {"path" = "${work}/core-source/src/types.scoop", "old" = "public infix fun shl(count: Long): Int\n", "new" = "public infix fun shl(distance: Long): Int\n"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${core.result.root.artifact_fingerprint}", "equals" = "35b59fc238467adb204afdcd3f5ab8943ecc0667466e59aa78fddda432d70488"},
]

[[steps]]
name = "prepare_consumer"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-core-const/edited-parameter-old-name.scoop", "to" = "${work}/sources/consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "${work}/sources/consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib", "exists" = false},
]
