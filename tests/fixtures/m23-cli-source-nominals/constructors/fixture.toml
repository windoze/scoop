schema = 1
name = "source-nominals-constructors"
inputs = ["provider", "runtime", "../../m23-type-source-nominals/constructors.scoop", "factory"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["source-nominals", "moving-gc"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/lib/scoop.core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-type-source-nominals/constructors.scoop", "to" = "${work}/sources/provider/src/main.scoop"}},
]
checks = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_exposed"
files = [
  {"copy" = {"from" = "${fixture}/factory/factory.scoop", "to" = "${work}/sources/provider/src/factory.scoop"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "public open class Envelope protected constructor(count: Int = 1) {", "new" = "public open class Envelope protected constructor(count: Int = 1) {\n    public val observed: Int = count\n    public companion object {\n        public fun privateEnvelope(): Envelope = Envelope(true)\n    }\n    public fun boxes(): Int = Box<Int>.Companion.defaulted(1).observed + Box(2).observed + Box(3, true).observed\n    public fun pairs(): Int {\n        @Unsafe { return Pair(1, count = 1).count + Pair(2, true).count + Pair<Int>.Companion.privatePair(3).count }\n    }\n    public fun singleton(): Boolean = Singleton === Singleton"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "    protected class Box<T> private constructor(private val stored: T, count: Int = 1) {", "new" = "    protected class Box<T> private constructor(private val stored: T, count: Int = 1) {\n        public val observed: Int = count\n        public companion object {\n            public fun defaulted(value: T): Box<T> = Box(stored = value)\n        }"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "    protected struct Pair<T>(val value: T, val count: Int = 1) {", "new" = "    protected struct Pair<T>(val value: T, val count: Int = 1) {\n        public companion object {\n            @Unsafe public fun privatePair(value: T): Pair<T> = Pair(value)\n        }"}},
]
checks = []

[[steps]]
name = "exposed"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [
  {"copy" = {"from" = "${fixture}/runtime", "to" = "${work}/sources/program"}},
  {"copy" = {"from" = "${fixture}/runtime/main.scoop", "to" = "${work}/sources/program/src/main.scoop"}},
]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
checks = []
