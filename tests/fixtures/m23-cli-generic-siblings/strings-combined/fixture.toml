schema = 1
name = "generic-siblings-strings-combined"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "generic-odr-provider", "../../m23-generic-odr-siblings/provider.scoop", "generic-odr-strings-combined-left", "../../m23-generic-odr-siblings/strings-combined-left.scoop", "generic-odr-strings-combined-right", "../../m23-generic-odr-siblings/strings-combined-right.scoop", "generic-odr-strings-combined-consumer", "../../m23-generic-odr-siblings/strings-combined-consumer.scoop", "runtime-fixture", "../../m23-cli-imported-classes/support/gc.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generic-siblings", "strings", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_generic-odr-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-provider", "to" = "${work}/sources/generic-odr-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/provider.scoop", "to" = "${work}/sources/generic-odr-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/generic-odr-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-odr-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/ast.txt", "snapshot" = "provider.ast.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/hir.txt", "snapshot" = "provider.hir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/mir.txt", "snapshot" = "provider.mir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/lir.txt", "snapshot" = "provider.lir.txt"},
]

[[steps]]
name = "remove_provider_source"
files = [
  {"remove" = {"path" = "${work}/sources/generic-odr-provider"}},
]

[[steps]]
name = "prepare_generic-odr-strings-combined-left"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-strings-combined-left", "to" = "${work}/sources/generic-odr-strings-combined-left"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/strings-combined-left.scoop", "to" = "${work}/sources/generic-odr-strings-combined-left/src/main.scoop"}},
]

[[steps]]
name = "left"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/generic-odr-strings-combined-left", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-odr-strings-combined-left/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/left"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${left.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/left/${left.result.root.identity}/ast.txt", "snapshot" = "left.ast.txt"},
  {"file" = "${work}/dump/left/${left.result.root.identity}/hir.txt", "snapshot" = "left.hir.txt"},
  {"file" = "${work}/dump/left/${left.result.root.identity}/mir.txt", "snapshot" = "left.mir.txt"},
  {"file" = "${work}/dump/left/${left.result.root.identity}/lir.txt", "snapshot" = "left.lir.txt"},
]

[[steps]]
name = "remove_left_source"
files = [
  {"remove" = {"path" = "${work}/sources/generic-odr-strings-combined-left"}},
]

[[steps]]
name = "prepare_generic-odr-strings-combined-right"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-strings-combined-right", "to" = "${work}/sources/generic-odr-strings-combined-right"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/strings-combined-right.scoop", "to" = "${work}/sources/generic-odr-strings-combined-right/src/main.scoop"}},
]

[[steps]]
name = "right"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/generic-odr-strings-combined-right", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-right", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-odr-strings-combined-right/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/right"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${right.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/right/${right.result.root.identity}/ast.txt", "snapshot" = "right.ast.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/hir.txt", "snapshot" = "right.hir.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/mir.txt", "snapshot" = "right.mir.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/lir.txt", "snapshot" = "right.lir.txt"},
]

[[steps]]
name = "remove_right_source"
files = [
  {"remove" = {"path" = "${work}/sources/generic-odr-strings-combined-right"}},
]

[[steps]]
name = "prepare_generic-odr-strings-combined-consumer"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-strings-combined-consumer", "to" = "${work}/sources/generic-odr-strings-combined-consumer"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-odr-siblings/strings-combined-consumer.scoop", "to" = "${work}/sources/generic-odr-strings-combined-consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/generic-odr-strings-combined-consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-odr-strings-combined-consumer/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/consumer"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${consumer.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/ast.txt", "snapshot" = "consumer.ast.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/hir.txt", "snapshot" = "consumer.hir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/mir.txt", "snapshot" = "consumer.mir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/lir.txt", "snapshot" = "consumer.lir.txt"},
]

[[steps]]
name = "remove_consumer_source"
files = [
  {"remove" = {"path" = "${work}/sources/generic-odr-strings-combined-consumer"}},
]

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
]

[[steps]]
name = "prepare_gc"
files = [
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_gc_source"
files = [
  {"remove" = {"path" = "${work}/native/gc.c"}},
  {"remove" = {"path" = "${work}/native/gc.o"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--emit", "all", "--dump-dir", "${work}/dump/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${program.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/program/${program.result.root.identity}/ast.txt", "snapshot" = "program.ast.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/hir.txt", "snapshot" = "program.hir.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/mir.txt", "snapshot" = "program.mir.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/lir.txt", "snapshot" = "program.lir.${target}.txt"},
]

[[steps]]
name = "isolate"
files = [
  {"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/root.slib"}},
  {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}},
  {"remove" = {"path" = "${work}/sources"}},
]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${work}/root.slib", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--dependency-slib", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-provider/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-strings-combined-left/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-strings-combined-right/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-strings-combined-consumer/0.1.0/cone.slib", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 5},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {"actual" = "${link.result.link_plan}", "snapshot" = "link.plan.${target}.txt", "normalize" = ["paths", "native-digests"]},
]
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}

[[steps]]
name = "reverse_link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${work}/root.slib", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--message-format", "json", "--dump-plan", "-o", "${work}/reverse-program", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-strings-combined-consumer/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-strings-combined-right/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-strings-combined-left/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-provider/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${reverse_link.result.dependencies.length}", "equals" = 5},
  {"actual" = "${reverse_link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {"actual" = "${reverse_link.result.link_plan}", "snapshot" = "link.plan.${target}.txt", "normalize" = ["paths", "native-digests"]},
]
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = ""
stderr = ""
env = {}

[[steps]]
name = "run_moving"
argv = ["${work}/program"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "reverse_run"
argv = ["${work}/reverse-program"]
exit = 0
stdout = ""
stderr = ""
env = {}

[[steps]]
name = "reverse_run_moving"
argv = ["${work}/reverse-program"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "symbols"
argv = ["/usr/bin/nm", "-j", "--defined-only", "--extern-only", "${work}/program"]
exit = 0
stdout = {snapshot = "symbols.${target}.txt"}
stderr = ""

[[steps]]
name = "strong_symbols"
argv = ["/usr/bin/nm", "-j", "--defined-only", "--extern-only", "--no-weak", "${work}/program"]
exit = 0
stdout = {snapshot = "strong_symbols.${target}.txt"}
stderr = ""
