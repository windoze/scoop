exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${right.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/right/${right.result.root.identity}/ast.txt", "snapshot" = "right.ast.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/hir.txt", "snapshot" = "right.hir.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/mir.txt", "snapshot" = "right.mir.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/lir.txt", "snapshot" = "right.lir.txt"},
]

[[steps]]
name = "remove_right_source"
files = [
  {"remove" = {"path" = "${work}/sources/generic-odr-adapters-right"}},
]

[[steps]]
name = "prepare_generic-odr-adapters-consumer"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-adapters-consumer", "to" = "${work}/sources/generic-odr-adapters-consumer"}},
  {"copy" = {"from" = "${fixture}/../../m23-odr-member-unions/adapters-consumer.scoop", "to" = "${work}/sources/generic-odr-adapters-consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "${work}/sources/generic-odr-adapters-consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-odr-adapters-consumer/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/consumer"]
exit = 0
stdout = ""
