[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../../m23-odr-member-unions/addresses.c", "to" = "${work}/native/addresses.c"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_LEFT_TD", "new" = "_scoop$1$td$36dcd3dbc334218f9b25c996c755ca8b42cec9ca5ccd2b312e3d5703f7f5763e"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_RIGHT_TD", "new" = "_scoop$1$td$36dcd3dbc334218f9b25c996c755ca8b42cec9ca5ccd2b312e3d5703f7f5763e"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_OTHER_TD", "new" = "_scoop$1$td$599e53dc26b5f79de59241629aa64ad86dcaa30453d9f7732c86478aa52ecee3"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_INTERFACE_TD", "new" = "_scoop$1$td$1d717c086d4b0d78b659c74b11c8297163070209063f7a06d87ad08ab08192bb"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "left_slots[UNION_READ_SLOT] != NULL", "new" = "left_slots[0] != NULL"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "left_slots[UNION_READ_SLOT] == right_slots[UNION_READ_SLOT]", "new" = "left_slots[0] == right_slots[0]"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "#include \"scoop_rt.h\"", "new" = "#include \"scoop_rt.h\"\n#include <stdio.h>\n#include <stdlib.h>"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "#define SCOOP_FIXTURE_METADATA_CHECK() union_metadata_check()", "new" = "static void check_after_shutdown(void) {\n    if (!union_metadata_check()) {\n        fputs(\"shared type or interface slot address differs\\n\", stderr);\n        abort();\n    }\n}\n\nvoid m23_register_union_check(void) {\n    if (atexit(check_after_shutdown) != 0) { abort(); }\n}"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-I", "${runtime}/src", "-c", "${work}/native/addresses.c", "-o", "${work}/native/addresses.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_union.a", "${work}/native/addresses.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_native_source"
files = [
  {"remove" = {"path" = "${work}/native/addresses.c"}},
  {"remove" = {"path" = "${work}/native/addresses.o"}},
]

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
]

[[steps]]
name = "prepare_gc"
files = [
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
