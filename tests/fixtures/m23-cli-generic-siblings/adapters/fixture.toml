schema = 1
name = "generic-siblings-adapters"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "generic-odr-provider", "../../m23-odr-member-unions/provider.scoop", "generic-odr-adapters-left", "../../m23-odr-member-unions/adapters-left.scoop", "generic-odr-adapters-right", "../../m23-odr-member-unions/adapters-right.scoop", "generic-odr-adapters-consumer", "../../m23-odr-member-unions/adapters-consumer.scoop", "../../m23-odr-member-unions/addresses.c", "runtime-fixture", "../../m23-cli-imported-classes/support/gc.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin"]
tags = ["generic-siblings", "adapters", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_generic-odr-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-provider", "to" = "${work}/sources/generic-odr-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-odr-member-unions/provider.scoop", "to" = "${work}/sources/generic-odr-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "${work}/sources/generic-odr-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-odr-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/ast.txt", "snapshot" = "provider.ast.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/hir.txt", "snapshot" = "provider.hir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/mir.txt", "snapshot" = "provider.mir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/lir.txt", "snapshot" = "provider.lir.txt"},
]

[[steps]]
name = "remove_provider_source"
files = [
  {"remove" = {"path" = "${work}/sources/generic-odr-provider"}},
]

[[steps]]
name = "prepare_generic-odr-adapters-left"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-adapters-left", "to" = "${work}/sources/generic-odr-adapters-left"}},
  {"copy" = {"from" = "${fixture}/../../m23-odr-member-unions/adapters-left.scoop", "to" = "${work}/sources/generic-odr-adapters-left/src/main.scoop"}},
]

[[steps]]
name = "left"
argv = ["${scoop}", "build", "${work}/sources/generic-odr-adapters-left", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-odr-adapters-left/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/left"]
