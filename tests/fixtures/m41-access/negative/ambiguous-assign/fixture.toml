[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/program.scoop", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
