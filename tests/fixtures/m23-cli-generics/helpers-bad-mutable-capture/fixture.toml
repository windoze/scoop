schema = 1
name = "generic-helpers-bad-mutable-capture"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "generic-helper-provider", "../../m23-generic-helper-consumption/provider.scoop", "bad-mutable-capture", "../../m23-generic-helper-consumption/bad-mutable-capture.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["generics", "helpers", "negative"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_generic-helper-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-helper-provider", "to" = "${work}/sources/generic-helper-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-helper-consumption/provider.scoop", "to" = "${work}/sources/generic-helper-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "${work}/sources/generic-helper-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-helper-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_provider_source"
files = [
  {"remove" = {"path" = "${work}/sources/generic-helper-provider"}},
]

[[steps]]
name = "prepare_bad-mutable-capture"
files = [
  {"copy" = {"from" = "${fixture}/bad-mutable-capture", "to" = "${work}/sources/bad-mutable-capture"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-helper-consumption/bad-mutable-capture.scoop", "to" = "${work}/sources/bad-mutable-capture/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "${work}/sources/bad-mutable-capture", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/bad-mutable-capture/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/bad-mutable-capture/0.1.0/cone.slib", "exists" = false},
]
