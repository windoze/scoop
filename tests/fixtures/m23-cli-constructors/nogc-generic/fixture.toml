schema = 1
name = "constructor-nogc-generic"
root = "../../m19-constructor-nogc/generic.scoop"
inputs = ["../../m19-constructor-nogc/generic.scoop", "provider", "consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["constructors", "constructor-nogc", "source-and-artifact"]

[[steps]]
name = "single"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-single", "--message-format", "json", "-o", "${work}/single", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "single_run"
argv = ["${work}/single"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "single_moving"
argv = ["${work}/single"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${single.result.dependencies.0.path}", "to" = "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"}},
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${root}", "to" = "${work}/sources/provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/constructor-nogc-generic/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${provider.result.dependencies.length}", "equals" = 1},
]

[[steps]]
name = "publish_core"
files = [
  {"remove" = {"path" = "${work}/sources/provider"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "prepare_consumer"
files = [
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "isolate"
files = [
  {"copy" = {"from" = "${consumer.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}},
  {"remove" = {"path" = "${work}/sources"}},
]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${consumer.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--message-format", "json", "--dump-plan", "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${consumer.result.link_plan_fingerprint}"},
  {"actual" = "${link.result.dependencies.length}", "equals" = 2},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:constructor-nogc-generic:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:constructor-nogc-generic-consumer:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=3 root=${symbol_prefix}scoop$$1$$re$$f09bc2872d9f3ea3476baee0503b478b08653b85aab4f04fe2549bb26771d34a"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${work}/program"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
