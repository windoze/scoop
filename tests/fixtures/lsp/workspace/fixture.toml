schema = 1
name = "lsp-workspace-precompiled-inputs"
inputs = ["project", "peer.py", "diagnostics.py", "cancellation.py", "signatures.py", "incomplete_signatures.py", "source_dependencies.py", "callable_values.py", "property_references.py", "constructor_references.py", "constructor_hovers.py", "constructor_names.py", "construction_bodies.py", "operator_references.py", "subscript_references.py", "accessor_bodies.py", "runtime_initializers.py", "static_constants.py", "static_calls.py", "static_variants.py", "defaults.py", "references.py", "import_references.py", "reexport_references.py", "rename.py", "rename_versions.py", "rename_exports.py", "rename_bodies.py", "rename_support.py", "rename_types.py", "rename_members.py", "documentation.py", "type_references.py", "type_definitions.py", "type_hovers.py", "type_implementations.py", "member_implementations.py", "recovered_classes.py", "recovered_structs.py", "recovered_interfaces.py", "recovered_enums.py", "recovered_objects.py", "qualified_signatures.py", "while_recovery.py", "for_recovery.py", "do_while_recovery.py", "when_recovery.py", "exception_recovery.py", "callable_literals.py", "callable_arguments.py", "local_function_recovery.py", "file_headers.py"]
tools = ["scoop-lsp", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["lsp", "workspace", "artifacts"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/project", to = "${work}/project"}},
  {replace = {path = "${work}/project/Cone.toml", old = "STD_ARTIFACT", new = "${sysroot}/lib/${target}/scoop.std.slib"}},
]

[[steps]]
name = "session"
argv = ["${python}", "${fixture}/peer.py", "${scoop-lsp}", "${work}/project", "${sysroot}", "${target}"]
exit = 0
stdout = "workspace inputs passed\n"
stderr = ""
checks = [
  {file = "${work}/project/target", exists = false},
]
