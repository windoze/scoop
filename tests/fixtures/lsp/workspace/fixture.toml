schema = 1
name = "lsp-workspace-precompiled-inputs"
inputs = ["project", "peer.py", "diagnostics.py", "cancellation.py", "signatures.py", "incomplete_signatures.py"]
tools = ["scoop-lsp", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["lsp", "workspace", "artifacts"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/project", to = "${work}/project"}},
  {replace = {path = "${work}/project/Cone.toml", old = "STD_ARTIFACT", new = "${sysroot}/lib/${target}/scoop.std.slib"}},
]

[[steps]]
name = "session"
argv = ["${python}", "${fixture}/peer.py", "${scoop-lsp}", "${work}/project", "${sysroot}", "${target}"]
exit = 0
stdout = "workspace inputs passed\n"
stderr = ""
checks = [
  {file = "${work}/project/target", exists = false},
]
