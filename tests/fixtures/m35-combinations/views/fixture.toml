schema = 1
name = "m35-combinations-views"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m35", "when", "gc"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "7\n70\n5\n44\n5\n37\n140\n7\n7\n4\n24\n5\n17\n10\n25\n26\n7\n7\n7\n7\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "7\n70\n5\n44\n5\n37\n140\n7\n7\n4\n24\n5\n17\n10\n25\n26\n7\n7\n7\n7\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "7\n70\n5\n44\n5\n37\n140\n7\n7\n4\n24\n5\n17\n10\n25\n26\n7\n7\n7\n7\n"
stderr = ""
