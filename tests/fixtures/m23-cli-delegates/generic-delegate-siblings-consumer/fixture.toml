schema = 1
name = "generic-delegate-siblings-consumer"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "delegate-siblings-provider", "../../m23-generic-delegate-siblings/provider.scoop", "delegate-siblings-left", "../../m23-generic-delegate-siblings/left.scoop", "delegate-siblings-right", "../../m23-generic-delegate-siblings/right.scoop", "delegate-siblings-consumer", "../../m23-generic-delegate-siblings/consumer.scoop", "runtime-fixture", "../../m23-cli-imported-classes/support/gc.c", "../support/siblings.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generics", "generic_delegate_siblings_share_initialization_and_failure_with_moving_gc", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_delegate-siblings-provider"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-provider", "to" = "${work}/sources/delegate-siblings-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/provider.scoop", "to" = "${work}/sources/delegate-siblings-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/delegate-siblings-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/ast.txt", "snapshot" = "provider.ast.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/hir.txt", "snapshot" = "provider.hir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/mir.txt", "snapshot" = "provider.mir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/lir.txt", "snapshot" = "provider.lir.txt"},
]

[[steps]]
name = "remove_provider_source"
files = [
  {"remove" = {"path" = "${work}/sources/delegate-siblings-provider"}},
]

[[steps]]
name = "prepare_delegate-siblings-left"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-left", "to" = "${work}/sources/delegate-siblings-left"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/left.scoop", "to" = "${work}/sources/delegate-siblings-left/src/main.scoop"}},
]

[[steps]]
name = "left"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/delegate-siblings-left", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-left/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/left"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${left.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/left/${left.result.root.identity}/ast.txt", "snapshot" = "left.ast.txt"},
  {"file" = "${work}/dump/left/${left.result.root.identity}/hir.txt", "snapshot" = "left.hir.txt"},
  {"file" = "${work}/dump/left/${left.result.root.identity}/mir.txt", "snapshot" = "left.mir.txt"},
  {"file" = "${work}/dump/left/${left.result.root.identity}/lir.txt", "snapshot" = "left.lir.txt"},
]

[[steps]]
name = "remove_left_source"
files = [
  {"remove" = {"path" = "${work}/sources/delegate-siblings-left"}},
]

[[steps]]
name = "prepare_delegate-siblings-right"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-right", "to" = "${work}/sources/delegate-siblings-right"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/right.scoop", "to" = "${work}/sources/delegate-siblings-right/src/main.scoop"}},
]

[[steps]]
name = "right"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/delegate-siblings-right", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-right", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-right/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/right"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${right.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/right/${right.result.root.identity}/ast.txt", "snapshot" = "right.ast.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/hir.txt", "snapshot" = "right.hir.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/mir.txt", "snapshot" = "right.mir.txt"},
  {"file" = "${work}/dump/right/${right.result.root.identity}/lir.txt", "snapshot" = "right.lir.txt"},
]

[[steps]]
name = "remove_right_source"
files = [
  {"remove" = {"path" = "${work}/sources/delegate-siblings-right"}},
]

[[steps]]
name = "prepare_delegate-siblings-consumer"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-consumer", "to" = "${work}/sources/delegate-siblings-consumer"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/consumer.scoop", "to" = "${work}/sources/delegate-siblings-consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/delegate-siblings-consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-consumer/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/consumer"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${consumer.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/ast.txt", "snapshot" = "consumer.ast.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/hir.txt", "snapshot" = "consumer.hir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/mir.txt", "snapshot" = "consumer.mir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/lir.txt", "snapshot" = "consumer.lir.txt"},
]

[[steps]]
name = "remove_consumer_source"
files = [
  {"remove" = {"path" = "${work}/sources/delegate-siblings-consumer"}},
]

[[steps]]
name = "prepare_siblings_metadata"
files = [
  {"copy" = {"from" = "${fixture}/../support/siblings.c", "to" = "${work}/native/siblings.c"}},
  {"replace" = {"path" = "${work}/native/siblings.c", "old" = "LEFT_IMAGE", "new" = "${symbol_prefix}scoop$1$im$$${left.result.root.identity}"}},
  {"replace" = {"path" = "${work}/native/siblings.c", "old" = "RIGHT_IMAGE", "new" = "${symbol_prefix}scoop$1$im$$${right.result.root.identity}"}},
]

[[steps]]
name = "compile_siblings_metadata"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/siblings.c", "-o", "${work}/native/siblings.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_siblings_metadata"
argv = ["${ar}", "qcS", "${work}/native/libm23_delegate_siblings.a", "${work}/native/siblings.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_siblings_metadata"
files = [
  {"remove" = {"path" = "${work}/native/siblings.c"}},
  {"remove" = {"path" = "${work}/native/siblings.o"}},
]

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_native_source"
files = [
  {"remove" = {"path" = "${work}/native/gc.c"}},
  {"remove" = {"path" = "${work}/native/gc.o"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "isolate"
files = [
  {"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}},
  {"remove" = {"path" = "${work}/sources"}},
]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {"actual" = "${link.result.dependencies.length}", "equals" = 5},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:delegate-siblings-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:delegate-siblings-left:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:delegate-siblings-right:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:delegate-siblings-consumer:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:runtime-fixture:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=6 root=${symbol_prefix}scoop$$1$$re$$697a194f371e65fbbfe0f2ae0a577df915ae0fdee6758d312df7b2c864602bc7"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${work}/program"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "symbols"
argv = ["/usr/bin/nm", "-j", "--defined-only", "--extern-only", "${work}/program"]
exit = 0
stdout = {snapshot = "symbols.${target}.txt"}
stderr = ""

[[steps]]
name = "strong_symbols"
argv = ["/usr/bin/nm", "-j", "--defined-only", "--extern-only", "--no-weak", "${work}/program"]
exit = 0
stdout = {snapshot = "strong_symbols.${target}.txt"}
stderr = ""
