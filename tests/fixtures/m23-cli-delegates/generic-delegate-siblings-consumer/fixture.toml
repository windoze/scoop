schema = 1
name = "generic-delegate-siblings-consumer"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "delegate-siblings-provider", "../../m23-generic-delegate-siblings/provider.scoop", "delegate-siblings-left", "../../m23-generic-delegate-siblings/left.scoop", "delegate-siblings-right", "../../m23-generic-delegate-siblings/right.scoop", "delegate-siblings-consumer", "../../m23-generic-delegate-siblings/consumer.scoop", "runtime-fixture", "../../m23-cli-imported-classes/support/gc.c", "../support/siblings.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generics", "generic_delegate_siblings_share_initialization_and_failure_with_moving_gc"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_delegate-siblings-provider"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-provider", "to" = "${work}/sources/delegate-siblings-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/provider.scoop", "to" = "${work}/sources/delegate-siblings-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/delegate-siblings-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_delegate-siblings-left"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-left", "to" = "${work}/sources/delegate-siblings-left"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/left.scoop", "to" = "${work}/sources/delegate-siblings-left/src/main.scoop"}},
]

[[steps]]
name = "left"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/delegate-siblings-left", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-left/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_delegate-siblings-right"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-right", "to" = "${work}/sources/delegate-siblings-right"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/right.scoop", "to" = "${work}/sources/delegate-siblings-right/src/main.scoop"}},
]

[[steps]]
name = "right"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/delegate-siblings-right", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-right", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-right/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_delegate-siblings-consumer"
files = [
  {"copy" = {"from" = "${fixture}/delegate-siblings-consumer", "to" = "${work}/sources/delegate-siblings-consumer"}},
  {"copy" = {"from" = "${fixture}/../../m23-generic-delegate-siblings/consumer.scoop", "to" = "${work}/sources/delegate-siblings-consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/delegate-siblings-consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-siblings-consumer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_siblings_metadata"
files = [
  {"copy" = {"from" = "${fixture}/../support/siblings.c", "to" = "${work}/native/siblings.c"}},
  {"replace" = {"path" = "${work}/native/siblings.c", "old" = "LEFT_IMAGE", "new" = "${symbol_prefix}scoop$1$im$$${left.result.root.identity}"}},
  {"replace" = {"path" = "${work}/native/siblings.c", "old" = "RIGHT_IMAGE", "new" = "${symbol_prefix}scoop$1$im$$${right.result.root.identity}"}},
]

[[steps]]
name = "compile_siblings_metadata"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/siblings.c", "-o", "${work}/native/siblings.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_siblings_metadata"
argv = ["${ar}", "qcS", "${work}/native/libm23_delegate_siblings.a", "${work}/native/siblings.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${program.result.dependencies.length}", equals = 5},
]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
