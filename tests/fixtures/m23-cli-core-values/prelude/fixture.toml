schema = 1
name = "core-values-prelude"
inputs = ["core.scoop", "main.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["core-values", "modified-core", "moving-gc"]

[[steps]]
name = "runtime_vendor"
files = [{symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}}]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"symlink" = {"from" = "${work}/core-source", "to" = "${work}/sysroot/src/scoop.core"}},
  {"copy" = {"from" = "${fixture}/core.scoop", "to" = "${work}/core-source/src/prelude_values.scoop"}},
]
checks = []

[[steps]]
name = "core"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [{"copy" = {"from" = "${fixture}/main.scoop", "to" = "${work}/sources/program.scoop"}}]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 1}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
checks = []
