schema = 1
name = "cli-build-warm-observation-link"
root = "hello.scoop"
inputs = ["hello.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "cache"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--emit", "all", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.kind}", "equals" = "executable"},
  {"actual" = "${build.result.profile}", "equals" = "debug"},
  {"actual" = "${build.result.output}", "equals" = "${work}/target/${target}/debug/hello"},
  {"actual" = "${build.result.observations.child_invocations.length}", "equals" = 2},
  {"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "exists" = true},
  {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "exists" = true},
  {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "exists" = true},
  {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "exists" = true},
]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--release", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm.result.observations.child_invocations.length}", equals = 2},
  {actual = "${warm.result.root.artifact_fingerprint}", not_equals = "${build.result.root.artifact_fingerprint}"},
  {actual = "${warm.result.output}", equals = "${work}/target/${target}/release/hello"},
  {file = "${warm.result.root.path}", different_from = "${build.result.root.path}"},
]

[[steps]]
name = "observed"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--emit", "all", "--dump-dir", "${work}/observed", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${observed.result.observations.child_invocations}", equals = []},
  {actual = "${observed.result.root.artifact_fingerprint}", equals = "${build.result.root.artifact_fingerprint}"},
  {file = "${work}/observed/${build.result.root.identity}/hir.txt", same_as = "${work}/dump/${build.result.root.identity}/hir.txt"},
]

[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json", "--", "-o", "", "two words"]
exit = 0
stdout = "hello from public CLI\n"
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${run.result.observations.child_invocations}", equals = []}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${build.result.root.path}", {"each" = "${build.result.dependencies}", "field" = "path", "prefix" = "--dependency-slib"}, "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "-o", "${work}/relinked", "--dump-plan", "--message-format", "json", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${link.result.kind}", equals = "link"},
  {actual = "${link.result.link_plan_fingerprint}", equals = "${build.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
]

[[steps]]
name = "relinked"
argv = ["${link.result.output}"]
exit = 0
stdout = "hello from public CLI\n"
stderr = ""
