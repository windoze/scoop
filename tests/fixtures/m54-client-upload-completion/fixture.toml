schema = 1
name = "m54-client-upload-completion"
inputs = ["consumer"]
support = ["../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m54", "http", "client", "upload", "asyncio", "prebuilt", "gc"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${build.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "redirect-success"
argv = ["${build.result.output}", "redirect", "success"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
timeout = 180
exit = 0
stdout = "upload completion redirect success\n"
stderr = ""

[[steps]]
name = "redirect-failure"
argv = ["${build.result.output}", "redirect", "failure"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
timeout = 180
exit = 0
stdout = "upload completion redirect failure\n"
stderr = ""

[[steps]]
name = "retry-success"
argv = ["${build.result.output}", "retry", "success"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
timeout = 180
exit = 0
stdout = "upload completion retry success\n"
stderr = ""

[[steps]]
name = "retry-failure"
argv = ["${build.result.output}", "retry", "failure"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
timeout = 180
exit = 0
stdout = "upload completion retry failure\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]
