schema = 1
name = "m26-characters-shadow"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["m26", "characters", "gc"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []


[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "42\n"
stderr = ""
