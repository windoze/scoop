schema = 1
[cone]
group = "dev.m43"
name = "source-selection"
version = "0.1.0"
kind = "library"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"

[[test.sources]]
path = "checks/common"
[[test.sources]]
path = "checks/darwin"
when = {os = "darwin"}
[[test.sources]]
path = "checks/gnu"
when = {env = "gnu"}
[[test.sources]]
path = "checks/musl"
when = {env = "musl"}
[[test.sources]]
path = "missing"
when = {os = []}
