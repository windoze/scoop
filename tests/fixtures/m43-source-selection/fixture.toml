schema = 1
name = "m43-source-selection"
inputs = ["program", "empty.toml"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m43", "test-sources", "source-role"]
variants = [
    {name = "debug", vars = {profile = "debug"}},
    {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/program", to = "${work}/program"}}]

[[steps]]
name = "list"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/program", "--list", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
    {actual = "${list.test_result.counts.containers}", equals = 1},
    {actual = "${list.test_result.counts.cases}", equals = 1},
    {actual = "${list.test_result.containers.0.location.path}", equals = "checks/common/cases.scoop"},
]

[[steps]]
name = "run"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/program", "--nocapture", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "${target}\n"
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
    {actual = "${run.test_result.status}", equals = "passed"},
    {actual = "${run.test_result.complete}", equals = true},
    {actual = "${run.test_result.counts.passed}", equals = 1},
    {actual = "${run.result.root.artifact_fingerprint}", equals = "${list.result.root.artifact_fingerprint}"},
    {actual = "${run.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "disable-tests"
files = [{copy = {from = "${fixture}/empty.toml", to = "${work}/program/Cone.toml"}}]

[[steps]]
name = "empty"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/outputs", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
    {actual = "${empty.test_result.status}", equals = "passed"},
    {actual = "${empty.test_result.complete}", equals = true},
    {actual = "${empty.test_result.counts.cases}", equals = 0},
    {actual = "${empty.test_result.empty_reason}", equals = "no tests"},
]
