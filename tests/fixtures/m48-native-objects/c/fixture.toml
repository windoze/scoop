schema = 1
name = "m48-native-objects-c"
inputs = ["library", "consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m48", "native", "cache"]
[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--runtime-root", "${runtime}", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/library", to = "${work}/library"}}, {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}}]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "${work}/library", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${cold.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/library", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations.length}", equals = 0}]

[[steps]]
name = "edit_scoop"
files = [{replace = {path = "${work}/library/src/library.scoop", old = "answer() + 1", new = "answer() + 2"}}]

[[steps]]
name = "scoop_changed"
argv = ["${scoop}", "build", "${work}/library", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${scoop_changed.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${link_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_scoop_changed"
argv = ["${consumer.result.output}"]
exit = 43
stdout = ""
stderr = ""

[[steps]]
name = "edit_header"
files = [{replace = {path = "${work}/library/second/nested/value.h", old = "VALUE 41", new = "VALUE 42"}}]

[[steps]]
name = "header_changed"
argv = ["${scoop}", "build", "${work}/library", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${header_changed.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "consumer_updated"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${link_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_header_changed"
argv = ["${consumer_updated.result.output}"]
exit = 44
stdout = ""
stderr = ""

[[steps]]
name = "prefer_new_header"
files = [{write = {path = "${work}/library/first/nested/value.h", data = "#define VALUE 100\n"}}]

[[steps]]
name = "new_header"
argv = ["${scoop}", "build", "${work}/library", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${new_header.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "new_header_warm"
argv = ["${scoop}", "build", "${work}/library", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${new_header_warm.result.observations.child_invocations.length}", equals = 0}]

[[steps]]
name = "consumer_final"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${link_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_new_header"
argv = ["${consumer_final.result.output}"]
exit = 102
stdout = ""
stderr = ""
