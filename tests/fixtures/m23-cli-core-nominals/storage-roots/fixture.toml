schema = 1
name = "core-nominals-storage-roots"
inputs = ["program.scoop", "../../m23-type-source-nominals/storage-roots.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["core-nominals", "modified-core", "single-file", "moving-gc"]

[[steps]]
name = "runtime_vendor"
files = [{symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}}]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"symlink" = {"from" = "${work}/core-source", "to" = "${work}/sysroot/src/scoop.core"}},
  {"copy" = {"from" = "${fixture}/../../m23-type-source-nominals/storage-roots.scoop", "to" = "${work}/core-source/src/nominals.scoop"}},
]
checks = []

[[steps]]
name = "core"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_exposed"
files = [
  {"copy" = {"from" = "${core.result.root.path}", "to" = "${work}/original-core.slib"}},
  {"replace" = {"path" = "${work}/core-source/src/nominals.scoop", "old" = "public object Storage {", "new" = "public object Storage {\n    public fun flags(): (Boolean, Boolean) {\n        val empty = when (selected) {\n            case Selection.Empty -> true\n            case Selection.Present(value) -> value.flag\n        }\n        val absent = when (fields) { case None -> true; case Some(value) -> false }\n        return (empty, absent)\n    }"}},
]
checks = []

[[steps]]
name = "exposed"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [{"copy" = {"from" = "${fixture}/program.scoop", "to" = "${work}/sources/program.scoop"}}]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 1}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
checks = []
