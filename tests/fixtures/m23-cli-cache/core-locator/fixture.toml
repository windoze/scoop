schema = 1
name = "cli-core-locator-cache"
inputs = ["root", "runner", "../../core-library/extension.scoop", "../../core-library/library-consumer.scoop", "helper"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "core", "cache", "stage-golden"]

[vars]
options = ["--sysroot", "${work}/missing-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/root", "to" = "${work}/sources/root"}},
  {"copy" = {"from" = "${fixture}/runner", "to" = "${work}/sources/runner"}},
  {"copy" = {"from" = "${fixture}/helper", "to" = "${work}/sources/helper"}},
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/sources/core"}},
  {"copy" = {"from" = "${fixture}/../../core-library/extension.scoop", "to" = "${work}/sources/core/src/extension.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-library/library-consumer.scoop", "to" = "${work}/sources/root/src/main.scoop"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib", "--emit", "all", "--dump-dir", "${work}/dumps/cold"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${cold.result.kind}", "equals" = "library"},
  {"actual" = "${cold.result.dependencies.length}", "equals" = 2},
  {"actual" = "${cold.result.observations.child_invocations}", "equals" = ["${cold.result.dependencies.0.identity}", "${cold.result.dependencies.1.identity}", "${cold.result.root.identity}"]},
  {"file" = "${work}/missing-sysroot", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${cold.result.root.path}"},
  {"actual" = "${cold.result.observations.nodes.0.identity}", "equals" = "${cold.result.dependencies.0.identity}"},
  {"actual" = "${cold.result.observations.nodes.0.origin}", "equals" = "compiled"},
  {"actual" = "${cold.result.observations.nodes.1.identity}", "equals" = "${cold.result.dependencies.1.identity}"},
  {"actual" = "${cold.result.observations.nodes.1.origin}", "equals" = "compiled"},
  {"actual" = "${cold.result.observations.nodes.2.identity}", "equals" = "${cold.result.root.identity}"},
  {"actual" = "${cold.result.observations.nodes.2.origin}", "equals" = "compiled"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/ast.txt", "snapshot" = "cold.ast.txt"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/hir.txt", "snapshot" = "cold.hir.txt"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/mir.txt", "snapshot" = "cold.mir.txt"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/lir.txt", "snapshot" = "cold.lir.txt"},
]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${warm.result.kind}", "equals" = "library"},
  {"actual" = "${warm.result.dependencies.length}", "equals" = 2},
  {"actual" = "${warm.result.observations.child_invocations}", "equals" = []},
  {"file" = "${work}/missing-sysroot", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${warm.result.root.path}"},
  {"actual" = "${warm.result.observations.nodes.0.identity}", "equals" = "${warm.result.dependencies.0.identity}"},
  {"actual" = "${warm.result.observations.nodes.0.origin}", "equals" = "cache"},
  {"actual" = "${warm.result.dependencies.0.artifact_fingerprint}", "equals" = "${cold.result.dependencies.0.artifact_fingerprint}"},
  {"file" = "${warm.result.dependencies.0.path}", "same_as" = "${cold.result.dependencies.0.path}"},
  {"actual" = "${warm.result.observations.nodes.0.cache_key}", "equals" = "${cold.result.observations.nodes.0.cache_key}"},
  {"actual" = "${warm.result.observations.nodes.1.identity}", "equals" = "${warm.result.dependencies.1.identity}"},
  {"actual" = "${warm.result.observations.nodes.1.origin}", "equals" = "cache"},
  {"actual" = "${warm.result.dependencies.1.artifact_fingerprint}", "equals" = "${cold.result.dependencies.1.artifact_fingerprint}"},
  {"file" = "${warm.result.dependencies.1.path}", "same_as" = "${cold.result.dependencies.1.path}"},
  {"actual" = "${warm.result.observations.nodes.1.cache_key}", "equals" = "${cold.result.observations.nodes.1.cache_key}"},
  {"actual" = "${warm.result.observations.nodes.2.identity}", "equals" = "${warm.result.root.identity}"},
  {"actual" = "${warm.result.observations.nodes.2.origin}", "equals" = "cache"},
  {"actual" = "${warm.result.root.artifact_fingerprint}", "equals" = "${cold.result.root.artifact_fingerprint}"},
  {"file" = "${warm.result.root.path}", "same_as" = "${cold.result.root.path}"},
  {"actual" = "${warm.result.observations.nodes.2.cache_key}", "equals" = "${cold.result.observations.nodes.2.cache_key}"},
]

[[steps]]
name = "cold_program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/runner", {"each" = "${options}"}, "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "cold_run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "cold_moving"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "edit_core"
files = [
  {"replace" = {"path" = "${work}/sources/core/src/extension.scoop", "old" = "+ 1", "new" = "+ 2"}},
]

[[steps]]
name = "changed"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib", "--emit", "all", "--dump-dir", "${work}/dumps/changed"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${changed.result.kind}", "equals" = "library"},
  {"actual" = "${changed.result.dependencies.length}", "equals" = 2},
  {"actual" = "${changed.result.observations.child_invocations}", "equals" = ["${changed.result.dependencies.0.identity}", "${changed.result.dependencies.1.identity}", "${changed.result.root.identity}"]},
  {"file" = "${work}/missing-sysroot", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${changed.result.root.path}"},
  {"actual" = "${changed.result.observations.nodes.0.identity}", "equals" = "${changed.result.dependencies.0.identity}"},
  {"actual" = "${changed.result.observations.nodes.0.origin}", "equals" = "compiled"},
  {"actual" = "${changed.result.dependencies.0.artifact_fingerprint}", "not_equals" = "${cold.result.dependencies.0.artifact_fingerprint}"},
  {"actual" = "${changed.result.observations.nodes.0.cache_key}", "not_equals" = "${cold.result.observations.nodes.0.cache_key}"},
  {"actual" = "${changed.result.observations.nodes.1.identity}", "equals" = "${changed.result.dependencies.1.identity}"},
  {"actual" = "${changed.result.observations.nodes.1.origin}", "equals" = "compiled"},
  {"actual" = "${changed.result.dependencies.1.artifact_fingerprint}", "not_equals" = "${cold.result.dependencies.1.artifact_fingerprint}"},
  {"actual" = "${changed.result.observations.nodes.1.cache_key}", "not_equals" = "${cold.result.observations.nodes.1.cache_key}"},
  {"actual" = "${changed.result.observations.nodes.2.identity}", "equals" = "${changed.result.root.identity}"},
  {"actual" = "${changed.result.observations.nodes.2.origin}", "equals" = "compiled"},
  {"actual" = "${changed.result.root.artifact_fingerprint}", "not_equals" = "${cold.result.root.artifact_fingerprint}"},
  {"actual" = "${changed.result.observations.nodes.2.cache_key}", "not_equals" = "${cold.result.observations.nodes.2.cache_key}"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/ast.txt", "snapshot" = "changed.ast.txt"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/hir.txt", "snapshot" = "changed.hir.txt"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/mir.txt", "snapshot" = "changed.mir.txt"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/lir.txt", "snapshot" = "changed.lir.txt"},
]

[[steps]]
name = "changed_warm"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${changed_warm.result.kind}", "equals" = "library"},
  {"actual" = "${changed_warm.result.dependencies.length}", "equals" = 2},
  {"actual" = "${changed_warm.result.observations.child_invocations}", "equals" = []},
  {"file" = "${work}/missing-sysroot", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${changed_warm.result.root.path}"},
  {"actual" = "${changed_warm.result.observations.nodes.0.identity}", "equals" = "${changed_warm.result.dependencies.0.identity}"},
  {"actual" = "${changed_warm.result.observations.nodes.0.origin}", "equals" = "cache"},
  {"actual" = "${changed_warm.result.dependencies.0.artifact_fingerprint}", "equals" = "${changed.result.dependencies.0.artifact_fingerprint}"},
  {"file" = "${changed_warm.result.dependencies.0.path}", "same_as" = "${changed.result.dependencies.0.path}"},
  {"actual" = "${changed_warm.result.observations.nodes.0.cache_key}", "equals" = "${changed.result.observations.nodes.0.cache_key}"},
  {"actual" = "${changed_warm.result.observations.nodes.1.identity}", "equals" = "${changed_warm.result.dependencies.1.identity}"},
  {"actual" = "${changed_warm.result.observations.nodes.1.origin}", "equals" = "cache"},
  {"actual" = "${changed_warm.result.dependencies.1.artifact_fingerprint}", "equals" = "${changed.result.dependencies.1.artifact_fingerprint}"},
  {"file" = "${changed_warm.result.dependencies.1.path}", "same_as" = "${changed.result.dependencies.1.path}"},
  {"actual" = "${changed_warm.result.observations.nodes.1.cache_key}", "equals" = "${changed.result.observations.nodes.1.cache_key}"},
  {"actual" = "${changed_warm.result.observations.nodes.2.identity}", "equals" = "${changed_warm.result.root.identity}"},
  {"actual" = "${changed_warm.result.observations.nodes.2.origin}", "equals" = "cache"},
  {"actual" = "${changed_warm.result.root.artifact_fingerprint}", "equals" = "${changed.result.root.artifact_fingerprint}"},
  {"file" = "${changed_warm.result.root.path}", "same_as" = "${changed.result.root.path}"},
  {"actual" = "${changed_warm.result.observations.nodes.2.cache_key}", "equals" = "${changed.result.observations.nodes.2.cache_key}"},
]

[[steps]]
name = "changed_program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/runner", {"each" = "${options}"}, "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "changed_run"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""

[[steps]]
name = "changed_moving"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "publish_core"
files = [
  {"copy" = {"from" = "${changed.result.dependencies.0.path}", "to" = "${work}/core.slib"}},
  {"replace" = {"path" = "${work}/sources/root/Cone.toml", "old" = "path = \"../core\"", "new" = "artifact = \"../../core.slib\""}},
  {"remove" = {"path" = "${work}/sources/core"}},
]

[[steps]]
name = "prebuilt"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${prebuilt.result.kind}", "equals" = "library"},
  {"actual" = "${prebuilt.result.dependencies.length}", "equals" = 2},
  {"actual" = "${prebuilt.result.observations.child_invocations}", "equals" = []},
  {"file" = "${work}/missing-sysroot", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${prebuilt.result.root.path}"},
  {"actual" = "${prebuilt.result.observations.nodes.0.identity}", "equals" = "${prebuilt.result.dependencies.0.identity}"},
  {"actual" = "${prebuilt.result.observations.nodes.0.origin}", "equals" = "prebuilt"},
  {"actual" = "${prebuilt.result.dependencies.0.artifact_fingerprint}", "equals" = "${changed.result.dependencies.0.artifact_fingerprint}"},
  {"file" = "${prebuilt.result.dependencies.0.path}", "same_as" = "${changed.result.dependencies.0.path}"},
  {"actual" = "${prebuilt.result.observations.nodes.0.cache_key}", "equals" = {"file" = "null.json"}},
  {"actual" = "${prebuilt.result.observations.nodes.1.identity}", "equals" = "${prebuilt.result.dependencies.1.identity}"},
  {"actual" = "${prebuilt.result.observations.nodes.1.origin}", "equals" = "cache"},
  {"actual" = "${prebuilt.result.dependencies.1.artifact_fingerprint}", "equals" = "${changed.result.dependencies.1.artifact_fingerprint}"},
  {"file" = "${prebuilt.result.dependencies.1.path}", "same_as" = "${changed.result.dependencies.1.path}"},
  {"actual" = "${prebuilt.result.observations.nodes.1.cache_key}", "equals" = "${changed.result.observations.nodes.1.cache_key}"},
  {"actual" = "${prebuilt.result.observations.nodes.2.identity}", "equals" = "${prebuilt.result.root.identity}"},
  {"actual" = "${prebuilt.result.observations.nodes.2.origin}", "equals" = "cache"},
  {"actual" = "${prebuilt.result.root.artifact_fingerprint}", "equals" = "${changed.result.root.artifact_fingerprint}"},
  {"file" = "${prebuilt.result.root.path}", "same_as" = "${changed.result.root.path}"},
  {"actual" = "${prebuilt.result.observations.nodes.2.cache_key}", "equals" = "${changed.result.observations.nodes.2.cache_key}"},
]

[[steps]]
name = "prebuilt_program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/runner", {"each" = "${options}"}, "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prebuilt_run"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""

[[steps]]
name = "prebuilt_moving"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
