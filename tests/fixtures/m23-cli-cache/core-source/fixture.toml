schema = 1
name = "cli-core-source-cache"
inputs = ["root", "runner", "../../core-library/extension.scoop", "../../core-library/library-consumer.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["cli", "core", "cache", "stage-golden"]

[vars]
options = ["--sysroot", "${work}/private-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/root", "to" = "${work}/sources/root"}},
  {"copy" = {"from" = "${fixture}/runner", "to" = "${work}/sources/runner"}},
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/private-sysroot/lib/scoop.core"}},
  {"copy" = {"from" = "${fixture}/../../core-library/extension.scoop", "to" = "${work}/private-sysroot/lib/scoop.core/src/extension.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-library/library-consumer.scoop", "to" = "${work}/sources/root/src/main.scoop"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib", "--emit", "all", "--dump-dir", "${work}/dumps/cold"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${cold.result.kind}", "equals" = "library"},
  {"actual" = "${cold.result.dependencies.length}", "equals" = 1},
  {"actual" = "${cold.result.observations.child_invocations}", "equals" = ["${cold.result.dependencies.0.identity}", "${cold.result.root.identity}"]},
  {"file" = "${work}/private-sysroot/artifacts", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${cold.result.root.path}"},
  {"actual" = "${cold.result.observations.nodes.0.identity}", "equals" = "${cold.result.dependencies.0.identity}"},
  {"actual" = "${cold.result.observations.nodes.0.origin}", "equals" = "compiled"},
  {"actual" = "${cold.result.observations.nodes.1.identity}", "equals" = "${cold.result.root.identity}"},
  {"actual" = "${cold.result.observations.nodes.1.origin}", "equals" = "compiled"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/ast.txt", "snapshot" = "cold.ast.txt"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/hir.txt", "snapshot" = "cold.hir.txt"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/mir.txt", "snapshot" = "cold.mir.txt"},
  {"file" = "${work}/dumps/cold/${cold.result.root.identity}/lir.txt", "snapshot" = "cold.lir.txt"},
]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${warm.result.kind}", "equals" = "library"},
  {"actual" = "${warm.result.dependencies.length}", "equals" = 1},
  {"actual" = "${warm.result.observations.child_invocations}", "equals" = []},
  {"file" = "${work}/private-sysroot/artifacts", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${warm.result.root.path}"},
  {"actual" = "${warm.result.observations.nodes.0.identity}", "equals" = "${warm.result.dependencies.0.identity}"},
  {"actual" = "${warm.result.observations.nodes.0.origin}", "equals" = "cache"},
  {"actual" = "${warm.result.dependencies.0.artifact_fingerprint}", "equals" = "${cold.result.dependencies.0.artifact_fingerprint}"},
  {"file" = "${warm.result.dependencies.0.path}", "same_as" = "${cold.result.dependencies.0.path}"},
  {"actual" = "${warm.result.observations.nodes.0.cache_key}", "equals" = "${cold.result.observations.nodes.0.cache_key}"},
  {"actual" = "${warm.result.observations.nodes.1.identity}", "equals" = "${warm.result.root.identity}"},
  {"actual" = "${warm.result.observations.nodes.1.origin}", "equals" = "cache"},
  {"actual" = "${warm.result.root.artifact_fingerprint}", "equals" = "${cold.result.root.artifact_fingerprint}"},
  {"file" = "${warm.result.root.path}", "same_as" = "${cold.result.root.path}"},
  {"actual" = "${warm.result.observations.nodes.1.cache_key}", "equals" = "${cold.result.observations.nodes.1.cache_key}"},
]

[[steps]]
name = "cold_program"
argv = ["${scoop}", "build", "${work}/sources/runner", {"each" = "${options}"}, "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "cold_run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "cold_moving"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "edit_core"
files = [
  {"replace" = {"path" = "${work}/private-sysroot/lib/scoop.core/src/extension.scoop", "old" = "+ 1", "new" = "+ 2"}},
]

[[steps]]
name = "changed"
argv = ["${scoop}", "build", "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib", "--emit", "all", "--dump-dir", "${work}/dumps/changed"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${changed.result.kind}", "equals" = "library"},
  {"actual" = "${changed.result.dependencies.length}", "equals" = 1},
  {"actual" = "${changed.result.observations.child_invocations}", "equals" = ["${changed.result.dependencies.0.identity}", "${changed.result.root.identity}"]},
  {"file" = "${work}/private-sysroot/artifacts", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${changed.result.root.path}"},
  {"actual" = "${changed.result.observations.nodes.0.identity}", "equals" = "${changed.result.dependencies.0.identity}"},
  {"actual" = "${changed.result.observations.nodes.0.origin}", "equals" = "compiled"},
  {"actual" = "${changed.result.dependencies.0.artifact_fingerprint}", "not_equals" = "${cold.result.dependencies.0.artifact_fingerprint}"},
  {"actual" = "${changed.result.observations.nodes.0.cache_key}", "not_equals" = "${cold.result.observations.nodes.0.cache_key}"},
  {"actual" = "${changed.result.observations.nodes.1.identity}", "equals" = "${changed.result.root.identity}"},
  {"actual" = "${changed.result.observations.nodes.1.origin}", "equals" = "compiled"},
  {"actual" = "${changed.result.root.artifact_fingerprint}", "not_equals" = "${cold.result.root.artifact_fingerprint}"},
  {"actual" = "${changed.result.observations.nodes.1.cache_key}", "not_equals" = "${cold.result.observations.nodes.1.cache_key}"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/ast.txt", "snapshot" = "changed.ast.txt"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/hir.txt", "snapshot" = "changed.hir.txt"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/mir.txt", "snapshot" = "changed.mir.txt"},
  {"file" = "${work}/dumps/changed/${changed.result.root.identity}/lir.txt", "snapshot" = "changed.lir.txt"},
]

[[steps]]
name = "changed_warm"
argv = ["${scoop}", "build", "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${changed_warm.result.kind}", "equals" = "library"},
  {"actual" = "${changed_warm.result.dependencies.length}", "equals" = 1},
  {"actual" = "${changed_warm.result.observations.child_invocations}", "equals" = []},
  {"file" = "${work}/private-sysroot/artifacts", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${changed_warm.result.root.path}"},
  {"actual" = "${changed_warm.result.observations.nodes.0.identity}", "equals" = "${changed_warm.result.dependencies.0.identity}"},
  {"actual" = "${changed_warm.result.observations.nodes.0.origin}", "equals" = "cache"},
  {"actual" = "${changed_warm.result.dependencies.0.artifact_fingerprint}", "equals" = "${changed.result.dependencies.0.artifact_fingerprint}"},
  {"file" = "${changed_warm.result.dependencies.0.path}", "same_as" = "${changed.result.dependencies.0.path}"},
  {"actual" = "${changed_warm.result.observations.nodes.0.cache_key}", "equals" = "${changed.result.observations.nodes.0.cache_key}"},
  {"actual" = "${changed_warm.result.observations.nodes.1.identity}", "equals" = "${changed_warm.result.root.identity}"},
  {"actual" = "${changed_warm.result.observations.nodes.1.origin}", "equals" = "cache"},
  {"actual" = "${changed_warm.result.root.artifact_fingerprint}", "equals" = "${changed.result.root.artifact_fingerprint}"},
  {"file" = "${changed_warm.result.root.path}", "same_as" = "${changed.result.root.path}"},
  {"actual" = "${changed_warm.result.observations.nodes.1.cache_key}", "equals" = "${changed.result.observations.nodes.1.cache_key}"},
]

[[steps]]
name = "changed_program"
argv = ["${scoop}", "build", "${work}/sources/runner", {"each" = "${options}"}, "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "changed_run"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""

[[steps]]
name = "changed_moving"
argv = ["${work}/program"]
exit = 0
stdout = "43\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "restore_core"
files = [
  {"replace" = {"path" = "${work}/private-sysroot/lib/scoop.core/src/extension.scoop", "old" = "+ 2", "new" = "+ 1"}},
]

[[steps]]
name = "restored"
argv = ["${scoop}", "build", "${work}/sources/root", {"each" = "${options}"}, "--runtime-root", "${work}/absent-runtime", "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${restored.result.kind}", "equals" = "library"},
  {"actual" = "${restored.result.dependencies.length}", "equals" = 1},
  {"actual" = "${restored.result.observations.child_invocations}", "equals" = []},
  {"file" = "${work}/private-sysroot/artifacts", "exists" = false},
  {"file" = "${work}/library.slib", "same_as" = "${restored.result.root.path}"},
  {"actual" = "${restored.result.observations.nodes.0.identity}", "equals" = "${restored.result.dependencies.0.identity}"},
  {"actual" = "${restored.result.observations.nodes.0.origin}", "equals" = "cache"},
  {"actual" = "${restored.result.dependencies.0.artifact_fingerprint}", "equals" = "${cold.result.dependencies.0.artifact_fingerprint}"},
  {"file" = "${restored.result.dependencies.0.path}", "same_as" = "${cold.result.dependencies.0.path}"},
  {"actual" = "${restored.result.observations.nodes.0.cache_key}", "equals" = "${cold.result.observations.nodes.0.cache_key}"},
  {"actual" = "${restored.result.observations.nodes.1.identity}", "equals" = "${restored.result.root.identity}"},
  {"actual" = "${restored.result.observations.nodes.1.origin}", "equals" = "cache"},
  {"actual" = "${restored.result.root.artifact_fingerprint}", "equals" = "${cold.result.root.artifact_fingerprint}"},
  {"file" = "${restored.result.root.path}", "same_as" = "${cold.result.root.path}"},
  {"actual" = "${restored.result.observations.nodes.1.cache_key}", "equals" = "${cold.result.observations.nodes.1.cache_key}"},
]

[[steps]]
name = "restored_program"
argv = ["${scoop}", "build", "${work}/sources/runner", {"each" = "${options}"}, "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "restored_run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "restored_moving"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
