schema = 1
name = "legacy-m9-gc-generic-struct"
root = "../../m9-gc/generic-struct.scoop"
inputs = ["../../m9-gc/generic-struct.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m9-gc", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "generic-struct.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "generic-struct.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "generic-struct.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "generic-struct.${target}.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "7\nseven\nheld\n"
stderr = ""
