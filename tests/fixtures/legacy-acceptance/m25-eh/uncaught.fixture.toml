schema = 1
name = "legacy-m25-eh-uncaught"
root = "../../m25-eh/uncaught.scoop"
inputs = ["../../m25-eh/uncaught.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m25-eh", "single-file", "trap"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 1
stdout = ""
stderr = "scoop: uncaught exception: n(c=scoop%3Asingle-file%3A0.0.0;p=;o=-;k=C;x=M25UncaughtError)\n"
