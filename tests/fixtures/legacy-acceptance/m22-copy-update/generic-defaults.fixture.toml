schema = 1
name = "legacy-m22-copy-update-generic-defaults"
root = "../../m22-copy-update/generic-defaults.scoop"
inputs = ["../../m22-copy-update/generic-defaults.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m22-copy-update", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "2\nint\nafter\ntext\nalias\nalias-label\n4\nint-cell\nnew\ntext-cell\nafter-default\ndefault-label\n"
stderr = ""
