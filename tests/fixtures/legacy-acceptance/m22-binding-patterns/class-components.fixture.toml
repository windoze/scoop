schema = 1
name = "legacy-m22-binding-patterns-class-components"
root = "../../m22-binding-patterns/class-components.scoop"
inputs = ["../../m22-binding-patterns/class-components.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m22-binding-patterns", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "subject\nouter-1\ninner-1\ninner-2\nouter-2\n11\nthrow-1\nthrow-2\ncaught\n"
stderr = ""
