schema = 1
name = "legacy-m21-visibility-visibility"
root = "../../m21-visibility/visibility.scoop"
inputs = ["../../m21-visibility/visibility.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["legacy", "m21-visibility", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "visibility.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "visibility.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "visibility.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "visibility.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "7\n9\n11\n"
stderr = ""
