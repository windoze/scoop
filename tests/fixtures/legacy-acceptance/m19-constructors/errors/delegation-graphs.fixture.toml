schema = 1
name = "legacy-m19-constructors-errors-delegation-graphs"
root = "../../../m19-constructors/errors/delegation-graphs.scoop"
inputs = ["../../../m19-constructors/errors/delegation-graphs.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m19-constructors", "single-file", "negative"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "delegation-graphs.diagnostics.json"}
