schema = 1
name = "legacy-m19-constructors-generic-default-vararg"
root = "../../m19-constructors/generic-default-vararg.scoop"
inputs = ["../../m19-constructors/generic-default-vararg.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m19-constructors", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "constructor-default\n1\ngeneric-secondary\nfirst\n0\n2\ngeneric-secondary\nhead\n2\n"
stderr = ""
