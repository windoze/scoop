schema = 1
name = "legacy-m17-arguments-source-order"
root = "../../m17-arguments/source-order.scoop"
inputs = ["../../m17-arguments/source-order.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["legacy", "m17-arguments", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "source-order.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "source-order.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "source-order.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "source-order.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "explicit-third\nexplicit-second\ndefault-first\n123\nmixed-first\nmixed-second\nmixed-third\n456\nreceiver\nmember-second\nmember-first\n121\nstruct-y\nstruct-x\n3\nclass-right\nclass-left\n7\nvariant-right\nvariant-left\n11\nresult\n"
stderr = ""
