schema = 1
name = "legacy-m1-hello-errors-unknown-function"
root = "../../../m1-hello/errors/unknown-function.scoop"
inputs = ["../../../m1-hello/errors/unknown-function.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m1-hello", "single-file", "negative"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "unknown-function.diagnostics.json"}
