schema = 1
name = "legacy-m22-iteration-errors-patterns-and-jumps"
root = "../../../m22-iteration/errors/patterns-and-jumps.scoop"
inputs = ["../../../m22-iteration/errors/patterns-and-jumps.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m22-iteration", "single-file", "negative"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "patterns-and-jumps.diagnostics.json"}
