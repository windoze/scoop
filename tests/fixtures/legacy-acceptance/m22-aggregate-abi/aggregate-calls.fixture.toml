schema = 1
name = "legacy-m22-aggregate-abi-aggregate-calls"
root = "../../m22-aggregate-abi/aggregate-calls.scoop"
inputs = ["../../m22-aggregate-abi/aggregate-calls.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["legacy", "m22-aggregate-abi", "single-file", "run", "moving-gc"]

[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = {"SCOOP_GC_STRESS_MOVE" = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "aggregate-calls.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "aggregate-calls.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "aggregate-calls.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "aggregate-calls.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "original-nested-32\n3\n0\n4\n0\nnested-24-constructor\n3\n4\n55\nnested-24-nogc\n40\n55\ngeneric-specialization-24\n60\n70\nflat-32-control\n100\nmanaged-call\nalpha-live\nbeta-live\n700\nmanaged-invoke-normal\nalpha-live\nbeta-live\n700\nmanaged-invoke-throw\ncaught-managed-invoke\nclosure-hidden-receiver-24\n9\n1090\n"
stderr = ""
