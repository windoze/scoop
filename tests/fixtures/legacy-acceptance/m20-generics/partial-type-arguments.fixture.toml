schema = 1
name = "legacy-m20-generics-partial-type-arguments"
root = "../../m20-generics/partial-type-arguments.scoop"
inputs = ["../../m20-generics/partial-type-arguments.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m20-generics", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "function\nstruct\nclass\nvariant\nmethod\nextension\n7\n8\nnested\nnamed\nlabel\nbounded\nint\nlocal\n"
stderr = ""
