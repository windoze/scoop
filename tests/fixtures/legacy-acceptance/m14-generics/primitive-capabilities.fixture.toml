schema = 1
name = "legacy-m14-generics-primitive-capabilities"
root = "../../m14-generics/primitive-capabilities.scoop"
inputs = ["../../m14-generics/primitive-capabilities.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m14-generics", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n4\ntrue\ntext\ntrue\ntrue\ntrue\ntrue\n"
stderr = ""
