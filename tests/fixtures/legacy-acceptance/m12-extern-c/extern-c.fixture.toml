schema = 1
name = "legacy-m12-extern-c-extern-c"
root = "../../m12-extern-c/extern-c.scoop"
inputs = ["../../m12-extern-c/extern-c.scoop", "../../m12-extern-c/native-fixture_extra.c", "../../m12-extern-c/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m12-extern-c", "single-file", "run", "native"]

[[steps]]
name = "prepare_native"
files = [{"mkdir" = {"path" = "${work}/native/objects"}}, {"mkdir" = {"path" = "${work}/native/lib"}}]

[[steps]]
name = "compile_native_0"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-fno-omit-frame-pointer", "-I", "${runtime}/include", "-c", "${fixture}/../../m12-extern-c/native-fixture_extra.c", "-o", "${work}/native/objects/fixture_extra.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native_0"
argv = ["${ar}", "rcs", "${work}/native/lib/libfixture_extra.a", "${work}/native/objects/fixture_extra.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "compile_native_1"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-fno-omit-frame-pointer", "-I", "${runtime}/include", "-c", "${fixture}/../../m12-extern-c/native.c", "-o", "${work}/native/objects/fixture_native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native_1"
argv = ["${ar}", "rcs", "${work}/native/lib/libfixture_native.a", "${work}/native/objects/fixture_native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native/lib", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "extern-c.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "extern-c.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "extern-c.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "extern-c.${target}.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "41\n42\ntrue\ntrue\n42\ntrue\n11\n7\n42\n7\n9\n13\n24\nfalse\ntrue\n17\ntrue\n"
stderr = ""
