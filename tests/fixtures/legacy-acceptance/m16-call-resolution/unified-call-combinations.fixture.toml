schema = 1
name = "legacy-m16-call-resolution-unified-call-combinations"
root = "../../m16-call-resolution/unified-call-combinations.scoop"
inputs = ["../../m16-call-resolution/unified-call-combinations.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m16-call-resolution", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "unified-call-combinations.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "unified-call-combinations.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "unified-call-combinations.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "unified-call-combinations.${target}.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
