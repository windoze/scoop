schema = 1
name = "legacy-m17-defaults-suspend-default"
root = "../../m17-defaults/suspend-default.scoop"
inputs = ["../../m17-defaults/suspend-default.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m17-defaults", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "registered\nregistered\nreturned\nafter-resume\ncallee\ndefault-result\n41\nafter-resume\ncallee\nexplicit-result\n42\n"
stderr = ""
