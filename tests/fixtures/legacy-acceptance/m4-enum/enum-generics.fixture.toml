schema = 1
name = "legacy-m4-enum-enum-generics"
root = "../../m4-enum/enum-generics.scoop"
inputs = ["../../m4-enum/enum-generics.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["legacy", "m4-enum", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "1\ns\nempty\n"
stderr = ""
