schema = 1
name = "legacy-m18-safe-call-safe-call-semantics"
root = "../../m18-safe-call/safe-call-semantics.scoop"
inputs = ["../../m18-safe-call/safe-call-semantics.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["legacy", "m18-safe-call", "single-file", "run"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "safe-call-semantics.diagnostics.json"}
checks = [{"file" = "${work}/dump/${build.result.root.identity}/ast.txt", "snapshot" = "safe-call-semantics.ast.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/hir.txt", "snapshot" = "safe-call-semantics.hir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/mir.txt", "snapshot" = "safe-call-semantics.mir.txt"}, {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "safe-call-semantics.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "safe-argument\nsend-body\nsome-5\nnone\nsafe-default\nsend-body\nsome-7\nnone\nsafe-receiver\nsend-body\nmade-8\nsome-9\nnone\nsome-nested\ntouch-body\nunit-some\nfield-10\n42\n"
stderr = ""
