schema = 1
name = "m35-when-ordinary"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m35", "when", "gc"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "subject\n1\n3\nhit\nstring\nequals\nkey\n1\n8\ncontains\n2\n20\nmany\n7\n9\nguarded else\n2\nfallthrough\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "subject\n1\n3\nhit\nstring\nequals\nkey\n1\n8\ncontains\n2\n20\nmany\n7\n9\nguarded else\n2\nfallthrough\n"
stderr = ""
