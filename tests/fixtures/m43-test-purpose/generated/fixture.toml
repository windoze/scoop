schema = 1
name = "m43-test-purpose-generated"
inputs = ["program", "bootstrap.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m43", "test-purpose", "entry", "lifecycle"]
variants = [
    {name = "debug", vars = {profile = "debug"}},
    {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "bootstrap"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/bootstrap.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/bootstrap", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "production"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/production", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "library"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/lib/scoop.test", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/library", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "compile"
argv = ["${scoopc}", "build", {each = "${compile_args}"}, "${fixture}/program", "--test", "--profile", "${profile}", "--direct-slib", "${library.result.root.path}", {each = "${library.result.dependencies}", field = "path", prefix = "--direct-slib"}, "--out-slib", "${work}/tests.slib"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--message-format", "json", {each = "${link_args}"}, "--root-slib", "${work}/tests.slib", "--dependency-slib", "${library.result.root.path}", {each = "${library.result.dependencies}", field = "path", prefix = "--dependency-slib"}, "--runtime-objects", "${bootstrap.result.runtime_index}", "-o", "${work}/tests"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${work}/tests"]
exit = 0
stdout = "init\nbefore\none\nafter\ninit\nbefore\ntwo\nafter\nother\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${work}/tests"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "init\nbefore\none\nafter\ninit\nbefore\ntwo\nafter\nother\n"
stderr = ""

[[steps]]
name = "copy-for-test-command"
files = [{copy = {from = "${fixture}/program", to = "${work}/program"}}]

[[steps]]
name = "umbrella"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/production", "--message-format", "json", "--no-run"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
 {actual = "${umbrella.result.output}", equals = "${work}/production/${target}/${profile}/tests/generated-tests"},
 {actual = "${umbrella.result.root.path}", not_equals = "${production.result.root.path}"},
]

[[steps]]
name = "umbrella-run"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/production", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
    {actual = "${umbrella-run.test_result.status}", equals = "passed"},
    {actual = "${umbrella-run.test_result.complete}", equals = true},
    {actual = "${umbrella-run.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "umbrella-moving"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/production", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "test-stderr"
diagnostics = []
env = {SCOOP_GC_STRESS_MOVE = "1"}
checks = [
    {actual = "${umbrella-moving.test_result.status}", equals = "passed"},
    {actual = "${umbrella-moving.test_result.complete}", equals = true},
]

[[steps]]
name = "change-test-body"
files = [{replace = {path = "${work}/program/tests/a.scoop", old = 'println("one")', new = 'println("changed one")'}}]

[[steps]]
name = "changed-test"
argv = ["${scoop}", "test", {each = "${link_args}"}, "${work}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/production", "--message-format", "json", "--nocapture"]
exit = 0
stdout = "init\nbefore\nchanged one\nafter\ninit\nbefore\ntwo\nafter\nother\n"
stderr = ""
json = "test-stderr"
diagnostics = []
checks = [
    {actual = "${changed-test.test_result.status}", equals = "passed"},
    {actual = "${changed-test.test_result.complete}", equals = true},
    {actual = "${changed-test.result.root.artifact_fingerprint}", not_equals = "${umbrella.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "production-after-test-change"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/production", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
 {actual = "${production-after-test-change.result.root.path}", equals = "${production.result.root.path}"},
 {actual = "${production-after-test-change.result.observations.child_invocations.length}", equals = 0},
]
