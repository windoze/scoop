schema = 1
name = "m43-test-purpose-generated"
inputs = ["program", "bootstrap.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m43", "test-purpose", "entry", "lifecycle"]
variants = [
    {name = "debug", vars = {profile = "debug"}},
    {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "bootstrap"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/bootstrap.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/bootstrap", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "production"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/production", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "library"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/lib/scoop.test", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/library", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "compile"
argv = ["${scoopc}", "build", {each = "${compile_args}"}, "${fixture}/program", "--test", "--profile", "${profile}", "--direct-slib", "${library.result.root.path}", {each = "${library.result.dependencies}", field = "path", prefix = "--direct-slib"}, "--out-slib", "${work}/tests.slib"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--message-format", "json", {each = "${link_args}"}, "--root-slib", "${work}/tests.slib", "--dependency-slib", "${library.result.root.path}", {each = "${library.result.dependencies}", field = "path", prefix = "--dependency-slib"}, "--runtime-objects", "${bootstrap.result.runtime_index}", "-o", "${work}/tests"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${work}/tests"]
exit = 0
stdout = "init\nbefore\none\nafter\ninit\nbefore\ntwo\nafter\nother\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${work}/tests"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "init\nbefore\none\nafter\ninit\nbefore\ntwo\nafter\nother\n"
stderr = ""
