schema = 1
name = "m43-test-purpose-production-import"
inputs = ["program"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m43", "test-purpose", "negative", "source-role"]

[[steps]]
name = "library"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/src/scoop.test", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/library", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "reject"
argv = ["${scoopc}", "build", {each = "${compile_args}"}, "${fixture}/program", "--test", "--direct-slib", "${library.result.root.path}", {each = "${library.result.dependencies}", field = "path", prefix = "--direct-slib"}, "--out-slib", "${work}/tests.slib"]
exit = 1
stdout = ""
stderr = {file = "diagnostics.txt"}
checks = [{file = "${work}/tests.slib", exists = false}]
