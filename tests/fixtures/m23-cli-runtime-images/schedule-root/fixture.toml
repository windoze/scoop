schema = 1
name = "runtime-images-schedule-root"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "schedule-a-base", "../../m23-runtime-images/schedule-a-base.scoop", "schedule-b-next", "../../m23-runtime-images/schedule-b-next.scoop", "schedule-c-peer", "../../m23-runtime-images/schedule-c-peer.scoop", "schedule-d-join", "../../m23-runtime-images/schedule-d-join.scoop", "../support/trace.c", "schedule-root", "../../m23-runtime-images/schedule-root.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["runtime-images", "schedule"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_schedule-a-base"
files = [
  {"copy" = {"from" = "${fixture}/schedule-a-base", "to" = "${work}/sources/schedule-a-base"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/schedule-a-base.scoop", "to" = "${work}/sources/schedule-a-base/src/main.scoop"}},
]

[[steps]]
name = "schedule-a-base"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/schedule-a-base", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-schedule-a-base", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/schedule-a-base/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_schedule-b-next"
files = [
  {"copy" = {"from" = "${fixture}/schedule-b-next", "to" = "${work}/sources/schedule-b-next"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/schedule-b-next.scoop", "to" = "${work}/sources/schedule-b-next/src/main.scoop"}},
]

[[steps]]
name = "schedule-b-next"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/schedule-b-next", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-schedule-b-next", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/schedule-b-next/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_schedule-c-peer"
files = [
  {"copy" = {"from" = "${fixture}/schedule-c-peer", "to" = "${work}/sources/schedule-c-peer"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/schedule-c-peer.scoop", "to" = "${work}/sources/schedule-c-peer/src/main.scoop"}},
]

[[steps]]
name = "schedule-c-peer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/schedule-c-peer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-schedule-c-peer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/schedule-c-peer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_schedule-d-join"
files = [
  {"copy" = {"from" = "${fixture}/schedule-d-join", "to" = "${work}/sources/schedule-d-join"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/schedule-d-join.scoop", "to" = "${work}/sources/schedule-d-join/src/main.scoop"}},
]

[[steps]]
name = "schedule-d-join"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/schedule-d-join", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-schedule-d-join", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/schedule-d-join/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../support/trace.c", "to" = "${work}/native/trace.c"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/native/trace.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_runtime_images.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_schedule-root"
files = [
  {"copy" = {"from" = "${fixture}/schedule-root", "to" = "${work}/sources/schedule-root"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/schedule-root.scoop", "to" = "${work}/sources/schedule-root/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/schedule-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 5},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:schedule-a-base:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:schedule-b-next:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:schedule-c-peer:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:schedule-d-join:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:schedule-root:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=6 root=${symbol_prefix}scoop$$1$$re$$e42cb7160d7f72aba6d61c42a35395fe8746615c0437ebbc9cb51e3fe5f3f60f"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "10\n20\n30\n40\n50\n"
stderr = ""
env = {}

[[steps]]
name = "run_moving"
argv = ["${work}/program"]
exit = 0
stdout = "10\n20\n30\n40\n50\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
