schema = 1
name = "runtime-images-eager-later-root"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "eager-bad-provider", "../../m23-runtime-images/eager-bad-provider.scoop", "eager-later-provider", "../../m23-runtime-images/eager-later-provider.scoop", "../support/trace.c", "eager-later-root", "../../m23-runtime-images/eager-later-root.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["runtime-images", "stopped", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_eager-bad-provider"
files = [
  {"copy" = {"from" = "${fixture}/eager-bad-provider", "to" = "${work}/sources/eager-bad-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/eager-bad-provider.scoop", "to" = "${work}/sources/eager-bad-provider/src/main.scoop"}},
]

[[steps]]
name = "eager-bad-provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/eager-bad-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-eager-bad-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/eager-bad-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/eager-bad-provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${eager-bad-provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/eager-bad-provider/${eager-bad-provider.result.root.identity}/ast.txt", "snapshot" = "eager-bad-provider.ast.txt"},
  {"file" = "${work}/dump/eager-bad-provider/${eager-bad-provider.result.root.identity}/hir.txt", "snapshot" = "eager-bad-provider.hir.txt"},
  {"file" = "${work}/dump/eager-bad-provider/${eager-bad-provider.result.root.identity}/mir.txt", "snapshot" = "eager-bad-provider.mir.txt"},
  {"file" = "${work}/dump/eager-bad-provider/${eager-bad-provider.result.root.identity}/lir.txt", "snapshot" = "eager-bad-provider.lir.${target}.txt"},
]

[[steps]]
name = "remove_eager-bad-provider"
files = [
  {"remove" = {"path" = "${work}/sources/eager-bad-provider"}},
]

[[steps]]
name = "prepare_eager-later-provider"
files = [
  {"copy" = {"from" = "${fixture}/eager-later-provider", "to" = "${work}/sources/eager-later-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/eager-later-provider.scoop", "to" = "${work}/sources/eager-later-provider/src/main.scoop"}},
]

[[steps]]
name = "eager-later-provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/eager-later-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-eager-later-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/eager-later-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/eager-later-provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${eager-later-provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/eager-later-provider/${eager-later-provider.result.root.identity}/ast.txt", "snapshot" = "eager-later-provider.ast.txt"},
  {"file" = "${work}/dump/eager-later-provider/${eager-later-provider.result.root.identity}/hir.txt", "snapshot" = "eager-later-provider.hir.txt"},
  {"file" = "${work}/dump/eager-later-provider/${eager-later-provider.result.root.identity}/mir.txt", "snapshot" = "eager-later-provider.mir.txt"},
  {"file" = "${work}/dump/eager-later-provider/${eager-later-provider.result.root.identity}/lir.txt", "snapshot" = "eager-later-provider.lir.${target}.txt"},
]

[[steps]]
name = "remove_eager-later-provider"
files = [
  {"remove" = {"path" = "${work}/sources/eager-later-provider"}},
]

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../support/trace.c", "to" = "${work}/native/trace.c"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/native/trace.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_runtime_images.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_native_source"
files = [
  {"remove" = {"path" = "${work}/native/trace.c"}},
  {"remove" = {"path" = "${work}/native/trace.o"}},
]

[[steps]]
name = "prepare_eager-later-root"
files = [
  {"copy" = {"from" = "${fixture}/eager-later-root", "to" = "${work}/sources/eager-later-root"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/eager-later-root.scoop", "to" = "${work}/sources/eager-later-root/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/eager-later-root", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--emit", "all", "--dump-dir", "${work}/dump/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${program.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/program/${program.result.root.identity}/ast.txt", "snapshot" = "program.ast.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/hir.txt", "snapshot" = "program.hir.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/mir.txt", "snapshot" = "program.mir.txt"},
  {"file" = "${work}/dump/program/${program.result.root.identity}/lir.txt", "snapshot" = "program.lir.${target}.txt"},
]

[[steps]]
name = "isolate"
files = [
  {"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}},
  {"remove" = {"path" = "${work}/sources"}},
]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
env = {"PATH" = "/usr/bin:/bin", "LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 3},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {"actual" = "${link.result.link_plan}", "snapshot" = "link.plan.${target}.txt", "normalize" = ["paths"]},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
stdout = "1\n"
stderr = "scoop: uncaught exception: n(c=scoop%3Ascoop.core%3A0.1.0;p=;o=-;k=C;x=IllegalStateException) during initialization of top-level:bad\n"
env = {}
signal = "SIGABRT"

[[steps]]
name = "run_moving"
argv = ["${work}/program"]
stdout = "1\n"
stderr = "scoop: uncaught exception: n(c=scoop%3Ascoop.core%3A0.1.0;p=;o=-;k=C;x=IllegalStateException) during initialization of top-level:bad\n"
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
signal = "SIGABRT"
