schema = 1
name = "runtime-images-lazy-cycle-root"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "lazy-cycle-provider", "../../m23-runtime-images/lazy-cycle-provider.scoop", "../support/trace.c", "lazy-cycle-root", "../../m23-runtime-images/lazy-cycle-root.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["runtime-images", "lazy"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_lazy-cycle-provider"
files = [
  {"copy" = {"from" = "${fixture}/lazy-cycle-provider", "to" = "${work}/sources/lazy-cycle-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/lazy-cycle-provider.scoop", "to" = "${work}/sources/lazy-cycle-provider/src/main.scoop"}},
]

[[steps]]
name = "lazy-cycle-provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/lazy-cycle-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-lazy-cycle-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/lazy-cycle-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../support/trace.c", "to" = "${work}/native/trace.c"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/native/trace.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_runtime_images.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_lazy-cycle-root"
files = [
  {"copy" = {"from" = "${fixture}/lazy-cycle-root", "to" = "${work}/sources/lazy-cycle-root"}},
  {"copy" = {"from" = "${fixture}/../../m23-runtime-images/lazy-cycle-root.scoop", "to" = "${work}/sources/lazy-cycle-root/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/lazy-cycle-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 2},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:lazy-cycle-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:lazy-cycle-root:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=3 root=${symbol_prefix}scoop$$1$$re$$11e3e3806b3436bba48837fef206641b02153ffbc27a267ef0308d60020736d9"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "1\n42\n"
stderr = ""
env = {}

[[steps]]
name = "run_moving"
argv = ["${work}/program"]
exit = 0
stdout = "1\n42\n"
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
