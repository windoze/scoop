schema = 1
name = "m33-native-libraries-reject-ambiguity"
inputs = ["cone", "native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m33", "native", "negative"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}, {mkdir = {path = "${work}/first"}}, {mkdir = {path = "${work}/second"}}]

[[steps]]
name = "compile_first"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-DVALUE=1", "-c", "${fixture}/native.c", "-o", "${work}/first/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_first"
argv = ["${ar}", "rcs", "${work}/first/libm.a", "${work}/first/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "compile_second"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-DVALUE=2", "-c", "${fixture}/native.c", "-o", "${work}/second/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_second"
argv = ["${ar}", "rcs", "${work}/second/libm.a", "${work}/second/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/first", "--library-path", "${work}/second", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.${target}.json"}
