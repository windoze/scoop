schema = 1
name = "m54-native-weak"
inputs = ["absent", "present", "native"]
tools = ["scoop", "scoopc"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m54", "native", "elf", "ffi", "link"]
variants = [
    {name = "absent-debug", vars = {cone = "absent", mode = []}},
    {name = "absent-release", vars = {cone = "absent", mode = ["--release"]}},
    {name = "present-debug", vars = {cone = "present", mode = []}},
    {name = "present-release", vars = {cone = "present", mode = ["--release"]}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/${cone}", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${build.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "native weak references follow the target linker\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${fixture}/${cone}", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]
