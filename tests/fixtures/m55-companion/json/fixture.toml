schema = 1
name = "m55-companion-json"
inputs = ["program"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m55", "generics", "companion", "json"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/program", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = '''true
0
{"id":7,"name":"Ada"}
true
true
1
{"value":9}
8
5
4
"Ada"
12
'''
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = '''true
0
{"id":7,"name":"Ada"}
true
true
1
{"value":9}
8
5
4
"Ada"
12
'''
stderr = ""
