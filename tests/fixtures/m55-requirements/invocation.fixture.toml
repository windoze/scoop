schema = 1
name = "m55-requirements-invocation"
root = "invocation.scoop"
inputs = ["invocation.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m55", "generics", "requirements", "defaults"]

[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "8\n8\n7\n12\n8\n8\n"
stderr = ""
json = "stderr"
diagnostics = []
