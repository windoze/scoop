schema = 1
name = "m55-requirements-effects"
root = "effects.scoop"
inputs = ["effects.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m55", "requirements", "combinations"]

[[variants]]
name = "normal"
[[variants]]
name = "gc-move"
env = { SCOOP_GC_STRESS_MOVE = "1" }

[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "41\n41\n42\nwaiting\n51\n"
stderr = ""
json = "stderr"
diagnostics = []
