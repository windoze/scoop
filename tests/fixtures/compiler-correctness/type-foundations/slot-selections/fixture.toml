schema = 1
name = "type-foundations-slot-selections"
inputs = ["../../../language/imported-classes/support/stage3_test.scoop", "slot-selections", "../../../language/shared-type-foundations/slot-selections.scoop", "type-foundation-slot-selections-consumer"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["type-foundations", "slot-selections", "compiler-correctness"]
[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_slot-selections"
files = [
  {"copy" = {"from" = "${fixture}/slot-selections", "to" = "${work}/sources/slot-selections"}},
  {"copy" = {"from" = "${fixture}/../../../language/shared-type-foundations/slot-selections.scoop", "to" = "${work}/sources/slot-selections/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/slot-selections", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/slot-selections/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_type-foundation-slot-selections-consumer"
files = [
  {"copy" = {"from" = "${fixture}/type-foundation-slot-selections-consumer", "to" = "${work}/sources/type-foundation-slot-selections-consumer"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/type-foundation-slot-selections-consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/type-foundation-slot-selections-consumer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []
