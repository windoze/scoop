schema = 1
name = "type-foundations-constructors"
inputs = ["../../../language/imported-classes/support/stage3_test.scoop", "constructors", "../../../language/shared-type-foundations/constructors.scoop", "type-foundation-constructors-consumer"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["type-foundations", "constructors", "compiler-correctness"]
[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_constructors"
files = [
  {"copy" = {"from" = "${fixture}/constructors", "to" = "${work}/sources/constructors"}},
  {"copy" = {"from" = "${fixture}/../../../language/shared-type-foundations/constructors.scoop", "to" = "${work}/sources/constructors/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/constructors", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/constructors/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_type-foundation-constructors-consumer"
files = [
  {"copy" = {"from" = "${fixture}/type-foundation-constructors-consumer", "to" = "${work}/sources/type-foundation-constructors-consumer"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/type-foundation-constructors-consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/type-foundation-constructors-consumer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []
