schema = 1
name = "debug-artifacts"
inputs = ["provider", "bridge", "consumer", "rejected", "../../../../../sysroot/src/scoop.json"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["inspection", "generics", "compiler-correctness", "expected-error"]
[[steps]]
name = "prepare_sources"
files = [
  {copy = {from = "${fixture}/bridge", to = "${work}/sources/bridge"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/sources/consumer"}},
  {copy = {from = "${fixture}/rejected", to = "${work}/sources/rejected"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/provider", "--lockfile", "${work}/source-lock-0.lock", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/inspection-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "bridge"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/bridge", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-bridge", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/inspection-bridge/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "debug-artifact-ok\n"
stderr = ""

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/rejected", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-rejected", "--cone-path", "${work}/artifacts", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "rejected-diagnostics.json"}
