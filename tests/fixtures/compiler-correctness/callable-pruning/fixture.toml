schema = 1
name = "callable-pruning"
inputs = ["provider", "program", "inspect.py"]
tools = ["scoop", "scoopc", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["link", "gc", "optimization", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "prepare"
files = [
    {copy = {from = "${fixture}/provider", to = "${work}/provider"}},
    {copy = {from = "${fixture}/program", to = "${work}/program"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--keep-symbols", {each = "${link_args}"}, "${work}/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--emit", "symbols", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "relink"
argv = ["${scoop}", "link", "--keep-symbols", "--enable-startup-stats", "--enable-gc-stress", {each = "${link_args}"}, "--root-slib", "${build.result.root.path}", {each = "${build.result.dependencies}", field = "path", prefix = "--dependency-slib"}, "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "-o", "${work}/instrumented", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "inspect"
argv = ["${python}", "${fixture}/inspect.py", "${work}/dump/${build.result.root.identity}/symbols.json", "${build.result.output}", "${relink.result.output}"]
exit = 0
stdout = "unreachable callables removed; dispatch and roots preserved\n"
stderr = ""
