schema = 1
name = "compiler-performance-parallel-cones"
root = "root"
inputs = ["base", "left", "right", "root"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["compiler-performance", "build-cache", "artifacts", "run", "compiler-correctness"]
variants = [
  {name = "serial", vars = {jobs = "1", other_jobs = "4"}},
  {name = "parallel", vars = {jobs = "4", other_jobs = "1"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--jobs", "${jobs}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${cold.result.observations.child_invocations.length}", equals = 4}]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--jobs", "${other_jobs}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations.length}", equals = 0}, {actual = "${warm.result.link_plan_fingerprint}", equals = "${cold.result.link_plan_fingerprint}"}]

[[steps]]
name = "observe"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--jobs", "${jobs}", "--message-format", "json", "--emit", "ast", "--dump-dir", "${work}/dumps", "--dump-scope", "sources"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${observe.result.observations.child_invocations.length}", equals = 4}, {actual = "${observe.result.link_plan_fingerprint}", equals = "${cold.result.link_plan_fingerprint}"}]

[[steps]]
name = "observe_again"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--jobs", "${other_jobs}", "--message-format", "json", "--emit", "ast", "--dump-dir", "${work}/dumps", "--dump-scope", "sources"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${observe_again.result.observations.child_invocations.length}", equals = 0}, {actual = "${observe_again.result.link_plan_fingerprint}", equals = "${cold.result.link_plan_fingerprint}"}]

[[steps]]
name = "run"
argv = ["${cold.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "concurrent_first"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/concurrent-cache", "--target-dir", "${work}/concurrent-first", "--jobs", "${jobs}", "--message-format", "json"]
background = true
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "concurrent_second"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/concurrent-cache", "--target-dir", "${work}/concurrent-second", "--jobs", "${other_jobs}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "concurrent_joined"
wait = "concurrent_first"
checks = [{actual = "${concurrent_first.result.link_plan_fingerprint}", equals = "${concurrent_second.result.link_plan_fingerprint}"}]
