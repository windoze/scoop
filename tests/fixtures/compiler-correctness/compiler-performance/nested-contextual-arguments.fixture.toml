schema = 1
name = "compiler-performance-nested-contextual-arguments"
root = "nested-contextual-arguments.scoop"
inputs = ["nested-contextual-arguments.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["compiler-performance", "inference", "run", "compiler-correctness"]
[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
timeout = 60
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "17\n234\n5\n"
stderr = ""
