schema = 1
name = "compiler-performance-type-interning"
root = "type-interning.scoop"
inputs = ["type-interning.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["compiler-performance", "codegen", "run", "compiler-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n42\n42\n42\ntrue\nfalse\n"
stderr = ""
