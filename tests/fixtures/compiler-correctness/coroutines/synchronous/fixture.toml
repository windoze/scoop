schema = 1
name = "synchronous-suspend"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["coroutine", "context", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug"}}, {"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "synchronous suspend inlining preserves effects, roots and pending cleanup\n"
stderr = ""
json = "stderr"
diagnostics = []
