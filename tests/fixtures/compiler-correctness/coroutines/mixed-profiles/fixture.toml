schema = 1
name = "coroutine-mixed-profiles"
inputs = ["provider", "middle", "program"]
tools = ["scoop", "scoopc", "scoop-link"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["coroutine", "artifact", "compiler-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug", replacement = "release"}},
  {name = "release", vars = {profile = "release", replacement = "debug"}},
]

[[steps]]
name = "prepare_sources"
files = [
  {copy = {from = "${fixture}/middle", to = "${work}/sources/middle"}},
  {copy = {from = "${fixture}/program", to = "${work}/sources/program"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/provider", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/artifacts/dev.m58.profiles/provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "middle"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/middle", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cone-path", "${work}/artifacts", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/artifacts/dev.m58.profiles/middle/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "change_profile"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/provider", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${replacement}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/artifacts/dev.m58.profiles/provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/program", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cone-path", "${work}/artifacts", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "mixed profiles preserve boxed and suspended calls\n"
stderr = ""
