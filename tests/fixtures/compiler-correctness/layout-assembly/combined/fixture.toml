schema = 1
name = "layout-assembly-combined"
inputs = ["../../../language/imported-classes/support/stage3_test.scoop", "../../../language/lir-export-assembly/combined.scoop", "../../../language/lir-export-assembly/private-local.scoop", "../support/unrelated.scoop", "provider", "consumer"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["layout-assembly", "combined", "compiler-correctness"]
[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/provider"}},
  {"copy" = {"from" = "${fixture}/../../../language/lir-export-assembly/combined.scoop", "to" = "${work}/provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/first.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "add_private_declarations"
files = [
  {"copy" = {"from" = "${fixture}/../../../language/lir-export-assembly/private-local.scoop", "to" = "${work}/provider/src/private_local.scoop"}},
  {"copy" = {"from" = "${fixture}/../support/unrelated.scoop", "to" = "${work}/provider/src/unrelated.scoop"}},
]

[[steps]]
name = "private"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-private", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/layout-library/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_consumer"
files = [
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/consumer"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/layout-consumer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []
