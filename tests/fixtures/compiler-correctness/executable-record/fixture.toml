schema = 1
name = "executable-record"
inputs = ["../../driver/executable-record/program", "../../driver/executable-record/provider", "../../driver/executable-record/state.py"]
tools = ["scoop", "scoopc", "scoop-link", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["executable", "cache", "multi-cone", "compiler-correctness"]
[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${repo}/tests/fixtures/driver/executable-record/program", to = "${work}/program-source"}}, {copy = {from = "${repo}/tests/fixtures/driver/executable-record/provider", to = "${work}/provider"}}]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "--profile", "debug", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/first/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${cold.result.observations.child_invocations.length}", equals = 2},
]

[[steps]]
name = "run_cold"
argv = ["${cold.result.output}"]
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "debug_file"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "debug", "${work}/cache", "${work}/first/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "one_result"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "count", "${work}/cache", "${work}/first/program", "1"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "save_cold"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "save", "${work}/cache", "${work}/first/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "--profile", "debug", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/first/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm.result.link_plan_fingerprint}", equals = "${cold.result.link_plan_fingerprint}"},
  {actual = "${warm.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "unchanged_warm"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "same", "${work}/cache", "${work}/first/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "another_output"
argv = ["${scoop}", "build", "--profile", "debug", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/second/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${another_output.result.link_plan_fingerprint}", equals = "${cold.result.link_plan_fingerprint}"},
  {actual = "${another_output.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "debug_file_another"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "debug", "${work}/cache", "${work}/second/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "unchanged_another"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "same", "${work}/cache", "${work}/first/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "remove_publication"
files = [{remove = {path = "${work}/second"}}]

[[steps]]
name = "restore_output"
argv = ["${scoop}", "build", "--profile", "debug", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/second/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${restore_output.result.link_plan_fingerprint}", equals = "${cold.result.link_plan_fingerprint}"},
  {actual = "${restore_output.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "debug_file_restored"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "debug", "${work}/cache", "${work}/second/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "unchanged_restored"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "same", "${work}/cache", "${work}/first/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_restored"
argv = ["${restore_output.result.output}"]
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "edit_provider"
files = [{replace = {path = "${work}/provider/src/value.scoop", old = "Int = 40", new = "Int = 41"}}]

[[steps]]
name = "provider_changed"
argv = ["${scoop}", "build", "--profile", "debug", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/first/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_provider_changed"
argv = ["${provider_changed.result.output}"]
exit = 43
stdout = ""
stderr = ""

[[steps]]
name = "two_results"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "count", "${work}/cache", "${work}/first/program", "2"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "edit_root"
files = [{replace = {path = "${work}/program-source/src/main.scoop", old = "value() + 2", new = "value() + 3"}}]

[[steps]]
name = "root_changed"
argv = ["${scoop}", "build", "--profile", "debug", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/first/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${root_changed.result.observations.child_invocations.length}", equals = 1},
]

[[steps]]
name = "run_root_changed"
argv = ["${root_changed.result.output}"]
exit = 44
stdout = ""
stderr = ""

[[steps]]
name = "three_results"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "count", "${work}/cache", "${work}/first/program", "3"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "release"
argv = ["${scoop}", "build", "--profile", "release", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/release/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "release_has_no_debug_file"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "none", "${work}/cache", "${work}/release/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_release"
argv = ["${release.result.output}"]
exit = 44
stdout = ""
stderr = ""

[[steps]]
name = "release_keep_symbols"
argv = ["${scoop}", "build", "--profile", "release", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/release/program", "--keep-symbols"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${release_keep_symbols.result.root.path}", equals = "${release.result.root.path}"},
  {actual = "${release_keep_symbols.result.link_plan_fingerprint}", not_equals = "${release.result.link_plan_fingerprint}"},
  {actual = "${release_keep_symbols.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "two_profiles_and_symbol_policy"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "count", "${work}/cache", "${work}/first/program", "5"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "debug_again"
argv = ["${scoop}", "build", "--profile", "debug", "${work}/program-source", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/first/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${debug_again.result.link_plan_fingerprint}", equals = "${root_changed.result.link_plan_fingerprint}"},
  {actual = "${debug_again.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "artifact_link"
argv = ["${scoop}", "link", "--keep-symbols", "--emit-debug-file", "--enable-stack-trace=true", "--root-slib", "${root_changed.result.root.path}", {each = "${root_changed.result.dependencies}", field = "path", prefix = "--dependency-slib"}, "--runtime-objects", "${root_changed.result.runtime_index}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", {each = "${link_args}"}, "-o", "${work}/artifact/program", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${artifact_link.result.link_plan_fingerprint}", equals = "${root_changed.result.link_plan_fingerprint}"},
]

[[steps]]
name = "artifact_debug_file"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "debug", "${work}/cache", "${work}/artifact/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "standalone_link"
argv = ["${scoop-link}", "--keep-symbols", "--emit-debug-file", "--enable-stack-trace=true", "--root-slib", "${root_changed.result.root.path}", {each = "${root_changed.result.dependencies}", field = "path", prefix = "--dep-slib"}, "--runtime-objects", "${root_changed.result.runtime_index}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", {each = "${link_args}"}, "-o", "${work}/standalone/program"]
exit = 0
stdout = "link-plan ${root_changed.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "standalone_debug_file"
argv = ["${python}", "${repo}/tests/fixtures/driver/executable-record/state.py", "debug", "${work}/cache", "${work}/standalone/program", "${work}/unchanged.json"]
exit = 0
stdout = ""
stderr = ""
