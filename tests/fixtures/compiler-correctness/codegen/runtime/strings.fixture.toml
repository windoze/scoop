schema = 1
name = "runtime-strings"
root = "strings.scoop"
inputs = ["strings.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["string", "intrinsics", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug"}}, {"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = "bounded String reads preserved\n"
stderr = ""
json = "stderr"
diagnostics = []
