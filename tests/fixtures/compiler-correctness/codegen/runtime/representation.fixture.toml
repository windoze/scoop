schema = 1
name = "runtime-representation"
root = "representation.scoop"
inputs = ["representation.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["boxing", "array", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug"}}, {"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = "boxing, cloning and moving references preserved\n"
stderr = ""
json = "stderr"
diagnostics = []
