schema = 1
name = "runtime-cards"
root = "cards.scoop"
inputs = ["cards.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["barriers", "optimization", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug"}}, {"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = "local field barriers preserve writes and receiver changes\n"
stderr = ""
json = "stderr"
diagnostics = []
