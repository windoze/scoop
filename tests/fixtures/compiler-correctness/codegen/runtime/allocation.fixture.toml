schema = 1
name = "runtime-allocation"
root = "allocation.scoop"
inputs = ["allocation.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["allocation", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug"}}, {"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = "fixed, array and zero-sized allocation preserved\n"
stderr = ""
json = "stderr"
diagnostics = []
