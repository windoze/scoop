schema = 1
name = "exceptions-return-paths"
root = "../../language/exceptions/return-paths.scoop"
inputs = ["inspect_returns.py", "../../language/exceptions/return-paths.scoop"]
tools = ["python", "scoop", "scoopc"]
tags = ["stage-structure", "single-file", "run", "compiler-correctness"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--profile", "debug", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "mir", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []


[[steps]]
name = "control_flow"
argv = ["${python}", "${fixture}/inspect_returns.py", "${work}/dump/${build.result.root.identity}/mir.txt", "${work}/returns.txt"]
exit = 0
stdout = ""
stderr = ""
checks = [{file = "${work}/returns.txt", snapshot = "return-paths.control-flow.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "1\n10\n11\n20\n21\n31\n40\nbody\n50\nbody\n51\n"
stderr = ""
