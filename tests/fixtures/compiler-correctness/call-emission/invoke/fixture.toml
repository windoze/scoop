schema = 1
name = "call-emission-invoke"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["codegen", "invoke", "dispatch", "compiler-correctness"]
[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "12\n22\n31\n41\ncaught\ncleanup\n"
stderr = ""
