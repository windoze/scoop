schema = 1
name = "optimization-profile-native-gc"
root = "program.scoop"
inputs = ["program.scoop", "native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
when = { os = ["darwin", "linux"] }
tags = ["optimization", "cli", "cache", "ffi", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug"}}, {"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "cold_cache"
files = [
  {mkdir = {path = "${work}/compile-cache"}},
  {remove = {path = "${work}/compile-cache"}},
]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-c", "${fixture}/native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libfixture_native.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/compile-cache", "--library-path", "${work}", "--profile", "${profile}", "-o", "${work}/program", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${build.result.profile}", equals = "${profile}"},
  {actual = "${build.result.observations.child_invocations.length}", equals = 1},
]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${work}/compile-cache", "--library-path", "${work}", "--profile", "${profile}", "-o", "${work}/program", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm.result.observations.child_invocations}", equals = []},
  {actual = "${warm.result.root.artifact_fingerprint}", equals = "${build.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "direct_core"
files = [
  {mkdir = {path = "${work}/direct-sysroot/lib/${target}"}},
  {copy = {from = "${build.result.dependencies.0.path}", to = "${work}/direct-sysroot/lib/${target}/scoop.core.slib"}},
  {copy = {from = "${sysroot}/include", to = "${work}/direct-sysroot/include"}},
]

[[steps]]
name = "direct"
argv = ["${scoopc}", "build", {each = "${compile_args}"}, "${root}", "--sysroot", "${work}/direct-sysroot", "--profile", "${profile}", "--direct-slib", "${sysroot}/lib/${target}/scoop.std.slib", "--out-slib", "${work}/direct.slib"]
exit = 0
stdout = ""
stderr = ""
checks = [{file = "${work}/direct.slib", same_as = "${build.result.root.path}"}]

[[steps]]
name = "run"
argv = ["${warm.result.output}"]
exit = 0
stdout = "52\n"
stderr = ""
