schema = 1
name = "integer-conditions"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["optimization", "constant-branches", "compiler-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "43\nsigned\nunsigned\n"
stderr = ""
