schema = 1
name = "local-effects"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop"]
when = { os = ["darwin", "linux"] }
tags = ["optimization", "constant-branches", "enum", "option", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug"}}, {"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "40\n7\n40\n-9223372036854775808\n99\n13\n"
stderr = ""
