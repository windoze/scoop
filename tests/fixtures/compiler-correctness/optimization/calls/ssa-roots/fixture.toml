schema = 1
name = "ssa-roots"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoop-link"]
when = { os = ["darwin", "linux"] }
tags = ["optimization", "exceptions", "closure", "context", "generic", "stage-golden", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug", "symbol_args" = ["--keep-symbols", "--emit-debug-file"], "stack_trace" = "true"}}, {"name" = "release", "vars" = {"profile" = "release", "symbol_args" = [], "stack_trace" = "false"}}]

[[steps]]
name = "prepare"
files = [{copy = {from = "${root}", to = "${work}/source/program.scoop"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/source/program.scoop", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--target-dir", "${work}/target", "--emit", "lir", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"file" = "${work}/dump/${build.result.root.identity}/lir.txt", "snapshot" = "program.${profile}.${target_facts.arch}.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n42\n21\n22\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop-link}", {"each" = "${link_args}"}, {"each" = "${symbol_args}"}, "--root-slib", "${build.result.root.path}", {"each" = "${build.result.dependencies}", "field" = "path", "prefix" = "--dep-slib"}, "--runtime-objects", "${build.result.runtime_index}", "-o", "${work}/programs/link/program", "--cache-dir", "${cache}", "--sysroot", "${sysroot}", "--enable-stack-trace=${stack_trace}"]
exit = 0
stdout = "link-plan ${build.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run_linked"
argv = ["${work}/programs/link/program"]
exit = 0
stdout = "42\n42\n21\n22\n"
stderr = ""
