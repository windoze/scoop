schema = 1
name = "counted-array-bounds"
root = "program.scoop"
inputs = ["program.scoop", "inspect.py"]
tools = ["scoop", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["optimization", "array", "poll", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--profile", "${profile}", "--emit", "mir", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "inspect"
argv = ["${python}", "${fixture}/inspect.py", "${work}/dump/${build.result.root.identity}/mir.txt", "${profile}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "array bounds preserve ranges, aliases and exceptional prefixes\n"
stderr = ""
