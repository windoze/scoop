schema = 1
name = "array-inline-ranges"
inputs = ["Cone.toml", "src/main.scoop", "src/kernels.scoop", "inspect.py"]
tools = ["scoop", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["optimization", "array", "inlining", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--profile", "${profile}", "--emit", "all", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "inspect"
argv = ["${python}", "${fixture}/inspect.py", "${work}/dump/${build.result.root.identity}", "${profile}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "array inline ranges preserve snapshots and failing prefixes\n"
stderr = ""
