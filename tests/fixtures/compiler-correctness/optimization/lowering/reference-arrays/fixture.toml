schema = 1
name = "reference-array-kernels"
inputs = ["Cone.toml", "main.scoop", "edges.scoop", "inspect.py", "../../../../../benchmarks/arrays/references/src/kernels.scoop"]
tools = ["scoop", "python"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["optimization", "array", "reference", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "prepare"
files = [
    {copy = {from = "${fixture}/Cone.toml", to = "${work}/cone/Cone.toml"}},
    {copy = {from = "${fixture}/main.scoop", to = "${work}/cone/src/main.scoop"}},
    {copy = {from = "${fixture}/edges.scoop", to = "${work}/cone/src/edges.scoop"}},
    {copy = {from = "${fixture}/../../../../../benchmarks/arrays/references/src/kernels.scoop", to = "${work}/cone/src/kernels.scoop"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--profile", "${profile}", "--emit", "all", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "inspect"
argv = ["${python}", "${fixture}/inspect.py", "${work}/dump/${build.result.root.identity}/mir.txt", "${profile}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "reference arrays preserve views, wrappers and checked prefixes\n"
stderr = ""
