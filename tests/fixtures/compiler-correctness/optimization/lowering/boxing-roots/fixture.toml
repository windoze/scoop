schema = 1
name = "boxing-payload-roots"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["optimization", "boxing", "escape", "generic", "compiler-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}, env = {SCOOP_GC_STRESS_MOVE = "1"}},
  {name = "release", vars = {profile = "release"}, env = {SCOOP_GC_STRESS_MOVE = "1", SCOOP_GC_STRESS_MINOR = "1"}},
]
[[steps]]
name = "run"
argv = ["${scoop}", "--enable-gc-stress", "run", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = "boxed aggregate snapshots retain relocated references\n"
stderr = ""
json = "stderr"
diagnostics = []
