schema = 1
name = "devirtualization-artifacts"
inputs = ["provider", "consumer"]
tools = ["scoop", "scoopc", "scoop-link"]
when = { os = ["darwin", "linux"] }
tags = ["stage-golden", "devirtualization", "generics", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug", "provider_profile" = "release", "symbol_args" = ["--keep-symbols", "--emit-debug-file"], "stack_trace" = "true"}}, {"name" = "release", "vars" = {"profile" = "release", "provider_profile" = "debug", "symbol_args" = [], "stack_trace" = "false"}}]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/sources/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/sources/consumer"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--profile", "${provider_profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--message-format", "json", "-o", "${work}/artifacts/dev.m34/devirt-provider/0.1.0/cone.slib", "--emit", "mir", "--dump-dir", "${work}/dump"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"file" = "${work}/dump/${provider.result.root.identity}/mir.txt", "snapshot" = "provider.${provider_profile}.mir.txt"},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/consumer", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "--emit", "mir", "--dump-dir", "${work}/dump", "-o", "${work}/programs/consumer/program"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"file" = "${work}/dump/${consumer.result.root.identity}/mir.txt", "snapshot" = "consumer.${profile}.mir.txt"},
]

[[steps]]
name = "link"
argv = ["${scoop-link}", {"each" = "${link_args}"}, "--root-slib", "${consumer.result.root.path}", {"each" = "${consumer.result.dependencies}", "field" = "path", "prefix" = "--dep-slib"}, "--runtime-objects", "${consumer.result.runtime_index}", "-o", "${work}/programs/link/program", "--cache-dir", "${cache}", "--sysroot", "${sysroot}", {"each" = "${symbol_args}"}, "--enable-stack-trace=${stack_trace}"]
exit = 0
stdout = "link-plan ${consumer.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/programs/link/program"]
exit = 0
stdout = "devirtualized artifacts\n"
stderr = ""
