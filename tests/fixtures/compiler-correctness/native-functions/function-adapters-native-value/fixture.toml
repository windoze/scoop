  {actual = "${link.result.link_plan}", contains = "cone dev.example:generic-member-native-value:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:generic-member-downstream-native-value:0.1.0 kind=Library objects="},
