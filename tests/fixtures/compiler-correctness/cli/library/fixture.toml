schema = 1
name = "cli-library-defaults-and-publication"
root = "cone/Cone.toml"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "library", "publication", "compiler-correctness"]
[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--runtime-root", "${runtime}", "--message-format", "json"]

[[steps]]
name = "project"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}]

[[steps]]
name = "default_root"
argv = ["${scoop}", "build", {each = "${link_args}"}, {each = "${options}"}]
cwd = "${work}/cone"
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${default_root.result.kind}", equals = "library"},
  {actual = "${default_root.result.output}", equals = "${work}/cone/target/${target}/debug/library.slib"},
  {file = "${default_root.result.output}", same_as = "${default_root.result.root.path}"},
]

[[steps]]
name = "explicit_root"
argv = ["${scoop}", "build", {each = "${link_args}"}, ".", {each = "${options}"}, "-o", "../published.slib", "--target-dir", "ignored", "--profile", "release"]
cwd = "${work}/cone"
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${explicit_root.result.output}", equals = "${work}/published.slib"},
  {actual = "${explicit_root.result.root.artifact_fingerprint}", not_equals = "${default_root.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "release_warm"
argv = ["${scoop}", "build", {each = "${link_args}"}, ".", {each = "${options}"}, "-o", "../warm.slib", "--profile", "release"]
cwd = "${work}/cone"
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${release_warm.result.observations.child_invocations}", equals = []},
  {actual = "${release_warm.result.root.artifact_fingerprint}", equals = "${explicit_root.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "not_executable"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${work}/cone", {each = "${options}"}, "--scoopc", "${scoopc}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = [{severity = "error", code = "SCOOP_RUN_LIBRARY", phase = "Request", message = "run requires an executable Cone; the root is a library", origin = {kind = "none"}, notes = []}]
