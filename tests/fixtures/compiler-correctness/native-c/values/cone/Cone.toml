schema = 1
[[sources]]
path = "src/main.scoop"
[[sources]]
path = "src/darwin.scoop"
when = {os = "darwin"}
[[sources]]
path = "src/gnu.scoop"
when = {env = "gnu"}
[[sources]]
path = "src/musl.scoop"
when = {env = "musl"}
[cone]
group = "dev.m33"
name = "native-values"
version = "0.1.0"
