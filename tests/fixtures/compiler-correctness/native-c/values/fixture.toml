schema = 1
name = "native-c-values"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native", "ffi", "compiler-correctness"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${fixture}/cone", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "manual_core"
files = [
  {copy = {from = "${build.result.dependencies.0.path}", to = "${work}/manual-sysroot/lib/${target}/scoop.core.slib"}},
  {copy = {from = "${sysroot}/include", to = "${work}/manual-sysroot/include"}},
]

[[steps]]
name = "manual"
argv = ["${scoop}", "build", {each = "${compile_args}"}, "${fixture}/cone", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${work}/manual-sysroot", "-o", "${work}/manual.slib", "--emit-slib", "--cache-dir", "${cache}", "--target-dir", "${work}/compiler-output", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{file = "${work}/manual.slib", same_as = "${build.result.root.path}"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "native-c-ok\n"
stderr = ""
