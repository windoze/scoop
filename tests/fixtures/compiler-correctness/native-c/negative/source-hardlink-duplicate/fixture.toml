schema = 1
name = "native-c-reject-definition-hardlink"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native", "negative", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}, {hardlink = {from = "${work}/cone/native.c", to = "${work}/cone/alias.c"}}]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
diagnostics_normalize = ["native-digests"]
