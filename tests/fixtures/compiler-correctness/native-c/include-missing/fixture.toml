schema = 1
name = "native-c-include-missing"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["native", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
