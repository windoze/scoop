schema = 1
name = "native-link-mixed"
inputs = ["mixed-provider", "../../../language/native-link/mixed/provider.scoop", "mixed-left", "../../../language/native-link/mixed/left.scoop", "mixed-right", "../../../language/native-link/mixed/right.scoop", "mixed-root", "../../../language/native-link/mixed/root.scoop", "../../../language/native-link/mixed/archive.c", "../../../language/native-link/mixed/helper.c", "../../../language/native-link/mixed/unused.c", "../../../language/native-link/mixed/dynamic.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
when = { os = "darwin" }
tags = ["native-link", "program-link", "compiler-correctness"]
variants = [{"name" = "normal"}]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/mixed-provider", "to" = "${work}/sources/mixed-provider"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/provider.scoop", "to" = "${work}/sources/mixed-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/mixed-left", "to" = "${work}/sources/mixed-left"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/left.scoop", "to" = "${work}/sources/mixed-left/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/mixed-right", "to" = "${work}/sources/mixed-right"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/right.scoop", "to" = "${work}/sources/mixed-right/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/mixed-root", "to" = "${work}/sources/mixed-root"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/root.scoop", "to" = "${work}/sources/mixed-root/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/archive.c", "to" = "${work}/sources/native/mixed/archive.c"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/helper.c", "to" = "${work}/sources/native/mixed/helper.c"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/unused.c", "to" = "${work}/sources/native/mixed/unused.c"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/mixed/dynamic.c", "to" = "${work}/sources/native/mixed/dynamic.c"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]

[[steps]]
name = "compile_0"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/mixed/archive.c", "-o", "${work}/objects/archive.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "compile_1"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/mixed/helper.c", "-o", "${work}/objects/helper.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "compile_2"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/mixed/unused.c", "-o", "${work}/objects/unused.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "compile_3"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/mixed/dynamic.c", "-o", "${work}/objects/dynamic.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "dylib_3"
argv = ["${cc}", {each = "${cc_args}"}, "-dynamiclib", "${work}/objects/dynamic.o", "-install_name", "@rpath/libm23_mix_dynamic.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-o", "${work}/native/libm23_mix_dynamic.dylib"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "archive_m23_mix_archive"
argv = ["${ar}", "qcS", "${work}/native/libm23_mix_archive.a", "${work}/objects/archive.o", "${work}/objects/helper.o", "${work}/objects/unused.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "build"
timeout = 300
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/mixed-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native", "-o", "${work}/programs/build/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 4},
  {"actual" = "${build.result.dependencies.0.coordinate.name}", "equals" = "scoop.core"},
  {"actual" = "${build.result.dependencies.1.coordinate.name}", "equals" = "mixed-provider"},
  {"actual" = "${build.result.dependencies.2.coordinate.name}", "equals" = "mixed-left"},
  {"actual" = "${build.result.dependencies.3.coordinate.name}", "equals" = "mixed-right"},
  {"actual" = "${build.result.root.coordinate.name}", "equals" = "mixed-root"},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "100\n0\n200\n56\n96\n121\nmixed-alive\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.1.path}", "to" = "${work}/artifacts/1.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.2.path}", "to" = "${work}/artifacts/2.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.3.path}", "to" = "${work}/artifacts/3.slib"}},
  {"symlink" = {"from" = "${work}/native", "to" = "${work}/native-alias"}},
]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--emit-debug-file", "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/3.slib", "--dependency-slib", "${work}/artifacts/2.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "100\n0\n200\n56\n96\n121\nmixed-alive\n"
stderr = ""

[[steps]]
name = "aliases_0"
argv = ["${scoop}", "link", "--emit-debug-file", "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/2.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/3.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native", "--library-path", "${work}/native-alias", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${aliases_0.result.link_plan}", "equals" = "${link.result.link_plan}"}, {"actual" = "${aliases_0.result.link_plan_fingerprint}", "equals" = "${link.result.link_plan_fingerprint}"}]

[[steps]]
name = "aliases_1"
argv = ["${scoop}", "link", "--emit-debug-file", "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/2.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/3.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native-alias", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${aliases_1.result.link_plan}", "equals" = "${link.result.link_plan}"}, {"actual" = "${aliases_1.result.link_plan_fingerprint}", "equals" = "${link.result.link_plan_fingerprint}"}]
