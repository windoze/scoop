schema = 1
name = "native-link-reject-callbacks-bad-unsafe"
inputs = ["source-error", "../../../language/native-link/callbacks/bad-unsafe.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["native-link", "negative", "canonical-diagnostics", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/source-error", "to" = "${work}/sources/source-error"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/callbacks/bad-unsafe.scoop", "to" = "${work}/sources/source-error/src/main.scoop"}}]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/source-error", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/rejected"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [{"file" = "${work}/rejected", "exists" = false}, {"file" = "${work}/sources/source-error/rejected.slib", "exists" = false}]
