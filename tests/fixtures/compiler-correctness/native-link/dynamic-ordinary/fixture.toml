schema = 1
name = "native-link-dynamic-ordinary"
inputs = ["cone", "../../../language/native-link/direct/root.scoop", "../../../language/native-link/direct/native.c", "native-sources/compile_m23_facade.c", "native-sources/compile_ordinary.c"]
tools = ["scoop", "scoopc", "cc"]
# This fixture exercises Mach-O dylib, dyld namespace, or framework behavior.
targets = ["aarch64-apple-darwin"]
tags = ["native-link", "program-link", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/ordinary-load"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/root.scoop", "to" = "${work}/sources/ordinary-load/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "library_binding"
files = [{"replace" = {"path" = "${work}/sources/ordinary-load/src/main.scoop", "old" = "m23_math", "new" = "m23_facade"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_leaf"
files = [{"copy" = {"from" = "${fixture}/../../../language/native-link/direct/native.c", "to" = "${work}/sources/native/build-m23_leaf.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_leaf"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_leaf.c", "-o", "${work}/objects/build-m23_leaf.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "dylib_m23_leaf"
argv = ["${cc}", "-target", "arm64-apple-macos", "-dynamiclib", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "${work}/objects/build-m23_leaf.o", "-install_name", "@rpath/libm23_leaf.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-o", "${work}/native/libm23_leaf.dylib"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "prepare_compile_m23_facade"
files = [{"copy" = {"from" = "${fixture}/native-sources/compile_m23_facade.c", "to" = "${work}/sources/native/build-m23_facade.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_facade"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_facade.c", "-o", "${work}/objects/build-m23_facade.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "dylib_m23_facade"
argv = ["${cc}", "-target", "arm64-apple-macos", "-dynamiclib", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "${work}/objects/build-m23_facade.o", "-install_name", "@rpath/libm23_facade.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-Wl,-reexport_library", "${work}/native/libm23_leaf.dylib", "-o", "${work}/native/libm23_facade.dylib"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/sources/ordinary-load", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "prepare_compile_ordinary"
files = [{"copy" = {"from" = "${fixture}/native-sources/compile_ordinary.c", "to" = "${work}/sources/native/build-ordinary.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_ordinary"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-ordinary.c", "-o", "${work}/objects/build-ordinary.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "dylib_ordinary"
argv = ["${cc}", "-target", "arm64-apple-macos", "-dynamiclib", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "${work}/objects/build-ordinary.o", "-install_name", "@rpath/libm23_facade.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "${work}/native/libm23_leaf.dylib", "-o", "${work}/native/libm23_facade.dylib"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "previous_reject_nonpublic"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject_nonpublic"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject_nonpublic.json"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]

[[steps]]
name = "remove_dependency"
files = [{"remove" = {"path" = "${work}/native/libm23_leaf.dylib"}}]
checks = []

[[steps]]
name = "previous_reject_missing"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject_missing"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject_missing.json"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]
