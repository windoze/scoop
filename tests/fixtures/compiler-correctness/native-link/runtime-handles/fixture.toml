schema = 1
name = "native-link-runtime-handles"
inputs = ["gc-provider", "../../../language/native-link/runtime/provider.scoop", "gc-combined", "../../../language/native-link/runtime/combined.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "compiler-correctness"]
variants = [{"name" = "normal"}]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/gc-provider", "to" = "${work}/sources/gc-provider"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/runtime/provider.scoop", "to" = "${work}/sources/gc-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/gc-combined", "to" = "${work}/sources/gc-combined"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/runtime/combined.scoop", "to" = "${work}/sources/gc-combined/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]

[[steps]]
name = "build"
timeout = 300
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/gc-combined", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 2},
  {"actual" = "${build.result.dependencies.0.coordinate.name}", "equals" = "scoop.core"},
  {"actual" = "${build.result.dependencies.1.coordinate.name}", "equals" = "gc-provider"},
  {"actual" = "${build.result.root.coordinate.name}", "equals" = "gc-combined"},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "handles-alive\nmarker-alive\nhandles-alive\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${build.result.root.path}", "--dependency-slib", "${build.result.dependencies.1.path}", "--dependency-slib", "${build.result.dependencies.0.path}", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "handles-alive\nmarker-alive\nhandles-alive\n"
stderr = ""
