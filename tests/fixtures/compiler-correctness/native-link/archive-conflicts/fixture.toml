schema = 1
name = "native-link-archive-conflicts"
inputs = ["cone", "../../../language/native-link/direct/root.scoop", "../../../language/native-link/direct/native.c", "native-sources/first_missing.c", "native-sources/second_missing.c", "native-sources/first_strong.c", "native-sources/second_strong.c", "native-sources/first_weak.c", "native-sources/second_weak.c", "native-sources/first_constructor.c", "native-sources/second_constructor.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/archive"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/root.scoop", "to" = "${work}/sources/archive/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_good"
files = [{"copy" = {"from" = "${fixture}/../../../language/native-link/direct/native.c", "to" = "${work}/sources/native/good.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_good"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/good.c", "-o", "${work}/objects/good.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "archive_m23_math"
argv = ["${ar}", "qcS", "${work}/native/libm23_math.a", "${work}/objects/good.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/archive", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "prepare_first_missing"
files = [{"copy" = {"from" = "${fixture}/native-sources/first_missing.c", "to" = "${work}/sources/native/first.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "first_missing"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/first.c", "-o", "${work}/objects/first.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "prepare_second_missing"
files = [{"copy" = {"from" = "${fixture}/native-sources/second_missing.c", "to" = "${work}/sources/native/second.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "second_missing"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/second.c", "-o", "${work}/objects/second.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "remove_archive_missing"
files = [{"remove" = {"path" = "${work}/native/libm23_math.a"}}]
checks = []

[[steps]]
name = "archive_missing"
argv = ["${ar}", "qcS", "${work}/native/libm23_math.a", "${work}/objects/first.o", "${work}/objects/second.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "previous_reject_missing"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "reject_missing"
diagnostics_normalize = ["native-digests"]
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "reject_missing.${target}.json"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]

[[steps]]
name = "prepare_first_strong"
files = [{"copy" = {"from" = "${fixture}/native-sources/first_strong.c", "to" = "${work}/sources/native/first.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
