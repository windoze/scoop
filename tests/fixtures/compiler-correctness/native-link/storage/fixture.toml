schema = 1
name = "native-link-storage"
inputs = ["storage", "../../../language/native-link/storage/root.scoop", "../../../language/native-link/storage/native.c"]
tools = ["scoop", "scoopc", "cc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "compiler-correctness"]
variants = [{"name" = "normal"}]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/storage", "to" = "${work}/sources/storage"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/storage/root.scoop", "to" = "${work}/sources/storage/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/storage/native.c", "to" = "${work}/sources/native/storage/native.c"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]

[[steps]]
name = "compile_0"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/storage/native.c", "-o", "${work}/native/m23_storage.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "build"
timeout = 300
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/storage", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native", "-o", "${work}/programs/build/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 1},
  {"actual" = "${build.result.dependencies.0.coordinate.name}", "equals" = "scoop.core"},
  {"actual" = "${build.result.root.coordinate.name}", "equals" = "storage"},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "30\n40\n43\n32\n31\n0\n33\n34\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--emit-debug-file", "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "30\n40\n43\n32\n31\n0\n33\n34\n"
stderr = ""
