schema = 1
name = "native-link-dynamic-overlap"
inputs = ["cone", "../../../language/native-link/dynamic/overlap.scoop", "../../../language/native-link/dynamic/a.c", "../../../language/native-link/dynamic/b.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
# This fixture exercises Mach-O dylib, dyld namespace, or framework behavior.
when = { os = "darwin" }
tags = ["native-link", "program-link", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/dynamic"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/dynamic/overlap.scoop", "to" = "${work}/sources/dynamic/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_a"
files = [{"copy" = {"from" = "${fixture}/../../../language/native-link/dynamic/a.c", "to" = "${work}/sources/native/build-m23_a.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_a"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_a.c", "-o", "${work}/objects/build-m23_a.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "dylib_m23_a"
argv = ["${cc}", {each = "${cc_args}"}, "-dynamiclib", "${work}/objects/build-m23_a.o", "-install_name", "@rpath/libm23_a.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-o", "${work}/native/libm23_a.dylib"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "prepare_compile_m23_b"
files = [{"copy" = {"from" = "${fixture}/../../../language/native-link/dynamic/b.c", "to" = "${work}/sources/native/build-m23_b.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_b"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_b.c", "-o", "${work}/objects/build-m23_b.o"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "dylib_m23_b"
argv = ["${cc}", {each = "${cc_args}"}, "-dynamiclib", "${work}/objects/build-m23_b.o", "-install_name", "@rpath/libm23_b.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-o", "${work}/native/libm23_b.dylib"]
exit = 0
stdout = ""
stderr = ""
env = {"PATH" = "/usr/bin:/bin"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/dynamic", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${build.result.root.path}", "--dependency-slib", "${build.result.dependencies.0.path}", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "--target", "${target}", "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--dump-plan"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan}", "contains" = "dynamic binding _m23_foo -> \"@rpath/libm23_a.dylib\""}, {"actual" = "${link.result.link_plan}", "contains" = "dynamic binding _m23_bar -> \"@rpath/libm23_b.dylib\""}, {"actual" = "${link.result.link_plan}", "contains" = "rpath "}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "11\n22\n"
stderr = ""
