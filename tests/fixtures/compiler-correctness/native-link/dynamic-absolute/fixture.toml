schema = 1
name = "native-link-dynamic-absolute"
inputs = ["cone", "../../../language/native-link/direct/root.scoop", "../../../language/native-link/direct/native.c"]
tools = ["scoop", "scoopc", "cc"]
# This fixture exercises Mach-O dylib, dyld namespace, or framework behavior.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
tags = ["native-link", "program-link", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/absolute"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/root.scoop", "to" = "${work}/sources/absolute/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_math"
files = [{"copy" = {"from" = "${fixture}/../../../language/native-link/direct/native.c", "to" = "${work}/sources/native/build-m23_math.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_math"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/build-m23_math.c", "-o", "${work}/objects/build-m23_math.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "dylib_m23_math"
argv = ["${cc}", {each = "${cc_args}"}, "-dynamiclib", "${work}/objects/build-m23_math.o", "-install_name", "${work}/native/libm23_math.dylib", "-current_version", "2.0", "-compatibility_version", "1.0", "-o", "${work}/native/libm23_math.dylib"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/absolute", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native", "-o", "${work}/programs/build/program"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--emit-debug-file", "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan}", "not_contains" = "\nrpath "}, {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"actual" = "${link.result.link_plan}", "contains" = "dynamic binding _m23_add -> \"${work}/native/libm23_math.dylib\""}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "prepare_stub"
files = [{"write" = {"path" = "${work}/stubs/libm23_math.tbd", "data" = "--- !tapi-tbd\ntbd-version: 4\ntargets: [arm64-macos, x86_64-macos]\ninstall-name: \"${work}/native/libm23_math.dylib\"\ncurrent-version: 2.0.0\ncompatibility-version: 1.0.0\nexports:\n  - targets: [arm64-macos, x86_64-macos]\n    symbols: [_m23_add]\n    weak-symbols: []\n    thread-local-symbols: []\n...\n"}}]
checks = []

[[steps]]
name = "stub_link"
argv = ["${scoop}", "link", "--emit-debug-file", "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/stubs", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${stub_link.result.link_plan}", "not_contains" = "\nrpath "}, {"actual" = "${stub_link.result.link_plan_fingerprint}", "not_equals" = "${link.result.link_plan_fingerprint}"}]

[[steps]]
name = "run_stub"
argv = ["${stub_link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "previous_ambiguous"
files = [{"write" = {"path" = "${work}/program", "data" = "previous executable"}}]
checks = []

[[steps]]
name = "ambiguous"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {each = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--library-path", "${work}/stubs", "--cache-dir", "${cache}"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "ambiguous.${target}.json"}
checks = [{"file" = "${work}/program", "equals" = "previous executable"}]
