schema = 1
name = "native-link-direct-reexport"
inputs = ["native-provider", "../../../language/native-link/direct/provider.scoop", "native-facade", "../../../language/native-link/direct/facade.scoop", "native-root", "../../../language/native-link/direct/combined.scoop", "../../../language/native-link/direct/native.c"]
tools = ["scoop", "scoopc", "cc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "compiler-correctness"]
variants = [{"name" = "normal"}]

[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/native-provider", "to" = "${work}/sources/native-provider"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/provider.scoop", "to" = "${work}/sources/native-provider/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/native-facade", "to" = "${work}/sources/native-facade"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/facade.scoop", "to" = "${work}/sources/native-facade/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/native-root", "to" = "${work}/sources/native-root"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/combined.scoop", "to" = "${work}/sources/native-root/src/main.scoop"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/native.c", "to" = "${work}/sources/native/direct/native.c"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]

[[steps]]
name = "compile_0"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/direct/native.c", "-o", "${work}/native/m23_math.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "build"
timeout = 300
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/native-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${build.result.dependencies.length}", "equals" = 3},
  {"actual" = "${build.result.dependencies.0.coordinate.name}", "equals" = "scoop.core"},
  {"actual" = "${build.result.dependencies.1.coordinate.name}", "equals" = "native-provider"},
  {"actual" = "${build.result.dependencies.2.coordinate.name}", "equals" = "native-facade"},
  {"actual" = "${build.result.root.coordinate.name}", "equals" = "native-root"},
]

[[steps]]
name = "run_built"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n42\n"
stderr = ""

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.1.path}", "to" = "${work}/artifacts/1.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.2.path}", "to" = "${work}/artifacts/2.slib"}},
]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/2.slib", "--dependency-slib", "${work}/artifacts/1.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "-o", "${work}/artifacts/program", "--message-format", "json", "--dump-plan", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${build.result.link_plan_fingerprint}"}, {"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n42\n"
stderr = ""
