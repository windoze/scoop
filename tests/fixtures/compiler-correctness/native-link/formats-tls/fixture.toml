schema = 1
name = "native-link-formats-tls"
inputs = ["cone", "../../../language/native-link/final/root.scoop", "native-sources/compile_m23_final.c"]
tools = ["scoop", "scoopc", "cc"]
# Exercise the target toolchain's normal TLV storage.
targets = ["aarch64-apple-darwin"]
tags = ["native-link", "program-link", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/records"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/final/root.scoop", "to" = "${work}/sources/records/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_m23_final"
files = [{"copy" = {"from" = "${fixture}/native-sources/compile_m23_final.c", "to" = "${work}/sources/native/m23_final.c"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "compile_m23_final"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/m23_final.c", "-o", "${work}/objects/m23_final.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "install_m23_final"
files = [{"copy" = {"from" = "${work}/objects/m23_final.o", "to" = "${work}/native/m23_final.o"}}]
checks = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/records", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "control"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
