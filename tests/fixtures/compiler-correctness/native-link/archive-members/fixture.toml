schema = 1
name = "native-link-archive-members"
inputs = ["cone", "../../../language/native-link/direct/root.scoop", "../../../language/native-link/direct/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["native-link", "program-link", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{"copy" = {"from" = "${fixture}/cone", "to" = "${work}/sources/same"}}, {"copy" = {"from" = "${fixture}/../../../language/native-link/direct/root.scoop", "to" = "${work}/sources/same/src/main.scoop"}}, {"mkdir" = {"path" = "${work}/native"}}, {"mkdir" = {"path" = "${work}/objects"}}]
checks = []

[[steps]]
name = "prepare_compile_left_same"
files = [{"copy" = {"from" = "${fixture}/../../../language/native-link/direct/native.c", "to" = "${work}/sources/native/left/same.c"}}, {"mkdir" = {"path" = "${work}/objects/left"}}]
checks = []

[[steps]]
name = "compile_left_same"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/sources/native/left/same.c", "-o", "${work}/objects/left/same.o"]
exit = 0
stdout = ""
stderr = ""
[[steps]]
name = "copy_member"
files = [{"copy" = {"from" = "${work}/objects/left/same.o", "to" = "${work}/objects/right/same.o"}}]
checks = []

[[steps]]
name = "archive_m23_math"
argv = ["${ar}", "qcS", "${work}/native/libm23_math.a", "${work}/objects/left/same.o", "${work}/objects/right/same.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/same", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [
  {"copy" = {"from" = "${build.result.root.path}", "to" = "${work}/artifacts/root.slib"}},
  {"copy" = {"from" = "${build.result.dependencies.0.path}", "to" = "${work}/artifacts/0.slib"}},
]
checks = []

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--root-slib", "${work}/artifacts/root.slib", "--dependency-slib", "${work}/artifacts/0.slib", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", {"each" = "${link_args}"}, "--message-format", "json", "-o", "${work}/program", "--library-path", "${work}/native", "--dump-plan", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${link.result.link_plan}", "snapshot" = "link.${target}.plan", "normalize" = ["paths", "native-digests", "native-link-plan"]}]

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
