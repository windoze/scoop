schema = 1
name = "native-libraries-explicit"
inputs = ["cone", "native.c"]
tools = ["scoop", "cc", "ar"]
when = { os = ["darwin", "linux"] }
tags = ["native", "libraries", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-c", "${fixture}/native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libm.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${fixture}/cone", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = ""
stderr = ""
