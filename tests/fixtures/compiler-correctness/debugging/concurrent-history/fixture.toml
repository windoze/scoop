schema = 1
name = "concurrent-throwable-history"
inputs = ["program", "verify.py"]
tools = ["scoop", "scoopc", "python"]
tags = ["debugging", "exceptions", "gc", "compiler-correctness"]
variants = [{name = "moving", env = {SCOOP_GC_STRESS_MOVE = "1", SCOOP_GC_STRESS_MINOR = "1"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/program", {each = "${link_args}"}, "--release", "--debug-info", "line-tables", "--enable-gc-stress", "--enable-stack-trace", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--lockfile", "${work}/Cone.lock", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "observe"
argv = ["${python}", "${fixture}/verify.py", "${build.result.output}"]
exit = 0
stdout = ""
stderr = ""
