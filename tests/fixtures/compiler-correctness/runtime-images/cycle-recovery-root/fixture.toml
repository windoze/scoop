schema = 1
name = "runtime-images-cycle-recovery-root"
inputs = ["../../../language/imported-classes/support/stage3_test.scoop", "cycle-recovery-provider", "../../../language/runtime-images/cycle-recovery-provider.scoop", "../support/trace.c", "cycle-recovery-root", "../../../language/runtime-images/cycle-recovery-root.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["runtime-images", "lazy", "compiler-correctness"]
[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_cycle-recovery-provider"
files = [
  {"copy" = {"from" = "${fixture}/cycle-recovery-provider", "to" = "${work}/sources/cycle-recovery-provider"}},
  {"copy" = {"from" = "${fixture}/../../../language/runtime-images/cycle-recovery-provider.scoop", "to" = "${work}/sources/cycle-recovery-provider/src/main.scoop"}},
]

[[steps]]
name = "cycle-recovery-provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/cycle-recovery-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-cycle-recovery-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/cycle-recovery-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../support/trace.c", "to" = "${work}/native/trace.c"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/native/trace.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_runtime_images.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_cycle-recovery-root"
files = [
  {"copy" = {"from" = "${fixture}/cycle-recovery-root", "to" = "${work}/sources/cycle-recovery-root"}},
  {"copy" = {"from" = "${fixture}/../../../language/runtime-images/cycle-recovery-root.scoop", "to" = "${work}/sources/cycle-recovery-root/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/cycle-recovery-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/programs/program/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--emit-debug-file", {"each" = "${link_args}"}, "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 2},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:cycle-recovery-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:cycle-recovery-root:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=3 root=${symbol_prefix}scoop$$1$$re$$89b1fd4d505e986fa3f51fc23176d75680d6f1356ddb7576f943299e90004ac4"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""
