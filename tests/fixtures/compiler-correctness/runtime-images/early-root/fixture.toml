schema = 1
name = "runtime-images-early-root"
inputs = ["../../../language/imported-classes/support/stage3_test.scoop", "early-chain", "../../../language/runtime-images/early-chain.scoop", "../support/trace.c", "early-root", "../../../language/runtime-images/early-root.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
when = { os = ["darwin", "linux"] }
tags = ["runtime-images", "early", "compiler-correctness"]
[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_early-chain"
files = [
  {"copy" = {"from" = "${fixture}/early-chain", "to" = "${work}/sources/early-chain"}},
  {"copy" = {"from" = "${fixture}/../../../language/runtime-images/early-chain.scoop", "to" = "${work}/sources/early-chain/src/main.scoop"}},
]

[[steps]]
name = "early-chain"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/early-chain", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-early-chain", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/early-chain/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../support/trace.c", "to" = "${work}/native/trace.c"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/native/trace.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_runtime_images.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_early-root"
files = [
  {"copy" = {"from" = "${fixture}/early-root", "to" = "${work}/sources/early-root"}},
  {"copy" = {"from" = "${fixture}/../../../language/runtime-images/early-root.scoop", "to" = "${work}/sources/early-root/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/early-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/programs/program/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", "--emit-debug-file", {"each" = "${link_args}"}, "--enable-stack-trace=true", "--keep-symbols", "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 2},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:early-chain:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:early-root:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=3 root=${symbol_prefix}scoop$$1$$re$$b12af8bcf41d5a47cb2b42cd06f605792a887c31ba123284c47be1a5dfda8c1d"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "6\n5\n4\n3\n2\n1\n7\n"
stderr = ""
