schema = 1
name = "runtime-images-eager-later-root"
inputs = ["../../../language/imported-classes/support/stage3_test.scoop", "eager-bad-provider", "../../../language/runtime-images/eager-bad-provider.scoop", "eager-later-provider", "../../../language/runtime-images/eager-later-provider.scoop", "../support/trace.c", "eager-later-root", "../../../language/runtime-images/eager-later-root.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["runtime-images", "stopped", "compiler-correctness"]
[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_eager-bad-provider"
files = [
  {"copy" = {"from" = "${fixture}/eager-bad-provider", "to" = "${work}/sources/eager-bad-provider"}},
  {"copy" = {"from" = "${fixture}/../../../language/runtime-images/eager-bad-provider.scoop", "to" = "${work}/sources/eager-bad-provider/src/main.scoop"}},
]

[[steps]]
name = "eager-bad-provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/eager-bad-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-eager-bad-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/eager-bad-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_eager-later-provider"
files = [
  {"copy" = {"from" = "${fixture}/eager-later-provider", "to" = "${work}/sources/eager-later-provider"}},
  {"copy" = {"from" = "${fixture}/../../../language/runtime-images/eager-later-provider.scoop", "to" = "${work}/sources/eager-later-provider/src/main.scoop"}},
]

[[steps]]
name = "eager-later-provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/eager-later-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-eager-later-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/eager-later-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../support/trace.c", "to" = "${work}/native/trace.c"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${work}/native/trace.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_runtime_images.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_eager-later-root"
files = [
  {"copy" = {"from" = "${fixture}/eager-later-root", "to" = "${work}/sources/eager-later-root"}},
  {"copy" = {"from" = "${fixture}/../../../language/runtime-images/eager-later-root.scoop", "to" = "${work}/sources/eager-later-root/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/eager-later-root", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 3},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:eager-bad-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:eager-later-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:eager-later-root:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=4 root=${symbol_prefix}scoop$$1$$re$$ae12a06da616f1ee39ea78b6e70339b5a216646f141240131e0432d6183a3f83"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
stdout = "1\n"
stderr = {regex = "scoop:\\ uncaught\\ exception:\\ n\\(c=scoop%3Ascoop\\.core%3A0\\.1\\.0;p=;o=\\-;k=C;x=IllegalStateException\\)\\ during\\ initialization\\ of\\ top\\-level:bad\\\n  <stack trace unavailable: disabled>\\n"}
exit = 1
