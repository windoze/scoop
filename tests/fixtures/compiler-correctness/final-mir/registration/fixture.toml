schema = 1
name = "final-mir-registration"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["coroutines", "cleanup", "generics", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "sync-body\nsync-done\ntrue\nregistered\nfirst\nregistered\nsecond\nasync-body\nasync-done\nregistered\nfailure\ncaught\ncleanup\nfailure-done\n"
stderr = ""
