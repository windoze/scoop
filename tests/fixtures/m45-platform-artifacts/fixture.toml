schema = 1
name = "m45-platform-artifacts"
inputs = ["consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m45", "platform", "artifacts"]

[[steps]]
name = "platform"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/lib/scoop.platform", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-platform", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.platform/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cone-path", "${work}/artifacts", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "/beta\nbeta\ntrue\n-1\n1\ntrue\nopen\n7\ntrue\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${consumer.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "/beta\nbeta\ntrue\n-1\n1\ntrue\nopen\n7\ntrue\n"
stderr = ""
