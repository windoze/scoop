schema = 1
[cone]
group = "test.m53"
name = "http2-consumer"
version = "0.1.0"
kind = "executable"
[dependencies]
"scoop:scoop.http" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.std" = "0.1.0"

[native]
include = [
    {path = "../../../../sysroot/lib/aarch64-apple-darwin/nghttp2/include", when = {os = "darwin"}},
    {path = "../../../../sysroot/lib/x86_64-unknown-linux-gnu/nghttp2/include", when = {env = "gnu"}},
    {path = "../../../../sysroot/lib/x86_64-unknown-linux-musl/nghttp2/include", when = {env = "musl"}},
]
c_flags = ["-std=c11", "-Wall", "-Wextra", "-Werror", "-DNGHTTP2_STATICLIB"]
[[native.sources]]
path = "peer.c"
