schema = 1
name = "core-layouts-property-initialization-provider"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "../../m23-core-layout-exports/property-initialization-provider.scoop", "consumer", "../support/consumer.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["core-layouts", "property_initialization_uses_close_source_mir_lir_and_both_artifact_views", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"copy" = {"from" = "${fixture}/../../m23-core-layout-exports/property-initialization-provider.scoop", "to" = "${work}/core-source/src/layout_probe.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/core"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${core.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/core/${core.result.root.identity}/ast.txt", "snapshot" = "core.ast.txt"},
  {"file" = "${work}/dump/core/${core.result.root.identity}/hir.txt", "snapshot" = "core.hir.txt"},
  {"file" = "${work}/dump/core/${core.result.root.identity}/mir.txt", "snapshot" = "core.mir.txt"},
  {"file" = "${work}/dump/core/${core.result.root.identity}/lir.txt", "snapshot" = "core.lir.txt"},

]

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_consumer"
files = [
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/consumer"}},
  {"copy" = {"from" = "${fixture}/../support/consumer.scoop", "to" = "${work}/consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/layout-library/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/consumer"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${consumer.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/ast.txt", "snapshot" = "consumer.ast.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/hir.txt", "snapshot" = "consumer.hir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/mir.txt", "snapshot" = "consumer.mir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/lir.txt", "snapshot" = "consumer.lir.txt"},
]

[[steps]]
name = "remove_consumer_source"
files = [
  {"remove" = {"path" = "${work}/consumer"}},
]

[[steps]]
name = "artifact-fingerprints"
checks = [{actual = {"core" = "${core.result.root.artifact_fingerprint}"}, snapshot = "artifacts.${target}.json"}]
