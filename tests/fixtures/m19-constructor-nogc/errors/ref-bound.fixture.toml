schema = 1
name = "constructor-nogc-error-ref-bound"
root = "ref-bound.scoop"
inputs = ["ref-bound.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["constructors", "constructor-nogc", "single-file", "negative"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/rejected"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "ref-bound.diagnostics.json"}
checks = [
  {"file" = "${work}/rejected", "exists" = false},
]
