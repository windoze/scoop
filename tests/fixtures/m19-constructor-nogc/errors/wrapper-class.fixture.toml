schema = 1
name = "constructor-nogc-error-wrapper-class"
root = "wrapper-class.scoop"
inputs = ["wrapper-class.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["constructors", "constructor-nogc", "single-file", "negative"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/rejected"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "wrapper-class.diagnostics.json"}
checks = [
  {"file" = "${work}/rejected", "exists" = false},
]
