schema = 1
name = "release-blocks-native-aggregate-cross-cone"
inputs = ["provider", "consumer", "../native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m24", "release-blocks", "stage-golden"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${sysroot}/lib/scoop.core", to = "${work}/core-source"}},
  {mkdir = {path = "${work}/empty-sysroot"}},
  {copy = {from = "${fixture}/provider", to = "${work}/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
  {mkdir = {path = "${work}/artifacts/test/release-aggregate-provider/0.1.0"}},
]

[[steps]]
name = "prepare_native"
files = [{mkdir = {path = "${work}/native"}}]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${fixture}/../native.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm24_release.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {ZERO_AR_DATE = "1"}

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "remove_core_source"
files = [{remove = {path = "${work}/core-source"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--emit", "all", "--dump-dir", "${work}/dump/provider", "--message-format", "json", "-o", "${work}/artifacts/test/release-aggregate-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/provider/${provider.result.root.identity}/hir.txt", snapshot = "provider.hir.txt"},
  {file = "${work}/dump/provider/${provider.result.root.identity}/mir.txt", snapshot = "provider.mir.txt"},
  {file = "${work}/dump/provider/${provider.result.root.identity}/lir.txt", snapshot = "provider.${target}.lir.txt"},
]

[[steps]]
name = "remove_provider_source"
files = [{remove = {path = "${work}/provider"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--emit", "all", "--dump-dir", "${work}/dump/consumer", "--message-format", "json", "--cone-path", "${work}/artifacts", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/consumer/${consumer.result.root.identity}/hir.txt", snapshot = "consumer.hir.txt"},
  {file = "${work}/dump/consumer/${consumer.result.root.identity}/mir.txt", snapshot = "consumer.mir.txt"},
  {file = "${work}/dump/consumer/${consumer.result.root.identity}/lir.txt", snapshot = "consumer.${target}.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "remove_consumer_source"
files = [{remove = {path = "${work}/consumer"}}, {mkdir = {path = "${work}/empty-sysroot"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {each = "${link_args}"}, "--root-slib", "${consumer.result.root.path}", {each = "${consumer.result.dependencies}", field = "path", prefix = "--dependency-slib"}, "--runtime-objects", "${consumer.result.runtime_index}", "--library-path", "${work}/native", "--sysroot", "${work}/empty-sysroot", "-o", "${work}/relinked", "--message-format", "json"]
env = {LLVM_CONFIG_PATH = "/absent/llvm-config", LLVM_SYS_221_PREFIX = "/absent/llvm"}
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "relinked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "relinked_moving"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}

