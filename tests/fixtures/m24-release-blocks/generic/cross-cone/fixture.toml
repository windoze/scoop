schema = 1
name = "release-blocks-generic-cross-cone"
inputs = ["provider", "left", "right", "consumer", "native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m24", "release-blocks", "stage-golden"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${sysroot}/lib/scoop.core", to = "${work}/core-source"}},
  {mkdir = {path = "${work}/empty-sysroot"}},
  {copy = {from = "${fixture}/left", to = "${work}/left"}},
  {copy = {from = "${fixture}/right", to = "${work}/right"}},
  {mkdir = {path = "${work}/artifacts/test/release-generic-left/0.1.0"}},
  {copy = {from = "${fixture}/provider", to = "${work}/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
  {mkdir = {path = "${work}/artifacts/test/release-generic-provider/0.1.0"}},
]

[[steps]]
name = "prepare_native"
files = [{mkdir = {path = "${work}/native"}}]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${fixture}/native.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm24_release.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {ZERO_AR_DATE = "1"}

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "remove_core_source"
files = [{remove = {path = "${work}/core-source"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--emit", "all", "--dump-dir", "${work}/dump/provider", "--message-format", "json", "-o", "${work}/artifacts/test/release-generic-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/provider/${provider.result.root.identity}/hir.txt", snapshot = "provider.hir.txt"},
  {file = "${work}/dump/provider/${provider.result.root.identity}/mir.txt", snapshot = "provider.mir.txt"},
  {file = "${work}/dump/provider/${provider.result.root.identity}/lir.txt", snapshot = "provider.lir.${target}.txt"},
]

[[steps]]
name = "remove_provider_source"
files = [{remove = {path = "${work}/provider"}}]

[[steps]]
name = "left"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/left", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-left", "--cone-path", "${work}/artifacts", "--emit", "all", "--dump-dir", "${work}/dump/left", "--message-format", "json", "-o", "${work}/artifacts/test/release-generic-left/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/left/${left.result.root.identity}/hir.txt", snapshot = "left.hir.txt"},
  {file = "${work}/dump/left/${left.result.root.identity}/mir.txt", snapshot = "left.mir.txt"},
  {file = "${work}/dump/left/${left.result.root.identity}/lir.txt", snapshot = "left.lir.${target}.txt"},
]

[[steps]]
name = "remove_left_source"
files = [{remove = {path = "${work}/left"}}]

[[steps]]
name = "right"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/right", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-right", "--cone-path", "${work}/artifacts", "--emit", "all", "--dump-dir", "${work}/dump/right", "--message-format", "json", "-o", "${work}/artifacts/test/release-generic-right/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/right/${right.result.root.identity}/hir.txt", snapshot = "right.hir.txt"},
  {file = "${work}/dump/right/${right.result.root.identity}/mir.txt", snapshot = "right.mir.txt"},
  {file = "${work}/dump/right/${right.result.root.identity}/lir.txt", snapshot = "right.lir.${target}.txt"},
]

[[steps]]
name = "remove_right_source"
files = [{remove = {path = "${work}/right"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--emit", "all", "--dump-dir", "${work}/dump/consumer", "--message-format", "json", "--cone-path", "${work}/artifacts", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/consumer/${consumer.result.root.identity}/hir.txt", snapshot = "consumer.hir.txt"},
  {file = "${work}/dump/consumer/${consumer.result.root.identity}/mir.txt", snapshot = "consumer.mir.txt"},
  {file = "${work}/dump/consumer/${consumer.result.root.identity}/lir.txt", snapshot = "consumer.lir.${target}.txt"},
]

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "3\n69\n"
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "3\n69\n"
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "remove_consumer_source"
files = [{remove = {path = "${work}/consumer"}}, {mkdir = {path = "${work}/empty-sysroot"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {each = "${link_args}"}, "--root-slib", "${consumer.result.root.path}", {each = "${consumer.result.dependencies}", field = "path", prefix = "--dependency-slib"}, "--runtime-objects", "${consumer.result.runtime_index}", "--library-path", "${work}/native", "--sysroot", "${work}/empty-sysroot", "-o", "${work}/relinked", "--message-format", "json", "--dump-plan"]
env = {LLVM_CONFIG_PATH = "/absent/llvm-config", LLVM_SYS_221_PREFIX = "/absent/llvm"}
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${link.result.link_plan_fingerprint}", equals = "${consumer.result.link_plan_fingerprint}"},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone test:release-generic-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone test:release-generic-left:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone test:release-generic-right:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone test:release-generic-consumer:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=5 root=${symbol_prefix}scoop$$1$$re$$ffe8993579c787eab60f492174f07ebebe287f6807c4501ddce568cf4597484e"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "relinked"
argv = ["${link.result.output}"]
exit = 0
stdout = "3\n69\n"
stderr = ""

[[steps]]
name = "relinked_moving"
argv = ["${link.result.output}"]
exit = 0
stdout = "3\n69\n"
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}

