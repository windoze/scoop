schema = 1
name = "release-blocks-generic-reject-alias"
inputs = ["consumer", "../../cross-cone/provider"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["m24", "release-blocks", "negative", "canonical-diagnostics"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${sysroot}/lib/scoop.core", to = "${work}/core-source"}},
  {mkdir = {path = "${work}/empty-sysroot"}},
  {copy = {from = "${fixture}/../../cross-cone/provider", to = "${work}/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "remove_core_source"
files = [{remove = {path = "${work}/core-source"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "${work}/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/release-generic-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "remove_provider_source"
files = [{remove = {path = "${work}/provider"}}]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "${work}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/rejected.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{file = "${work}/rejected.slib", exists = false}]
