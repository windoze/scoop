schema = 1
name = "imported-class-primitive-inherited-wrong-argument"
inputs = ["../support/stage3_test.scoop", "../../m23-imported-classes/core-provider.scoop", "../../m23-imported-classes/core-member-defaults.scoop", "../../m23-imported-classes/core-cast-direct.scoop", "../../m23-imported-classes/core-arithmetic-direct.scoop", "../../m23-imported-classes/provider.scoop", "class-provider", "primitive-inherited-wrong-argument", "../../m23-imported-classes/primitive-inherited-wrong-argument.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-classes", "core-rebuild", "negative", "stage-golden"]

[[steps]]
name = "prepare_core"
files = [{"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}}, {"copy" = {"from" = "${fixture}/../support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}}, {"mkdir" = {"path" = "${work}/empty-sysroot"}}, {"mkdir" = {"path" = "${work}/artifacts"}}]

[[steps]]
name = "original_core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-original_core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/original-core.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "read_core-provider"
await_file = "${fixture}/../../m23-imported-classes/core-provider.scoop"

[[steps]]
name = "read_core-member-defaults"
await_file = "${fixture}/../../m23-imported-classes/core-member-defaults.scoop"

[[steps]]
name = "read_cast"
await_file = "${fixture}/../../m23-imported-classes/core-cast-direct.scoop"

[[steps]]
name = "read_arithmetic"
await_file = "${fixture}/../../m23-imported-classes/core-arithmetic-direct.scoop"

[[steps]]
name = "modify_core"
files = [{"write" = {"path" = "${work}/core-source/src/user_class.scoop", "data" = "${read_core-provider.bytes}${read_core-member-defaults.bytes}"}}, {"replace" = {"path" = "${work}/core-source/src/integers_signed.scoop", "old" = "public struct Long : ToString, Hash {", "new" = "public struct Long : ToString, Hash, RebuiltReadable {\n    public override fun read(): Long = this + stage3CoreAnswer() - 43"}}, {"replace" = {"path" = "${work}/core-source/src/stage3_test.scoop", "old" = "= 42", "new" = "= 43"}}, {"replace" = {"path" = "${work}/core-source/src/integers_signed.scoop", "old" = "public struct Long : ToString, Hash, RebuiltReadable {", "new" = "public struct Long : ToString, Hash, RebuiltReadable, RebuiltDefaults {"}}, {"replace" = {"path" = "${work}/core-source/src/types.scoop", "old" = "public struct Boolean : ToString, Hash {", "new" = "public struct Boolean : ToString, Hash, RebuiltDefaults {"}}, {"replace" = {"path" = "${work}/core-source/src/strings.scoop", "old" = "public class String : ToString, Hash, Iterable<Char> {", "new" = "public class String : ToString, Hash, Iterable<Char>, RebuiltDefaults {"}}, {"replace" = {"path" = "${work}/core-source/src/throwable.scoop", "old" = "public class ClassCastException public constructor() : Exception(Some(\"invalid cast\"))\n", "new" = "${read_cast.bytes}"}}, {"replace" = {"path" = "${work}/core-source/src/throwable.scoop", "old" = "public class ArithmeticException public constructor() : Exception(Some(\"arithmetic error\"))\n", "new" = "${read_arithmetic.bytes}"}}]

[[steps]]
name = "rebuilt_core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-rebuilt_core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${rebuilt_core.result.root.artifact_fingerprint}", "not_equals" = "${original_core.result.root.artifact_fingerprint}"}]

[[steps]]
name = "remove_core_source"
files = [{"remove" = {"path" = "${work}/core-source"}}, {"remove" = {"path" = "${work}/original-core.slib"}}]

[[steps]]
name = "read_provider"
await_file = "${fixture}/../../m23-imported-classes/provider.scoop"

[[steps]]
name = "prepare_class-provider"
files = [{"copy" = {"from" = "${fixture}/class-provider", "to" = "${work}/sources/class-provider"}}, {"write" = {"path" = "${work}/sources/class-provider/src/main.scoop", "data" = "${read_provider.bytes}"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/class-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/class-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "remove_provider_source"
files = [{"remove" = {"path" = "${work}/sources/class-provider"}}]

[[steps]]
name = "prepare_primitive-inherited-wrong-argument"
files = [{"copy" = {"from" = "${fixture}/primitive-inherited-wrong-argument", "to" = "${work}/sources/primitive-inherited-wrong-argument"}}, {"copy" = {"from" = "${fixture}/../../m23-imported-classes/primitive-inherited-wrong-argument.scoop", "to" = "${work}/sources/primitive-inherited-wrong-argument/src/main.scoop"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/primitive-inherited-wrong-argument", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/primitive-inherited-wrong-argument/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [{"file" = "${work}/artifacts/dev.example/primitive-inherited-wrong-argument/0.1.0/cone.slib", "exists" = false}]
