schema = 1
name = "qualified-types-diamond"
inputs = ["../../imported-classes/support/stage3_test.scoop", "origin", "../provider.scoop", "first", "../reexport-provider.scoop", "second", "../reexport-provider.scoop", "consumer", "../diamond.scoop", "runtime-fixture", "../../imported-classes/support/gc.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["qualified-types", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_origin"
files = [
  {"copy" = {"from" = "${fixture}/origin", "to" = "${work}/sources/origin"}},
  {"copy" = {"from" = "${fixture}/../provider.scoop", "to" = "${work}/sources/origin/src/main.scoop"}},
]

[[steps]]
name = "origin"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/origin", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-origin", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/qualified-origin/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_first"
files = [
  {"copy" = {"from" = "${fixture}/first", "to" = "${work}/sources/first"}},
  {"copy" = {"from" = "${fixture}/../reexport-provider.scoop", "to" = "${work}/sources/first/src/main.scoop"}},
]

[[steps]]
name = "first"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/first", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-first", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/qualified-first/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_second"
files = [
  {"copy" = {"from" = "${fixture}/second", "to" = "${work}/sources/second"}},
  {"copy" = {"from" = "${fixture}/../reexport-provider.scoop", "to" = "${work}/sources/second/src/main.scoop"}},
]

[[steps]]
name = "second"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/second", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-second", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/qualified-second/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_consumer"
files = [
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
  {"copy" = {"from" = "${fixture}/../diamond.scoop", "to" = "${work}/sources/consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/qualified-diamond/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
  {"copy" = {"from" = "${fixture}/../../imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${program.result.dependencies.length}", equals = 5},
]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
