schema = 1
name = "trailing-basic"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["trailing", "eh", "language"]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "2\n4\n6\n2\n5\n9\n31\n6\n4\n7\n17\n7\n13\n14\n15\n16\n5\n9\n42\n17\n18\nseparate-block\n20\n21\n3\n"
stderr = ""
