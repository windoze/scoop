schema = 1
name = "binding-patterns-errors-irrefutable-only"
root = "irrefutable-only.scoop"
inputs = ["irrefutable-only.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "negative", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "irrefutable-only.diagnostics.json"}
