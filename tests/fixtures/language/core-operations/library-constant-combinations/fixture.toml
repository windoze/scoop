schema = 1
name = "core-operations-library-constant-combinations"
inputs = ["../../core-library/extension.scoop", "../../core-library/metadata.scoop", "../../core-library/abi.scoop", "../../core-library/type-aliases.scoop", "../../core-library/integer-defaults.scoop", "../../core-library/default-data-flow.scoop", "../../reference-source-fields/standalone.scoop", "../../reference-source-fields/combined.scoop", "../../core-library/intrinsic-const-consumer.scoop"]
tools = ["scoop", "scoopc"]
tags = ["core-library-stages", "single-file", "language"]
[[steps]]
name = "runtime_vendor"
files = [
  {symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}},
  {symlink = {from = "${sysroot}/include", to = "${work}/sysroot/include"}},
]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"symlink" = {"from" = "${work}/core-source", "to" = "${work}/sysroot/src/scoop.core"}},
  {"copy" = {"from" = "${fixture}/../../core-library/extension.scoop", "to" = "${work}/core-source/src/user_extension.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-library/metadata.scoop", "to" = "${work}/core-source/src/user_metadata.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-library/abi.scoop", "to" = "${work}/core-source/src/user_abi.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-library/type-aliases.scoop", "to" = "${work}/core-source/src/user_aliases.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-library/integer-defaults.scoop", "to" = "${work}/core-source/src/user_integer_defaults.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-library/default-data-flow.scoop", "to" = "${work}/core-source/src/user_default_data_flow.scoop"}},
  {"copy" = {"from" = "${fixture}/../../reference-source-fields/standalone.scoop", "to" = "${work}/core-source/src/fields_standalone.scoop"}},
  {"copy" = {"from" = "${fixture}/../../reference-source-fields/combined.scoop", "to" = "${work}/core-source/src/fields_combined.scoop"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "publish_core"
files = [{copy = {from = "${core.result.root.path}", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}}]

[[steps]]
name = "prepare_program"
files = [{"copy" = {"from" = "${fixture}/../../core-library/intrinsic-const-consumer.scoop", "to" = "${work}/sources/intrinsic-constants.scoop"}}]

# This fixture changes core; std must be built against that changed dependency.
[[steps]]
name = "standard_library"
argv = ["${scoop}", "build", "${sysroot}/src/scoop.std", {each = "${compile_args}"}, "--release", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-std", "--message-format", "json", "-o", "${work}/sysroot/lib/${target}/scoop.std.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/intrinsic-constants.scoop", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
