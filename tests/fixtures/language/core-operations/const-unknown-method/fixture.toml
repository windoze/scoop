schema = 1
name = "core-operations-const-unknown-method"
inputs = ["../../imported-core-const/unknown-method.scoop", "consumer"]
tools = ["scoop", "scoopc"]
tags = ["core-intrinsics", "const", "negative", "language"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"replace" = {"path" = "${work}/core-source/src/integer_int.scoop", "old" = "public infix fun shl(count: Long): Int\n", "new" = "public infix fun shl(distance: Long): Int\n"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_consumer"
files = [
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
  {"copy" = {"from" = "${fixture}/../../imported-core-const/unknown-method.scoop", "to" = "${work}/sources/consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib", "exists" = false},
]
