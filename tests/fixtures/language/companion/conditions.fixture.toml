schema = 1
name = "companion-conditions"
root = "conditions.scoop"
inputs = ["conditions.scoop"]
tools = ["scoop"]
tags = ["generics", "companion", "defaults", "language"]

[[steps]]
name = "run"
argv = ["${scoop}", "run", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "negative\ngeneral\ngeneral\nnegative\nvalue+companion\nbase\n"
stderr = ""
json = "stderr"
diagnostics = []
