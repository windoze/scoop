schema = 1
name = "companion-projection"
root = "projection.scoop"
inputs = ["projection.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generics", "companion", "defaults", "language"]

[[steps]]
name = "run"
argv = ["${scoop}", "run", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "present\n0\nbox\nbox\nbox\n1\ntrue\nbox\n2\nbox\n"
stderr = ""
json = "stderr"
diagnostics = []
