schema = 1
name = "companion-error-not-function"
root = "not-function.scoop"
inputs = ["not-function.scoop"]
tools = ["scoop"]
tags = ["generics", "negative", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "not-function.diagnostics.json"}
