schema = 1
name = "arguments-source-order"
root = "source-order.scoop"
inputs = ["source-order.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "explicit-third\nexplicit-second\ndefault-first\n123\nmixed-first\nmixed-second\nmixed-third\n456\nreceiver\nmember-second\nmember-first\n121\nstruct-y\nstruct-x\n3\nclass-right\nclass-left\n7\nvariant-right\nvariant-left\n11\nresult\n"
stderr = ""
