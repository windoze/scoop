schema = 1
name = "core-layouts-heap-zst-storage"
inputs = ["../../imported-classes/support/stage3_test.scoop", "../../core-layout-exports/heap-zst-storage.scoop"]
tools = ["scoop", "scoopc"]
tags = ["core-layouts", "heap_zst_fields_produce_valid_layout_objects_and_shared_metadata", "language"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"copy" = {"from" = "${fixture}/../../core-layout-exports/heap-zst-storage.scoop", "to" = "${work}/core-source/src/layout_probe.scoop"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []
