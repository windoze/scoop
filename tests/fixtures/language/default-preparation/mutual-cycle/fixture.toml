schema = 1
name = "default-preparation-mutual-cycle"
inputs = ["../errors/mutual-cycle.scoop"]
tools = ["scoop", "scoopc"]
tags = ["default-preparation", "single-file", "negative", "language"]

[[steps]]
name = "prepare_program"
files = [{"concat" = {"path" = "${work}/sources/program.scoop", "parts" = [{"file" = "${fixture}/../errors/mutual-cycle.scoop"}]}}]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/built-program", "exists" = false},
]
