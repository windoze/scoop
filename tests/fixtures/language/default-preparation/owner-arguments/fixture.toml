schema = 1
name = "default-preparation-owner-arguments"
inputs = ["../../type-source-defaults/local-owner-arguments.scoop", "../../type-source-defaults/local-owner-argument-combinations.scoop", "../../type-source-defaults/local-owner-argument-calls.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["default-preparation", "single-file", "language"]
[[steps]]
name = "prepare_program"
files = [{"concat" = {"path" = "${work}/sources/program.scoop", "parts" = [{"file" = "${fixture}/../../type-source-defaults/local-owner-arguments.scoop"}, "\n", {"file" = "${fixture}/../../type-source-defaults/local-owner-argument-combinations.scoop"}, "\n", {"file" = "${fixture}/../../type-source-defaults/local-owner-argument-calls.scoop"}]}}]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []
