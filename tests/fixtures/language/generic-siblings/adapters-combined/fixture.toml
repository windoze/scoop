exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/root.slib", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${sysroot}", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--dependency-slib", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-provider/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-adapters-combined-left/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-adapters-combined-right/0.1.0/cone.slib", "--dependency-slib", "${work}/artifacts/dev.example/generic-odr-adapters-combined-consumer/0.1.0/cone.slib", "--library-path", "${work}/native", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
