diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-odr-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-odr-provider", "to" = "${work}/sources/generic-odr-provider"}},
  {"copy" = {"from" = "${fixture}/../../odr-member-unions/provider.scoop", "to" = "${work}/sources/generic-odr-provider/src/main.scoop"}},
]

