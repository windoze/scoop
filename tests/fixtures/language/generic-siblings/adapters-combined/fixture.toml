[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../../odr-member-unions/addresses.c", "to" = "${work}/native/addresses.c"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_LEFT_TD", "new" = "${symbol_prefix}scoop$1$td$0ee67f183558fd8e869a718846e42a8e1f30679b60c3eed1c6f3fd3ee1c0eeea"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_RIGHT_TD", "new" = "${symbol_prefix}scoop$1$td$0ee67f183558fd8e869a718846e42a8e1f30679b60c3eed1c6f3fd3ee1c0eeea"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_OTHER_TD", "new" = "${symbol_prefix}scoop$1$td$1cb9165a2f297eacd7ddb44e5aead683fb809c66e919669413dfaf237d404b6a"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "UNION_INTERFACE_TD", "new" = "${symbol_prefix}scoop$1$td$d229de54169029566e2979938288a12b56bc0094e81a9a9b580610106e112d95"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "left_slots[UNION_READ_SLOT] != NULL", "new" = "left_slots[0] != NULL"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "left_slots[UNION_READ_SLOT] == right_slots[UNION_READ_SLOT]", "new" = "left_slots[0] == right_slots[0]"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "#include \"scoop_rt.h\"", "new" = "#include \"scoop_rt.h\"\n#include <stdio.h>\n#include <stdlib.h>"}},
  {"replace" = {"path" = "${work}/native/addresses.c", "old" = "#define SCOOP_FIXTURE_METADATA_CHECK() union_metadata_check()", "new" = "static void check_after_shutdown(void) {\n    if (!union_metadata_check()) {\n        fputs(\"shared type or interface slot address differs\\n\", stderr);\n        abort();\n    }\n}\n\nvoid m23_register_union_check(void) {\n    if (atexit(check_after_shutdown) != 0) { abort(); }\n}"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-I", "${runtime}/src", "-c", "${work}/native/addresses.c", "-o", "${work}/native/addresses.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_union.a", "${work}/native/addresses.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

