schema = 1
name = "imported-class-inheritance-interface"
inputs = ["../support/stage3_test.scoop", "../core-provider.scoop", "../core-inheritance-provider.scoop", "../core-cast-direct.scoop", "../core-arithmetic-direct.scoop", "../provider.scoop", "../inheritance-provider.scoop", "class-provider", "classes-inheritance-interface", "../inheritance-interface.scoop", "class-downstream-inheritance-interface", "../downstream.scoop", "../support/main.scoop", "../support/gc.c", "runtime-fixture"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-classes", "core-rebuild", "language"]
[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/artifacts"}},
]

[[steps]]
name = "original_core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-original_core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/original-core.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "read_core-provider"
await_file = "${fixture}/../core-provider.scoop"

[[steps]]
name = "read_core-inheritance-provider"
await_file = "${fixture}/../core-inheritance-provider.scoop"

[[steps]]
name = "read_cast"
await_file = "${fixture}/../core-cast-direct.scoop"

[[steps]]
name = "read_arithmetic"
await_file = "${fixture}/../core-arithmetic-direct.scoop"

[[steps]]
name = "modify_core"
files = [{"write" = {"path" = "${work}/core-source/src/user_class.scoop", "data" = "${read_core-provider.bytes}${read_core-inheritance-provider.bytes}"}}, {"replace" = {"path" = "${work}/core-source/src/integer_long.scoop", "old" = "    Equals<Long>, ToString, Hash {", "new" = "    Equals<Long>, ToString, Hash, RebuiltReadable {\n    public override fun read(): Long = this + stage3CoreAnswer() - 43"}}, {"replace" = {"path" = "${work}/core-source/src/stage3_test.scoop", "old" = "= 42", "new" = "= 43"}}, {"replace" = {"path" = "${work}/core-source/src/throwable.scoop", "old" = "public class ClassCastException public constructor() : Exception(Some(\"invalid cast\"))\n", "new" = "${read_cast.bytes}"}}, {"replace" = {"path" = "${work}/core-source/src/throwable.scoop", "old" = "public class ArithmeticException public constructor() : Exception(Some(\"arithmetic error\"))\n", "new" = "${read_arithmetic.bytes}"}}]

[[steps]]
name = "rebuilt_core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-rebuilt_core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${rebuilt_core.result.root.artifact_fingerprint}", "not_equals" = "${original_core.result.root.artifact_fingerprint}"}]

[[steps]]
name = "read_provider"
await_file = "${fixture}/../provider.scoop"

[[steps]]
name = "read_inheritance-provider"
await_file = "${fixture}/../inheritance-provider.scoop"

[[steps]]
name = "prepare_class-provider"
files = [{"copy" = {"from" = "${fixture}/class-provider", "to" = "${work}/sources/class-provider"}}, {"write" = {"path" = "${work}/sources/class-provider/src/main.scoop", "data" = "${read_provider.bytes}${read_inheritance-provider.bytes}"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/class-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/class-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prepare_classes-inheritance-interface"
files = [{"copy" = {"from" = "${fixture}/classes-inheritance-interface", "to" = "${work}/sources/classes-inheritance-interface"}}, {"copy" = {"from" = "${fixture}/../inheritance-interface.scoop", "to" = "${work}/sources/classes-inheritance-interface/src/main.scoop"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/classes-inheritance-interface", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/classes-inheritance-interface/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_class-downstream-inheritance-interface"
files = [{"copy" = {"from" = "${fixture}/class-downstream-inheritance-interface", "to" = "${work}/sources/class-downstream-inheritance-interface"}}, {"copy" = {"from" = "${fixture}/../downstream.scoop", "to" = "${work}/sources/class-downstream-inheritance-interface/src/main.scoop"}}]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/class-downstream-inheritance-interface", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/class-downstream-inheritance-interface/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "read_main"
await_file = "${fixture}/../support/main.scoop"

[[steps]]
name = "prepare_runtime-fixture"
files = [{"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}}, {"write" = {"path" = "${work}/sources/runtime-fixture/src/main.scoop", "data" = "${read_main.bytes}"}}]

[[steps]]
name = "prepare_native"
files = [{"mkdir" = {"path" = "${work}/native"}}, {"copy" = {"from" = "${fixture}/../support/gc.c", "to" = "${work}/sources/gc.c"}}]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/sources/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
