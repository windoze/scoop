schema = 1
name = "imported-class-catch-unreachable"
inputs = ["../support/stage3_test.scoop", "../core-provider.scoop", "../core-cast-direct.scoop", "../core-arithmetic-direct.scoop", "../provider.scoop", "class-provider", "catch-unreachable", "../catch-unreachable.scoop"]
tools = ["scoop", "scoopc"]
tags = ["imported-classes", "core-rebuild", "negative", "language"]

[[steps]]
name = "rebuilt_core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${class_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-rebuilt_core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "read_provider"
await_file = "${fixture}/../provider.scoop"

[[steps]]
name = "prepare_class-provider"
files = [{"copy" = {"from" = "${fixture}/class-provider", "to" = "${work}/sources/class-provider"}}, {"write" = {"path" = "${work}/sources/class-provider/src/main.scoop", "data" = "${read_provider.bytes}"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/class-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/class-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prepare_catch-unreachable"
files = [{"copy" = {"from" = "${fixture}/catch-unreachable", "to" = "${work}/sources/catch-unreachable"}}, {"copy" = {"from" = "${fixture}/../catch-unreachable.scoop", "to" = "${work}/sources/catch-unreachable/src/main.scoop"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/catch-unreachable", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/catch-unreachable/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [{"file" = "${work}/artifacts/dev.example/catch-unreachable/0.1.0/cone.slib", "exists" = false}]
