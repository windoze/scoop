schema = 1
name = "imported-class-conformance-super-local-abstract"
inputs = ["../support/stage3_test.scoop", "../core-provider.scoop", "../core-cast-direct.scoop", "../core-arithmetic-direct.scoop", "../provider.scoop", "../conformance-provider.scoop", "../super-provider.scoop", "class-provider", "conformance-super-local-abstract", "../conformance-super-local-abstract.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-classes", "core-rebuild", "negative", "language"]

[[steps]]
name = "rebuilt_core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${class_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-rebuilt_core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "read_provider"
await_file = "${fixture}/../provider.scoop"

[[steps]]
name = "read_conformance-provider"
await_file = "${fixture}/../conformance-provider.scoop"

[[steps]]
name = "read_super-provider"
await_file = "${fixture}/../super-provider.scoop"

[[steps]]
name = "prepare_class-provider"
files = [{"copy" = {"from" = "${fixture}/class-provider", "to" = "${work}/sources/class-provider"}}, {"write" = {"path" = "${work}/sources/class-provider/src/main.scoop", "data" = "${read_provider.bytes}${read_conformance-provider.bytes}${read_super-provider.bytes}"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/class-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/class-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prepare_conformance-super-local-abstract"
files = [{"copy" = {"from" = "${fixture}/conformance-super-local-abstract", "to" = "${work}/sources/conformance-super-local-abstract"}}, {"copy" = {"from" = "${fixture}/../conformance-super-local-abstract.scoop", "to" = "${work}/sources/conformance-super-local-abstract/src/main.scoop"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/conformance-super-local-abstract", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/conformance-super-local-abstract/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [{"file" = "${work}/artifacts/dev.example/conformance-super-local-abstract/0.1.0/cone.slib", "exists" = false}]
