schema = 1
name = "imported-class-inheritance-access-sibling-receiver"
inputs = ["../provider.scoop", "../inheritance-provider.scoop", "../inheritance-access-provider.scoop", "class-provider", "inheritance-access-sibling-receiver", "../inheritance-access-sibling-receiver.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["imported-classes", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${inheritance_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "read_provider"
await_file = "${fixture}/../provider.scoop"

[[steps]]
name = "read_inheritance-provider"
await_file = "${fixture}/../inheritance-provider.scoop"

[[steps]]
name = "read_inheritance-access-provider"
await_file = "${fixture}/../inheritance-access-provider.scoop"

[[steps]]
name = "prepare_class-provider"
files = [{"copy" = {"from" = "${fixture}/class-provider", "to" = "${work}/sources/class-provider"}}, {"write" = {"path" = "${work}/sources/class-provider/src/main.scoop", "data" = "${read_provider.bytes}${read_inheritance-provider.bytes}${read_inheritance-access-provider.bytes}"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/class-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/class-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "prepare_inheritance-access-sibling-receiver"
files = [{"copy" = {"from" = "${fixture}/inheritance-access-sibling-receiver", "to" = "${work}/sources/inheritance-access-sibling-receiver"}}, {"copy" = {"from" = "${fixture}/../inheritance-access-sibling-receiver.scoop", "to" = "${work}/sources/inheritance-access-sibling-receiver/src/main.scoop"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/inheritance-access-sibling-receiver", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/inheritance-access-sibling-receiver/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [{"file" = "${work}/artifacts/dev.example/inheritance-access-sibling-receiver/0.1.0/cone.slib", "exists" = false}]
