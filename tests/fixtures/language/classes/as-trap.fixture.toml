schema = 1
name = "classes-as-trap"
root = "as-trap.scoop"
inputs = ["as-trap.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "trap", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 1
stdout = ""
stderr = {regex = "scoop:\\ uncaught\\ exception:\\ n\\(c=scoop%3Ascoop\\.core%3A0\\.1\\.0;p=;o=\\-;k=C;x=ClassCastException\\)\\\n  <stack trace unavailable: disabled>\\n"}
