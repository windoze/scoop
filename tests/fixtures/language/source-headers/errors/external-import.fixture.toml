schema = 1
name = "source-headers-errors-external-import"
root = "external-import/Cone.toml"
inputs = ["external-import"]
tools = ["scoop", "scoopc"]
tags = ["package", "negative", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "external-import.diagnostics.json"}
