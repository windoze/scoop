schema = 1
name = "string-api-rejects-get"
root = "get.scoop"
inputs = ["get.scoop"]
tools = ["scoop", "scoopc"]
tags = ["string-api", "negative", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "get.diagnostics.json"}
