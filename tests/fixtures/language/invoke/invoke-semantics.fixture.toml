schema = 1
name = "invoke-invoke-semantics"
root = "invoke-semantics.scoop"
inputs = ["invoke-semantics.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "local-1!\ntemporary-2?\nfield-3!\nmember-3!\nparameter-5!\n42\nlocal-6!\n42\ncommand:build\n41!\n13\n42\n43\n"
stderr = ""
