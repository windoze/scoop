schema = 1
name = "context-gc-lifetimes"
root = "program.scoop"
inputs = ["program.scoop", "../../callback/native.c", "../../callback/threading.h", "../../release-blocks/lifecycle/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["context", "callback", "coroutine", "release", "language"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "prepare_native"
files = [{mkdir = {path = "${work}/native"}}]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-I", "${runtime}/include", "-c", "${fixture}/../../callback/native.c", "-o", "${work}/native/fixture.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "native_release"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-c", "${fixture}/../../release-blocks/lifecycle/native.c", "-o", "${work}/native/release.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/native/libcontext_gc.a", "${work}/native/fixture.o", "${work}/native/release.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--profile", "${profile}", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "gc-lifetimes-ok\n"
stderr = ""
