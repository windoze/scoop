schema = 1
name = "context-types"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["context", "language"]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "exact-class\nexact-interface\n17\nnamed\nsmartcast\nalias\nexact-array\n21\n22\n23\n"
stderr = ""
