schema = 1
name = "context-callback-concurrent"
root = "program.scoop"
inputs = ["program.scoop", "../../callback/native.c", "../../callback/threading.h"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["context", "callback", "language"]
[[steps]]
name = "prepare_native"
files = [{mkdir = {path = "${work}/native"}}]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-I", "${runtime}/include", "-c", "${fixture}/../../callback/native.c", "-o", "${work}/native/fixture.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/native/libfixture_native.a", "${work}/native/fixture.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "callback-concurrent-ok\n"
stderr = ""
