schema = 1
name = "context-exits"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["context", "language"]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "1\n9\n1\n1\n1\nresult-3\n1\ncaught by caller\n"
stderr = ""
