schema = 1
name = "exceptions-handler-exits"
root = "handler-exits.scoop"
inputs = ["handler-exits.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["single-file", "run", "language"]
variants = [{"name" = "release"}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "return-finally\n7\nreplace-finally\nreplacement\nrethrow-finally\nrethrown\nnested-finally\nhandler-finally\nnested-out\n"
stderr = ""
