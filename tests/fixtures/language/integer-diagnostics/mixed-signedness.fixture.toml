schema = 1
name = "integer-diagnostics-mixed-signedness"
inputs = ["../integers/errors/mixed-signedness.scoop"]
tools = ["scoop", "scoopc"]
tags = ["integer-diagnostics", "negative", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/../integers/errors/mixed-signedness.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "mixed-signedness.diagnostics.json"}
