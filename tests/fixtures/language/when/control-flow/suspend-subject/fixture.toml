schema = 1
name = "when-suspend-subject"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["when", "suspend", "language"]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "subject-normal\nouter-1\ninner-1\ninner-2-enter\nnormal-suspended\ninner-2-exit\ninner-3\nouter-2\nfirst-normal\n42\nthird-normal\nlast-normal\nnormal-done\n42\nsubject-failure\nouter-1\ninner-1\ninner-2-enter\nfailure-suspended\ncaught-failure\nfailure-done\n0\n"
stderr = ""
