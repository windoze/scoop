schema = 1
name = "when-effects"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["when", "eh", "language"]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "subject-match\ncontains\nguard\nmatch\nsubject-boom\ncontains\ncontains-caught\ncontains-finally\nstop\ncondition-caught\ncondition-finally\nsubject-live\nstop\nguard-caught\nguard-finally\n"
stderr = ""
