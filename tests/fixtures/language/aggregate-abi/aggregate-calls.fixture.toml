schema = 1
name = "aggregate-abi-aggregate-calls"
root = "aggregate-calls.scoop"
inputs = ["aggregate-calls.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["single-file", "run", "language"]
variants = [{"name" = "release"}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "original-nested-32\n3\n0\n4\n0\nnested-24-constructor\n3\n4\n55\nnested-24-nogc\n40\n55\ngeneric-specialization-24\n60\n70\nflat-32-control\n100\nmanaged-call\nalpha-live\nbeta-live\n700\nmanaged-invoke-normal\nalpha-live\nbeta-live\n700\nmanaged-invoke-throw\ncaught-managed-invoke\nclosure-hidden-receiver-24\n9\n1090\n"
