schema = 1
name = "release-blocks-reject-native-transition-helper"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["release-blocks", "negative", "canonical-diagnostics", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/rejected"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
checks = [{file = "${work}/rejected", exists = false}]
