schema = 1
name = "release-blocks-native-aggregate-cross-cone"
inputs = ["provider", "consumer", "../native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["release-blocks", "language"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/provider"}},
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/consumer"}},
  {"mkdir" = {"path" = "${work}/artifacts/test/release-aggregate-provider/0.1.0"}},
]

[[steps]]
name = "prepare_native"
files = [{mkdir = {path = "${work}/native"}}]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${fixture}/../native.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm24_release.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {ZERO_AR_DATE = "1"}

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/release-aggregate-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--message-format", "json", "--cone-path", "${work}/artifacts", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${consumer.result.root.path}", {"each" = "${consumer.result.dependencies}", "field" = "path", "prefix" = "--dependency-slib"}, "--runtime-objects", "${consumer.result.runtime_index}", "--library-path", "${work}/native", "--sysroot", "${sysroot}", "-o", "${work}/relinked", "--message-format", "json", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "relinked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
