schema = 1
name = "release-blocks-roots-closures"
root = "program.scoop"
inputs = ["program.scoop", "../common.scoop", "../native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["release-blocks", "language"]

[[steps]]
name = "source"
files = [{concat = {path = "${work}/program.scoop", parts = [{file = "../common.scoop"}, "\n", {file = "program.scoop"}]}}]

[[steps]]
name = "prepare_native"
files = [{mkdir = {path = "${work}/native"}}]

[[steps]]
name = "compile_native"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-c", "${fixture}/../native.c", "-o", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm24_release.a", "${work}/native/trace.o"]
exit = 0
stdout = ""
stderr = ""
env = {ZERO_AR_DATE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/program.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native", "--runtime-root", "${runtime}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "true\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\n"
stderr = ""
