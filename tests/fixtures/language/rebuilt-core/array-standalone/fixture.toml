schema = 1
name = "rebuilt-core-array-standalone"
inputs = ["../../imported-classes/support/stage3_test.scoop", "rebuilt-core-array-standalone", "../../rebuilt-core-generics/standalone.scoop", "rebuilt-core-array-standalone-downstream", "../../rebuilt-core-generics/downstream.scoop", "runtime-fixture", "../../imported-classes/support/gc.c", "../../rebuilt-core-generics/core-additions.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["rebuilt-core", "array", "language"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
]

[[steps]]
name = "original_core"
timeout = 900
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "modify_core"
files = [
  {"replace" = {"path" = "${work}/core-source/src/arrays.scoop", "old" = "public fun toMutableArray(): MutableArray<T>\n\n    /**\n     * Traverses the elements in index order and remains exhausted after reaching the end.\n     */\n    public override operator fun iterator(): Iterator<T> = ListIterator<T>(this, 0L, false)", "new" = "public fun toMutableArray(): MutableArray<T>\n\n    /**\n     * Traverses the elements in index order and remains exhausted after reaching the end.\n     */\n    public override operator fun iterator(): Iterator<T> = ListIterator<T>(this, 1L, false)"}},
  {"replace" = {"path" = "${work}/core-source/src/arrays.scoop", "old" = "public fun toArray(): Array<T>\n\n    /**\n     * Traverses the elements in index order and remains exhausted after reaching the end.\n     */\n    public override operator fun iterator(): Iterator<T> = ListIterator<T>(this, 0L, false)", "new" = "public fun toArray(): Array<T>\n\n    /**\n     * Traverses the elements in index order and remains exhausted after reaching the end.\n     */\n    public override operator fun iterator(): Iterator<T> = ListIterator<T>(this, 1L, false)"}},
  {"copy" = {"from" = "${fixture}/../../rebuilt-core-generics/core-additions.scoop", "to" = "${work}/core-source/src/rebuilt_generics.scoop"}},
]

[[steps]]
name = "core"
timeout = 900
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${core.result.root.artifact_fingerprint}", "not_equals" = "${original_core.result.root.artifact_fingerprint}"},
]

[[steps]]
name = "prepare_rebuilt-core-array-standalone"
files = [
  {"copy" = {"from" = "${fixture}/rebuilt-core-array-standalone", "to" = "${work}/sources/rebuilt-core-array-standalone"}},
  {"copy" = {"from" = "${fixture}/../../rebuilt-core-generics/standalone.scoop", "to" = "${work}/sources/rebuilt-core-array-standalone/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/rebuilt-core-array-standalone", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/rebuilt-core-array-standalone/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_rebuilt-core-array-standalone-downstream"
files = [
  {"copy" = {"from" = "${fixture}/rebuilt-core-array-standalone-downstream", "to" = "${work}/sources/rebuilt-core-array-standalone-downstream"}},
  {"copy" = {"from" = "${fixture}/../../rebuilt-core-generics/downstream.scoop", "to" = "${work}/sources/rebuilt-core-array-standalone-downstream/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/rebuilt-core-array-standalone-downstream", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/rebuilt-core-array-standalone-downstream/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
  {"copy" = {"from" = "${fixture}/../../imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_link_inputs_isolate"
files = [{"copy" = {"from" = "${program.result.root.path}", "to" = "${work}/artifacts/root.slib"}}]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {"each" = "${link_args}"}, "--root-slib", "${work}/artifacts/root.slib", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${sysroot}", "--library-path", "${work}/native", "--message-format", "json", "--dump-plan", "-o", "${work}/program", "--cache-dir", "${cache}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
  {"actual" = "${link.result.dependencies.length}", "equals" = 3},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:rebuilt-core-array-standalone:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:rebuilt-core-array-standalone-downstream:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:runtime-fixture:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=4 root=${symbol_prefix}scoop$$1$$re$$697a194f371e65fbbfe0f2ae0a577df915ae0fdee6758d312df7b2c864602bc7"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
]

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = ""
stderr = ""
