schema = 1
name = "safe-call-safe-call-semantics"
root = "safe-call-semantics.scoop"
inputs = ["safe-call-semantics.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "safe-call-semantics.diagnostics.json"}
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "safe-argument\nsend-body\nsome-5\nnone\nsafe-default\nsend-body\nsome-7\nnone\nsafe-receiver\nsend-body\nmade-8\nsome-9\nnone\nsome-nested\ntouch-body\nunit-some\nfield-10\n42\n"
stderr = ""
