schema = 1
name = "default-access-call-domains-protected-after-public"
inputs = ["../../default-call-domains/errors/protected-after-public.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["default-access", "call-domains", "negative", "language"]

[[steps]]
name = "prepare_program"
files = [{"concat" = {"path" = "${work}/sources/program.scoop", "parts" = [{"file" = "${fixture}/../../default-call-domains/errors/protected-after-public.scoop"}]}}]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/built-program", "exists" = false},
]
