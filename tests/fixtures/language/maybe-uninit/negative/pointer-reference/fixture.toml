schema = 1
name = "maybe-uninit-reject-pointer-reference"
inputs = ["program.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["maybe-uninit", "negative", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/program.scoop", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
