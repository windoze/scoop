schema = 1
name = "negative-cross-cone"
inputs = ["provider", "facade", "consumer"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["generics", "reexport", "defaults", "language"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/provider", to = "${work}/source/provider"}}, {copy = {from = "${fixture}/facade", to = "${work}/source/facade"}}, {copy = {from = "${fixture}/consumer", to = "${work}/source/consumer"}}]

[[steps]]
name = "run"
argv = ["${scoop}", "run", "--release", {"each" = "${link_args}"}, "${work}/source/consumer", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = "opaque\ngeneral\ngeneral\nopaque\nopaque\nboth\nopaque\nnegative-method\ngeneral-method\nnegative-extension\ngeneral-extension\nopaque\n"
stderr = ""
json = "stderr"
diagnostics = []
