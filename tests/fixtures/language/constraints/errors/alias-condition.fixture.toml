schema = 1
name = "negative-error-alias-condition"
root = "alias-condition.scoop"
inputs = ["alias-condition.scoop"]
tools = ["scoop"]
tags = ["generics", "negative", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "alias-condition.diagnostics.json"}
