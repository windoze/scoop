schema = 1
name = "negative-error-exclude-parameter"
root = "exclude-parameter.scoop"
inputs = ["exclude-parameter.scoop"]
tools = ["scoop"]
tags = ["generics", "negative", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "exclude-parameter.diagnostics.json"}
