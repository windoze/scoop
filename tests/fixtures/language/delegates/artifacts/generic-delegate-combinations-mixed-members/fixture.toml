schema = 1
name = "generic-delegate-combinations-mixed-members"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "delegate-combinations-provider", "../../../generic-delegate-combinations/provider.scoop", "delegate-mixed-members", "../../../generic-delegate-combinations/mixed-members.scoop", "delegate-downstream-mixed-members", "../../../generic-delegate-combinations/downstream.scoop", "runtime-fixture", "../../../imported-classes/support/gc.c", "../support/metadata.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["generics", "generic_delegate_mixed_roles_republish_and_execute", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_delegate-combinations-provider"
files = [
  {"copy" = {"from" = "${fixture}/delegate-combinations-provider", "to" = "${work}/sources/delegate-combinations-provider"}},
  {"copy" = {"from" = "${fixture}/../../../generic-delegate-combinations/provider.scoop", "to" = "${work}/sources/delegate-combinations-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/delegate-combinations-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-combinations-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_delegate-mixed-members"
files = [
  {"copy" = {"from" = "${fixture}/delegate-mixed-members", "to" = "${work}/sources/delegate-mixed-members"}},
  {"copy" = {"from" = "${fixture}/../../../generic-delegate-combinations/mixed-members.scoop", "to" = "${work}/sources/delegate-mixed-members/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/delegate-mixed-members", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-mixed-members/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_delegate-downstream-mixed-members"
files = [
  {"copy" = {"from" = "${fixture}/delegate-downstream-mixed-members", "to" = "${work}/sources/delegate-downstream-mixed-members"}},
  {"copy" = {"from" = "${fixture}/../../../generic-delegate-combinations/downstream.scoop", "to" = "${work}/sources/delegate-downstream-mixed-members/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/delegate-downstream-mixed-members", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/delegate-downstream-mixed-members/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_metadata"
files = [
  {"copy" = {"from" = "${fixture}/../support/metadata.c", "to" = "${work}/native/metadata.c"}},
  {"replace" = {"path" = "${work}/native/metadata.c", "old" = "PROVIDER_IMAGE", "new" = "${symbol_prefix}scoop$1$im$$${provider.result.root.identity}"}},
  {"replace" = {"path" = "${work}/native/metadata.c", "old" = "CONSUMER_IMAGE", "new" = "${symbol_prefix}scoop$1$im$$${consumer.result.root.identity}"}},
]

[[steps]]
name = "compile_metadata"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-DM23_EXPECTED_UNITS=2", "-DM23_STORAGE_KIND=0", "-c", "${work}/native/metadata.c", "-o", "${work}/native/metadata.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_metadata"
argv = ["${ar}", "qcS", "${work}/native/libm23_delegate_metadata.a", "${work}/native/metadata.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
  {"copy" = {"from" = "${fixture}/../../../imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${program.result.dependencies.length}", equals = 4},
]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
