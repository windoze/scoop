schema = 1
name = "serialize-negative-ignore-emit"
root = "ignore-emit.scoop"
inputs = ["ignore-emit.scoop"]
tools = ["scoop", "scoopc"]
tags = ["serialization", "negative", "language", "expected-error"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "ignore-emit.diagnostics.json"}
