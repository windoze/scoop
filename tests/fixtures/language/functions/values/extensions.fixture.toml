schema = 1
name = "functions-extensions"
root = "../extensions.scoop"
inputs = ["../extensions.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\ngeneric\nstring\n40\n42\nmember-kept\nmember-kept\nnew\n42\n1\nunbound-ok\nbound-ok\ngeneric-unbound\ngeneric-bound\ncapture-this\nonce-only\n42\n140\ncaught\n"
stderr = ""
