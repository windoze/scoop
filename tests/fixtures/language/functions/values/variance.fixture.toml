schema = 1
name = "functions-variance"
root = "../variance.scoop"
inputs = ["../variance.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "run", "language"]
variants = [{"name" = "release"}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "true\ntrue\ntrue\ntrue\nvalue\ntrue\ntrue\nfalse\ntrue\n42\ntrue\ntrue\ntrue\nvalue\ntrue\ncaught\n"
stderr = ""
