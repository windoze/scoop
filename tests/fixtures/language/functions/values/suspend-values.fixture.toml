schema = 1
name = "functions-suspend-values"
root = "../suspend-values.scoop"
inputs = ["../suspend-values.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\nreturned\nsuspended\nalive-capture\nfinally\n42\n43\ntrue\n43\n45\nunit-body\nunit-done\nfailed\n46\n50\n47\n44\n44\n48\n51\nfailed\nfailed\nfailed\nfailed\n54\nfailure-finally\n49\n"
stderr = ""
