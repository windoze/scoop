schema = 1
name = "generics-partial-type-arguments"
root = "../partial-type-arguments.scoop"
inputs = ["../partial-type-arguments.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "function\nstruct\nclass\nvariant\nmethod\nextension\n7\n8\nnested\nnamed\nlabel\nbounded\nint\nlocal\n"
stderr = ""
