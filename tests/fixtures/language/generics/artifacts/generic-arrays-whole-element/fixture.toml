schema = 1
name = "generic-arrays-whole-element"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "generic-member-provider", "../../../generic-arrays/provider.scoop", "whole-element", "../../../generic-arrays/whole-element.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generics", "imported_arrays_and_varargs_republish_and_execute_from_artifacts", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-provider", "to" = "${work}/sources/generic-member-provider"}},
  {"copy" = {"from" = "${fixture}/../../../generic-arrays/provider.scoop", "to" = "${work}/sources/generic-member-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_whole-element"
files = [
  {"copy" = {"from" = "${fixture}/whole-element", "to" = "${work}/sources/whole-element"}},
  {"copy" = {"from" = "${fixture}/../../../generic-arrays/whole-element.scoop", "to" = "${work}/sources/whole-element/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/whole-element", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/whole-element/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/whole-element/0.1.0/cone.slib", "exists" = false},
]
