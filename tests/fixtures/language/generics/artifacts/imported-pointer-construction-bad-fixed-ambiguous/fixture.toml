schema = 1
name = "imported-pointer-construction-bad-fixed-ambiguous"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "generic-member-provider", "../../../imported-pointer-construction/provider.scoop", "bad-fixed-ambiguous", "../../../imported-pointer-construction/bad-fixed-ambiguous.scoop"]
tools = ["scoop", "scoopc"]
tags = ["generics", "imported_pointer_construction_republishes_and_executes_from_artifacts", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-provider", "to" = "${work}/sources/generic-member-provider"}},
  {"copy" = {"from" = "${fixture}/../../../imported-pointer-construction/provider.scoop", "to" = "${work}/sources/generic-member-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_bad-fixed-ambiguous"
files = [
  {"copy" = {"from" = "${fixture}/bad-fixed-ambiguous", "to" = "${work}/sources/bad-fixed-ambiguous"}},
  {"copy" = {"from" = "${fixture}/../../../imported-pointer-construction/bad-fixed-ambiguous.scoop", "to" = "${work}/sources/bad-fixed-ambiguous/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/bad-fixed-ambiguous", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/bad-fixed-ambiguous/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/bad-fixed-ambiguous/0.1.0/cone.slib", "exists" = false},
]
