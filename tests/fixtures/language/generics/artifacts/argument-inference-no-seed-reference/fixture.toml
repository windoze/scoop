schema = 1
name = "argument-inference-no-seed-reference"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "generic-member-provider", "../../../argument-inference/provider.scoop", "no-seed-reference", "../../../argument-inference/no-seed-reference.scoop"]
tools = ["scoop", "scoopc"]
tags = ["generics", "imported_contextual_arguments_republish_and_execute_from_artifacts", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-provider", "to" = "${work}/sources/generic-member-provider"}},
  {"copy" = {"from" = "${fixture}/../../../argument-inference/provider.scoop", "to" = "${work}/sources/generic-member-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_no-seed-reference"
files = [
  {"copy" = {"from" = "${fixture}/no-seed-reference", "to" = "${work}/sources/no-seed-reference"}},
  {"copy" = {"from" = "${fixture}/../../../argument-inference/no-seed-reference.scoop", "to" = "${work}/sources/no-seed-reference/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/no-seed-reference", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/no-seed-reference/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/no-seed-reference/0.1.0/cone.slib", "exists" = false},
]
