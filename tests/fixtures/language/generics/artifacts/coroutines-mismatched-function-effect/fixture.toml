argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/mismatched-function-effect", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/mismatched-function-effect/0.1.0/cone.slib"]
