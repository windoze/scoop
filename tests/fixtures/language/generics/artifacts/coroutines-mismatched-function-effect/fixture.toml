[[steps]]
name = "prepare_mismatched-function-effect"
files = [
  {"copy" = {"from" = "${fixture}/mismatched-function-effect", "to" = "${work}/sources/mismatched-function-effect"}},
  {"copy" = {"from" = "${fixture}/../../../coroutines/mismatched-function-effect.scoop", "to" = "${work}/sources/mismatched-function-effect/src/main.scoop"}},
]

[[steps]]
