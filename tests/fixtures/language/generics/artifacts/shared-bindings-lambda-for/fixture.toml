schema = 1
name = "shared-bindings-lambda-for"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "generic-member-provider", "../../../shared-bindings/provider.scoop", "generic-member-lambda-for", "../../../shared-bindings/lambda-for.scoop", "generic-member-downstream-lambda-for", "../../../shared-bindings/downstream.scoop", "runtime-fixture", "../../../imported-classes/support/gc.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["generics", "shared_binding_lowering_republishes_and_executes_from_artifacts", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-provider", "to" = "${work}/sources/generic-member-provider"}},
  {"copy" = {"from" = "${fixture}/../../../shared-bindings/provider.scoop", "to" = "${work}/sources/generic-member-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-lambda-for"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-lambda-for", "to" = "${work}/sources/generic-member-lambda-for"}},
  {"copy" = {"from" = "${fixture}/../../../shared-bindings/lambda-for.scoop", "to" = "${work}/sources/generic-member-lambda-for/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-lambda-for", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-lambda-for/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-downstream-lambda-for"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-downstream-lambda-for", "to" = "${work}/sources/generic-member-downstream-lambda-for"}},
  {"copy" = {"from" = "${fixture}/../../../shared-bindings/downstream.scoop", "to" = "${work}/sources/generic-member-downstream-lambda-for/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-downstream-lambda-for", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-downstream-lambda-for/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
  {"copy" = {"from" = "${fixture}/../../../imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${program.result.dependencies.length}", equals = 4},
]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
