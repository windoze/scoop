schema = 1
name = "generic-helpers-bad-private-ordinary"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "generic-helper-provider", "../../../generic-helper-consumption/provider.scoop", "bad-private-ordinary", "../../../generic-helper-consumption/bad-private-ordinary.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["generics", "helpers", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-helper-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-helper-provider", "to" = "${work}/sources/generic-helper-provider"}},
  {"copy" = {"from" = "${fixture}/../../../generic-helper-consumption/provider.scoop", "to" = "${work}/sources/generic-helper-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-helper-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-helper-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_bad-private-ordinary"
files = [
  {"copy" = {"from" = "${fixture}/bad-private-ordinary", "to" = "${work}/sources/bad-private-ordinary"}},
  {"copy" = {"from" = "${fixture}/../../../generic-helper-consumption/bad-private-ordinary.scoop", "to" = "${work}/sources/bad-private-ordinary/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/bad-private-ordinary", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/bad-private-ordinary/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/bad-private-ordinary/0.1.0/cone.slib", "exists" = false},
]
