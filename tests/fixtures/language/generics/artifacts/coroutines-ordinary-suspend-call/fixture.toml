schema = 1
name = "coroutines-ordinary-suspend-call"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "generic-member-provider", "../../../coroutines/provider.scoop", "ordinary-suspend-call", "../../../coroutines/ordinary-suspend-call.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["generics", "imported_coroutine_adapters_republish_and_execute", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-provider", "to" = "${work}/sources/generic-member-provider"}},
  {"copy" = {"from" = "${fixture}/../../../coroutines/provider.scoop", "to" = "${work}/sources/generic-member-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_ordinary-suspend-call"
files = [
  {"copy" = {"from" = "${fixture}/ordinary-suspend-call", "to" = "${work}/sources/ordinary-suspend-call"}},
  {"copy" = {"from" = "${fixture}/../../../coroutines/ordinary-suspend-call.scoop", "to" = "${work}/sources/ordinary-suspend-call/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/ordinary-suspend-call", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/ordinary-suspend-call/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/ordinary-suspend-call/0.1.0/cone.slib", "exists" = false},
]
