  {"copy" = {"from" = "${fixture}/unknown", "to" = "${work}/sources/unknown"}},
  {"copy" = {"from" = "${fixture}/../../../shared-struct-definitions/unknown.scoop", "to" = "${work}/sources/unknown/src/main.scoop"}},
