argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/unknown", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/unknown/0.1.0/cone.slib"]
