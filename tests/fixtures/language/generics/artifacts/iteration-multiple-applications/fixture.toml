schema = 1
name = "iteration-multiple-applications"
inputs = ["../../../imported-classes/support/stage3_test.scoop", "generic-member-provider", "../../../iteration/provider.scoop", "multiple-applications", "../../../iteration/multiple-applications.scoop"]
tools = ["scoop", "scoopc"]
tags = ["generics", "imported_iteration_rejections_have_source_diagnostics", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-member-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-member-provider", "to" = "${work}/sources/generic-member-provider"}},
  {"copy" = {"from" = "${fixture}/../../../iteration/provider.scoop", "to" = "${work}/sources/generic-member-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-member-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-member-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_multiple-applications"
files = [
  {"copy" = {"from" = "${fixture}/multiple-applications", "to" = "${work}/sources/multiple-applications"}},
  {"copy" = {"from" = "${fixture}/../../../iteration/multiple-applications.scoop", "to" = "${work}/sources/multiple-applications/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/multiple-applications", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/multiple-applications/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/multiple-applications/0.1.0/cone.slib", "exists" = false},
]
