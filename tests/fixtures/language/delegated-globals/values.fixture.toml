schema = 1
name = "delegated-globals-values"
root = "values.scoop"
inputs = ["values.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["single-file", "run", "language"]
variants = [{"name" = "release"}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "provide-effective\nmake-unit\nprovide-unit\nmake-extension\nprovide-extension\nmain\nget-unit\ninitial\nset-unit\nget-unit\nchanged\n7\n8\nget-extension\n11\nset-extension\nget-extension\n43\nget-extension\n44\n"
stderr = ""
