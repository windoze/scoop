schema = 1
name = "delegated-globals-errors-direct-cycle"
root = "direct-cycle.scoop"
inputs = ["direct-cycle.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "negative", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "direct-cycle.diagnostics.json"}
