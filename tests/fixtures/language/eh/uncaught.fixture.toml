schema = 1
name = "eh-uncaught"
root = "uncaught.scoop"
inputs = ["uncaught.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["single-file", "trap", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 1
stdout = ""
stderr = {regex = "scoop:\\ uncaught\\ exception:\\ n\\(c=scoop%3Asingle\\-file%3A0\\.0\\.0;p=;o=\\-;k=C;x=M25UncaughtError\\)\\\n  <stack trace unavailable: disabled>\\n"}
