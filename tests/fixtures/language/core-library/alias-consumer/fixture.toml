schema = 1
name = "core-library-alias-consumer"
inputs = ["../extension.scoop", "../metadata.scoop", "../abi.scoop", "../type-aliases.scoop", "../integer-defaults.scoop", "../default-data-flow.scoop", "../../reference-source-fields/standalone.scoop", "../../reference-source-fields/combined.scoop", "../alias-consumer.scoop", "consumer", "program"]
tools = ["scoop", "scoopc"]
tags = ["core-library", "language"]
[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../extension.scoop", "to" = "${work}/core-source/src/user_extension.scoop"}},
  {"copy" = {"from" = "${fixture}/../metadata.scoop", "to" = "${work}/core-source/src/user_metadata.scoop"}},
  {"copy" = {"from" = "${fixture}/../abi.scoop", "to" = "${work}/core-source/src/user_abi.scoop"}},
  {"copy" = {"from" = "${fixture}/../type-aliases.scoop", "to" = "${work}/core-source/src/user_aliases.scoop"}},
  {"copy" = {"from" = "${fixture}/../integer-defaults.scoop", "to" = "${work}/core-source/src/user_integer_defaults.scoop"}},
  {"copy" = {"from" = "${fixture}/../default-data-flow.scoop", "to" = "${work}/core-source/src/user_default_data_flow.scoop"}},
  {"copy" = {"from" = "${fixture}/../../reference-source-fields/standalone.scoop", "to" = "${work}/core-source/src/fields_standalone.scoop"}},
  {"copy" = {"from" = "${fixture}/../../reference-source-fields/combined.scoop", "to" = "${work}/core-source/src/fields_combined.scoop"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_consumer"
files = [
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
  {"copy" = {"from" = "${fixture}/../alias-consumer.scoop", "to" = "${work}/sources/consumer/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [{"copy" = {"from" = "${fixture}/program", "to" = "${work}/sources/program"}}]

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
