schema = 1
name = "process-exit"
root = "program.scoop"
inputs = ["program.scoop", "native.c"]
tools = ["scoop", "scoop-link", "cc", "ar"]
when = { os = ["darwin", "linux"] }
tags = ["ffi", "process", "language"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-pthread", "-O2", "-Wall", "-Wextra", "-Werror", "-I", "${runtime}/include", "-c", "${fixture}/native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libfixture_native.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "prepare"
files = [{copy = {from = "${root}", to = "${work}/source/program.scoop"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/source/program.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "link"
argv = ["${scoop-link}", {"each" = "${link_args}"}, "--library-path", "${work}", "--root-slib", "${build.result.root.path}", {"each" = "${build.result.dependencies}", "field" = "path", "prefix" = "--dep-slib"}, "--runtime-objects", "${build.result.runtime_index}", "-o", "${work}/relinked", "--cache-dir", "${cache}", "--sysroot", "${sysroot}"]
exit = 0
stdout = "link-plan ${build.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/relinked"]
exit = 37
stdout = "stdout-buffer"
stderr = "stderr-buffer"

[[steps]]
name = "code_0"
argv = ["${work}/relinked"]
env = {M33_EXIT_CODE = "-2147483648"}
exit = 0
stdout = "stdout-buffer"
stderr = "stderr-buffer"

[[steps]]
name = "code_1"
argv = ["${work}/relinked"]
env = {M33_EXIT_CODE = "-1"}
exit = 255
stdout = "stdout-buffer"
stderr = "stderr-buffer"

[[steps]]
name = "code_2"
argv = ["${work}/relinked"]
env = {M33_EXIT_CODE = "0"}
exit = 0
stdout = "stdout-buffer"
stderr = "stderr-buffer"

[[steps]]
name = "code_3"
argv = ["${work}/relinked"]
env = {M33_EXIT_CODE = "1"}
exit = 1
stdout = "stdout-buffer"
stderr = "stderr-buffer"

[[steps]]
name = "code_4"
argv = ["${work}/relinked"]
env = {M33_EXIT_CODE = "255"}
exit = 255
stdout = "stdout-buffer"
stderr = "stderr-buffer"

[[steps]]
name = "code_5"
argv = ["${work}/relinked"]
env = {M33_EXIT_CODE = "256"}
exit = 0
stdout = "stdout-buffer"
stderr = "stderr-buffer"

[[steps]]
name = "code_6"
argv = ["${work}/relinked"]
env = {M33_EXIT_CODE = "2147483647"}
exit = 255
stdout = "stdout-buffer"
stderr = "stderr-buffer"
