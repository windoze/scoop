schema = 1
name = "constructor-safety-error-generic"
root = "generic.scoop"
inputs = ["generic.scoop"]
tools = ["scoop", "scoopc"]
tags = ["constructors", "constructor-safety", "single-file", "negative", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "-o", "${work}/rejected"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "generic.diagnostics.json"}
checks = [
  {"file" = "${work}/rejected", "exists" = false},
]
