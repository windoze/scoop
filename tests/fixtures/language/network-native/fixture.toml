schema = 1
name = "network-native"
inputs = ["consumer", "probe.c", "peer.c"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["platform", "network", "language"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "prepare"
files = [
    {copy = {from = "${sysroot}/src/scoop.platform", to = "${work}/platform"}},
    {copy = {from = "${fixture}/probe.c", to = "${work}/platform/native/network_probe.c"}},
    {copy = {from = "${fixture}/peer.c", to = "${work}/platform/native/network_peer.c"}},
    {replace = {path = "${work}/platform/native/socket_open.c", old = "#define _GNU_SOURCE 1", new = "#define _GNU_SOURCE 1\n#define socket m45_network_socket\n#define close m45_network_close\n#define setsockopt m45_network_setsockopt\n#define bind m45_network_bind\n#define connect m45_network_connect\n#define accept m45_network_accept\n#define accept4 m45_network_accept4"}},
    {replace = {path = "${work}/platform/native/socket_io.c", old = "#define _GNU_SOURCE 1", new = "#define _GNU_SOURCE 1\n#define send m45_network_send\n#define sendto m45_network_sendto\n#define recvmsg m45_network_recvmsg\n#define recv m45_network_recv"}},
    {replace = {path = "${work}/platform/native/resolve.c", old = "#define _GNU_SOURCE 1", new = "#define _GNU_SOURCE 1\n#define getaddrinfo m45_network_getaddrinfo\n#define freeaddrinfo m45_network_freeaddrinfo"}},
    {replace = {path = "${work}/platform/Cone.toml", old = "path = \"native/socket_open.c\"", new = "path = \"native/socket_open.c\"\n\n[[native.sources]]\npath = \"native/network_probe.c\"\n\n[[native.sources]]\npath = \"native/network_peer.c\""}},
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "network ownership, native errors and SIGPIPE passed\n"
stderr = ""
