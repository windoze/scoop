schema = 1
name = "main-args-int"
root = "program.scoop"
inputs = ["launcher.c", "program.scoop", "native.c"]
tools = ["scoop", "scoop-link", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["ffi", "process", "language"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "launcher"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-Wall", "-Wextra", "-Werror", "${fixture}/launcher.c", "-o", "${work}/launcher"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-pthread", "-O2", "-Wall", "-Wextra", "-Werror", "-I", "${runtime}/include", "-c", "${fixture}/native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libfixture_native.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "prepare"
files = [{copy = {from = "${root}", to = "${work}/source/program.scoop"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/source/program.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "cli_run"
argv = ["${scoop}", "run", {each = "${link_args}"}, "${work}/source/program.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json", "--", "normal"]
env = {M33_MAIN_CODE = "1"}
exit = 1
stdout = "${build.result.output}\n"
stderr = "finally\n"
json = "stderr"
diagnostics = []

[[steps]]
name = "link"
argv = ["${scoop-link}", {"each" = "${link_args}"}, "--library-path", "${work}", "--root-slib", "${build.result.root.path}", {"each" = "${build.result.dependencies}", "field" = "path", "prefix" = "--dep-slib"}, "--runtime-objects", "${build.result.runtime_index}", "-o", "${work}/relinked", "--cache-dir", "${cache}", "--sysroot", "${sysroot}"]
exit = 0
stdout = "link-plan ${build.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/relinked", "normal"]
exit = 37
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "invalid_utf8"
argv = ["${work}/relinked", "valid", {hex = "ff"}]
exit = 1
stdout = ""
stderr = {regex = "invalid\\ UTF\\-8\\ in\\ argv\\[2\\]\\\nscoop:\\ uncaught\\ exception:\\ n\\(c=scoop%3Ascoop\\.core%3A0\\.1\\.0;p=;o=\\-;k=C;x=CharacterCodingException\\)\\\n(?:  at [^\\n]+\\n)+(?:  <[^\\n]+>\\n)*"}

[[steps]]
name = "code_0"
argv = ["${work}/relinked", "normal"]
env = {M33_MAIN_CODE = "-2147483648"}
exit = 0
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "code_1"
argv = ["${work}/relinked", "normal"]
env = {M33_MAIN_CODE = "-1"}
exit = 255
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "code_2"
argv = ["${work}/relinked", "normal"]
env = {M33_MAIN_CODE = "0"}
exit = 0
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "code_3"
argv = ["${work}/relinked", "normal"]
env = {M33_MAIN_CODE = "1"}
exit = 1
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "code_4"
argv = ["${work}/relinked", "normal"]
env = {M33_MAIN_CODE = "255"}
exit = 255
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "code_5"
argv = ["${work}/relinked", "normal"]
env = {M33_MAIN_CODE = "256"}
exit = 0
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "code_6"
argv = ["${work}/relinked", "normal"]
env = {M33_MAIN_CODE = "2147483647"}
exit = 255
stdout = "${work}/relinked\n"
stderr = "finally\n"

[[steps]]
name = "uncaught"
argv = ["${work}/relinked", "throw"]
exit = 1
stdout = ""
stderr = {regex = "scoop:\\ uncaught\\ exception:\\ n\\(c=scoop%3Ascoop\\.core%3A0\\.1\\.0;p=;o=\\-;k=C;x=IllegalStateException\\)\\\n(?:  at [^\\n]+\\n)+(?:  <[^\\n]+>\\n)*"}

[[steps]]
name = "invalid_argv0"
argv = ["${work}/launcher", "${work}/relinked", "bad"]
exit = 1
stdout = ""
stderr = {regex = "invalid\\ UTF\\-8\\ in\\ argv\\[0\\]\\\nscoop:\\ uncaught\\ exception:\\ n\\(c=scoop%3Ascoop\\.core%3A0\\.1\\.0;p=;o=\\-;k=C;x=CharacterCodingException\\)\\\n(?:  at [^\\n]+\\n)+(?:  <[^\\n]+>\\n)*"}

[[steps]]
name = "verbatim_argv0"
argv = ["${work}/launcher", "${work}/relinked", "int"]
exit = 37
stdout = "../literal app name\n"
stderr = "finally\n"
