schema = 1
name = "requirements-effects"
root = "effects.scoop"
inputs = ["effects.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["requirements", "combinations", "language"]
variants = [{"name" = "release"}]

[[steps]]
name = "run"
argv = ["${scoop}", "run", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "41\n41\n42\nwaiting\n51\n"
stderr = ""
json = "stderr"
diagnostics = []
