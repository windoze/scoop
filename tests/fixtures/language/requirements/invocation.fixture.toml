schema = 1
name = "requirements-invocation"
root = "invocation.scoop"
inputs = ["invocation.scoop"]
tools = ["scoop"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["generics", "requirements", "defaults", "language"]

[[steps]]
name = "run"
argv = ["${scoop}", "run", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = "8\n8\n7\n12\n8\n8\n"
stderr = ""
json = "stderr"
diagnostics = []
