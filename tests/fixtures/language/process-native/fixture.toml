schema = 1
name = "process-native"
inputs = ["consumer", "probe.c", "child.c"]
tools = ["scoop", "scoopc", "cc"]
when = { os = ["darwin", "linux"] }
tags = ["platform", "process", "language"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "prepare"
files = [
    {copy = {from = "${sysroot}/src/scoop.platform", to = "${work}/platform"}},
    {copy = {from = "${fixture}/probe.c", to = "${work}/platform/native/process_probe.c"}},
    {replace = {path = "${work}/platform/native/process.c", old = "#define _GNU_SOURCE 1", new = "#define _GNU_SOURCE 1\n#define calloc m45_process_calloc\n#define posix_spawn m45_process_spawn\n#define posix_spawn_file_actions_adddup2 m45_process_dup2\n#define close m45_process_close"}},
    {replace = {path = "${work}/platform/native/pipes.c", old = "#define _GNU_SOURCE 1", new = "#define _GNU_SOURCE 1\n#define pipe m45_process_pipe\n#define pipe2 m45_process_pipe2\n#define close m45_process_close\n#define poll m45_process_poll"}},
    {replace = {path = "${work}/platform/native/process_wait.c", old = "#define _GNU_SOURCE 1", new = "#define _GNU_SOURCE 1\n#define waitpid m45_process_waitpid\n#define kill m45_process_kill"}},
    {replace = {path = "${work}/platform/native/io.c", old = "#define _GNU_SOURCE 1", new = "#define _GNU_SOURCE 1\n#define close m45_process_close\n#define read m45_process_read\n#define write m45_process_write"}},
    {replace = {path = "${work}/platform/Cone.toml", old = "path = \"native/process.c\"", new = "path = \"native/process.c\"\n\n[[native.sources]]\npath = \"native/process_probe.c\""}},
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
]

[[steps]]
name = "helper"
argv = ["${cc}", {each = "${cc_args}"}, {each = "${cc_link_args}"}, "-std=c11", "-Wall", "-Wextra", "-Werror", "${fixture}/child.c", "-o", "${work}/child"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--profile", "${profile}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}", "${work}/child"]
exit = 0
stdout = "process rollback, ownership and native communication passed\n"
stderr = ""
