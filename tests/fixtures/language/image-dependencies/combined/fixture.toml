schema = 1
name = "image-dependencies-combined"
inputs = ["provider", "../provider.scoop", "unused", "../unused.scoop", "consumer", "../consumer.scoop", "program"]
tools = ["scoop", "scoopc"]
tags = ["image-dependencies", "cross-cone", "language"]
[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/../provider.scoop", "to" = "${work}/sources/provider/src/main.scoop"}},
]
checks = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/image-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_unused"
files = [
  {"copy" = {"from" = "${fixture}/unused", "to" = "${work}/sources/unused"}},
  {"copy" = {"from" = "${fixture}/../unused.scoop", "to" = "${work}/sources/unused/src/main.scoop"}},
]
checks = []

[[steps]]
name = "unused"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/unused", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-unused", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/image-unused/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_consumer"
files = [
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
  {"copy" = {"from" = "${fixture}/../consumer.scoop", "to" = "${work}/sources/consumer/src/main.scoop"}},
]
checks = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/image-consumer/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [
  {"copy" = {"from" = "${fixture}/program", "to" = "${work}/sources/program"}},
]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 4}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []
