schema = 1
name = "annotation-rules-alias-duplicate"
root = "program/Cone.toml"
inputs = ["program"]
tools = ["scoop", "scoopc"]
tags = ["annotation-rules", "negative", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
