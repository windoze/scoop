schema = 1
name = "annotation-parameter-type"
root = "parameter-type.scoop"
inputs = ["parameter-type.scoop"]
tools = ["scoop", "scoopc"]
tags = ["annotation", "negative", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "parameter-type.diagnostics.json"}
