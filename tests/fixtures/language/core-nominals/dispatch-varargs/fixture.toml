schema = 1
name = "core-nominals-dispatch-varargs"
inputs = ["program.scoop", "../../type-source-dispatch/parameter-varargs.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["core-nominals", "modified-core", "single-file", "language"]
[[steps]]
name = "runtime_vendor"
files = [
  {symlink = {from = "${sysroot}/vendor", to = "${work}/sysroot/vendor"}},
  {symlink = {from = "${sysroot}/include", to = "${work}/sysroot/include"}},
]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/core-source"}},
  {"symlink" = {"from" = "${work}/core-source", "to" = "${work}/sysroot/src/scoop.core"}},
  {"copy" = {"from" = "${fixture}/../../type-source-dispatch/parameter-varargs.scoop", "to" = "${work}/core-source/src/nominals.scoop"}},
]
checks = []

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_exposed"
files = [
  {"copy" = {"from" = "${core.result.root.path}", "to" = "${work}/original-core.slib"}},
  {"replace" = {"path" = "${work}/core-source/src/nominals.scoop", "old" = "public class Variadic public constructor(vararg values: Int) {", "new" = "public class Variadic public constructor(vararg values: Int) {\n    public fun observe(vararg values: Int): Long {\n        collect(*values)\n        defaulted()\n        defaulted(seed = 3)\n        defaulted(4, 7, 8)\n        generic<Int>(1, 2)\n        generic<String>(\"a\", \"b\")\n        generic<String>()\n        return values.size\n    }"}},
]
checks = []

[[steps]]
name = "exposed"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "publish_core"
files = [{copy = {from = "${exposed.result.root.path}", to = "${work}/sysroot/lib/${target}/scoop.core.slib"}}]

[[steps]]
name = "prepare_program"
files = [{"copy" = {"from" = "${fixture}/program.scoop", "to" = "${work}/sources/program.scoop"}}]
checks = []

# This fixture changes core; std must be built against that changed dependency.
[[steps]]
name = "standard_library"
argv = ["${scoop}", "build", "${sysroot}/src/scoop.std", {each = "${compile_args}"}, "--release", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-std", "--message-format", "json", "-o", "${work}/sysroot/lib/${target}/scoop.std.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${work}/sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []
