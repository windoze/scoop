schema = 1
name = "shared-shapes-m21-properties-properties"
inputs = ["../properties/properties.scoop"]
tools = ["scoop", "scoopc"]
tags = ["shared-shapes", "language"]
variants = [{"name" = "release"}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/../properties/properties.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "11\n20\n44\n44\n7\nactual\n7\n7\n42\n9\n5\n9\ntrue\n8\n"
stderr = ""
