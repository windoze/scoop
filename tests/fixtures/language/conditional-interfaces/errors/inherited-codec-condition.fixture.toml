schema = 1
name = "conditional-interfaces-inherited-codec-condition"
root = "inherited-codec-condition.scoop"
inputs = ["inherited-codec-condition.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["conditional-interfaces", "negative", "language"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "inherited-codec-condition.diagnostics.json"}
