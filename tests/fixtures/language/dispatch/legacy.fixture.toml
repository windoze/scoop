schema = 1
name = "dispatch-multiple-interface-applications"
inputs = ["../generics/multiple-interface-applications.scoop"]
tools = ["scoop", "scoopc"]
tags = ["dispatch", "language"]
variants = [{"name" = "release"}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${fixture}/../generics/multiple-interface-applications.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "int\nstring\n"
stderr = ""
