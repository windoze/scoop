schema = 1
name = "generic-shape-errors-constructors-bad-arity"
inputs = ["../../imported-classes/support/stage3_test.scoop", "generic-constructor-provider", "../../generic-constructor-consumption/provider.scoop", "generic-constructor-bad-arity", "../../generic-constructor-consumption/bad-arity.scoop", "../../generic-constructor-consumption/provider-base.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generic-shape-errors", "constructors", "negative", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-constructor-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-constructor-provider", "to" = "${work}/sources/generic-constructor-provider"}},
  {"copy" = {"from" = "${fixture}/../../generic-constructor-consumption/provider.scoop", "to" = "${work}/sources/generic-constructor-provider/src/main.scoop"}},
  {"copy" = {"from" = "${fixture}/../../generic-constructor-consumption/provider-base.scoop", "to" = "${work}/sources/generic-constructor-provider/src/base.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-constructor-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-constructor-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-constructor-bad-arity"
files = [
  {"copy" = {"from" = "${fixture}/generic-constructor-bad-arity", "to" = "${work}/sources/generic-constructor-bad-arity"}},
  {"copy" = {"from" = "${fixture}/../../generic-constructor-consumption/bad-arity.scoop", "to" = "${work}/sources/generic-constructor-bad-arity/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-constructor-bad-arity", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-constructor-bad-arity/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/generic-constructor-bad-arity/0.1.0/cone.slib", "exists" = false},
]
