schema = 1
name = "source-nominals-callables"
inputs = ["provider", "runtime", "../../type-source-nominals/callables.scoop", "factory"]
tools = ["scoop", "scoopc"]
tags = ["source-nominals", "language"]
[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/../../type-source-nominals/callables.scoop", "to" = "${work}/sources/provider/src/main.scoop"}},
]
checks = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_exposed"
files = [
  {"copy" = {"from" = "${fixture}/factory/factory.scoop", "to" = "${work}/sources/provider/src/factory.scoop"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "public open class Envelope {", "new" = "public open class Envelope {\n    private class Reader<T>(private val stored: T) : View<T> {\n        public override fun read(): T = stored\n        public override val item: T get() = stored\n    }\n    public fun <T, U : Bound> exercise(value: T, other: U): (T, U) {\n        val box = Box(value)\n        return (box.combine(box.inspect(value), other), box.echo(other))\n    }\n    public fun <T> view(value: T): (T, T, Int, Int) {\n        val reader = Reader(value)\n        return (reader.read(), reader.item, reader.count(), reader.size)\n    }\n    public fun cached(): Int = Cache.inspect() + topLevel()\n    public fun variant(value: Int): Boolean = Choice.Constructed(value) == Choice.Constructed(value, 1)"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "        public fun value(): T = stored", "new" = "        public fun inspect(value: T): T {\n            property = helper(value)\n            @Unsafe { property = raw(property) }\n            return virtual(property)\n        }\n        public fun value(): T = stored"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "    protected object Cache {", "new" = "    protected object Cache {\n        public fun inspect(): Int = fixed + cached()"}},
]
checks = []

[[steps]]
name = "exposed"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [
  {"copy" = {"from" = "${fixture}/runtime", "to" = "${work}/sources/program"}},
  {"copy" = {"from" = "${fixture}/runtime/main.scoop", "to" = "${work}/sources/program/src/main.scoop"}},
]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []
