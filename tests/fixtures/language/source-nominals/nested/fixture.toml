schema = 1
name = "source-nominals-nested"
inputs = ["provider", "runtime", "../../type-source-nominals/nested.scoop", "factory"]
tools = ["scoop", "scoopc"]
tags = ["source-nominals", "language"]
[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/../../type-source-nominals/nested.scoop", "to" = "${work}/sources/provider/src/main.scoop"}},
]
checks = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_exposed"
files = [
  {"copy" = {"from" = "${fixture}/factory/factory.scoop", "to" = "${work}/sources/provider/src/factory.scoop"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "public open class Envelope : Base() {", "new" = "public open class Envelope : Base() {\n    private class Reader : View {\n        public override val number: Int get() = 11\n    }\n    public fun marker(): Marker = Cache\n    public fun <T : Marker> boxed(value: T): T {\n        val box = Box<T>.Companion.create(value)\n        if (box.inspect() != 6) { throw IllegalStateException() }\n        return box.echo(box.value())\n    }\n    public fun readView(): Int = Reader().read() + Reader().number\n    public fun cacheValue(): Int = Cache.read()\n    public fun values(): Boolean = Pair(\"pair\", 1) == Pair(\"pair\", 1) && Choice.Named(value = \"named\") == Choice.Named(value = \"named\")"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "        public fun value(): T = item", "new" = "        public companion object {\n            public fun create(value: T): Box<T> = Box(value)\n        }\n        public fun inspect(): Int = helper() + internalMethod() + protectedMethod()\n        public fun value(): T = item"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "public open class GenericOuter<T> {", "new" = "public open class GenericOuter<T> {\n    public fun childValue(): Int = ConcreteChild().method()\n    public fun <U> genericValue(value: U): U = GenericChild(value).item"}},
]
checks = []

[[steps]]
name = "exposed"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [
  {"copy" = {"from" = "${fixture}/runtime", "to" = "${work}/sources/program"}},
  {"copy" = {"from" = "${fixture}/runtime/main.scoop", "to" = "${work}/sources/program/src/main.scoop"}},
]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []
