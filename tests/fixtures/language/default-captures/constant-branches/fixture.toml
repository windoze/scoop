schema = 1
name = "default-captures-constant-branches"
inputs = ["../closure-references/provider", "runtime"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["default-captures", "constant-branches", "statepoints", "language"]
[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${fixture}/../closure-references/provider", "to" = "${work}/sources/provider"}},
]
checks = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/default-capture-provider/1.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [
  {"copy" = {"from" = "${fixture}/runtime", "to" = "${work}/sources/program"}},
  {"copy" = {"from" = "${fixture}/runtime/main.scoop", "to" = "${work}/sources/program/src/main.scoop"}},
]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []
