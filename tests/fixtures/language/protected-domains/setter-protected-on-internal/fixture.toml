schema = 1
name = "protected-domains-setter-protected-on-internal"
inputs = ["../../setter-domains/errors/protected-setter-on-internal.scoop"]
tools = ["scoop", "scoopc"]
tags = ["protected-domains", "negative", "language"]

[[steps]]
name = "prepare_program"
files = [{"copy" = {"from" = "${fixture}/../../setter-domains/errors/protected-setter-on-internal.scoop", "to" = "${work}/sources/program.scoop"}}]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/program.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--message-format", "json", "-o", "${work}/built-program"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/built-program", "exists" = false},
]
