files = [
  {"copy" = {"from" = "${fixture}/constructor-wrong-payload", "to" = "${work}/sources/constructor-wrong-payload"}},
  {"copy" = {"from" = "${fixture}/../../imported-enums/constructor-wrong-payload.scoop", "to" = "${work}/sources/constructor-wrong-payload/src/main.scoop"}},
]

[[steps]]
