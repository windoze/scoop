schema = 1
name = "imported-enum-patterns"
inputs = ["../../imported-classes/support/stage3_test.scoop", "../../imported-enums/provider.scoop", "enum-provider", "../../imported-enums/patterns.scoop", "enums-patterns", "../../imported-enums/pattern-downstream.scoop", "downstream-patterns", "../support/enum-main.scoop", "value-runtime-enum-patterns"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["imported-values", "enum", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_enum-provider"
files = [
  {"copy" = {"from" = "${fixture}/enum-provider", "to" = "${work}/sources/enum-provider"}},
  {"copy" = {"from" = "${fixture}/../../imported-enums/provider.scoop", "to" = "${work}/sources/enum-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/enum-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/enum-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_enums-patterns"
files = [
  {"copy" = {"from" = "${fixture}/enums-patterns", "to" = "${work}/sources/enums-patterns"}},
  {"copy" = {"from" = "${fixture}/../../imported-enums/patterns.scoop", "to" = "${work}/sources/enums-patterns/src/main.scoop"}},
]

[[steps]]
