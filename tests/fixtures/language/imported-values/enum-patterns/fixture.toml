  {"copy" = {"from" = "${fixture}/downstream-patterns", "to" = "${work}/sources/downstream-patterns"}},
  {"copy" = {"from" = "${fixture}/../../imported-enums/pattern-downstream.scoop", "to" = "${work}/sources/downstream-patterns/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/downstream-patterns", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/downstream-patterns/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_value-runtime-enum-patterns"
files = [
  {"copy" = {"from" = "${fixture}/value-runtime-enum-patterns", "to" = "${work}/sources/value-runtime-enum-patterns"}},
