argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/value-runtime-struct-combined", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
