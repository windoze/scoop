schema = 1
name = "roots-reject-core-root-supertype"
inputs = ["roots.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["roots", "core", "negative", "language"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${sysroot}/src/scoop.core", to = "${work}/core-source"}},
  {copy = {from = "${fixture}/roots.scoop", to = "${work}/core-source/src/roots.scoop"}},
]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
