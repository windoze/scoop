schema = 1
name = "roots-reject-core-missing-any"
inputs = ["roots.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["roots", "core", "negative", "language"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${sysroot}/src/scoop.core", to = "${work}/core-source"}},
  {copy = {from = "${fixture}/roots.scoop", to = "${work}/core-source/src/roots.scoop"}},
]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
checks = [
  {actual = "${reject.diagnostics.0.code}", equals = "SCOOPC_HIR_ERROR"},
  {actual = "${reject.diagnostics.0.message}", equals = "scoop.core must define exactly one `core_any` intrinsic type"},
  {actual = "${reject.diagnostics.0.notes}", equals = []},
  {actual = "${reject.diagnostics.0.severity}", equals = "error"},
  {actual = "${reject.diagnostics.0.origin.cone}", equals = "5ea5f5e8ff248182c8f8c7e1043caae20f163bcefd34cca4e97d8c6a03bf620d"},
]
