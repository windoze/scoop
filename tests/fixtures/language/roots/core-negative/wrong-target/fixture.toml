schema = 1
name = "roots-reject-core-wrong-target"
inputs = ["roots.scoop"]
tools = ["scoop", "scoopc"]
tags = ["roots", "core", "negative", "language"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${sysroot}/src/scoop.core", to = "${work}/core-source"}},
  {copy = {from = "${fixture}/roots.scoop", to = "${work}/core-source/src/roots.scoop"}},
]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/core-source", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
checks = [
  {actual = "${reject.diagnostics.0}", equals = {code = "SCOOPC_HIR_ERROR", message = "intrinsic type `core_any` requires a class declaration", notes = [], origin = {cone = "5ea5f5e8ff248182c8f8c7e1043caae20f163bcefd34cca4e97d8c6a03bf620d", end = 22, kind = "source", path = "src/roots.scoop", start = 0}, severity = "error"}},
]
