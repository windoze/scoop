schema = 1
name = "roots-artifacts"
inputs = ["provider", "facade", "consumer", "edited-roots.scoop", "root-exports.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc-ucrt", "x86_64-w64-windows-llvm-mingw-msvcrt", "x86_64-w64-windows-llvm-mingw-ucrt"]
tags = ["roots", "core", "language"]
[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${sysroot}/src/scoop.core", "to" = "${work}/sources/core"}},
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/facade", "to" = "${work}/sources/facade"}},
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
]

[[steps]]
name = "original_core"
timeout = 900
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "edit_core"
files = [
  {copy = {from = "${fixture}/edited-roots.scoop", to = "${work}/sources/core/src/roots.scoop"}},
  {copy = {from = "${fixture}/root-exports.scoop", to = "${work}/sources/core/src/root_exports.scoop"}},
]

[[steps]]
name = "core"
timeout = 900
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${core.result.root.artifact_fingerprint}", not_equals = "${original_core.result.root.artifact_fingerprint}"}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.m32/roots-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "facade"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/facade", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-facade", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.m32/roots-facade/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${consumer.result.dependencies.length}", "equals" = 3}]

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "42\n0\ngeneric\ndefault\nadapter\ntrue\ndynamic\n42\n"
stderr = ""
