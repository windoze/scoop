schema = 1
name = "equality-operator-shadow"
inputs = ["program"]
tools = ["scoop"]
tags = ["equality", "contracts", "language"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${fixture}/program/Cone.toml", "--lockfile", "${work}/source-lock-0.lock", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "operator-shadow\n"
stderr = ""
