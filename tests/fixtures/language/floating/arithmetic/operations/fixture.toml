schema = 1
name = "floating-operations"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["floating", "language"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "--profile", "${profile}", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "22.5 22.5\n-1.5 -1.5\n-0.0 -0.0\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\n1.25 3.25 3.25 1.25\n1.25 3.25 3.25 1.25\n4.0 true 4.0\n"
stderr = ""
