schema = 1
name = "floating-arithmetic-constants"
root = "program.scoop"
inputs = ["program.scoop", "native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["floating", "language"]
[[steps]]
name = "prepare_native"
files = [{"mkdir" = {"path" = "${work}/native/objects"}}, {"mkdir" = {"path" = "${work}/native/lib"}}]

[[steps]]
name = "compile_native_0"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O0", "-fno-omit-frame-pointer", "-I", "${runtime}/include", "-c", "${fixture}/native.c", "-o", "${work}/native/objects/fixture_native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native_0"
argv = ["${ar}", "rcs", "${work}/native/lib/libfixture_native.a", "${work}/native/objects/fixture_native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--library-path", "${work}/native/lib", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "1.0000001 0.0 1.0 -0.0 -0.0\ntrue\n127 0 9223372036854775807 0 8.0\n1.6777216e7 1.6777217e7 Infinity 0.10000000149011612\n3.4028235e38 5.0e-324 1.1754944e-38 1.0e-45 2.2250738585072014e-308\nNaN NaN Infinity -Infinity\ntrue\n0.1 -0.0\n"
stderr = ""
