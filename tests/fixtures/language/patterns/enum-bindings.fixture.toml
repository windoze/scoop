schema = 1
name = "patterns-enum-bindings"
root = "enum-bindings.scoop"
inputs = ["enum-bindings.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "1\n2\ntrue\nfalse\nfalse\ntrue\nfalse\ntrue\ntrue\nfalse\n"
stderr = ""
