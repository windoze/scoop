schema = 1
name = "platform-native-errors"
inputs = ["probe.c"]
tools = ["cc"]
when = { os = ["darwin", "linux"] }
tags = ["platform", "native", "language"]

[[steps]]
name = "build"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-Wall", "-Wextra", "-Werror", "${fixture}/probe.c", "${repo}/sysroot/src/scoop.platform/native/errors.c", "-o", "${work}/probe"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/probe"]
exit = 0
stdout = ""
stderr = ""
