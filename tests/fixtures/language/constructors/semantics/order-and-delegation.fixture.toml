schema = 1
name = "constructors-order-and-delegation"
root = "../order-and-delegation.scoop"
inputs = ["../order-and-delegation.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "run", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "outer-delegation\nderived-default\nderived-base-argument\nbase-property\nbase-init\nderived-property\nderived-init-one\nderived-init-two\ninner-body\nderived-secondary-inner\nderived-secondary-outer\n3\n5\n3\nalternate-this\nalternate-super\nbase-property\nbase-init\nalternate-property\nalternate-init\nalternate-terminal\nalternate-outer\n11\n12\nstruct-delegation\n13\nstruct-secondary\n13\n"
stderr = ""
