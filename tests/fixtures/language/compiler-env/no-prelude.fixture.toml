schema = 1
name = "compiler-env-no-prelude"
root = "no-prelude.scoop"
inputs = ["no-prelude.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["compiler-intrinsics", "negative", "language"]

[[steps]]
name = "check"
argv = ["${scoop}", "check", "${root}", "--release", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "no-prelude.diagnostics.json"}
