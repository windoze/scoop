schema = 1
name = "compiler-include-dir-errors"
root = "errors.scoop"
inputs = ["errors.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["compiler-intrinsics", "negative", "language"]

[[steps]]
name = "prepare"
files = [
  {mkdir = {path = "${work}/cone/escape"}},
  {mkdir = {path = "${work}/cone/broken"}},
  {mkdir = {path = "${work}/cone/cycle"}},
  {mkdir = {path = "${work}/outside"}},
  {copy = {from = "${fixture}/errors.scoop", to = "${work}/cone/errors.scoop"}},
  {symlink = {from = "${work}/outside", to = "${work}/cone/escape/excluded"}},
  {symlink = {from = "${work}/cone/absent", to = "${work}/cone/broken/excluded"}},
  {symlink = {from = "${work}/cone/cycle", to = "${work}/cone/cycle/self"}},
]

[[steps]]
name = "check"
argv = ["${scoop}", "check", "${work}/cone/errors.scoop", "--release", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "errors.diagnostics.json"}
