schema = 1
name = "generic-shapes-constructors-struct-secondary"
inputs = ["../../imported-classes/support/stage3_test.scoop", "generic-constructor-provider", "../../generic-constructor-consumption/provider.scoop", "generic-constructor-struct-secondary", "../../generic-constructor-consumption/struct-secondary.scoop", "generic-constructor-downstream-struct-secondary", "../../generic-constructor-consumption/downstream.scoop", "runtime-fixture", "../../imported-classes/support/gc.c", "../../generic-constructor-consumption/provider-base.scoop"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["generic-shapes", "constructors", "language"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-constructor-provider"
files = [
  {"copy" = {"from" = "${fixture}/generic-constructor-provider", "to" = "${work}/sources/generic-constructor-provider"}},
  {"copy" = {"from" = "${fixture}/../../generic-constructor-consumption/provider.scoop", "to" = "${work}/sources/generic-constructor-provider/src/main.scoop"}},
  {"copy" = {"from" = "${fixture}/../../generic-constructor-consumption/provider-base.scoop", "to" = "${work}/sources/generic-constructor-provider/src/base.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-constructor-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-constructor-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-constructor-struct-secondary"
files = [
  {"copy" = {"from" = "${fixture}/generic-constructor-struct-secondary", "to" = "${work}/sources/generic-constructor-struct-secondary"}},
  {"copy" = {"from" = "${fixture}/../../generic-constructor-consumption/struct-secondary.scoop", "to" = "${work}/sources/generic-constructor-struct-secondary/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-constructor-struct-secondary", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-constructor-struct-secondary/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_generic-constructor-downstream-struct-secondary"
files = [
  {"copy" = {"from" = "${fixture}/generic-constructor-downstream-struct-secondary", "to" = "${work}/sources/generic-constructor-downstream-struct-secondary"}},
  {"copy" = {"from" = "${fixture}/../../generic-constructor-consumption/downstream.scoop", "to" = "${work}/sources/generic-constructor-downstream-struct-secondary/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/generic-constructor-downstream-struct-secondary", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/generic-constructor-downstream-struct-secondary/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_runtime"
files = [
  {"copy" = {"from" = "${fixture}/runtime-fixture", "to" = "${work}/sources/runtime-fixture"}},
  {"copy" = {"from" = "${fixture}/../../imported-classes/support/gc.c", "to" = "${work}/native/gc.c"}},
]

[[steps]]
name = "compile_gc"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fno-common", "-I", "${runtime}/include", "-c", "${work}/native/gc.c", "-o", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_gc"
argv = ["${ar}", "qcS", "${work}/native/libm23_class_gc.a", "${work}/native/gc.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "program"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/runtime-fixture", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${program.result.dependencies.length}", equals = 4},
]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
