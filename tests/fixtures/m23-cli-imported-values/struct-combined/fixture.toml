schema = 1
name = "imported-struct-combined"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "../../m23-imported-struct-values/provider.scoop", "struct-provider", "../../m23-imported-struct-values/combined.scoop", "struct-combined", "../../m23-imported-struct-values/downstream.scoop", "downstream-combined", "../../m23-imported-struct-values/runtime.ll", "../support/struct-main.scoop", "value-runtime-struct-combined"]
tools = ["scoop", "scoopc", "llc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-values", "struct"]

[vars]
symbol0 = "scoop$1$cb$1f383547ac3febae604f2ec026f0bfbcb297be2953105a6fc5354678c230ee5f"
symbol1 = "scoop$1$cb$db1b090557926612fe7e0d4bae3e0604ba352e6f89eaef764220b9bfd104d5f2"
symbol2 = "scoop$1$cb$1608e360f99c45cf05017369fda3429c2fc30b8f80e9ad6c3edd15e9688fca2c"
symbol3 = "scoop$1$cb$62362e921517572b660fc0c602ac89b7759d8d43ffcccfccefcc5e940e8cbdd0"
symbol4 = "scoop$1$cb$4d813e313e1e314bec04c122137a9035fcfbeb07860852e42f67dd4dd779b403"
symbol5 = "scoop$1$cb$de2563b21522a5e3c8d674dafc0bdaaa6e3ba53c53ac65d6518576443423a0b7"

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_struct-provider"
files = [
  {"copy" = {"from" = "${fixture}/struct-provider", "to" = "${work}/sources/struct-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-struct-values/provider.scoop", "to" = "${work}/sources/struct-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/struct-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/struct-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_struct-combined"
files = [
  {"copy" = {"from" = "${fixture}/struct-combined", "to" = "${work}/sources/struct-combined"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-struct-values/combined.scoop", "to" = "${work}/sources/struct-combined/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/struct-combined", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/struct-combined/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_downstream-combined"
files = [
  {"copy" = {"from" = "${fixture}/downstream-combined", "to" = "${work}/sources/downstream-combined"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-struct-values/downstream.scoop", "to" = "${work}/sources/downstream-combined/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/downstream-combined", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/downstream-combined/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../../m23-imported-struct-values/runtime.ll", "to" = "${work}/native/abi.ll"}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @f0(", "new" = "declare void @\"${symbol0}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @f0(", "new" = "call void @\"${symbol0}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @f1(", "new" = "declare void @\"${symbol1}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @f1(", "new" = "call void @\"${symbol1}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @f2(", "new" = "declare void @\"${symbol2}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @f2(", "new" = "call void @\"${symbol2}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @f3(", "new" = "declare void @\"${symbol3}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @f3(", "new" = "call void @\"${symbol3}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @f4(", "new" = "declare void @\"${symbol4}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @f4(", "new" = "call void @\"${symbol4}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @f5(", "new" = "declare void @\"${symbol5}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @f5(", "new" = "call void @\"${symbol5}\"("}},
]

[[steps]]
name = "compile_native"
argv = ["${llc}", "-mtriple=${llvm_target}", "-filetype=obj", "-relocation-model=pic", "${work}/native/abi.ll", "-o", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_struct_abi.a", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_value-runtime-struct-combined"
files = [
  {"copy" = {"from" = "${fixture}/value-runtime-struct-combined", "to" = "${work}/sources/value-runtime-struct-combined"}},
  {"copy" = {"from" = "${fixture}/../support/struct-main.scoop", "to" = "${work}/sources/value-runtime-struct-combined/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/value-runtime-struct-combined", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${program.result.dependencies.length}", equals = 4},
]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
