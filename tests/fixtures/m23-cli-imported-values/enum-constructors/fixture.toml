schema = 1
name = "imported-enum-constructors"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "../../m23-imported-enums/provider.scoop", "enum-provider", "../../m23-imported-enums/constructors.scoop", "enums-constructors", "../../m23-imported-enums/constructor-downstream.scoop", "downstream-constructors", "../support/enum-main.scoop", "value-runtime-enum-constructors"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-values", "enum"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_enum-provider"
files = [
  {"copy" = {"from" = "${fixture}/enum-provider", "to" = "${work}/sources/enum-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-enums/provider.scoop", "to" = "${work}/sources/enum-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/enum-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/enum-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_enums-constructors"
files = [
  {"copy" = {"from" = "${fixture}/enums-constructors", "to" = "${work}/sources/enums-constructors"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-enums/constructors.scoop", "to" = "${work}/sources/enums-constructors/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/enums-constructors", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/enums-constructors/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_downstream-constructors"
files = [
  {"copy" = {"from" = "${fixture}/downstream-constructors", "to" = "${work}/sources/downstream-constructors"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-enums/constructor-downstream.scoop", "to" = "${work}/sources/downstream-constructors/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/downstream-constructors", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/downstream-constructors/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_value-runtime-enum-constructors"
files = [
  {"copy" = {"from" = "${fixture}/value-runtime-enum-constructors", "to" = "${work}/sources/value-runtime-enum-constructors"}},
  {"copy" = {"from" = "${fixture}/../support/enum-main.scoop", "to" = "${work}/sources/value-runtime-enum-constructors/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/value-runtime-enum-constructors", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 4}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
