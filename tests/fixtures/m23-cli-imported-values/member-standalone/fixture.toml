[[steps]]
name = "compile_native"
argv = ["${cc}", "-target", "arm64-apple-macos", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-Wno-override-module", "-c", "${work}/native/abi.ll", "-o", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_member_abi.a", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""
