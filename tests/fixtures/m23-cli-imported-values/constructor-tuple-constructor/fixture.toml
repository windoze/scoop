schema = 1
name = "imported-constructor-tuple-constructor"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "../../m23-imported-constructors/provider.scoop", "constructor-provider", "../../m23-imported-constructors/tuple-constructor.scoop", "constructors-tuple-constructor", "../../m23-imported-constructors/downstream.scoop", "downstream-tuple-constructor", "../../m23-imported-constructors/runtime.ll", "../support/constructor-main.scoop", "value-runtime-constructor-tuple-constructor"]
tools = ["scoop", "scoopc", "llc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-values", "constructor"]

[vars]
symbol_primary = "scoop$1$cb$e98f876c4d4360591e4d45ec1821b63bf5d59dd73d9332d3c22fcd1fe9fcd662"
symbol_check = "scoop$1$cb$0f8bc8202ee58b8dd39256301e8548bfb42a40fd24aeec15c68c0a7eed892825"

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${test_core}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_constructor-provider"
files = [
  {"copy" = {"from" = "${fixture}/constructor-provider", "to" = "${work}/sources/constructor-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/provider.scoop", "to" = "${work}/sources/constructor-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/constructor-provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/constructor-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_constructors-tuple-constructor"
files = [
  {"copy" = {"from" = "${fixture}/constructors-tuple-constructor", "to" = "${work}/sources/constructors-tuple-constructor"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/tuple-constructor.scoop", "to" = "${work}/sources/constructors-tuple-constructor/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/constructors-tuple-constructor", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/constructors-tuple-constructor/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_downstream-tuple-constructor"
files = [
  {"copy" = {"from" = "${fixture}/downstream-tuple-constructor", "to" = "${work}/sources/downstream-tuple-constructor"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/downstream.scoop", "to" = "${work}/sources/downstream-tuple-constructor/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/downstream-tuple-constructor", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/downstream-tuple-constructor/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/runtime.ll", "to" = "${work}/native/abi.ll"}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @primary(", "new" = "declare void @\"${symbol_primary}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @primary(", "new" = "call void @\"${symbol_primary}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare i64 @check(", "new" = "declare i64 @\"${symbol_check}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call i64 @check(", "new" = "call i64 @\"${symbol_check}\"("}},
]

[[steps]]
name = "compile_native"
argv = ["${llc}", "-mtriple=${llvm_target}", "-filetype=obj", "-relocation-model=pic", "${work}/native/abi.ll", "-o", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_constructor_abi.a", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "prepare_value-runtime-constructor-tuple-constructor"
files = [
  {"copy" = {"from" = "${fixture}/value-runtime-constructor-tuple-constructor", "to" = "${work}/sources/value-runtime-constructor-tuple-constructor"}},
  {"copy" = {"from" = "${fixture}/../support/constructor-main.scoop", "to" = "${work}/sources/value-runtime-constructor-tuple-constructor/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/value-runtime-constructor-tuple-constructor", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${program.result.dependencies.length}", equals = 4},
]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
