schema = 1
name = "imported-constructor-combined"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "../../m23-imported-constructors/provider.scoop", "constructor-provider", "../../m23-imported-constructors/combined.scoop", "constructors-combined", "../../m23-imported-constructors/downstream.scoop", "downstream-combined", "../../m23-imported-constructors/runtime.ll", "../support/constructor-main.scoop", "value-runtime-constructor-combined"]
tools = ["scoop", "scoopc", "llc", "ar"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-values", "constructor", "stage-golden"]

[vars]
symbol_primary = "scoop$1$cb$062aac8a15a278a6c98b067b12e09cd79feb651955f384b6d51db4af221fef86"
symbol_check = "scoop$1$cb$8dccbf7a5c9a77c2e2129dd81e38916975783c34488415541de5ae615d763f07"

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_constructor-provider"
files = [
  {"copy" = {"from" = "${fixture}/constructor-provider", "to" = "${work}/sources/constructor-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/provider.scoop", "to" = "${work}/sources/constructor-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/constructor-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/constructor-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/provider"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${provider.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/ast.txt", "snapshot" = "provider.ast.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/hir.txt", "snapshot" = "provider.hir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/mir.txt", "snapshot" = "provider.mir.txt"},
  {"file" = "${work}/dump/provider/${provider.result.root.identity}/lir.txt", "snapshot" = "provider.${target}.lir.txt"},
]

[[steps]]
name = "remove_provider_source"
files = [
  {"remove" = {"path" = "${work}/sources/constructor-provider"}},
]

[[steps]]
name = "prepare_constructors-combined"
files = [
  {"copy" = {"from" = "${fixture}/constructors-combined", "to" = "${work}/sources/constructors-combined"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/combined.scoop", "to" = "${work}/sources/constructors-combined/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/constructors-combined", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/constructors-combined/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/consumer"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${consumer.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/ast.txt", "snapshot" = "consumer.ast.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/hir.txt", "snapshot" = "consumer.hir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/mir.txt", "snapshot" = "consumer.mir.txt"},
  {"file" = "${work}/dump/consumer/${consumer.result.root.identity}/lir.txt", "snapshot" = "consumer.lir.txt"},
]

[[steps]]
name = "remove_consumer_source"
files = [
  {"remove" = {"path" = "${work}/sources/constructors-combined"}},
]

[[steps]]
name = "prepare_downstream-combined"
files = [
  {"copy" = {"from" = "${fixture}/downstream-combined", "to" = "${work}/sources/downstream-combined"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/downstream.scoop", "to" = "${work}/sources/downstream-combined/src/main.scoop"}},
]

[[steps]]
name = "downstream"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/downstream-combined", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-downstream", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/downstream-combined/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump/downstream"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${downstream.result.observations.child_invocations.length}", "equals" = 1},
  {"file" = "${work}/dump/downstream/${downstream.result.root.identity}/ast.txt", "snapshot" = "downstream.ast.txt"},
  {"file" = "${work}/dump/downstream/${downstream.result.root.identity}/hir.txt", "snapshot" = "downstream.hir.txt"},
  {"file" = "${work}/dump/downstream/${downstream.result.root.identity}/mir.txt", "snapshot" = "downstream.mir.txt"},
  {"file" = "${work}/dump/downstream/${downstream.result.root.identity}/lir.txt", "snapshot" = "downstream.lir.txt"},
]

[[steps]]
name = "remove_downstream_source"
files = [
  {"remove" = {"path" = "${work}/sources/downstream-combined"}},
]

[[steps]]
name = "prepare_native"
files = [
  {"copy" = {"from" = "${fixture}/../../m23-imported-constructors/runtime.ll", "to" = "${work}/native/abi.ll"}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare void @primary(", "new" = "declare void @\"${symbol_primary}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call void @primary(", "new" = "call void @\"${symbol_primary}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "declare i64 @check(", "new" = "declare i64 @\"${symbol_check}\"("}},
  {"replace" = {"path" = "${work}/native/abi.ll", "old" = "call i64 @check(", "new" = "call i64 @\"${symbol_check}\"("}},
]

[[steps]]
name = "compile_native"
argv = ["${llc}", "-mtriple=${llvm_target}", "-filetype=obj", "-relocation-model=pic", "${work}/native/abi.ll", "-o", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "qcS", "${work}/native/libm23_constructor_abi.a", "${work}/native/abi.o"]
exit = 0
stdout = ""
stderr = ""
env = {"ZERO_AR_DATE" = "1"}

[[steps]]
name = "remove_native_source"
files = [
  {"remove" = {"path" = "${work}/native/abi.ll"}},
  {"remove" = {"path" = "${work}/native/abi.o"}},
]

[[steps]]
name = "prepare_value-runtime-constructor-combined"
files = [
  {"copy" = {"from" = "${fixture}/value-runtime-constructor-combined", "to" = "${work}/sources/value-runtime-constructor-combined"}},
  {"copy" = {"from" = "${fixture}/../support/constructor-main.scoop", "to" = "${work}/sources/value-runtime-constructor-combined/src/main.scoop"}},
]

[[steps]]
name = "program"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/value-runtime-constructor-combined", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/program", "--runtime-root", "${runtime}", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "isolate"
files = [
  {"remove" = {"path" = "${work}/sources"}},
  {"copy" = {"from" = "${scoop}", "to" = "${work}/standalone/scoop"}},
]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${program.result.root.path}", "--cone-path", "${work}/artifacts", "--runtime-objects", "${program.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "-o", "${work}/relinked", "--dump-plan", "--message-format", "json", "--library-path", "${work}/native"]
exit = 0
stdout = ""
stderr = ""
env = {"LLVM_CONFIG_PATH" = "/absent/llvm-config", "LLVM_SYS_221_PREFIX" = "/absent/llvm"}
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${link.result.dependencies.length}", "equals" = 4},
  {actual = "${link.result.link_plan}", contains = "program-link v3\n"},
  {actual = "${link.result.link_plan}", contains = "cone scoop:scoop.core:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:constructor-provider:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:constructors-combined:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:downstream-combined:0.1.0 kind=Library objects="},
  {actual = "${link.result.link_plan}", contains = "cone dev.example:value-runtime-constructor-combined:0.1.0 kind=Executable objects="},
  {actual = "${link.result.link_plan}", contains = "images=5 root=${symbol_prefix}scoop$$1$$re$$44e7642470607f3d67725ceac5782cd7e6925e1ed29f5d6f022da26120ae837e"},
  {actual = "${link.result.link_plan}", contains = "alias ${symbol_prefix}scoop_td_String -> ${symbol_prefix}scoop$$1$$td$$ad3ae7a719e82101f547257b8a8ac185f05531c14504be81962250566a3ee868"},
  {"actual" = "${link.result.link_plan_fingerprint}", "equals" = "${program.result.link_plan_fingerprint}"},
]

[[steps]]
name = "run"
argv = ["${link.result.output}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run_moving"
argv = ["${link.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
