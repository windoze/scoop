schema = 1
name = "imported-member-wrong-field-type"
inputs = ["../../m23-cli-imported-classes/support/stage3_test.scoop", "../../m23-imported-members/provider.scoop", "member-provider", "../../m23-imported-members/wrong-field-type.scoop", "wrong-field-type"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["imported-values", "member", "negative"]

[[steps]]
name = "prepare_core"
files = [
  {"copy" = {"from" = "${sysroot}/lib/scoop.core", "to" = "${work}/core-source"}},
  {"copy" = {"from" = "${fixture}/../../m23-cli-imported-classes/support/stage3_test.scoop", "to" = "${work}/core-source/src/stage3_test.scoop"}},
  {"mkdir" = {"path" = "${work}/empty-sysroot"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/core-source", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_core_source"
files = [
  {"remove" = {"path" = "${work}/core-source"}},
]

[[steps]]
name = "prepare_member-provider"
files = [
  {"copy" = {"from" = "${fixture}/member-provider", "to" = "${work}/sources/member-provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-members/provider.scoop", "to" = "${work}/sources/member-provider/src/main.scoop"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/member-provider", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/member-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_provider_source"
files = [
  {"remove" = {"path" = "${work}/sources/member-provider"}},
]

[[steps]]
name = "prepare_wrong-field-type"
files = [
  {"copy" = {"from" = "${fixture}/wrong-field-type", "to" = "${work}/sources/wrong-field-type"}},
  {"copy" = {"from" = "${fixture}/../../m23-imported-members/wrong-field-type.scoop", "to" = "${work}/sources/wrong-field-type/src/main.scoop"}},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/wrong-field-type", "--sysroot", "${work}/empty-sysroot", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/dev.example/wrong-field-type/0.1.0/cone.slib"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/artifacts/dev.example/wrong-field-type/0.1.0/cone.slib", "exists" = false},
]
