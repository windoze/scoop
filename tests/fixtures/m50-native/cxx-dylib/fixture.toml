schema = 1
name = "m50-native-cxx-dylib"
inputs = ["cone", "native.cpp"]
tools = ["scoop", "scoopc", "cc"]
targets = ["aarch64-apple-darwin"]
tags = ["m50", "native", "native-link"]

[[variants]]
name = "two-level"
vars = { namespace_args = [] }

[[variants]]
name = "flat"
vars = { namespace_args = ["-Wl,-flat_namespace"] }

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
  {mkdir = {path = "${work}/native"}},
]

[[steps]]
name = "dylib"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-std=c++17", "-dynamiclib", "-Wl,-no_fixup_chains", "${fixture}/native.cpp", {each = "${namespace_args}"}, "-lc++", "-install_name", "@rpath/libm50_cxx.dylib", "-o", "${work}/native/libm50_cxx.dylib"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
