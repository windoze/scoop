schema = 1
name = "m50-native-cxx-dylib-cleanup"
inputs = ["cone", "native.cpp", "cleanup.c"]
tools = ["scoop", "scoopc", "cc"]
targets = ["aarch64-apple-darwin"]
tags = ["m50", "native", "native-link"]

[[variants]]
name = "normal"

[[variants]]
name = "moving"
env = { SCOOP_GC_STRESS_MOVE = "1" }

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/cone", to = "${work}/cone"}},
  {mkdir = {path = "${work}/native"}},
]

[[steps]]
name = "compile_c"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-fexceptions", "-c", "${fixture}/cleanup.c", "-o", "${work}/cleanup.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "dylib"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-std=c++17", "-dynamiclib", "-Wl,-no_fixup_chains", "${fixture}/native.cpp", "${work}/cleanup.o", "-lc++", "-install_name", "@rpath/libm50_cxx.dylib", "-o", "${work}/native/libm50_cxx.dylib"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop}", "link", {each = "${link_args}"}, "--root-slib", "${build.result.root.path}", "--dependency-slib", "${build.result.dependencies.0.path}", "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${sysroot}", "-o", "${work}/linked", "--library-path", "${work}/native", "--cache-dir", "${cache}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run_linked"
argv = ["${link.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""
