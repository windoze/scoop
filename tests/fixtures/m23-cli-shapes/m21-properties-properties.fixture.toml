schema = 1
name = "shared-shapes-m21-properties-properties"
inputs = ["../m21-properties/properties.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["shared-shapes", "stage-golden", "moving-gc"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/../m21-properties/properties.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "m21-properties-properties.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "m21-properties-properties.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "m21-properties-properties.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "m21-properties-properties.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "11\n20\n44\n44\n7\nactual\n7\n7\n42\n9\n5\n9\ntrue\n8\n"
stderr = ""
