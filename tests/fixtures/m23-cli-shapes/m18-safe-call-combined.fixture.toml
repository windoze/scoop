schema = 1
name = "shared-shapes-m18-safe-call-combined"
inputs = ["../m18-safe-call/combined.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["shared-shapes", "moving-gc"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${fixture}/../m18-safe-call/combined.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "safe-transform-created\nsafe-combined-default\nsafe-transform-created\nsafe-combined-default\nsafe-absent\nsafe-none\nsafe-suspended\nsafe-success\ncaptured-payload-success!\nsafe-failure\nsafe-caught\n"
stderr = ""
