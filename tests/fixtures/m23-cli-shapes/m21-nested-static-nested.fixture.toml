schema = 1
name = "shared-shapes-m21-nested-static-nested"
inputs = ["../m21-nested/static-nested.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["shared-shapes", "stage-golden", "moving-gc"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/../m21-nested/static-nested.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "m21-nested-static-nested.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "m21-nested-static-nested.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "m21-nested-static-nested.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "m21-nested-static-nested.${target}.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "42\nleft\nright\ntrue\n9\n7\n"
stderr = ""
