schema = 1
name = "shared-shapes-m10-suspend-constructor-argument"
inputs = ["../m10-coroutines/suspend-constructor-argument.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["shared-shapes", "stage-golden", "moving-gc"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/../m10-coroutines/suspend-constructor-argument.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "m10-suspend-constructor-argument.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "m10-suspend-constructor-argument.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "m10-suspend-constructor-argument.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "m10-suspend-constructor-argument.${target}.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "created\nreturned\n42\n"
stderr = ""
