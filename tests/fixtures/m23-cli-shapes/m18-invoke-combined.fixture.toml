schema = 1
name = "shared-shapes-m18-invoke-combined"
inputs = ["../m18-invoke/combined.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["shared-shapes", "stage-golden", "moving-gc"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/../m18-invoke/combined.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "m18-invoke-combined.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "m18-invoke-combined.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "m18-invoke-combined.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "m18-invoke-combined.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "invoke-default\ninvoke-default\ninvoke-suspended\ninvoke-success\ncaptured-payload-success!\ninvoke-failure\ninvoke-caught\n"
stderr = ""
