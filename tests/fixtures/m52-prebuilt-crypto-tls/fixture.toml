schema = 1
name = "m52-prebuilt-crypto-tls"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m52", "crypto", "tls", "cache"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]
[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "${fixture}/cone", {each = "${link_args}"}, {each = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${cold.result.observations.child_invocations}", equals = ["${cold.result.root.identity}"]}]

[[steps]]
name = "run"
argv = ["${cold.result.output}"]
exit = 0
stdout = "prebuilt crypto and TLS\n"
stderr = ""
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${fixture}/cone", {each = "${link_args}"}, {each = "${options}"}, "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]
