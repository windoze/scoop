schema = 1
name = "m54-nonduplicable-safepoint"
inputs = ["consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m54", "gc", "optimization", "prebuilt"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "source"
files = [{copy = {from = "${fixture}/consumer", to = "${work}/consumer"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${build.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "true-branch"
argv = ["${build.result.output}", "left", "x", "", "left"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint left\n"
stderr = ""

[[steps]]
name = "false-first"
argv = ["${build.result.output}", "right", "x", "x", "right"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint right\n"
stderr = ""

[[steps]]
name = "false-second"
argv = ["${build.result.output}", "left", "", "x", "right"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint right\n"
stderr = ""

[[steps]]
name = "true-failure"
argv = ["${build.result.output}", "left", "x", "x", "error"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint error\n"
stderr = ""

[[steps]]
name = "false-failure"
argv = ["${build.result.output}", "right", "x", "", "error"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "conditional safepoint error\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]
