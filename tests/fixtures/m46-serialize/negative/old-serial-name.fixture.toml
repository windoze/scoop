schema = 1
name = "m46-serialize-negative-old-serial-name"
root = "old-serial-name.scoop"
inputs = ["old-serial-name.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m46", "serialization", "negative"]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "old-serial-name.diagnostics.json"}
