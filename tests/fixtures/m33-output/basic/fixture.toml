schema = 1
name = "m33-output-basic"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc", "scoop-link"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m33", "ffi", "gc", "output"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "prepare"
files = [{copy = {from = "${root}", to = "${work}/source/program.scoop"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/source/program.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "remove_source"
files = [{remove = {path = "${work}/source"}}]

[[steps]]
name = "link"
argv = ["${scoop-link}", {each = "${link_args}"}, "--root-slib", "${build.result.root.path}", {each = "${build.result.dependencies}", field = "path", prefix = "--dep-slib"}, "--runtime-objects", "${build.result.runtime_index}", "-o", "${work}/relinked"]
env = {LLVM_CONFIG_PATH = "/absent/llvm-config", LLVM_SYS_221_PREFIX = "/absent/llvm"}
exit = 0
stdout = "link-plan ${build.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/relinked"]
exit = 0
stdout = "A\u0000界value42\ncaught\n"
stderr = "E\u0000界valuetrue\n"

[[steps]]
name = "moving"
argv = ["${work}/relinked"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "A\u0000界value42\ncaught\n"
stderr = "E\u0000界valuetrue\n"

[[steps]]
name = "minor"
argv = ["${work}/relinked"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 0
stdout = "A\u0000界value42\ncaught\n"
stderr = "E\u0000界valuetrue\n"
