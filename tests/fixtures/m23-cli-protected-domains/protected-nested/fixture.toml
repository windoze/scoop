schema = 1
name = "protected-domains-protected-nested"
inputs = ["provider", "runtime", "../../m23-type-protected-production/nested.scoop", "factory"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["protected-domains", "moving-gc"]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/lib/scoop.core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_provider"
files = [
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/../../m23-type-protected-production/nested.scoop", "to" = "${work}/sources/provider/src/main.scoop"}},
]
checks = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_exposed"
files = [
  {"copy" = {"from" = "${fixture}/factory/factory.scoop", "to" = "${work}/sources/provider/src/factory.scoop"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "public open class Surface protected constructor() {", "new" = "public open class Surface protected constructor() {\n    public fun inspect(): Boolean {\n        state = 9\n        val first = Generic<Int>.create(13)\n        val second = Generic<String>.create(\"nested\")\n        return state == 0 && identity<Int>(7) == 7 && identity<String>(\"kept\") == \"kept\"\n            && Nested.create().inspect() == 16 && first === first && second === second\n            && Choice.Some<Int>(19) == Choice.Some<Int>(19)\n    }"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "    protected open class Nested protected constructor(value: Int) {", "new" = "    protected open class Nested protected constructor(value: Int) {\n        public fun inspect(): Int = call(11) + Hidden().inspect()\n        companion object { public fun create(): Nested = Nested(9) }"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "        private open class Hidden {", "new" = "        private open class Hidden {\n            public fun inspect(): Int = buried()"}},
  {"replace" = {"path" = "${work}/sources/provider/src/main.scoop", "old" = "    protected class Generic<T> protected constructor(value: T) {}", "new" = "    protected class Generic<T> protected constructor(value: T) {\n        companion object { public fun create(value: T): Generic<T> = Generic<T>(value) }\n    }"}},
]
checks = []

[[steps]]
name = "exposed"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/test/scoop-hir-lower/0.0.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "prepare_program"
files = [
  {"copy" = {"from" = "${fixture}/runtime", "to" = "${work}/sources/program"}},
  {"copy" = {"from" = "${fixture}/runtime/main.scoop", "to" = "${work}/sources/program/src/main.scoop"}},
]
checks = []

[[steps]]
name = "program"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/program", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-program", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/built-program", "--runtime-root", "${runtime}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{"actual" = "${program.result.dependencies.length}", "equals" = 2}]

[[steps]]
name = "run"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
checks = []

[[steps]]
name = "run_moving"
argv = ["${program.result.output}"]
exit = 0
stdout = ""
stderr = ""
env = {"SCOOP_GC_STRESS_MOVE" = "1"}
checks = []
