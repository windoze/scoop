schema = 1
name = "m52-deployment"
inputs = ["cone", "check.py"]
tools = ["scoop", "scoopc", "cc", "python"]
targets = ["aarch64-apple-darwin"]
tags = ["m52", "deployment", "native", "cache", "gc"]

[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]

[[steps]]
name = "default"
argv = ["/usr/bin/env", "-u", "MACOSX_DEPLOYMENT_TARGET", "${scoop}", "build", "${fixture}/cone", {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${default.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 42
stdout = ""
stderr = ""

[[steps]]
name = "check_default"
argv = ["${python}", "${fixture}/check.py", "${deployment}", "${default.result.root.path}", "${default.result.output}", "${default.result.runtime_index}"]
exit = 0
stdout = "deployment matches\n"
stderr = ""

[[steps]]
name = "changed"
argv = ["${scoop}", "build", "${fixture}/cone", {each = "${options}"}]
env = {MACOSX_DEPLOYMENT_TARGET = "27.0.2"}
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${changed.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "check_changed"
argv = ["${python}", "${fixture}/check.py", "27.0.2", "${changed.result.root.path}", "${changed.result.output}", "${changed.result.runtime_index}"]
exit = 0
stdout = "deployment matches\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${fixture}/cone", {each = "${options}"}]
env = {MACOSX_DEPLOYMENT_TARGET = "27.0.2"}
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations.length}", equals = 0}]
