schema = 1
name = "m33-platform-cone-musl-pie"
inputs = ["provider", "consumer"]
tools = ["scoop", "scoopc", "scoop-link"]
targets = ["x86_64-unknown-linux-musl"]
tags = ["m33", "ffi", "native", "callback", "gc", "atomics", "artifact-only"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/sources/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/sources/consumer"}},
  {mkdir = {path = "${work}/files"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "--link-mode", "dynamic", "${work}/sources/provider", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--message-format", "json", "-o", "${work}/artifacts/dev.m33/platform-example/0.1.0/cone.slib"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "remove_provider"
files = [{remove = {path = "${work}/sources/provider"}}]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "--link-mode", "dynamic", "${work}/sources/consumer", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "remove_consumer"
files = [{remove = {path = "${work}/sources/consumer"}}]

[[steps]]
name = "link"
argv = ["${scoop-link}", {each = "${link_args}"}, "--link-mode", "dynamic", "--root-slib", "${consumer.result.root.path}", {each = "${consumer.result.dependencies}", field = "path", prefix = "--dep-slib"}, "--runtime-objects", "${consumer.result.runtime_index}", "-o", "${work}/relinked"]
env = {LLVM_CONFIG_PATH = "/absent/llvm-config", LLVM_SYS_221_PREFIX = "/absent/llvm"}
exit = 0
stdout = "link-plan ${consumer.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/relinked", "${work}/files"]
exit = 37
stdout = "platform-cone-ok\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${work}/relinked", "${work}/files"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 37
stdout = "platform-cone-ok\n"
stderr = ""

[[steps]]
name = "minor"
argv = ["${work}/relinked", "${work}/files"]
env = {SCOOP_GC_STRESS_MINOR = "1"}
exit = 37
stdout = "platform-cone-ok\n"
stderr = ""
