schema = 1
name = "m48-compiler-cache-native"
inputs = ["../../m33-native-c/values/cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m48", "cache", "compiler-input"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/../../m33-native-c/values/cone", to = "${work}/cone"}},
  {copy = {from = "${scoopc}", to = "${work}/bin/scoopc"}},
]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--runtime-root", "${runtime}", "--scoopc", "${work}/bin/scoopc", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${cold.result.observations.child_invocations.length}", equals = 1},
]

[[steps]]
name = "run_cold"
argv = ["${cold.result.output}"]
exit = 0
stdout = "native-c-ok\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--runtime-root", "${runtime}", "--scoopc", "${work}/bin/scoopc", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "run_warm"
argv = ["${warm.result.output}"]
exit = 0
stdout = "native-c-ok\n"
stderr = ""

[[steps]]
name = "update_tool_timestamp"
files = [{touch = {path = "${work}/bin/scoopc"}}]

[[steps]]
name = "tool_changed"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--runtime-root", "${runtime}", "--scoopc", "${work}/bin/scoopc", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${tool_changed.result.observations.child_invocations.length}", equals = 1},
]

[[steps]]
name = "run_tool_changed"
argv = ["${tool_changed.result.output}"]
exit = 0
stdout = "native-c-ok\n"
stderr = ""

[[steps]]
name = "warm_again"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--runtime-root", "${runtime}", "--scoopc", "${work}/bin/scoopc", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm_again.result.observations.child_invocations.length}", equals = 0},
]

[[steps]]
name = "run_warm_again"
argv = ["${warm_again.result.output}"]
exit = 0
stdout = "native-c-ok\n"
stderr = ""
