schema = 1
name = "dispatch-multiple-interface-applications"
inputs = ["../m14-generics/multiple-interface-applications.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["dispatch", "stage-golden", "moving-gc"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/../m14-generics/multiple-interface-applications.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "legacy.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "legacy.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "legacy.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "legacy.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "int\nstring\n"
stderr = ""
