schema = 1
name = "m48-build-record-library"
inputs = ["cone", "program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m48", "cache", "build-record"]

[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}]

[[steps]]
name = "cold"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${cold.result.observations.child_invocations.length}", equals = 1},
  {file = "${cold.result.output}", same_as = "${cold.result.root.path}"},
  {file = "${work}/cache/compile-v2/${cold.result.observations.nodes.1.cache_key}/record.cbor", exists = true},
]

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${warm.result.observations.child_invocations.length}", equals = 0},
  {file = "${warm.result.output}", same_as = "${warm.result.root.path}"},
  {file = "${work}/cache/compile-v2/${warm.result.observations.nodes.1.cache_key}/record.cbor", exists = true},
]

[[steps]]
name = "another_output"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/another.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${another_output.result.observations.child_invocations.length}", equals = 0},
  {file = "${another_output.result.output}", same_as = "${another_output.result.root.path}"},
  {file = "${work}/cache/compile-v2/${another_output.result.observations.nodes.1.cache_key}/record.cbor", exists = true},
]

[[steps]]
name = "remove_requested_output"
files = [{remove = {path = "${work}/library.slib"}}]

[[steps]]
name = "restore_output"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${restore_output.result.observations.child_invocations.length}", equals = 0},
  {file = "${restore_output.result.output}", same_as = "${restore_output.result.root.path}"},
  {file = "${work}/cache/compile-v2/${restore_output.result.observations.nodes.1.cache_key}/record.cbor", exists = true},
]

[[steps]]
name = "program_at_same_output"
argv = ["${scoop}", "build", "${fixture}/program.scoop", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${program_at_same_output.result.kind}", equals = "executable"}]

[[steps]]
name = "run_program"
argv = ["${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "library_at_same_output"
argv = ["${scoop}", "build", "${work}/cone", {each = "${link_args}"}, {each = "${options}"}, "-o", "${work}/library.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${library_at_same_output.result.observations.child_invocations.length}", equals = 0},
  {file = "${library_at_same_output.result.output}", same_as = "${cold.result.root.path}"},
]
