schema = 1
name = "m28-deep-frames-musl-pie"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
targets = ["x86_64-unknown-linux-musl"]
tags = ["m28", "gc", "eh", "abi", "deep-stack"]
variants = [
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--link-mode", "dynamic", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "-o", "${work}/program", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
timeout = 120
exit = 0
stdout = "deep frames passed\n"
stderr = ""
