schema = 1
name = "native-raw-globals-and-tls"
inputs = ["../m12-globals/globals.scoop", "../m12-globals/native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
targets = ["aarch64-apple-darwin"]
tags = ["native", "raw-globals", "moving-gc", "stage-golden"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "prepare"
files = [
  {mkdir = {path = "${work}/native/objects"}},
  {mkdir = {path = "${work}/native/lib"}},
]

[[steps]]
name = "compile_native"
argv = ["${cc}", "-target", "${target}", "-isysroot", "${sdk}", "-mmacosx-version-min=${deployment}", "-std=c11", "-O0", "-Wall", "-Wextra", "-Werror", "-fno-omit-frame-pointer", "-I", "${runtime}/include", "-c", "${fixture}/../m12-globals/native.c", "-o", "${work}/native/objects/raw-globals.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive_native"
argv = ["${ar}", "rcs", "${work}/native/lib/libfixture_native.a", "${work}/native/objects/raw-globals.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}/../m12-globals/globals.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}/native/lib", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "raw-globals.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "raw-globals.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "raw-globals.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "raw-globals.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "1\n2\n3\n4\n30\n31\n32\n33\n34\n22\n21\n23\n24\n42\n41\n43\n44\n"
stderr = ""
