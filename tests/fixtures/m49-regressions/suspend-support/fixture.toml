schema = 1
name = "m49-suspend-support-export"
inputs = ["provider", "consumer"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m49", "cross-cone", "suspend"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/provider-target", "--message-format", "json", "--profile", "${profile}", "-o", "${work}/artifacts/test/suspend-support/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/consumer-target", "--cone-path", "${work}/artifacts", "--message-format", "json", "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "42\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${consumer.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "42\n"
stderr = ""
