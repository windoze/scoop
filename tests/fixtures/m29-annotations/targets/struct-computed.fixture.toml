schema = 1
name = "m29-annotation-struct-computed"
root = "struct-computed.scoop"
inputs = ["struct-computed.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m29", "annotation", "positive"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "struct-computed.hir.txt"}, {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "struct-computed.mir.txt"}, {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "struct-computed.lir.txt"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = ""
stderr = ""
