schema = 1
name = "source-locations-legacy-defaults-coroutines"
inputs = ["../m17-defaults/source-locations.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["source-locations", "defaults", "coroutines", "moving-gc", "stage-golden"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${fixture}/../m17-defaults/source-locations.scoop", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "legacy.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "legacy.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "legacy.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "legacy.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "direct\ntrue\n43\n18\nmain\n\ndefault\ntrue\n45\n30\nmain\n\nexplicit\ntrue\n43\n18\nmain\n\nforwarded\ntrue\n47\n32\nmain\n\ngeneric-body\ntrue\n18\n49\ngenericBody\n\nmember-body\ntrue\n21\n48\nbodyLocation\nReporter\nmember-default\ntrue\n52\n37\nmain\n\nsuspend-body\ntrue\n29\n63\nrun\nLocationTask\n"
stderr = ""
