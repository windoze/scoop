schema = 1
name = "source-locations-cross-cone-relocation"
inputs = ["provider", "facade", "consumer", "standalone.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["source-locations", "defaults", "generics", "reexport", "cache", "moving-gc", "stage-golden"]

[vars]
options = ["--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--runtime-root", "${runtime}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]

[[variants]]
name = "normal"
[[variants]]
name = "moving"
env = {SCOOP_GC_STRESS_MOVE = "1"}

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/source/provider"}},
  {copy = {from = "${fixture}/facade", to = "${work}/source/facade"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/source/consumer"}},
  {copy = {from = "${fixture}/standalone.scoop", to = "${work}/source/renamed.scoop"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/source/consumer", {each = "${options}"}, "--emit", "all", "--dump-dir", "${work}/dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/dump/${build.result.root.identity}/ast.txt", snapshot = "consumer.ast.txt"},
  {file = "${work}/dump/${build.result.root.identity}/hir.txt", snapshot = "consumer.hir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/mir.txt", snapshot = "consumer.mir.txt"},
  {file = "${work}/dump/${build.result.root.identity}/lir.txt", snapshot = "consumer.lir.txt"},
]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""

[[steps]]
name = "single"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/source/renamed.scoop", {each = "${options}"}, "--emit", "all", "--dump-dir", "${work}/single-dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {file = "${work}/single-dump/${single.result.root.identity}/ast.txt", snapshot = "standalone.ast.txt"},
  {file = "${work}/single-dump/${single.result.root.identity}/hir.txt", snapshot = "standalone.hir.txt"},
  {file = "${work}/single-dump/${single.result.root.identity}/mir.txt", snapshot = "standalone.mir.txt"},
  {file = "${work}/single-dump/${single.result.root.identity}/lir.txt", snapshot = "standalone.lir.txt"},
]

[[steps]]
name = "run_single"
argv = ["${single.result.output}"]
exit = 0
stdout = "scoop:single-file:0.0.0/main.scoop\n2\n20\nmain\n\n"
stderr = ""

[[steps]]
name = "relocate"
files = [{move = {from = "${work}/source", to = "${work}/relocated"}}]

[[steps]]
name = "relocated"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/relocated/consumer", {each = "${options}"}, "--emit", "all", "--dump-dir", "${work}/relocated-dump"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${relocated.result.root.artifact_fingerprint}", equals = "${build.result.root.artifact_fingerprint}"},
  {file = "${work}/relocated-dump/${build.result.root.identity}/ast.txt", same_as = "${work}/dump/${build.result.root.identity}/ast.txt"},
  {file = "${work}/relocated-dump/${build.result.root.identity}/hir.txt", same_as = "${work}/dump/${build.result.root.identity}/hir.txt"},
  {file = "${work}/relocated-dump/${build.result.root.identity}/mir.txt", same_as = "${work}/dump/${build.result.root.identity}/mir.txt"},
  {file = "${work}/relocated-dump/${build.result.root.identity}/lir.txt", same_as = "${work}/dump/${build.result.root.identity}/lir.txt"},
]

[[steps]]
name = "run_relocated"
argv = ["${relocated.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""

[[steps]]
name = "isolate"
files = [
  {remove = {path = "${work}/relocated"}},
  {copy = {from = "${scoop}", to = "${work}/standalone/scoop"}},
  {mkdir = {path = "${work}/empty-sysroot"}},
]

[[steps]]
name = "link"
argv = ["${work}/standalone/scoop", "link", {each = "${link_args}"}, "--root-slib", "${build.result.root.path}", {each = "${build.result.dependencies}", field = "path", prefix = "--dependency-slib"}, "--runtime-objects", "${build.result.runtime_index}", "--sysroot", "${work}/empty-sysroot", "-o", "${work}/relinked", "--message-format", "json"]
env = {LLVM_CONFIG_PATH = "/absent/llvm-config", LLVM_SYS_221_PREFIX = "/absent/llvm"}
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {actual = "${link.result.link_plan_fingerprint}", equals = "${build.result.link_plan_fingerprint}"},
]

[[steps]]
name = "run_link"
argv = ["${link.result.output}"]
exit = 0
stdout = {file = "expected.stdout"}
stderr = ""
