schema = 1
name = "regression-derived-equality-origins"
inputs = ["provider", "consumer"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["compiler-regression", "regressions"]
[[steps]]
name = "prepare"
files = [
  {"mkdir" = {"path" = "${work}/standalone"}},
  {"copy" = {"from" = "${fixture}/provider", "to" = "${work}/sources/provider"}},
  {"copy" = {"from" = "${fixture}/consumer", "to" = "${work}/sources/consumer"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${sysroot}/src/scoop.core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "provider"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/provider", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--cone-path", "${work}/artifacts", "--message-format", "json", "-o", "${work}/artifacts/repro/equality/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${work}/sources/consumer", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

checks = []

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "true\n"
stderr = ""
