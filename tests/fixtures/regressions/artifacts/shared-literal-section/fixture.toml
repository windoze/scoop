schema = 1
name = "shared-literal-section"
root = "main.scoop"
inputs = ["main.scoop"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["codegen", "optimization", "regressions"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json", "--profile", "${profile}"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "12\n30\n2\n3\n40\n1\n35\n8\n91\n-10\n10\n100\n10\n"
stderr = ""
