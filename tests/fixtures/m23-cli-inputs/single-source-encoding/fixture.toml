schema = 1
name = "cli-input-single-source-encoding"
inputs = ["main.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "input", "negative"]

[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
human_options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target"]

[[steps]]
name = "prepare"
files = [
  {"copy" = {"from" = "${fixture}/main.scoop", "to" = "${work}/main.scoop"}},
  {"write" = {"path" = "${work}/previous.slib", "data" = "previous output\n"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${sysroot}/lib/scoop.core", "-o", "${work}/producer-sysroot/artifacts/${target_profile}/scoop.core.slib", {"each" = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [
  {"actual" = "${core.result.kind}", "equals" = "library"},
]

[[steps]]
name = "public"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/main.scoop", "-o", "${work}/previous.slib", {"each" = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]

[[steps]]
name = "producer"
argv = ["${scoopc}", "build", "${work}/main.scoop", "--sysroot", "${work}/producer-sysroot", {each = "${compile_args}"}, "--out-slib", "${work}/producer.slib"]
exit = 1
stdout = ""
stderr = "error: invalid single-file input ${work}/main.scoop: source file is not valid UTF-8\n"
checks = [
  {"file" = "${work}/producer.slib", "exists" = false},
]

[[steps]]
name = "human"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/main.scoop", "-o", "${work}/previous.slib", {"each" = "${human_options}"}]
exit = 1
stdout = ""
stderr = "${work}/main.scoop: error[SCOOP_BUILD_FAILED]: cannot snapshot single-file root: invalid single-file input ${work}/main.scoop: source file is not valid UTF-8\n"
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]
