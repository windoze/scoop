schema = 1
name = "cli-input-manifest-name"
inputs = []
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["cli", "input", "negative"]

[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
human_options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target"]

[[steps]]
name = "prepare"
files = [
  {"write" = {"path" = "${work}/cone.toml", "data" = "fun main() {}\n"}},
  {"write" = {"path" = "${work}/previous.slib", "data" = "previous output\n"}},
]

[[steps]]
name = "public"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone.toml", "-o", "${work}/previous.slib", {"each" = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]

[[steps]]
name = "producer"
argv = ["${scoopc}", "build", "${work}/cone.toml", "--sysroot", "${sysroot}", "--target", "${target}", "--out-slib", "${work}/producer.slib"]
exit = 1
stdout = ""
stderr = "error: invalid current Cone operand ${work}/cone.toml: regular file must be named Cone.toml or have exact .scoop extension\n"
checks = [
  {"file" = "${work}/producer.slib", "exists" = false},
]

[[steps]]
name = "human"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/cone.toml", "-o", "${work}/previous.slib", {"each" = "${human_options}"}]
exit = 1
stdout = ""
stderr = "${work}/cone.toml: error[SCOOP_CLI_CONFIG]: invalid current Cone operand ${work}/cone.toml: regular file must be named Cone.toml or have exact .scoop extension\n"
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]
