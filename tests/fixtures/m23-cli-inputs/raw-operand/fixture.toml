schema = 1
name = "cli-input-raw-operand"
inputs = []
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin"]
tags = ["cli", "input", "negative"]

[vars]
options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target", "--message-format", "json"]
raw_hex = "${work.hex}2f7261772dff2e73636f6f70"
human_options = ["--sysroot", "${sysroot}", "--cache-dir", "${work}/cache", "--target-dir", "${work}/target"]

[[steps]]
name = "prepare"
files = [
  {"write" = {"path" = "${work}/previous.slib", "data" = "previous output\n"}},
]

[[steps]]
name = "public"
argv = ["${scoop}", "build", {"hex" = "${raw_hex}"}, "-o", "${work}/previous.slib", {"each" = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "diagnostics.json"}
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]

[[steps]]
name = "producer"
argv = ["${scoopc}", "build", {"hex" = "${raw_hex}"}, "--sysroot", "${sysroot}", "--target", "${target}", "--out-slib", "${work}/producer.slib"]
exit = 1
stdout = ""
stderr = "error: invalid current Cone operand ${work}/raw-�.scoop: cannot inspect: No such file or directory (os error 2)\n"
checks = [
  {"file" = "${work}/producer.slib", "exists" = false},
]

[[steps]]
name = "human"
argv = ["${scoop}", "build", {"hex" = "${raw_hex}"}, "-o", "${work}/previous.slib", {"each" = "${human_options}"}]
exit = 1
stdout = ""
stderr = "${work}/raw-�.scoop: error[SCOOP_CLI_CONFIG]: invalid current Cone operand ${work}/raw-�.scoop: cannot inspect: No such file or directory (os error 2)\n"
checks = [
  {"file" = "${work}/previous.slib", "equals" = "previous output\n"},
]
