schema = 1
name = "m33-native-c-reject-cone-symbol-conflict"
inputs = ["project"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m33", "native", "negative"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/project", to = "${work}/project"}}]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/project/root", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.${target}.json"}
