schema = 1
name = "m33-native-c-values"
inputs = ["cone"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m33", "native", "ffi"]
variants = [
  {name = "debug", vars = {profile = "debug"}},
  {name = "release", vars = {profile = "release"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${fixture}/cone", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = []

[[steps]]
name = "manual_core"
files = [{copy = {from = "${build.result.dependencies.0.path}", to = "${work}/manual-sysroot/lib/${target}/scoop.core.slib"}}]

[[steps]]
name = "manual"
argv = ["${scoopc}", "build", {each = "${compile_args}"}, "${fixture}/cone", "--profile", "${profile}", "--sysroot", "${work}/manual-sysroot", "--out-slib", "${work}/manual.slib"]
exit = 0
stdout = ""
stderr = ""
checks = [{file = "${work}/manual.slib", same_as = "${build.result.root.path}"}]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "native-c-ok\n"
stderr = ""

[[steps]]
name = "moving"
argv = ["${build.result.output}"]
env = {SCOOP_GC_STRESS_MOVE = "1"}
exit = 0
stdout = "native-c-ok\n"
stderr = ""
