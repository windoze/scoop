schema = 1
name = "m45-platform-native-errors"
inputs = ["probe.c"]
tools = ["cc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m45", "platform", "native"]

[[steps]]
name = "build"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-Wall", "-Wextra", "-Werror", "${fixture}/probe.c", "${repo}/sysroot/src/scoop.platform/native/errors.c", "-o", "${work}/probe"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/probe"]
exit = 0
stdout = ""
stderr = ""
