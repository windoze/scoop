schema = 1
name = "m54-client-interceptors"
inputs = ["consumer", "peer.py", "peer_server.py"]
support = ["../m54-client-websocket/wire.py", "../../../sysroot/src/scoop.crypto/test-certificates/src/root.scoop"]
tools = ["scoop", "scoopc"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["m54", "http", "websocket", "asyncio", "lifetime", "prebuilt"]
variants = [{name = "debug", vars = {mode = []}}, {name = "release", vars = {mode = ["--release"]}}]

[[steps]]
name = "source"
files = [
    {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
    {copy = {from = "${fixture}/peer.py", to = "${work}/peer.py"}},
    {copy = {from = "${fixture}/peer_server.py", to = "${work}/peer_server.py"}},
    {copy = {from = "${repo}/tests/fixtures/m54-client-websocket/wire.py", to = "${work}/websocket_wire.py"}},
    {copy = {from = "${repo}/sysroot/src/scoop.crypto/test-certificates/src/root.scoop", to = "${work}/consumer/src/root.scoop"}},
]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
timeout = 1800
argv = ["python3", "${work}/peer.py", "${build.result.output}"]
exit = 0
stdout = "client interceptors signatures cache identity WebSocket and resource ownership passed\n"
stderr = ""

[[steps]]
name = "warm"
argv = ["${scoop}", "build", "${work}/consumer", {each = "${mode}"}, {each = "${link_args}"}, "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations}", equals = []}]
