name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y clang-21 llvm-21-dev libpolly-21-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure LLVM 21 environment
        run: |
          LLVM_PREFIX="$(llvm-config-21 --prefix)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "CC=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          "$LLVM_PREFIX/bin/llvm-config" --version
          "$LLVM_PREFIX/bin/clang" --version

      - name: Platform diagnostics
        run: |
          uname -m
          rustc -vV
          llvm-config --version
          clang --version

      - name: Cargo test
        run: cargo test --all --all-targets

      - name: Spec doctest fixtures
        run: cargo run -p scoop_tools -- spec-fixtures check

      - name: Fixture smoke
        run: cargo run -p scoop -- test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
