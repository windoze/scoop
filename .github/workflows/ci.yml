name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y clang-21 llvm-21-dev libpolly-21-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure LLVM 21 environment
        run: |
          LLVM_PREFIX="$(llvm-config-21 --prefix)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "CC=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          "$LLVM_PREFIX/bin/llvm-config" --version
          "$LLVM_PREFIX/bin/clang" --version

      - name: Platform diagnostics
        run: |
          uname -m
          rustc -vV
          llvm-config --version
          clang --version

      - name: Cargo test
        run: cargo test --all --all-targets

      - name: Cargo test (no default features)
        run: cargo test --all --all-targets --no-default-features

      - name: scoop_runtime (gc-baseline)
        run: cargo test -p scoop_runtime --all-targets --no-default-features --features gc-baseline

      - name: scoop_runtime (gc-minimal)
        run: cargo test -p scoop_runtime --all-targets --no-default-features --features gc-minimal

      - name: scoop_runtime (gc-hosted)
        run: cargo test -p scoop_runtime --all-targets --no-default-features --features gc-hosted

      - name: Spec doctest fixtures
        run: cargo run -p scoop_tools -- spec-fixtures check

      - name: Fixture smoke
        run: cargo run -p scoop -- test

      - name: P5 ABI targeted matrix
        run: |
          cargo test -p scoopc native_callable -- --nocapture
          cargo test -p scoopc managed_extern_ -- --nocapture
          cargo run -p scoop -- test --fixtures tests/fixtures/run-pass/extern_native_aggregate_return_direct_indirect_parity.scoop
          cargo run -p scoop -- test --fixtures tests/fixtures/runtime_gc/funptr_enter_native_roots_gc.scoop
          cargo run -p scoop -- test --fixtures tests/fixtures/build/funptr_enter_native_no_statepoint_writeback.scoop
          cargo run -p scoop -- test --fixtures tests/fixtures/build/managed_abi_aggregate_return_hidden_sret.scoop
          cargo run -p scoop -- test --fixtures tests/fixtures/build/managed_abi_direct_call_ordinary_contract.scoop
          cargo run -p scoop -- test --fixtures tests/fixtures/run_pass_cone/managed_abi_string_gc
          cargo run -p scoop -- test --fixtures tests/fixtures/run-pass/managed_abi_string_helpers_basic.scoop

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
