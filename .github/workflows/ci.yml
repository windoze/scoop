name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --all

      - name: Spec doctest fixtures
        run: cargo run -p scoop_tools -- spec-fixtures check

      - name: Fixture smoke
        run: cargo run -p scoop -- test
