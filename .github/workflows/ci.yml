name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install LLVM 18 (llvm-config)
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure LLVM_SYS_181_PREFIX
        run: |
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          llvm-config-18 --version

      - name: Cargo test
        run: cargo test --all --all-targets

      - name: Cargo test (no default features)
        run: cargo test --all --all-targets --no-default-features

      - name: scoop_runtime (gc-baseline)
        run: cargo test -p scoop_runtime --all-targets --no-default-features --features gc-baseline

      - name: scoop_runtime (gc-minimal)
        run: cargo test -p scoop_runtime --all-targets --no-default-features --features gc-minimal

      - name: scoop_runtime (gc-hosted)
        run: cargo test -p scoop_runtime --all-targets --no-default-features --features gc-hosted

      - name: Spec doctest fixtures
        run: cargo run -p scoop_tools -- spec-fixtures check

      - name: Fixture smoke
        run: cargo run -p scoop -- test
